  # ═══ Culverin ═══
  Culverin:
    category: equipment
    short: Electromagnetic acceleration weapon—a railgun scaled for infantry use.
    details: |
      Standard Imperial infantry weapon for units facing armored opposition. Magnetic 
      acceleration propels ferromagnetic penetrators at velocities that punch through 
      armor, walls, and most cover.
      
      VISUAL IDENTIFICATION: Copper coils visible through barrel shroud (the acceleration 
      stage). Magazine feeds penetrators; optic is standard because culverin velocities 
      require precision aiming—no walking fire onto a target.
      
      IMPERIAL MANUFACTURE: Produced at the Furnaces in ya-Don. Geometric line-work on 
      receiver echoes Inner City aesthetic. Authentication system built in at manufacture 
      prevents unauthorized use—the weapon will not fire for someone it doesn't recognize.
      
      GANATI MANUFACTURE: Reverse-engineered by Republican armorers. Receivers produced by 
      salvage collectives, assembled by manufacturing kilits like Taho Metalworkers' 
      Collective. Critically: no authentication system. Same killing power without the 
      neural lock.
      
      AVOUVAR USE: Original Warborn railguns (60kg, massive recoil) mounted on fixed 
      emplacements, crewed by teams of three. Both feuding houses trade fire across the 
      disputed corridor with these weapons.
    related: [Furnaces, Warborn, Beamcaster, Taho Metalworkers' Collective]
