  Alley of Lenses:
    category: location
    short: "Opticians' Guild retail street—precision instruments and lector components."
    details: |
      Guild street where Opticians' Guild members sell precision instruments, spectacles, 
      lector components, and optical devices. Distinct from the Lens-Grinders' Courtyard 
