  # ═══ Merchant Terraces ═══
  Merchant Terraces:
    category: location
    short: "Five levels of commercial districts climbing Taho's slope—goods flow down, status flows up."
    details: |
      Each terrace 100-150 feet higher than the last, created by cutting into slope and building 
      massive retaining walls (granite blocks 3-6 feet per side, fitted without mortar in oldest 
      sections). First Terrace: Sultanate period, re-carved facades. Second/Third: late Sultanate 
      expansion. Fourth/Fifth: revolutionary-era, past twenty years. Connected by granite 
      staircases—the Great Stairs rise 800 steps to Upper City, electric lights every 20 steps.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Taho, Port District, Upper Taho]
    location_features:
      level: district
      location_type: commercial
      parent: Taho
      children:
