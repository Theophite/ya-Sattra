      controlling_entity: Bureau of the Rod
      population: ~8,000
      primary_function: Cooling system administration
      notable_features:
        - Institute of Flow headquarters
        - es-Vorath family compound
      real_world_anchor: "Central Valley (within ya-Don)"
    aesthetic_features:
      intention: "We administer what you need. We need not become you."
      environment: "Aggressively climate-controlled. The district maintains temperatures comfortable for coastal residents—twenty degrees cooler than surrounding ya-Don. The transition at the district boundary is physically noticeable."
      construction: |
        Colonial architecture. Ya-Sattra styles imported without adaptation: geometric 
        precision, fitted construction, materials brought from the coast rather than 
        sourced locally. The buildings would look at home in the Medina Quarter; they 
        look deeply wrong in ya-Don.
        
        Active cooling systems work at capacity throughout summer. The Institute of Flow 
        coordinates the Furnaces' cooling systems from a building that demonstrates what 
        cooling can achieve when resources are unlimited. The es-Vorath compound connects 
        to both the Institute and the Aureate Enclave—the family bridges worlds.
        
        Local workers enter the district for employment; they notice the temperature 
        change immediately. The architecture isn't hostile, but it isn't welcoming either. 
        It exists for its residents, not its neighbors.
      materials:
