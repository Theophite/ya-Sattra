  # ═══ Żelovin ═══
  Żelovin:
    category: location
    short: "The Medial Precinct—surrounds the Technical quarter, supplies most practicing mediators."
    details: |
      Żelovin surrounds the Technical Caste quarter on three sides, giving them privileged access 
      to the Medials. The house supplies most of the city's practicing mediators, and this expertise 
      translates into political influence disproportionate to their territory. They govern through 
      the Tevorath (Witness Council)—seven senior mediators selected by demonstrated skill rather 
      than age. This meritocratic element makes Żelovin unusual among Avouvar houses, where age 
      normally determines authority.
