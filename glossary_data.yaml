      borders:
        south: [San Juan Factorias, Szürkevíz]
        west: [Pacific Ocean]
        north: [Puget Sound]
      real_world_anchor: "Fraser River delta (Vancouver area)"
    aesthetic_features:
      intention: "We remain. We have time. We were here before you arrived; we will be here after you leave."
      environment: "Fraser River delta where river meets glaciers. Cold and wet: 35-50°F, persistent fog, rain more days than not. Harbor freezes in winter. Aurora visible—structured geometric light in greens, blues, magentas, violets. Think frozen Vancouver at extinction's edge."
      construction: "They do not build. The autofactory maintains everything. They MODIFY with hobbyist craftsmanship given centuries of attention. Fabric screens partitioning vast chambers. Platforms built on furniture. Accumulated small modifications refined over generations."
      visual_vocabulary:
        - "1980s institutional modernism: geometric but with color, concrete and glass with accent panels"
        - "Vancouver specifically: glass and water, North Pacific grey-silver light"
        - "Thai temple architecture: gold leaf on black lacquer, elaborate ornamentation rewarding decades of viewing"
        - "Mycenaean: cyclopean walls, cities built for populations that no longer exist"
        - "Art Deco (futuristic past quality): designed to be eternal future, now thousands of years old"
      materials:
        - "dark concrete (nearly indestructible, absorbing light)"
        - "shining black alloy (reflective, scattering aurora colors)"
        - "autofactory fabric (original purpose forgotten, perfected through generations)"
        - "aurora-colored scarves draped over ink-black bodies"
      colors:
        - "city as void: black concrete, black alloy, grey fog, grey overcast, white glaciers"
        - "people as aurora: deep blues, electric greens, magentas, violets"
        - "colors with names only in Avouvar language"
        - "void-black bodies carrying light rather than absorbing it"
      sensory:
        - "aurora flashing geometric patterns in winter nights"
        - "fog rolling off ice sheets"
        - "maintained emptiness: streets cleaned for absent millions"
        - "precincts as islands of activity in ocean of empty grandeur"
        - "cold and wet: everything damp, mold in corners"
      key_elements:
        - "wrong proportions: Highborn corridors 15 feet wide, 30 feet high; doors 12 feet tall"
        - "fabric screens partitioning vast chambers (centuries of refinement)"
        - "platforms built on furniture (clever, elegant, clearly individual solutions)"
        - "exquisite small-scale work in spaces that remain fundamentally wrong"
        - "decoration in registers requiring decades to perceive"
  # ─── end Asovoë ───

  # ═══ Aureate Enclave ═══
  Aureate Enclave:
    category: location
    short: "Patent-holding families' compounds—ranging from formal vernacular to deliberate modesty."
    details: |
      ~2,000 residents. es-Kiral, es-Etaie, es-Vorath compounds. Where ya-Don's 
      Aureate families maintain residences showing different relationships to display: 
      es-Kiral ostentation vs. es-Etaie deliberate modesty. The contrast is intentional 
      and theological.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Aureate, es-Kiral, es-Etaie, es-Vorath]
    location_features:
      level: district
      location_type: residential
      parent: ya-Don
      controlling_entity: Aureate families
      children:
        - es-Kiral Compound
        - es-Etaie Residence
        - es-Vorath City Residence
      population: ~2,000
      primary_function: Elite residence
      castes_present:
        - Highborn
        - Aureate
      notable_features:
        - es-Kiral compound (ostentatious)
        - es-Etaie residence (deliberately modest)
        - es-Vorath compound (secondary)
        - Enclave Gardens
        - The Aureate Club
      real_world_anchor: "Central Valley (within ya-Don, low hill at southern edge)"
    aesthetic_features:
      intention: "Wealth displayed—or deliberately not displayed. The choice itself is display."
      environment: "Removed from Furnace proximity—the heat is managed, not embraced. Low hill provides marginally cooler temperatures. The compounds turn inward like all ya-Don architecture, but what they enclose varies dramatically."
      construction: |
        Two registers coexist:
        
        es-Kiral ostentation: Walled estate with climate-controlled interiors, formal 
        gardens watered by private cisterns. Grey granite imported from ya-Sattra. 
        Geometric precision referencing capital formality. The architecture says: we 
        could live in ya-Sattra if we chose.
        
        es-Etaie modesty: Three-story stone building that would not be out of place 
        in the Threshold. Local materials. No garden display. The architecture says: 
        we do not need to impress. The contrast with es-Kiral is intentional—the 
        family's genuine Penitent faith expressed through refusal of ostentation.
        
        The es-Vorath compound falls between—comfortable without es-Kiral excess, 
        but not making a theological statement of modesty.
      materials:
        - "es-Kiral: imported grey granite, bronze throughout, garden irrigation"
        - "es-Etaie: local stone, standard bronze, no ornamental water"
        - "es-Vorath: mixed—comfort without excess"
      colors:
        - "es-Kiral: grey granite (deliberately not tan), garden green"
        - "es-Etaie: local tan and grey, blending with Threshold"
        - "the contrast itself is visible from the street"
      sensory:
        - "es-Kiral: fountain sounds, active cooling, managed comfort"
        - "es-Etaie: ordinary sounds of a Threshold building"
        - "the quiet of wealth (es-Kiral) vs. the quiet of deliberate simplicity (es-Etaie)"
      key_elements:
        - "es-Kiral: formal vernacular at highest register, ya-Sattra reference"
        - "es-Etaie: deliberate modesty, theological statement through architecture"
        - "the Enclave Gardens: shared green space, ornamental vegetation rare in ya-Don"
        - "The Aureate Club: social facility, membership by patent"
  # ─── end Aureate Enclave ───
  
  # ═══ es-Kiral Compound ═══
  es-Kiral Compound:
    category: location
    short: "Largest Aureate compound in ya-Don—formal vernacular at its most ambitious."
    details: |
      Walled estate with climate-controlled interiors, formal gardens watered by 
      private cisterns—the only substantial ornamental vegetation in ya-Don. Home 
      of Sri Pater Morain es-Kiral and heir Veradis es-Kiral. ~80 residents. Patent 
      administration offices. The architecture references ya-Sattra formality.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [Aureate Enclave, es-Kiral, ya-Don]
    location_features:
      level: site
      location_type: residential
      parent: Aureate Enclave
      controlling_entity: es-Kiral
      population: ~80
      primary_function: es-Kiral residence, patent administration
      notable_features:
        - Climate-controlled interiors
        - Formal gardens
        - Patent administration offices
      real_world_anchor: "Central Valley (ya-Don Aureate Enclave)"
    aesthetic_features:
      intention: "We could live in ya-Sattra if we chose. We chose to be here."
      construction: |
        Formal vernacular: imported grey granite, geometric precision, proportions 
        referencing capital formality. Thick walls with active cooling supplementing 
        passive design. Bronze fittings throughout—more substantial, more deliberately 
        Antediluvian in reference than Threshold construction.
      materials:
        - "grey granite: imported, deliberately not local tan"
        - "bronze: throughout, not just thresholds"
        - "garden irrigation: transforming desert to comfort"
        - "active cooling systems"
      key_elements:
        - "formal vernacular at highest register"
        - "ya-Sattra reference adapted locally"
        - "gardens: the only ornamental vegetation in ya-Don"
        - "display of resources and connections"
  # ─── end es-Kiral Compound ───
  
  # ═══ es-Etaie Residence ═══
  es-Etaie Residence:
    category: location
    short: "Deliberately modest Aureate residence—Penitent faith expressed through architectural restraint."
    details: |
      Three-story stone building that would not be out of place in the Threshold. 
      The contrast with es-Kiral ostentation is intentional. Home of Sri Matrice 
      Dawn-of-Ascension es-Etaie. ~30 residents. The family's genuine Penitent 
