      Examination, failed primarily on Third Corner (Doctrinal Conformity) where he wrote: 
      "If truth requires consensus to be true, then it is not truth but convenience." Occupies 
      the Vermillion Tower three blocks from the es-Tsay cylinder on a 40,000-obol annual 
      allowance. Collects pre-Interdict artifacts without discrimination (~60% are forgeries). 
      Hosts intellectual salons where radical theories are discussed and funding pledged to 
      projects forgotten by morning. Second-degree member of Cloud Temple. Runs a charitable 
      trust funding Jak Loak, Mesca Galen, and Hannon Venn's "electricity project" in the 
      Middens—actually an excavation accessing the Eighth Auditor complex. Believes he has 
      outsmarted the Foreigners: the Interdict is a test, the Eighth Testament a puzzle, 
