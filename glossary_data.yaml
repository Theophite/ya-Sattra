  Tsoka Red Deer:
    category: person
    short: "Junta institutionalist—fostered by Imperial colonel, commands 643 soldiers, writing book on synthesis."
    person_location: Ogon
    details: |
      Age 43. Southeast approach to Ogon. Inherited token from father 20 years ago. 
      Fostered by Colonel-Hereditary es-Valent for 12 years, absorbed Imperial 
      institutional thinking. His forces operate with Imperial discipline (written 
      orders, salaries, merit promotion) while maintaining Akama identity. Writing 
      manuscript synthesizing Akama values with Imperial organizational principles. 
      Tribute protection contracts create structural conflict with Ataru's salmon 
      empire. They've fought three duels; Tsoka won all three. Will likely kill 
      each other eventually.
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Junta of Ogon, Ogon, Ataru Blackfish]
