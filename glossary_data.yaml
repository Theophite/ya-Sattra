    aesthetic_features:
      intention: "The tight spaces are home. We fit where others cannot."
      environment: "Basement levels, sub-basements, infrastructure corridors beneath ya-Don's surface districts. Vertical as much as horizontal—passages climb and descend through building foundations, following routes surface maps don't show. The Upper Warren near surface access; the Deep Warren in infrastructure levels below standard construction."
      construction: |
        The Antediluvians carved these passages for maintenance access—cable runs, 
        ventilation ducts, crawlways to systems that may or may not still function. 
        Ceiling heights of four feet or less. Passages that require Ductworker 
        compression to navigate—ribcages folding, bodies flattening to squeeze through.
        
        Nobody made it easy to occupy. People moved in anyway. Chambers converted 
        from junction boxes. Sleeping alcoves carved into what were equipment housings. 
        The Warren Tavern occupies a converted infrastructure junction—ceiling height 
        perhaps four feet, baseline visitors cannot enter without crawling.
        
        The adaptation assumes Ductworker bodies. Doorways sized for compressed passage. 
        Platforms at heights comfortable for four-foot frames. The Gathering Hall's 
        low ceiling feels spacious to residents, claustrophobic to visitors.
