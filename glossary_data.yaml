    short: "Guild street for metalworkers—copper, bronze, and brass goods."
    details: Guild monopoly on metalworking retail within marked boundaries. Shops produce household items, decorative pieces, and architectural fittings.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter]
    location_features:
