    details: |
      ~4,000 permanent residents. Cinder-Sifters operate here under Curate Malachi. 
      The Furnaces produce ash, slag, contaminated materials—someone has to process it. 
      The work is dangerous, the land is worthless, and people live here because they 
      have no better options. Essential disposal plus smuggling.
