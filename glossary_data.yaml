    details: |
      Pre-Interdict engineered vegetation. Baobab-scale trunks (30-50 feet circumference) rising 
      to 80-100 feet, spreading umbrella canopies of dark red foliage. Line watercourses 
      throughout the Central Valley, especially around ya-Don and St. Brennam's Garden. 
      Roots stabilize irrigation channels; canopy provides shade along agricultural routes.
      
      The red coloration comes from modified photosynthetic pigments—the trees process 
      light differently than unengineered species. Nobody knows their original purpose 
      or how to cultivate new ones; existing populations self-maintain along watercourses.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, St. Brennam's Garden]
    aesthetic_features:
      intention: "They were here before we were. They will be here after."
      construction: |
        Engineered vegetation on overwhelming scale. Trunks 30-50 feet in circumference, 
        bulbous like baobabs but taller. Rising 80-100 feet to umbrella canopies of 
        dark red foliage. Standing along watercourses like sentinels—visible from 
        miles away, marking where water flows through the valley's ochre earth.
      materials:
