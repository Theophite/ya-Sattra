    aesthetic_features:
      intention: "We are Ganati. Our buildings show it."
      environment: "The visual shock of the boundary is immediate—rounded adobe forms instead of angular stone, organic curves instead of rectangular precision. The color palette shifts from tan-and-grey to rust, ochre, and teal."
      construction: |
        Ganati tradition, not Imperial vernacular. Rounded adobe forms rather than 
        angular stone—curves that baseline Imperial architecture cannot produce. 
        Copper-inlaid decoration: geometric patterns on doorframes, windowsills, anywhere 
        the eye rests. Amber-tinted windows filter light for Serrulata comfort. Doorways 
        are organic curves rather than rectangular openings.
        
        The architecture developed for desert conditions different from ya-Don's valley 
        heat—more adapted to temperature swings, less focused on the sustained furnace 
        that ya-Don experiences. But Serrulata bodies prefer it, and after generations 
        here, the district has evolved its own Ganati-in-ya-Don character.
      materials:
