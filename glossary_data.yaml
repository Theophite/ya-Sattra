  # ═══ Hall of Mothers ═══
  Hall of Mothers:
    category: location
    short: "Warborn cloning facility in the Second Whorl—where cohorts are decanted and raised."
    details: |
      Primary production site for Imperial Warborn. Designed for an Empire that expected to 
      populate stars; currently operates at perhaps three percent of capacity.
      
      THE APPROACH: A bronze corridor runs four hundred feet without variation—bronze walls, 
      bronze floor tiles two feet square, bronze ceiling ten feet overhead. The shadowless 
      twilight of the Second Whorl makes the passage feel longer than it is.
      
      THE ATRIUM: Ceiling rises two hundred feet. Floor extends five hundred feet in every 
      direction. Art Deco maternal statues—sixty feet tall, bronze, faces reduced to geometric 
      planes—stand at intervals around the perimeter. They hold infants in stylized poses, or 
      cradle abstract shapes that might represent genetic helices, or extend hands toward empty 
      space where something has been removed. No inscriptions identify them. No one remembers 
      who they represent. The atrium was designed as a receiving space for thousands of new 
      parents collecting children. Now a few Creche functionaries cross the bronze floor at 
      any given time, footsteps echoing off walls three hundred feet away.
      
      VAT CHAMBERS: Radial wings branch from the central atrium, each dedicated to different 
      cloneline categories. Warborn wing closest to military liaison offices. Each wing contains 
      rows of cloning vats—cylindrical bronze vessels eight feet tall, four feet diameter, 
      arranged in ranks of twenty. Pre-Interdict technology, processes poorly understood by 
      current operators. The vats hum at frequencies below human hearing, producing vibrations 
      felt in teeth rather than sounds heard with ears.
      
      THE CRÃƒÆ’Ëâ€ CHES: Beyond the vat chambers. Lower ceilings (twelve feet rather than two hundred), 
      warmer lighting (panels simulating diurnal cycles), furniture scaled for children. Cohort-mates 
      share dormitories, classrooms, training facilities. Crèche nurses—often themselves clones from 
      lines designed for childcare—remain with cohorts for their entire developmental period.
    rag_pointer: Bureau of the Sword, Castes of Mankind
    related: [Warborn, Second Whorl, Bureau of the Creche, Institute of Restricted Castes, Lineal Vaults]
    location_features:
      level: site
      location_type: infrastructure
      parent: Second Whorl
      controller: Bureau of the Creche
      primary_function: Warborn production and early training
      castes_present:
        - Warborn (produced here)
        - Creche administrators
        - Medical staff
        - Crèche nurses (cloned childcare specialists)
      notable_features:
        - 400-foot bronze approach corridor
        - 200-foot atrium with 60-foot Art Deco maternal statues
        - Cylindrical bronze cloning vats (8 ft tall, 4 ft diameter, ranks of 20)
        - Cohort-specific crèche wings
        - Operates at ~3% designed capacity
      real_world_anchor: "Inner City arcology (Second Whorl)"
  # ─── end Hall of Mothers ───

  # ═══ Lineal Vaults ═══
  Lineal Vaults:
    category: location
    short: "Cryogenic archive adjacent to Hall of Mothers containing genetic templates for all certified clonelines."
    details: |
      The original sequences for every certified cloneline are preserved here against degradation. 
      A fortress of absolute sterility guarded by Sword sentinels. Periodic "genetic refresh" is 
      required for long-running clonelines—the Vaults provide reference templates to correct drift 
      that accumulates across generations of cloning. This creates dependency: even clonelines 
      without supplement requirements need periodic correction from Vault-preserved originals. 
      The Creche controls the Vaults. The Creche therefore controls every cloneline's long-term viability.
    rag_pointer: Bureau of the Creche, Castes of Mankind
