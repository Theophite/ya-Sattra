      construction: |
        Buildings contemporaneous with the Furnaces—construction techniques suggesting 
        origins tens of thousands of years old. Could pass for ordinary worker housing 
        until close inspection reveals: unusual proportions (doorways slightly too 
        wide, ceilings slightly too high), acoustic features baseline construction 
        lacks, materials whose composition resists casual analysis.
        
        Modifications accumulated across millennia of continuous occupation, but the 
