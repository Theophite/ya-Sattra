        - "Many's queue extending into the street"
        - "scribes' pen-scratch from open windows"
        - "Iron Yards sounds drifting across boundary"
        - "the transition: commercial noise northward, industrial noise southward"
      key_elements:
        - "boundary vernacular: Antediluvian aspiration fading toward Iron Yards practicality"
        - "Archive Gate (remnant of the customs house)"
        - "Booksellers' Row (respectable anchor, gives the Gate its current name)"
        - "Many's countinghouse (everyone passes it)"
        - "gradient visible: decoration increases northward"
