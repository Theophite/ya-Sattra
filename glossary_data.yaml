    details: |
      Details classified. What is known: conflict in the volcanic scablands, unknown 
      combatants and stakes, ended suddenly when the City of Glass did something no 
      one can describe. The City-of-Glass Charter that transferred reproductive 
      jurisdiction from Creche to Scale was named for this intervention. The City 
