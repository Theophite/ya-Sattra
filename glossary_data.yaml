        - "harbor sounds and smells"
        - "modest radiation (outsiders warned)"
        - "the relief of spaces that fit"
      key_elements:
        - "near-baseline proportions (unique in Asovoë)"
        - "almost comfortable for Avouvar bodies"
        - "the interface point between Asovoë and normal human trade"
        - "modest radiation keeps outsiders cautious"
  # ─── end Harbor District ───

  # ═══ High Junction ═══
  High Junction:
    category: location
    short: "Garrison city at the Republic's northern frontier."
    details: |
      80,000 inhabitants at 6,400 feet on the Azhmar River (Arkansas). Transformed 
      from frontier garrison of 30,000 to manufacturing center after grid power 
      arrived six years ago. Dawn Party stronghold, chaotic politics. The Dhal-Setil 
      family (Rasma's family) has a multi-generational compound here. Pre-Interdict 
      bridge spans the river—250 feet long, metalloceramic, single impossible arch.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat, Thousand Kingdoms, Rasma Dhal-Setil]
    location_features:
      level: city
      location_type: settlement
      parent: Ganat
      children:
        - Old Town
        - The Bridge
        - Manufacturing District
        - Southern Windmills
        - Homesteaders' Brotherhood
      population: ~80,000
      primary_function: Garrison, manufacturing
      castes_present:
        - Serrulata
        - Near-Baseline
        - Ranga
      notable_features:
        - Pre-Interdict bridge
        - Grid power
        - Vice economy
      borders:
        west: [Ganat proper]
        north: [Thousand Kingdoms]
      real_world_anchor: "Southern Colorado highlands, Leadville/Buena Vista area (Arkansas River)"
    aesthetic_features:
      intention: "Frontier becomes industry. The old ways electrified. Dawn Party territory—revolution's edge."
      environment: "High desert at 6,400 feet on Azhmar River gorge. Cold winters, short summers. City carved into sandstone terraces above the river. The Bridge defines geography—250 feet of impossible metalloceramic arch spanning the gorge."
      construction: "Pueblo kiva meets frontier boomtown meets early electrification. Adobe domes with underground chambers—thick walls, narrow windows, cool in summer, warm in winter. Timber-frame additions where the city outgrew its adobe core. Copper wire strung on timber poles threading through streets older than the Republic."
      visual_vocabulary:
        - "Pueblo architecture: adobe domes, underground kiva chambers, sandstone terraces, thick walls with narrow windows"
        - "Old West frontier: wooden porches, general stores, gambling halls, hitching posts alongside the new electric poles"
        - "Early electrification: carbon-filament bulbs glowing amber in adobe interiors, copper wire on timber poles, windmills on the southern perimeter"
        - "Art Nouveau touches: decorative ironwork around electrical fixtures, organic curves meeting utility, ornamentation on the Dhal-Setil compound"
      materials:
        - "adobe: sun-dried brick, tan and ochre, dome construction with underground chambers"
        - "sandstone: carved terraces, natural foundations, Old Town built into the rock"
        - "timber: frontier-style frames, porches, the new construction west of the Bridge"
        - "copper wire on timber poles: the grid that changed everything six years ago"
        - "the Bridge: pale grey metalloceramic, perfectly smooth, glass-slick when wet"
      colors:
        - "tan and ochre adobe (dominant in Old Town)"
        - "sandstone red-brown (natural terraces)"
        - "amber electric glow (carbon-filament bulbs in old buildings)"
        - "grey timber (new construction, weathering fast at altitude)"
        - "Dawn Party red (political markers, flags, painted slogans)"
        - "pale grey Bridge against red-brown gorge"
      sensory:
        - "high altitude thin air—visitors from Ganat proper notice immediately"
        - "electric hum in Old Town, generator clatter in Manufacturing District"
        - "river gorge acoustics—sound carries strangely under the Bridge"
        - "cold wind off northern frontier, smell of sagebrush and coal smoke"
        - "at night: amber electric windows in adobe domes, oil lamps in worker housing, the windmills creaking on the southern ridge"
      key_elements:
        - "the Bridge: 250-foot impossible arch, sand spread constantly for traction, the city's defining feature"
        - "Old Town: adobe domes with underground chambers on sandstone terraces, Sultanate-era but now electrified"
        - "Manufacturing District: hasty timber-frame west of the Bridge, grid-powered, chaotic growth"
        - "windmills: twenty 40-foot towers on southern perimeter, degrading but still turning"
        - "the Dhal-Setil compound: multi-generational adobe estate with Art Nouveau ironwork, electric lighting, private courtyard"
        - "Saint Arsakh parish: converted Sultanate administrative building, two-story adobe, covered courtyard"
        - "vice district: gambling halls, brothels, taverns serving the garrison—Old West frontier economy"
  # ─── end High Junction ───

  # ═══ Southern Windmills ═══
  Southern Windmills:
    category: location
    short: "Twenty degrading 40-foot windmills providing backup power on High Junction's southern perimeter."
    details: |
      Installed during early post-revolutionary expansion when High Junction was 10,000 people. 
      Barely sufficient as supplementary generation now. Feed salvaged capacitor banks. When 
      transmission from Ganat fails, manufacturers claim windmill power first, leaving Old 
      Town dark. Bandits strip copper wire; when stripped, no one replaces it.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [High Junction, Infrastructure]
    location_features:
      level: site
      location_type: infrastructure
      parent: High Junction
      primary_function: Power generation (backup)
      notable_features:
        - Twenty 40-foot windmills
        - Salvaged capacitor banks
        - Degrading infrastructure
      hazards:
        - Copper theft
        - Mechanical failure
      real_world_anchor: "Southern Colorado highlands (High Junction southern perimeter)"
    local_aesthetic: "Twenty windmills on the southern ridge, silhouettes against the high desert sky. Forty feet tall each, timber towers with metal blades that creak in the cold wind. They've been here since the early expansion—designed for 10,000 people, struggling to supplement 80,000. Salvaged capacitor banks in sheds at each tower's base, humming when they work, silent when they don't. Copper wire runs from tower to tower, then toward the city—except where bandits have stripped it, leaving gaps no one repairs. At night the windmills turn against the stars. During grid outages, the manufacturers claim their output first; Old Town goes dark and remembers when these towers were enough."
  # ─── end Southern Windmills ───

  # ═══ Homesteaders' Brotherhood ═══
  Homesteaders' Brotherhood:
    category: location
    short: "Least ideological veterans' organization—social club near the garrison."
    details: |
      Casual facility, meetings are excuses for socializing, political discussions minimal. 
      Focused on land grants and equipment loans without commitment to Dawn platforms 
      beyond member benefits. Free pulque and hashish for prospective members near discharge.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [High Junction, Veterans' Kilits]
    location_features:
      level: site
      location_type: commercial
      parent: High Junction
      primary_function: Veterans' social club
      notable_features:
        - Non-ideological
        - Free intoxicants for recruits
        - Land grant assistance
      real_world_anchor: "Southern Colorado highlands (High Junction, near garrison)"
    local_aesthetic: "Social club, not revolutionary headquarters. Near the garrison for convenience—discharged soldiers can walk here without crossing the Bridge. Comfortable chairs, a decent bar, hashish pipes passed around. No revolutionary banners, no martyr portraits. Meetings are excuses for drinking and talking about land grants. The Brotherhood helps members navigate bureaucracy: where to file for homestead claims, how to secure equipment loans, which rangelands are actually suitable. For soldiers who just want to settle down and farm, this is the place. The ideology is implied: individual success over collective transformation. The competition with Frontier Veterans' Collective is unstated but real."
  # ─── end Homesteaders' Brotherhood ───

  # ═══ Howling Row ═══
  Howling Row:
    category: location
    short: "Street in ya-Tsatsa's Upper City where the whistles are strongest."
    details: Named for the autumn gale sounds. Tsatsans trusted by the Presence often found in humble occupations here.
