        - Perpetual electric lighting
        - Revolutionary aesthetics
        - Underground warrens
      borders:
        west: [Taho]
        east: [High Junction]
      real_world_anchor: "Glen Canyon, Colorado River"
    aesthetic_features:
      intention: "The Republic made this. See who did what. WE did this—specific kilit, named, identifiable."
      environment: "500-foot salmon-colored Navajo sandstone canyon. Cross-bedding visible—diagonal lines from ancient desert dunes, winds that blew before humans. River at bottom moderates temperature. Canyon creates shade and breeze. Summer 10-15° cooler than surrounding desert; winter sheltered from wind."
      construction: "Petra meets Cappadocia meets Gaudí. Cities carved INTO cliff faces—interior space created by subtraction. Underground warrens extend hundreds of meters into the rock: tunnels branching, vertical shafts connecting levels, three-dimensional maze comprehensible to residents and disorienting to visitors. The Dam adds Antediluvian mystery: grey material harder than granite, smooth, impervious to weathering."
      visual_vocabulary:
        - "Petra: Treasury and Monastery carved into canyon walls, cities approached through narrow canyons opening into carved grandeur"
        - "Cappadocia/Derinkuyu: Underground cities carved for climate control, but Ganat adds monumental carved art to functional underground living"
        - "Gaudí's Sagrada Familia: Art Nouveau facades covering entire canyon walls—20-25 foot figures in organic flowing curves, robes flowing not hanging, hair like flames or water"
        - "Angkor Wat/Khajuraho: Figurative density—thousands of carved figures in relief 2-3 feet from the wall"
        - "Art Nouveau guild emphasis: Each piece identifiable by maker, craft integrated with art, rejection of anonymity"
        - "Old West frontier: Electric lights as civilization marker, competitive display of which establishment has better lighting"
      materials:
        - "salmon Navajo sandstone: soft enough to carve with hand tools, durable once carved, beautiful in smooth curves and flowing organic forms"
        - "desert varnish: iron and manganese oxide streaks from water seepage, dark lines running down weathered walls like permanent rain"
        - "stained glass: wealthy cave-homes with vast panels lit from behind, glowing both day and night"
        - "copper cladding: verdigris green against warm sandstone, organic doorway frames"
        - "the Dam itself: grey Antediluvian material harder than granite, smooth to the touch, impervious to weathering—NOT sandstone"
      colors:
        - "salmon and cream sandstone (dominant—horizontal layers of red, rust-orange, cream, tan)"
        - "perpetual electric light against orange rock at night"
        - "teal from copper compounds (expensive, semi-permanent)"
        - "rust-orange from iron oxide"
        - "stained glass glowing from wealthy cave-homes"
        - "verdigris copper cladding against warm stone"
      sensory:
        - "river sound constant at lower levels"
        - "perpetual electric hum—turbines never stop"
        - "canyon echoes—voices carry, layer, create cacophony"
        - "the smell: hot metal, chemicals, sawdust, human sweat, machine oil, ozone"
        - "dramatic temperature shift between sun and shade"
        - "hookah dens and drinking clubs: tobacco smoke, cannabis haze, political argument"
      key_elements:
        - "the Dam: grey Antediluvian material, turbines that never stop, power too cheap to meter"
        - "working-class warrens: tunnels branching through sandstone, chambers carved every 20 feet, electric bulbs every 10 feet, bright salmon-colored stone visible constantly"
        - "Art Nouveau facades: 20-25 foot carved figures in flowing curves covering both canyon walls, kilit signatures identifying who carved what"
        - "stained glass cave-homes: wealthy residences with massive panels visible from across the canyon"
        - "Senate Chamber: 80-foot circular room carved from sandstone, tiered seating, revolutionary reliefs carved over monarchical scenes"
        - "perpetual illumination: the city never sleeps because power is free, streets and tunnels and warrens lit continuously"
        - "revolutionary palimpsest: new imagery carved 2-3 inches deeper over monarchical scenes, the original forms faintly visible underneath"
