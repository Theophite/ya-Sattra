  # ═══ Harbor Master's Tower ═══
  Harbor Master's Tower:
    category: location
    short: "Bureau of the Rod's harbor offices overlooking the Rift."
    details: |
      Tower at the Rift's narrowest point, overlooking both shores and all three bridges. 
      The Harbor Master coordinates dock assignments, adjudicates berth priority disputes, 
      and interfaces with the Stevedores' Guild. Currently held by Koval es-Therren, a 
      Highborn administrator with considerable independent authority.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
