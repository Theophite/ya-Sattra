  # ─── end Coppersmith Lane ───

  # ═══ Aureate Span ═══
  Aureate Span:
    category: location
    short: "Bridge serving patent-holders crossing the Rift—Sword checkpoint everyone knows works for the Aureates."
    details: |
      Bronze railings and covered walkway announce the status of those who use it. 
      Sword Bureau gendarmes staff the checkpoint at the Medina end, checking 
      documentation and questioning those whose appearance doesn't match their 
      claimed business. Everyone knows the checkpoint really works for the Aureates—
      the gendarmes report to estate security, take direction from patent-holders, 
      and treat the wrong people crossing as a personal affront to residents rather 
      than a bureaucratic irregularity. Choosing this bridge when you lack standing 
      invites attention you won't enjoy.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide, The Antediluvian Quarter"
    related: [Medina Quarter, Antediluvian Quarter, Rift, Clerk's Span, Valet's Span, Bureau of the Sword]
    location_features:
      level: site
      location_type: infrastructure
      parent: Rift
      primary_function: High-status Rift crossing
      controlling_entity: Bureau of the Sword (nominal); Aureate estates (actual)
      notable_features:
        - Sword checkpoint (Medina end)
        - Bronze railings, covered walkway
        - Gendarmes work for Aureates
      borders:
        south: [Great Bazaar]
        north: [Antediluvian Quarter]
      real_world_anchor: "Monterey Bay basin (spanning Rift)"
    local_aesthetic: "Bronze and status. The covered walkway keeps sun and rain off patent-holders; the checkpoint keeps everyone else off the bridge. Sword gendarmes in formal uniform check papers with the particular attention of men who know exactly who pays for their children's schooling. The questions aren't about documentation—they're about whether you belong. Wrong answers get you turned back. Very wrong answers get you remembered."
  # ─── end Aureate Span ───

  # ═══ Clerk's Span ═══
  Clerk's Span:
    category: location
    short: "Bridge carrying Bureau traffic across the Rift—Sword checkpoint slightly less captured by Aureates."
    details: |
      Used by officials on business requiring crossing but not warranting Aureate 
      acknowledgment. Middle status of the three Rift bridges. Sword checkpoint 
      here answers more to Bureau hierarchy than estate money—but the gendarmes 
      still know which side of the Rift pays better, and difficult crossers find 
      their documentation takes longer to process. Officials flash credentials; 
      everyone else explains themselves.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide, The Antediluvian Quarter"
    related: [Medina Quarter, Antediluvian Quarter, Rift, Aureate Span, Valet's Span, Bureau of the Sword]
    location_features:
      level: site
      location_type: infrastructure
      parent: Rift
      primary_function: Bureau Rift crossing
      controlling_entity: Bureau of the Sword
      notable_features:
        - Sword checkpoint (Medina end)
        - Bureau credential verification
        - Moderate Aureate influence
      borders:
        south: [Great Bazaar]
        north: [Antediluvian Quarter]
      real_world_anchor: "Monterey Bay basin (spanning Rift)"
    local_aesthetic: "Functional authority. The checkpoint processes officials quickly—credential flash, nod, through. Everyone else joins a slower queue where gendarmes ask questions and write things down. The bridge itself is plain stone, nothing announcing status except the fact that you're not on the Valet's Span. Bureau messengers, minor officials, and those with legitimate business cross here. Those without legitimate business cross here too, hoping middle-status anonymity covers their purposes."
  # ─── end Clerk's Span ───

  # ═══ Valet's Span ═══
  Valet's Span:
    category: location
    short: "Bridge for servants and deliveries—Sword checkpoint that absolutely works for the Aureates."
    details: |
      Utilitarian construction matching users' station. Handles servant traffic and 
      commercial deliveries to Antediluvian Quarter. Lowest status of three bridges, 
      but the Sword checkpoint is the most obviously captured—gendarmes here take 
      direct instruction from estate majordomi, cross-reference servant registries 
      maintained by Aureate households, and turn back anyone not on someone's list. 
      Legitimate servants pass easily. Delivery workers need manifests. Everyone else 
      needs a very good story and the right demeanor of deference.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide, The Antediluvian Quarter"
    related: [Medina Quarter, Antediluvian Quarter, Rift, Aureate Span, Clerk's Span, Bureau of the Sword]
    location_features:
      level: site
      location_type: infrastructure
      parent: Rift
      primary_function: Servant/delivery Rift crossing
      controlling_entity: Bureau of the Sword (nominal); Aureate households (actual)
      notable_features:
        - Sword checkpoint (Medina end)
        - Servant registry verification
        - Delivery manifest requirements
        - Direct Aureate household control
      borders:
        south: [Great Bazaar]
        north: [Antediluvian Quarter]
      real_world_anchor: "Monterey Bay basin (spanning Rift)"
    local_aesthetic: "The servant's entrance. Plain stone, no railings worth mentioning, wide enough for carts. The checkpoint processes the familiar faces of regular servants with a nod—they're in the registries, their households vouch for them. Delivery workers present manifests; gendarmes check names against expected shipments. The unfamiliar get questions: who sent you, what house, what business. Wrong answers mean turning back. Very wrong answers mean the gendarmes take an interest in where you came from."
  # ─── end Valet's Span ───

  # ═══ Factors' Row ═══
  Factors' Row:
    category: location
    short: "Concentration of trading offices along the Rift's Medina waterfront."
    details: |
      Warehouses below, offices above, with views over the docks. Trading missions from 
      Ganati merchant kilits, Aureate commercial representatives, and Sztoavel Imports 
      (Asovoe) maintain presence here. Salt-stained stone, timber reinforced against 
      humidity, windows perpetually hazed by maritime conditions.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
    related: [Rift, Medina Quarter, Ganati Trading Mission, Sztoavel Imports, Ganat, Asovoe]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Rift
      primary_function: Foreign trade coordination
      notable_features:
        - Ganati Trading Mission
