  # ═══ Depths of St. Yerren ═══
  Depths of St. Yerren:
    category: location
    short: "Underground district in Antediluvian tunnels never meant for habitation."
    details: |
      ~50,000 residents. Tunnel systems surface dwellers barely know exist. Geography 
      follows geology, not surface streets. Speaking Stones communication hub. The 
      Antediluvians carved these passages for infrastructure—ventilation, conduits, 
      access to systems nobody now understands. People moved in anyway.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Karst, Speaking Stones]
    location_features:
      level: district
      location_type: underground
      parent: ya-Don
      children:
        - Speaking Stones
        - St. Yerren's Shrine
        - The Deep Market
        - The Blind Fish
      population: ~50,000
      primary_function: Underground residence
      castes_present:
        - Karst
        - Ductworker
        - Near-Baseline
      notable_features:
        - Speaking Stones
        - Geology-defined boundaries
        - Antediluvian infrastructure adapted for habitation
      real_world_anchor: "Central Valley (underground, within ya-Don)"
    aesthetic_features:
      intention: "The stone is home. The weight above is comfort."
      environment: |
        Tunnel systems spreading beneath the Threshold, Ember Row, the Furnaces, Thornback 
        Ridge. Geography follows rock formations—chambers beneath Ember Row might connect 
        more easily to tunnels beneath the Furnaces than to surface streets directly above. 
        Constant temperature (cool relative to surface), constant pressure, constant darkness 
        except where residents have added light.
        
        FURNACE PIPES RUN THROUGH THESE TUNNELS. Some passages were carved specifically to 
        house them—conduit routes, access corridors. Thesad pipes (pristine, humming with 
        processes) alongside conventional bronze (patched by generations of underground 
        workers). Equipment housings embedded in walls. Junction chambers where multiple 
        pipe routes converge. The infrastructure that surfaces at intersections above 
        originates HERE, in the carved depths.
      construction: |
        The Antediluvians carved these spaces from bedrock—straight cuts, precise angles, 
        chambers sized for purposes nobody remembers. Ventilation shafts. Equipment 
        housings. Conduit routes carrying Furnace pipes. Access passages to systems that 
        may or may not still function. None of it was meant for habitation.
        
        People moved in anyway. Platforms laid across uneven floors. Doorways cut through 
        walls that were never meant to have doorways. Chambers subdivided with salvage 
        partitions. What were equipment alcoves are now sleeping quarters. What were 
        junction boxes are now shrines. The adaptation is total—generations of making 
        uninhabitable space habitable through accumulated modification.
        
        The pipes are neighbors. Residents know which carry heat, which vibrate, which 
        sometimes leak substances nobody can identify. Some families maintain sections 
        of pipe—hereditary relationships with specific lengths of conduit. The Karst 
        who live here understand the pipe geography better than anyone on the surface.
      materials:
        - "carved bedrock: Antediluvian cuts, precise angles, unchanged"
        - "Furnace pipes: thesad (pristine, humming) and conventional (patched)"
        - "equipment housings: embedded in walls, junction chambers"
        - "human additions: platforms, partitions, salvage construction"
        - "bioluminescent fixtures: Karst-adapted lighting"
      colors:
        - "stone grey (the carved bedrock)"
        - "thesad bronze (pristine, running through tunnels)"
        - "conventional bronze (verdigris, patched)"
        - "salvage variety (human additions)"
        - "bioluminescent blue-green (Karst lighting)"
      sensory:
        - "constant temperature (relief from surface heat)"
        - "pipe sounds: humming, creaking, thermal expansion"
        - "stone pressure: the weight above felt, comforting to Karst"
        - "tap-language echoing through rock (the Speaking Stones)"
        - "the smell of pipe condensation (unknown substances)"
        - "disorientation for surface dwellers (no landmarks, no sky)"
      key_elements:
        - "Furnace pipes running through carved tunnels"
        - "hereditary pipe maintenance (some families responsible for sections)"
        - "junction chambers where pipe routes converge"
        - "Antediluvian infrastructure never meant for habitation"
        - "human adaptation through accumulated modification"
        - "geography follows geology, not surface streets"
        - "Speaking Stones (tap-language communication hub)"
