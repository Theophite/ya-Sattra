  # ═══ Beamcaster ═══
  Beamcaster:
    category: equipment
    short: Plasma sidearm, standard Warborn issue.
    details: |
      Pre-Interdict weapon firing superheated plasma from magnetic containment. The violet 
      glow visible through the barrel housing is plasma held in suspension until discharge.
      
      CHARACTERISTICS: Matte black casing, brutal simplicity, chevron venting pattern. 
      Ergonomics assume hands larger than baseline human. Devastating at close range—
      what infantry see in the moment before a Warborn kills them at conversational distance.
      
      PRODUCTION: Furnaces, ya-Don. Process inherited rather than understood. Not 
      archaeotech salvage but continuous (if mysterious) manufacture.
      
      AVAILABILITY: Standard issue for Warborn cohorts; extremely rare in civilian hands. 
      A Colonel-Hereditary might inherit one as a status symbol. Authentication systems 
      prevent unauthorized use.
    related: [Warborn, Furnaces, Culverin]
