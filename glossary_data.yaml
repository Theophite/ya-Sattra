        - Worker saint shrines
        - Aspirational-vertical architecture
      real_world_anchor: "Central Valley (ya-Don)"
    aesthetic_features:
      intention: "Reaching upward. The sacred work elevates us; the architecture should too."
      environment: "Anchoring the Threshold district. The Cathedral's vertical forms are visible across ya-Don—spires reaching toward the Furnace obelisks, grey stone against tan surroundings."
      construction: |
        Aspirational-vertical register: Gothic cathedral meets Art Deco monumentalism. 
        Grey stone in crystalline formations, angular spires clustered like organ pipes, 
        geometric verticality reaching upward. The style aspires toward the obelisk 
        towers—not the smooth domes of the Furnace production facilities, but the 
        vertical exhaust towers rising 300 feet with their glowing amber tops.
        
        Interior: massive—capable of holding 5,000+ worshippers. Acoustics prioritized 
        over decoration. Guild banners, saint icons, memorial alcoves for workers 
        killed in industrial accidents. The altar incorporates salvaged Furnace 
        components; communion vessels are industrial metalwork transformed.
      materials:
