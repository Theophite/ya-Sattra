  # ─── end Ductworker ───

  # ═══ Draëthen ═══
  Draëthen:
    category: caste
    short: "Engineering laborers with synchronized cognition and absolute conformity."
    details: |
      Puget Sound refugee caste from ya-Tsovez. Most baseline-adjacent of refugee 
      castes, making differences harder to locate. Engineered for synchronized 
      labor—minds converge on identical conclusions without coordination.
    rag_pointer: "Castes of Mankind, The Volerath of Puget Sound"
    related: [Völërath, Szkovërin, Refugee Castes]
    caste_features:
      morphology: baseline
      scale: baseline
      compulsion: unknown
      lifespan: baseline
      cognition: specialized
      population: rare
      physical_traits:
        - "average height and build"
        - "coloring within normal ranges"
        - "eyes set slightly closer together (creates intensity when focusing)"
        - "movements too regular—stride matched precisely step to step"
        - "expressions shift without transition states"
      original_function: "synchronized industrial labor"
      current_role: "sorting autofactory output, weaving collectives"
      distribution:
        - "Puget Sound caste-villages"
        - "Brennholm and surrounding settlements"
      special:
        - "model systems with such fidelity that separate individuals reach identical conclusions"
        - "work in weaving collectives produces patterns of perfect consistency"
        - "experience 'következ'—the next thing that must be completed"
        - "live in compounds of 40+ members"
        - "wear identical clothing, cut hair identically"
        - "identify by distinguishing features (Grey-Patch, Crooked-Thumb)"
        - "reach consensus through gradual alignment, not discussion"
        - "DO NOT give quarter in combat, DO NOT ask for it"
        - "capacity for absolute violence when threatened"
  # ─── end Draëthen ───

  # ═══ Dravoëtsin ═══
  Dravoëtsin:
    category: location
    short: "Żelovin's vassal precinct—holds the eastern approach to the Technical quarter."
    details: |
      Smaller precinct surviving by serving Żelovin interests while maintaining nominal 
      independence. Holds the eastern approach to the Technical quarter (Żelovin holds 
      three sides). Recruits across house lines through the ancient right when children 
      declare mediator calling—a practice that keeps the precinct viable despite its 
      small population.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Żelovin, Medials]
    location_features:
      level: district
      location_type: administrative
      parent: Asovoë
      primary_function: Eastern Technical quarter approach
      castes_present:
        - Avouvar
      borders:
        vassal_to: Żelovin
        guards: Technical Caste quarter (eastern approach)
      notable_features:
        - "Nominal independence under Żelovin protection"
        - "Cross-house recruitment when children declare mediator calling"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "We survive by being useful. We serve the work that matters."
      environment: "Eastern approach to the Technical quarter—the fourth side that Żelovin doesn't control. Same disorienting Technical Caste geometry, but a smaller precinct, dependent on Żelovin goodwill."
      construction: "Technical Caste infrastructure like Żelovin—disorienting geometries, perception-confusing corridors. But less accumulated refinement, smaller population, dependent status visible in maintenance."
      visual_vocabulary:
        - "Technical Caste geometry (same as Żelovin)"
        - "Smaller scale: vassal precinct, dependent status"
        - "Cross-house children in training (recruited from other precincts)"
      materials:
        - "Technical Caste infrastructure"
        - "training facilities for recruited children"
        - "dependent-status markers (less elaborate than Żelovin)"
      colors:
        - "Technical quarter palette"
        - "aurora-bright Avouvar from multiple houses (recruited children)"
        - "simpler territorial marking than Żelovin"
      sensory:
        - "Technical geometry disorientation (like Żelovin)"
        - "children from other houses learning mediator skills"
        - "dependent-status precinct: less elaborate, more practical"
      key_elements:
        - "Eastern Technical quarter approach"
        - "Vassal status under Żelovin protection"
        - "Cross-house recruitment (children declaring mediator calling)"
        - "Nominal independence, actual dependency"
  # ─── end Dravoëtsin ───

  # ═══ Droëvan ═══
  Droëvan:
    category: location
    short: Feuding precinct—5000 years of vendetta with Vesztraëlin in the garrison district.
    details: |
      The other half of the garrison district feud. What began during an ancient starvation 
      winter has become institutional culture: Chancery filings, epic poetry, formal disputations, 
      death-verses. Droëvan uses a mess hall as archive space—centuries of documents stacked to 
      the ceiling. The schism with Vesztraëlin generates more Chancery proceedings than any 
      other inter-house dispute: seventeen border adjudications, four hundred twelve rulings on 
      specific violence, ninety-seven precedents on permitted targets.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Vesztraëlin, Warborn]
    location_features:
      level: district
      location_type: military
      parent: Asovoë
      primary_function: The feud
      castes_present:
        - Avouvar
      borders:
        contested: Vesztraëlin
      hazards:
        - "Autonomous training systems in buffer yards"
        - "Railgun emplacements"
        - "The feud itself"
      notable_features:
        - "5000-year vendetta with Vesztraëlin"
        - "Mess hall converted to document archive"
        - "Specialized Chancery notation for their proceedings"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "The precedents are clear. The killing is documented. The archive grows."
      environment: "Former Warborn garrison adjacent to Vesztraëlin—the same brutal proportions, the same contested border, the same millennia of accumulated violence. But where Vesztraëlin made theater, Droëvan made archive."
      construction: "Warborn barracks adapted identically to Vesztraëlin: stone platforms as family foundations, fabric partitions, impossible proportions made functional. But the mess hall here is buried under paper—centuries of Chancery filings, surveys, architectural analyses, precedent compilations stacked in piles reaching the ceiling."
      visual_vocabulary:
        - "Warborn proportions: lower, wider, brutal"
        - "Document archive: paper stacks as architecture"
        - "Lavoëran notation system for the feud's specialized proceedings"
        - "The same vendetta culture, different expression"
      materials:
        - "Warborn-scale military construction"
        - "fabric partitions on stone soldier-beds"
        - "railgun emplacements (pointed at Vesztraëlin)"
        - "paper: millennia of Chancery filings, precedents, adjudications"
      colors:
        - "military grey and black"
        - "aurora-bright Avouvar in brutal spaces"
        - "yellowed document paper, faded ink"
        - "archive dust in the light"
      sensory:
        - "paper everywhere: the smell of old documents, preservation agents"
        - "the quiet of archivists cross-referencing precedent"
        - "autonomous drones in the buffer yards"
        - "Warborn proportions: the same wrongness as Vesztraëlin"
      key_elements:
        - "5000-year feud with Vesztraëlin (mirror image, different emphasis)"
        - "Mess hall as document archive (ceiling-high stacks)"
        - "Formal disputations rather than theatrical performance"
        - "Specialized Lavoëran notation for their proceedings"
        - "17 border adjudications, 412 rulings, 97 precedents"
  # ─── end Droëvan ───

