  # ═══ Pilgrim's Rest ═══
  "Pilgrim's Rest":
    category: location
    short: "Traveler services district—austere vernacular for those preparing to leave the city behind."
    details: |
      ~8,000 residents. Gateway to hermitage routes in Sierra foothills. The architecture 
      deliberately refuses elaboration—pilgrims should not become comfortable here. This 
      is a threshold, not a destination.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don]
    location_features:
      level: district
      location_type: commercial
      parent: ya-Don
      population: ~8,000
      primary_function: Pilgrim services
      notable_features:
        - Gateway to hermitage trails
        - Pilgrim hostels
        - Outfitters for wilderness travel
      real_world_anchor: "Central Valley (ya-Don, eastern edge)"
    aesthetic_features:
      intention: "You are leaving. We help you leave. This place serves that purpose."
      environment: "At the city's eastern edge where urban fabric dissolves into foothill trails. The Sierras visible ahead—the first real view of the mountains that pilgrims will climb. The Furnace glow dimmer here, the city receding."
      construction: |
        Austere vernacular. The same materials and traditions as the rest of ya-Don, but 
        deliberately plain. Pilgrim hostels offer shelter without comfort; the difficulty 
        begins here. Outfitters sell what the journey requires—water containers, walking 
        staffs, the simple robes that hermitage visitors wear.
        
        The architecture refuses elaboration. No geometric relief, no bronze fittings 
        beyond the functional. Stone and timber without pretense. The message is 
        theological: comfort belongs to the city you're leaving, not the journey ahead.
      materials:
