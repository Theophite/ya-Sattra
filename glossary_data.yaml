        - "pilgrims preparing"
        - "outfitters selling simple necessities"
        - "the first foothill breezes"
      key_elements:
        - "austere vernacular (deliberate plainness)"
        - "threshold function (not destination)"
        - "gateway to hermitage routes"
        - "the mountains visible ahead"
  # ─── end Pilgrim's Rest ───

  # ═══ Port District ═══
  Port District:
    category: location
    short: "Industrial waterfront district at lake level—warehouses blazing with electric light."
    details: |
      Two square miles at 6,200 feet where streams reach the lake. Massive granite warehouses 
      (200x80x40 feet) storing six months of goods when pass is open. Electric lights blaze 
      from every door and dock—nighttime loading common. Dense worker housing: multi-story 
      granite buildings with shared courtyards, exterior staircases, electric heating elements 
      (winter kills without them). Re-carved reliefs on older buildings—monarchical scenes 
      replaced with revolutionary, new panels 2-3 inches deeper.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Taho, Merchant Terraces]
    location_features:
      level: district
      location_type: industrial
      parent: Taho
      children:
        - "Factor's Row"
        - Worker Tenements
      primary_function: Trade, warehousing
      castes_present:
        - Serrulata
        - Near-Baseline
        - Ranga
      notable_features:
        - 24-hour lighting
        - Massive warehouses
        - Re-carved Sultanate reliefs
      borders:
        above: [Merchant Terraces]
      real_world_anchor: "Lake Tahoe waterfront (Taho, 6,200 feet)"
    local_aesthetic: "Industrial granite Petra at lake level. Massive warehouses built from granite blocks—some 200 feet long, 80 wide, 40 high—with timber roofs. Electric lights blaze from every door and dock; Salvage and Cartage Consolidated keeps lights burning 24 hours daily. Worker housing dense: multi-story granite buildings with shared courtyards, exterior staircases, electric heating elements on walls and sleeping platforms. Every unit has light and heat—winter at this altitude kills without them. The granite walls show carved bas-reliefs, but look closely: the deeper carvings are newer, revolutionary scenes replacing monarchical. A tribute panel showing Sultana Ulayah is now a collective harvest, carved 2-3 inches deeper. The stone remembers even when people prefer to forget."
  # ─── end Port District ───

  # ═══ Factor's Row ═══
  Factor's Row:
    category: location
    short: "District where Imperial factors operate seasonally—half Imperial, half Republican, entirely commercial."
    details: |
      Timber buildings on granite foundations, large doors facing docks. Imperial factors 
      arrive when pass opens, leave before winter, maintain year-round staff. They dress 
      in geometric-cut robes, speak Imperial Common, maintain foreign customs—but negotiate 
      with kilits as equals because kilits won't tolerate subordination. Warehouses vast, 
      electric lighting throughout (powered by merchant kilit subsidies).
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Port District, Taho, Undying Empire]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Port District
      primary_function: Imperial trade operations
      notable_features:
        - Seasonal occupation
        - Imperial customs
        - Vast warehouses
      real_world_anchor: "Lake Tahoe waterfront (Taho Port District)"
    local_aesthetic: "Imperial enclave in Republican territory. Timber buildings on granite foundations—large doors facing docks, offices on second floors, electric lights blazing from every window. Imperial factors dress in geometric-cut robes marking Bureau affiliation or Aureate employment. They speak Imperial Common, maintain formal protocols, serve afternoon tea. But they've adapted: they negotiate with kilit representatives as equals, tolerate Republican political discussions, understand commerce here requires accommodation. The warehouses are vast—storage for months of goods. Electric lighting throughout, powered by merchant kilit subsidies the factors pay for but don't control. Half Imperial, half Republican, entirely commercial."
  # ─── end Factor's Row ───

  # ═══ Worker Tenements ═══
  Worker Tenements:
    category: location
    short: "Dense worker housing in Port District—granite buildings with electric heating."
    details: |
      Multi-story granite buildings with shared courtyards, exterior staircases, minimal 
      insulation. But every unit has electric heating elements—copper coils on walls or 
      under sleeping platforms. Winter kills without them. Workers pay monthly for power; 
      merchant kilits provide it at subsidized rates. Dense: four to a room in Port District.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Port District, Taho]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Port District
      primary_function: Worker housing
      castes_present:
        - Serrulata
        - Near-Baseline
        - Ranga
      notable_features:
        - Electric heating (essential for survival)
        - Dense occupation
        - Subsidized power
      real_world_anchor: "Lake Tahoe waterfront (Taho Port District)"
    local_aesthetic: "Survival made possible by infrastructure. Multi-story granite buildings with shared courtyards, exterior staircases, minimal insulation against mountain cold. But every unit has electric heating elements—copper coils that warm when powered, mounted on walls or under sleeping platforms. Winter at 6,200 feet kills without heat; this is not luxury but necessity. Workers pay 3 dinars monthly for power that costs 3.5 dinars—receiving charity while the merchant kilit announces it loudly as proof of revolutionary virtue. Four to a room. Shared kitchens. But the lights stay on and the heating elements warm. The poor in Taho live better than middle class in eastern settlements. The contrast with Upper City compounds is absolute: thirty people in 8,000 square feet versus eighty in 4,000. But both have electric light and heat."
  # ─── end Worker Tenements ───

  # ═══ Quick Lanes ═══
  Quick Lanes:
    category: location
    short: "Astal settlement—ya-Don vernacular at Astal scale."
    details: |
      ~15,000 residents (base population; surges to 40,000+ during harvest). On marginal 
      land northwest of ya-Don where irrigation doesn't quite reach. Architecture adapted 
      for bodies barely over a meter tall and lifespans of 35 years. A building standing 
      fifty years is ancient here.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Astal]
    location_features:
      level: district
      location_type: residential
      parent: ya-Don
      population: ~15,000 (base); up to ~40,000 (seasonal surge)
      primary_function: Astal residence and agricultural labor
      castes_present:
        - Astal
      notable_features:
        - Miniaturized architecture
        - Aphorism lintels
        - Surge dormitories
      real_world_anchor: "Central Valley (ya-Don, northwestern agricultural edge)"
    aesthetic_features:
      intention: "Three plantings make a life. The harvest comes regardless."
      environment: "Marginal land where irrigation thins. The agricultural districts visible to the south, the Furnace glow at night, but the district feels peripheral. Population fluctuates dramatically with harvest seasons."
      construction: |
        Ya-Don vernacular scaled for bodies barely over a meter tall. Courtyard 
        organization, adobe construction, bronze fittings at thresholds—doorways 
        that force baseline adults to duck or crawl. Windows at Astal eye-height. 
        Courtyards that feel intimate to visitors but spacious to residents.
        
        Adobe dominates because it builds fast—Astal temporal experience means a 
        building project that takes baseline workers a season feels like years. 
        A fifty-year-old building has sheltered multiple generations; residents 
        speak of "great-grandmother's house" for structures baseline visitors 
        would call recent construction.
        
        Surge dormitories—large halls sized for harvest population—stand half-empty 
        most of the year, fill completely during agricultural peaks.
      materials:
        - "adobe: Astal-scaled bricks"
        - "bronze threshold fittings"
        - "timber framing"
        - "courtyard paving worn smooth by small feet"
      colors:
        - "adobe tan"
        - "bronze fittings at Astal eye-height"
        - "agricultural tan and green at margins"
      sensory:
        - "children everywhere"
        - "small-scale activity: everything sized down"
        - "aphorisms spoken constantly"
        - "baseline visitors ducking through doorways"
        - "seasonal density shifts"
      key_elements:
        - "miniaturized architecture"
        - "aphorism lintels (painted above doorways)"
        - "courtyard organization at Astal scale"
        - "surge dormitories for harvest population"
    local_aesthetic: |
      Ya-Don patterns miniaturized—doorways that baseline visitors must duck through, 
      windows at waist-height, courtyards that feel intimate until you realize they're 
      standard proportions for meter-tall bodies. Bronze threshold strips at every 
      entrance, catching light at Astal eye-level.
      
      Above doorways, painted aphorisms in neat Imperial script: "Three plantings make 
      a life," "Children remember what parents forget," "The harvest comes regardless." 
      Knowledge transmitted through daily encounter. The paint refreshes every few 
      years—someone's grandmother's wisdom repainted by her great-great-grandchildren, 
      the words unchanged, the hands different.
      
      The Assembly hall has geometric relief at its entrance, the same pattern you'd 
      find on a guild hall in the Threshold, but at two-thirds scale. The district 
      shrine holds services at Astal pace (half as long, twice as often). The Penitent 
      priest who serves here—baseline, forty-two—has outlived three generations of 
      his congregation.
  # ─── end Quick Lanes ───

  # ═══ Ridge ═══
  Ridge:
