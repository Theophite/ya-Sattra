      examine contradictions. Friendly with everyone, genuinely likes Imek.
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Junta of Ogon, Ogon, Tama Family]
  # ─── end Bal Tama ───

  # ═══ Iron-Rain ═══
  Iron-Rain:
    category: person
    short: "Junta Ironbone-Warborn hybrid—nearly 3 meters tall, invulnerable, 1,200 warriors, personal name unknown."
    person_location: Ogon
    details: |
      Age 29. Northern districts. Took token through combat 5 years ago. Bred 
      through seven-generation program in the far north, declared infertile, 
      sold into slavery, killed master at age 12 when capabilities manifested. 
      Armor plates cover most of body, Warborn healing and combat reflexes. 
      Commands through pure physical dominance. Doesn't particularly like violence, 
      just unbeatable. Obsessed with people who rise above station through effort. 
      In relationship with Imek; they're pursuing genetic interventions to produce heir.
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Junta of Ogon, Ogon, Ironbone, Warborn, Imek Stone-Foot]
