  # ═══ Coolant District ═══
  Coolant District:
    category: location
    short: "Bureau of the Rod enclave—ya-Sattra architecture imposed, alien to the surrounding city."
    details: |
      ~8,000 residents. Institute of Flow headquarters. es-Vorath family compound. 
      Colonial architecture: built for bodies that cannot tolerate Central Valley 
      heat, making no concession to local tradition. The district announces that 
      its residents are from elsewhere and intend to remain comfortable.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Bureau of the Rod]
    location_features:
      level: district
      location_type: administrative
      parent: ya-Don
      children:
