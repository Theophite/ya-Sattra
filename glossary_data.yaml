  # ═══ Manufacturing District ═══
  Manufacturing District:
    category: location
    short: "Industrial area west of High Junction's bridge."
    details: |
      Chaotic periphery of hastily constructed worker housing around relocated manufacturing 
      facilities. ~15,000 workers in forges, textile operations, food processing, workshops. 
      Vice economy serving garrison soldiers. Grid-powered since six years ago. 50,000 new 
      arrivals in six years transformed this from empty land to controlled chaos.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [High Junction, The Bridge]
    location_features:
      level: district
      location_type: industrial
      parent: High Junction
      children:
        - Worker Housing
        - Vice District
        - Frontier Veterans' Collective
      primary_function: Manufacturing, worker housing
      population: ~50,000
      hazards:
        - Poor sanitation
        - Industrial waste
        - Fire risk
        - Disease outbreaks
      borders:
        east: [The Bridge]
      real_world_anchor: "Southern Colorado highlands (High Junction west bank)"
    local_aesthetic: "Frontier boomtown, six years old and already weathering. Timber frames on stone foundations, sheet-metal roofing, large doors for wagon access, chimneys venting forge smoke. Buildings functional rather than aesthetic—walls that keep weather out, roofs that don't leak, floors that support heavy machinery. But the shabby exteriors hide advanced technology: precision lathes, textile machinery with salvaged Imperial components, metalworking equipment. Copper wire on timber poles carries grid power; generators clatter when the line fails. Dawn Party red painted on walls, newspapers posted everywhere—'80,000 people and 80,000 newspapers.' The smell of coal smoke and industrial waste. Across the Bridge, amber electric light in adobe domes; here, raw industry lit by whatever's cheapest."
  # ─── end Manufacturing District ───

  # ═══ Worker Housing ═══
  Worker Housing:
    category: location
    short: "Ad hoc construction housing ~35,000 manufacturing workers and families."
    details: |
      Urgent need met with available resources: undersized timber frames, inconsistent adobe 
      fill, roofing of whatever could be obtained. Families of four or five in single rooms, 
      sometimes sharing buildings. Sanitation inadequate—communal latrines, wells, water 
      carriers. Fire risk extreme. Increasingly common: Dhal-Setil Mercantile prefab cabins 
      on installment payments.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Manufacturing District, High Junction, Dhal-Setil Mercantile]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Manufacturing District
      population: ~35,000
      primary_function: Worker residence
      hazards:
        - Fire risk
        - Poor sanitation
        - Disease outbreaks
        - Overcrowding
      real_world_anchor: "Southern Colorado highlands (High Junction west bank)"
    local_aesthetic: "Desperation made architectural. Undersized timber frames, inconsistent adobe fill, roofing of salvaged sheet metal or whatever came to hand. Many structures began as temporary shelters and solidified through continuous repair rather than any plan. Oil lamps because electric service doesn't reach here reliably. Eight people in 300 square feet. Communal latrines that fill faster than they're cleaned. The Dhal-Setil prefab cabins stand out—standardized timber-frame structures shipped in sections, better quality at prices workers afford through installment payments. They're the aspiration; the improvised housing is the reality. Disease spreads easily. Fire risk is extreme. But for someone who spent years watching sheep or failing at collective farming, this represents improvement."
  # ─── end Worker Housing ───

  # ═══ Vice District ═══
  Vice District:
    category: location
    short: "Gambling, brothels, taverns, and hashish vendors serving the garrison."
    details: |
      Vice operations concentrated in specific streets, informally tolerated so long as they 
      don't generate excessive disorder. Gambling establishments range from respectable to 
      extremely crooked. Brothels operate in legal gray areas. Colonel Ghar focuses on 
      preventing violence rather than achieving prohibition.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Manufacturing District, High Junction, Garrison Headquarters]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Manufacturing District
      primary_function: Entertainment, vice
      hazards:
        - Violence
        - Theft
        - Disease
      real_world_anchor: "Southern Colorado highlands (High Junction west bank)"
    local_aesthetic: "Old West saloon district. Wooden porches, painted signs advertising gambling and drink, oil lamps casting yellow light across muddy streets. Gambling halls with crooked games and honest ones, the difference not always apparent until you've lost. Brothels behind unmarked doors—everyone knows which ones. Taverns serving pulque and harder spirits, hashish smoke drifting from backrooms. Young soldiers on leave, pockets full of garrison pay, making the choices young soldiers make. Street vendors selling food to the drunk and gambling-broke. Informally tolerated because prohibition is impossible and containment is practical. Colonel Ghar's men patrol but don't enforce—violence brings response, vice does not."
  # ─── end Vice District ───

  # ═══ Frontier Veterans' Collective ═══
  Frontier Veterans' Collective:
    category: location
    short: "Radical Dawn veterans' organization in converted warehouse—ideology over mutual aid."
    details: |
      Meetings are serious, ideological, structured around formal agendas with debates and 
      votes. Advocates aggressive Dawn positions: maximum military spending, accelerated 
      eastern expansion, collective farms over individual homesteads. Revolutionary banners, 
      martyr portraits. Free pulque and hashish for prospective members near discharge.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Manufacturing District, High Junction, Veterans' Kilits, Dawn Party]
    location_features:
      level: site
      location_type: commercial
      parent: Manufacturing District
      primary_function: Veterans' organization, political
      notable_features:
        - Radical Dawn politics
        - Free intoxicants for recruits
        - Revolutionary banners
      real_world_anchor: "Southern Colorado highlands (High Junction west bank)"
    local_aesthetic: "Converted warehouse made into revolutionary headquarters. Revolutionary banners cover the walls—rust-orange and teal maguey-silk with cream-colored slogans. Portraits of revolutionary martyrs at the front. Meetings are formal: agendas, debates, votes on positions. This is serious politics, not social club. The bar serves pulque and hashish virtually free to young soldiers nearing discharge—recruitment tool and ideological test. Those who stay past the free drinks hear speeches about maximum military spending, aggressive eastern expansion, collective farms over individual homesteads. The rhetoric treats military service as ongoing revolutionary commitment. Older members remember fighting the Sultanate; younger ones want to fight the Thousand Kingdoms."
  # ─── end Frontier Veterans' Collective ───

  # ═══ Medina Quarter ═══
  Medina Quarter:
    category: location
    short: "Ya-Sattra's principal commercial and residential district—gateway where outside world meets Imperial authority."
    details: |
      ~300,000 residents on the eastward landward approach to the city. The district 
      was once full of arcologies; most were destroyed in a classified catastrophe 
      that also toppled the Ridge. Three full-size arcologies survive: The Angle 
      (sheared at 30°, ~8,000 residents), Calibration Hall (fully operational, ~30,000 
      residents), and Kethesir's Pillar (gutted by ancient vandalism, ~2,000 on lower 
      floors). The Processional—three kilometers of antediluvian porcelain-coral—cuts 
      through the district to the Rift embarcadero. Guild shops operate under ancient 
      charters; markets fill every public space; the Great Bazaar alone covers a third 
      of the district's area. Bureau sub-offices distributed throughout.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [ya-Sattra, Archive Gate, "Booksellers' Row", Great Bazaar, The Processional]
    location_features:
      level: district
      location_type: commercial
      parent: ya-Sattra
      children:
        # Prestige area (near Fourth Whorl)
        - The Approach
        # Guild neighborhoods
        - Clothiers' Quarter
        - Grocers' District
        - Joiners' Block
        - Lens-Grinders' Courtyard
        # Guild streets
        - Alley of Lenses
        - Coppersmith Lane
        # Boundary neighborhood (near Archive Gate)
        - Old Customs
        # Commercial areas
        - Great Bazaar
        - Foundation Market
        - The Processional
        # Ancient buildings
        - Processional Tower
        - Stewards' Block
        # Religious
        - Cathedral of the Plea
        # Arcologies
        - The Angle
        - Calibration Hall
        - Kethesir's Pillar
        # Trade missions
        - Sztoavel Imports
      population: ~300,000
      primary_function: Commerce and middle-class residence
      castes_present:
        - Near-Baseline
        - Various artisan and merchant castes
      notable_features:
        - The Processional (porcelain-coral thoroughfare)
        - Three surviving arcologies
        - Great Bazaar (covers a third of district, opens to Rift bridges)
        - Foundation Market (exposed pre-Interdict infrastructure)
        - The Approach (bronze buildings, reliable power—everyone calls it 'the Fifth')
        - Old Customs (boundary commerce near Archive Gate)
        - Processional Tower (truncated, threshold worn 8cm deep)
        - Stewards' Block (cream walls warm to touch)
        - Lens-Grinders' Courtyard (seven ancient buildings)
        - Cathedral of the Plea (Transmission Tower for Tenth Observance)
        - Many's primary countinghouse (Booksellers' Row)
        - Sztoavel Imports (Asovoë trading presence)
      borders:
        west: [Inner City, Fourth Whorl]
        north: [Rift]
        southwest: [Rotten Quarter, Iron Yards]
        east: [Eastern approaches]
        across_rift: [Antediluvian Quarter]
      transit:
        - route: Fourth Whorl Doorways
          to: Inner City
          type: door
          notes: "Massive bronze doorways perpetually open; transition from enclosed to open-air"
        - route: Archive Gate
          to: Iron Yards / Rotten Quarter
          type: checkpoint
          notes: "Lens inspectors examine salvage; boundary between commercial and industrial"
        - route: Aureate Span
          from: Antediluvian Quarter
          to: Great Bazaar
          type: bridge
          notes: "Sword checkpoint works for Aureates; once through, market chaos swallows status"
        - route: Clerk's Span
          from: Antediluvian Quarter
          to: Great Bazaar
          type: bridge
          notes: "Sword checkpoint; Bureau credentials help"
        - route: Valet's Span
          from: Antediluvian Quarter
          to: Great Bazaar
          type: bridge
          notes: "Sword checkpoint checks Aureate servant registries"
        - route: Cliff Route
          to: Antediluvian Quarter
          type: road
          notes: "No checkpoint; circles around Rift tip; longer but avoids all bridge scrutiny"
        - route: Eastern Approaches
          to: Imperial hinterland
          type: road
          notes: "Caravans, frontier traffic; Medina is first experience of capital"
      real_world_anchor: "Monterey Bay basin (east of Inner City)"
    aesthetic_features:
      intention: "Normal life amid the impossible. We built around what we inherited; we maintain what still works; we ignore what we cannot understand."
      environment: |
        Commercial bustle atop foundations designed for purposes no one remembers. The 
        Processional's pale cream porcelain-coral cuts through grey granite—antediluvian 
        pavement the district was built around, self-cleaning while conventional streets 
        show millennia of wear. Three arcologies rise above the conventional construction: 
        The Angle's dramatic thirty-degree truncation catching light at dawn, Calibration 
        Hall glowing with operational systems, Kethesir's Pillar dark above the fourth floor 
        where defaced murals stare eyelessly. The Great Bazaar has no boundaries—it begins 
        wherever merchants set up. Foundation Market occupies a 200-meter subsidence bowl 
        where exposed infrastructure became premium retail. Mediterranean climate. Gateway 
        where caravans from the frontier first encounter Imperial authority.
      construction: |
        THREE LAYERS of construction visible everywhere:
        
        FIRST (Ancient): Pre-Interdict structures—the arcologies, Processional Tower's 
        truncated eleven stories, Stewards' Block's massive single structure with four-meter 
        doorways reduced to human scale, Lens-Grinders' Courtyard's seven buildings on 
        their shared foundation. Bronze-colored thesad. Impossible. Permanent.
        
        SECOND (Interstitial): Stone, brick, timber buildings (3-5 stories) built BETWEEN 
        ancient structures. Never touching the bronze columns—the five-foot gap maintained 
        for reasons no one remembers. This layer absorbed 50,000 years of Antediluvian 
        aesthetic pressure:
        
        - GEOMETRIC BORDER PATTERNS on guild halls, churches, high-status buildings: 
          simplified "circuit board" motifs derived from arcology surfaces. More elaborate 
          than ya-Don but less refined than Antediluvian Quarter.
        - SMOOTH STUCCO FINISHES: attempting to approximate seamless thesad. Plaster 
          carefully applied to hide masonry joints. The aspiration is visible—buildings 
          WANT to be monolithic.
        - BRONZE FITTINGS: not just threshold strips but door hardware, window frames, 
          decorative accents. Aspirational, referencing the great bronze structures.
        - STREAMLINED PROPORTIONS: height-to-width ratios echoing arcology geometry. 
          Round-cornered windows on newer buildings. Smooth transitions between levels.
        
        THIRD (Accumulated): Modification across millennia—stairs worn into curves, 
        handrails polished to mirror brightness, thresholds channeled from constant 
        passage. Eight thousand years of wear visible in every surface.
        
        The conventional construction WANTS to be Antediluvian. It fails, but the attempt 
        shapes everything. A Medina guild hall shows more geometric decoration than a 
        frontier church. A merchant's townhouse here has smoother stucco than an Aureate 
        residence in ya-Don.
      visual_vocabulary:
        - "The Processional: pale cream porcelain-coral against grey granite—the antediluvian artifact the district was built around"
        - "Three arcologies: The Angle sheared at 30° (smooth-as-glass truncation surface), Calibration Hall lit from foundation to apex, Kethesir's Pillar dark above floor four"
        - "Foundation Market: 200m subsidence bowl exposing infrastructure, commerce on platforms across ancient equipment housings"
        - "Guild territories: bronze boundary plaques with antiquity patina, colors marking affiliations, monopolies older than current Bureau organization"
        - "Geometric border patterns: visible on every guild hall, church, high-status building"
        - "Smooth stucco: buildings aspiring toward thesad seamlessness"
        - "Bronze accents: pervasive, aspirational"
        - "Wear patterns: floors worn into canyons, handrails sculpted by touch, thresholds worn through"
      materials:
        - "porcelain-coral (The Processional—self-cleaning, self-repairing, pale cream)"
        - "grey pre-Interdict substrate (arcologies, ancient buildings—absorbs light differently)"
        - "grey granite (conventional construction—weathered, foundation of interstitial layer)"
        - "smooth stucco (aspirational finish, attempting thesad seamlessness)"
        - "bronze fittings (pervasive—threshold strips, door hardware, decorative accents)"
        - "geometric relief (circuit-board patterns on formal entrances)"
        - "tan local timber, rust-orange salvaged metal, cream plastered adobe"
      colors:
        - "The Processional: pale cream against surrounding grey"
        - "arcology grey: shifts with light—blue at dawn, grey at noon, amber at sunset"
        - "conventional construction: grey-brown stone, cream stucco, bronze accents"
        - "guild markers: specific colors by affiliation"
        - "textile awnings: faded blues and ochres"
        - "bronze patina: verdigris on older fittings, polished gold-red on maintained ones"
      sensory:
        - "The Processional: pristine pavement, debris absorbed overnight, quieter footfalls"
        - "Great Bazaar: ten thousand conversations, hammering, sizzle of cooking, thousands of footsteps"
        - "ancient buildings: hum of unknown systems (Calibration Hall audible; Kethesir's silent)"
        - "smooth stucco walls: the tactile aspiration toward thesad"
        - "bronze fittings: cold metal at entrances, polished by generations of hands"
        - "morning: market setup, wood scraping stone; evening: markets dismantled, music begins"
      key_elements:
        - "The Processional: three kilometers of porcelain-coral from eastern approaches to embarcadero"
        - "Three surviving arcologies: The Angle, Calibration Hall, Kethesir's Pillar"
        - "Foundation Market: subsidence bowl exposing ancient infrastructure"
        - "Great Bazaar: white market on foundation tops, grey market in canyons, black margins in carved spaces"
        - "Geometric border patterns: the Antediluvian aesthetic absorbed into vernacular"
        - "Smooth stucco finishes: aspiring toward thesad seamlessness"
        - "Bronze fittings: pervasive aspirational material"
        - "Guild territories: bronze plaques marking monopolies older than Bureau organization"
  # ─── end Medina Quarter ───

  # ═══ Lens-Grinders' Courtyard ═══
  Lens-Grinders' Courtyard:
    category: location
    short: "Complex of seven pre-Interdict structures housing Opticians' Guild and precision workshops."
    details: |
      Seven ancient buildings surrounding central courtyard on shared foundation ~200 meters 
      square. Houses Opticians' Guild headquarters (distinct from retail in Alley of Lenses), 
      three precision-instrument workshops, residential space for ~200 people, and a Bureau 
      of the Rod sub-office that has occupied the same rooms for eleven centuries.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Opticians' Guild, Alley of Lenses]
    location_features:
