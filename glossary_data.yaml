    category: location
    short: "Agricultural districts—rural vernacular where the land shapes the building."
    details: |
      ~80,000 residents. Parish of Common-Ground. Where ya-Don's food comes from and 
      where agricultural workers live. The architecture follows the land rather than 
      urban patterns—irrigation channels dictate building placement, seasonal rhythms 
      shape construction schedules.
