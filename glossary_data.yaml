  # ═══ Rotten Quarter ═══
  Rotten Quarter:
    category: location
    short: "Colloquial name for ya-Sattra's poor industrial districts."
    details: Informal grouping encompassing Iron Yards, Middens, and Ridge. Not a formal administrative unit.
    rag_pointer: The Iron Yards, The Hanged Men
    related: [Iron Yards, Middens, Ridge]
