      real_world_anchor: "Monterey Bay basin (Rift, western edge)"
  # ─── end Westerner Berths ───

  # ═══ Embarcadero ═══
  Embarcadero:
    category: location
    short: "Ya-Sattra's commercial waterfront—the Rift's southern shore where The Processional ends."
    details: |
      Timber and iron docks extending along the entire south shore of the Rift. Where 
      The Processional's porcelain-coral terminates, becoming the main commercial harbor. 
      Warehouses, Stevedores' Guild operations, factors' offices, and terraces climbing 
      toward the Iron Yards. Working-class character: stevedores, sailors, transient labor, 
      the infrastructure that keeps ya-Sattra supplied. Cranes of mixed vintage—some 
      pre-Interdict mechanisms, others conventional block-and-tackle.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
    related: [Rift, The Processional, Medina Quarter, Iron Yards, Stevedores' Guild, Factors' Row]
    location_features:
      level: neighborhood
      location_type: infrastructure
      parent: Rift
      primary_function: Commercial docking, cargo handling
      notable_features:
        - Terminus of The Processional
        - Transition from porcelain-coral to timber docks
        - Stevedores' Guild operations
        - Terraces to Iron Yards
        - Mixed-era crane systems
      borders:
        south: [Medina Quarter, Iron Yards]
        north: [Rift water]
      real_world_anchor: "Monterey Bay basin (Rift, south shore)"
    local_aesthetic: "Where antediluvian meets industrial: The Processional's porcelain-coral ends abruptly at timber and iron docks. The transition is stark—self-cleaning pavement giving way to planking that creaks underfoot, stained by salt and labor. Cranes swing cargo between ship and warehouse; stevedores move in coordinated gangs under Guild supervision. Behind the immediate waterfront, stone terraces climb toward the Iron Yards, each level more industrial than the last. At night, dock lights reflect on dark water while the north shore's pleasure craft bob in quiet contrast."
  # ─── end Embarcadero ───

  # ═══ Marina Promenade ═══
  Marina Promenade:
    category: location
    short: "Pleasure waterfront along the Rift's north shore—private docks for Antediluvian Quarter residents."
    details: |
      Porcelain-coral promenade running along the Antediluvian Quarter's waterfront. 
      Private docks, yacht berths, pleasure craft for patent-holding families. The 
      quiet side of the Rift—wealth's leisure rather than commerce's chaos. Brass 
      fittings, maintained rigging, vessels that rarely leave harbor but demonstrate 
      their owners can afford them.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
    related: [Rift, Antediluvian Quarter, Aureate]
    location_features:
      level: neighborhood
      location_type: infrastructure
      parent: Antediluvian Quarter
      primary_function: Pleasure craft moorings
      notable_features:
        - Private yacht berths
        - Porcelain-coral construction
        - Aureate family vessels
      borders:
        south: [Rift water]
      real_world_anchor: "Monterey Bay basin (Rift, north shore)"
    local_aesthetic: "Porcelain-coral underfoot, the same self-cleaning surface as the Quarter's streets, extending to the water's edge. Private docks branch off at intervals—each family's vessels moored at designated berths, brass fittings polished by hereditary dock-servants. The craft themselves range from small sailing boats to larger yachts that could make coastal voyages if their owners wished. Few do. The vessels exist to demonstrate wealth rather than serve purpose. Across the dark water, the commercial chaos of the embarcadero provides constant reminder of what money insulates against."
  # ─── end Marina Promenade ───

  # ═══ Great Bazaar ═══
  Great Bazaar:
    category: location
    short: "Vast commercial chaos covering a third of the Medina—streets sunken between arcology foundations, buildings carved into ancient substrate."
    details: |
      A third of the Medina Quarter by area, though nobody has successfully mapped it. 
      No formal boundaries—begins wherever merchants set up, ends wherever they don't. 
      The destroyed arcologies left their foundations: massive platforms rising 3-5 meters 
      above the streets that run between them. You walk in canyons, then climb stairs 
      or ramps to reach the buildings constructed ON the foundations. Many buildings 
      are built INTO the foundations themselves—carved chambers, converted conduit spaces, 
      shops occupying equipment housings whose original purpose nobody remembers. The 
      palimpsest goes down as well as up: basement levels beneath basement levels, some 
      connecting, some dead-ending into substrate nobody has surveyed.
      
      White market (licensed guild shops on foundation tops), gray market (uncertain legal 
      status in the streets between), black margins (transactions in the carved spaces 
      where nobody looks). The three bridges from Antediluvian Quarter open into the 
      Bazaar's northern edge—status declared on one side of the Rift, then swallowed by 
      commercial chaos on the other.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Rift, Fourth Whorl, Foundation Market]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Medina Quarter
      population: ~100,000 (transient)
      primary_function: General commerce at all legal registers
      notable_features:
        - Covers a third of Medina Quarter
        - Streets sunken between arcology foundations
        - Buildings ON foundations (climb to reach)
        - Buildings INTO foundations (carved spaces)
        - Multiple basement levels of unknown extent
        - White/gray/black market zones
        - Three bridges from Antediluvian Quarter open here
      borders:
        north: [Rift]
        west: [The Approach]
        south: [Clothiers' Quarter, Joiners' Block]
        east: [Eastern approaches]
      transit:
