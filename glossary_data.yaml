  # ═══ Far Wall ═══
  Far Wall:
    category: location
    short: "Government and bureaucracy side of Glen Canyon—Senate Chamber, ministry warrens, Cathedral atop."
    details: |
      The canyon wall hosting government, bureaucracy, and transformed wealth. Lower levels: 
      bureaucratic warrens notoriously confusing—endless tunnels connecting offices, meeting 
      rooms, archive storage. Mid-level: the Senate Chamber, 80 feet in diameter, revolutionary 
      reliefs carved over monarchical scenes. Higher up: Hereditary Debtors' quarter, former 
      slave quarters now valuable property. Atop: the Cathedral, former palace of Sultana Ulayah, 
      now Patriarch Kaleb's seat, partially overhanging the cliff.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat proper, Near Wall]
    location_features:
      level: district
      location_type: administrative
      parent: Ganat proper
      children:
        - Bureaucratic Warrens
        - Senate Chamber
        - Hereditary Debtors' Quarter
        - The Cathedral
      borders:
        across_canyon: [Near Wall]
      real_world_anchor: "Glen Canyon (Ganat proper, government-side wall)"
    local_aesthetic: "Power carved from stone. Lower levels: bureaucratic warrens, aggressively lit—electric bulbs every few feet, Dawn aesthetic of transparency through illumination, nothing hidden. Endless tunnels connecting offices, meeting rooms, archive storage. A petitioner might spend hours navigating. Mid-level: the Senate Chamber, circular, 80 feet in diameter, revolutionary reliefs carved 3-4 inches deep over monarchical scenes (the originals faintly visible underneath). Higher: Hereditary Debtors' quarter, former slave quarters now valuable real estate—transformed, expanded, decorated. Atop it all: the Cathedral, massive sandstone structure on the canyon rim, partially overhanging, visible from across the canyon. Art Nouveau facades carved on every accessible surface: flowing curves, figurative scenes, relief work 2-3 feet from the wall."
  # ─── end Far Wall ───

  # ═══ Bureaucratic Warrens ═══
  Bureaucratic Warrens:
    category: location
    short: "Ministry tunnels in the Far Wall's lower levels—notoriously confusing, aggressively lit."
    details: |
      Endless tunnels connecting offices, meeting rooms, archive storage. A petitioner might 
      spend hours navigating. Electric bulbs every few feet—Dawn aesthetic of transparency 
      through illumination, nothing hidden in darkness. Forms processed, reports written, 
      administrators coordinating between government and kilits.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Far Wall, Ganat proper]
    location_features:
      level: neighborhood
      location_type: administrative
      parent: Far Wall
      primary_function: Government administration
      notable_features:
        - Aggressive illumination
        - Labyrinthine layout
      real_world_anchor: "Glen Canyon (Far Wall, lower levels)"
    local_aesthetic: "Cappadocia for bureaucrats. Endless tunnels carved through salmon sandstone, connecting chambers that hold offices, meeting rooms, archive storage. Electric bulbs every few feet—aggressive illumination, Dawn aesthetic demanding nothing hide in darkness. A petitioner navigating from entrance to correct office might walk for hours, directed by signs that disappear or become obsolete as tunnels change. The warrens fill when the Senate is in session: senators, staff, lobbyists representing kilits, petitioners seeking favor. Forms are processed. Reports are written. The individual work feels negligible; the collective machinery grinds on. The bright endless corridors become exhausting. The salmon stone glows warm under perpetual light."
  # ─── end Bureaucratic Warrens ───

  # ═══ Hereditary Debtors' Quarter ═══
  Hereditary Debtors' Quarter:
    category: location
    short: "Former slave quarters transformed into valuable real estate—proximity to power made them rich."
    details: |
      Upper Far Wall, adjacent to Senate and ministry warrens. The Hereditary Debtors are 
      descendants of slaves whose debts became hereditary obligations under the Sultanate. 
      The Revolution abolished hereditary debt; former slave quarters became kilit property. 
      Now expanded, improved, decorated—visible transformation from bondage to wealth. They 
      lease space to bureaucrats, rent offices to kilits needing government access, operate 
      restaurants and lodging.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Far Wall, Ganat proper, Hereditary Debtors]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Far Wall
      controlling_entity: Hereditary Debtors' Kilit
      primary_function: Residence, commercial leasing
      notable_features:
        - Transformed slave quarters
        - Ongoing expansion
      real_world_anchor: "Glen Canyon (Far Wall, upper levels)"
    local_aesthetic: "Revolution made visible in stone. The quarters were originally minimal: narrow tunnels, small chambers, basic sanitation—slave housing. Over twenty years, the Hereditary Debtors have expanded, improved, decorated. Larger chambers carved out. Tunnels connected more efficiently. Better lighting, plumbing. Decoration announcing transformation: carved flourishes where bare walls once stood, Art Nouveau organic curves added to functional spaces. Sections in transition visible—workers actively carving new spaces, installing new infrastructure. The wealth comes from position: adjacent to Senate and ministries, proximity to power creates opportunity. Former slaves now lease to bureaucrats, rent to kilits seeking government access, operate restaurants and lodging. The stone remembers what they were. The carving shows what they've become."
  # ─── end Hereditary Debtors' Quarter ───

  # ═══ The Cathedral ═══
  The Cathedral:
    category: location
    short: "Former palace of Sultana Ulayah, now Patriarch Kaleb's seat—atop Far Wall, overlooking the canyon."
    details: |
      Largest free-standing structure in Ganat: 300 feet long, 150 feet wide, four stories tall. 
      Built from quarried sandstone blocks on the canyon rim, partially overhanging the cliff. 
      Western face visible from across the canyon. Sultanate grandeur adapted to revolutionary 
      religion—geometric patterns, figurative scenes, Art Nouveau curves carved into salmon 
      sandstone. Houses revolutionary broadcasting equipment.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Far Wall, Ganat proper, Patriarch Kaleb, Penitent Church]
    location_features:
      level: site
      location_type: religious
      parent: Far Wall
      controlling_entity: Patriarch Kaleb
      primary_function: Religious seat, broadcasting
      notable_features:
        - Former palace
        - Revolutionary broadcasting
        - Canyon-edge position
      real_world_anchor: "Glen Canyon (Far Wall rim, overhanging)"
    local_aesthetic: "Sultanate grandeur serving revolutionary religion. Massive sandstone structure on the canyon rim—300 feet long, 150 wide, four stories tall, built from quarried blocks assembled at the edge. The western face partially overhangs the cliff, visible from across the canyon, from the Near Wall markets, from the Dam. A statement of power that worked for monarchy and now serves Patriarch Kaleb. Carved decoration covers every surface: geometric patterns, figurative scenes, flowing Art Nouveau curves in salmon sandstone. Inside, revolutionary broadcasting equipment—the Patriarch's voice carried to every settlement with a receiver. The palace became cathedral; the Sultana's chambers became offices for religious administration; power changed hands but the building still dominates."
  # ─── end The Cathedral ───

  # ═══ Falx ═══
  Falx:
    category: equipment
    short: Heavy curved blade weapon, standard Warborn close-combat armament.
    details: |
      When culverins and beamcasters aren't enough, when the fighting closes to arm's 
      length, Warborn carry the falx: a forward-curving blade designed to shear through 
      armor and the bodies wearing it.
      
      DESIGN: Single-edged blade curving forward, edge on the inner curve. The blade 
      widens toward the tip, concentrating mass where it impacts. Guard and pommel 
      carry geometric bronze inlay in Inner City patterns. Leather-wrapped grip sized 
      for hands twice baseline scale. Not powered—just steel and the strength of a 
      2.7-meter soldier swinging it.
      
      MANUFACTURE: Furnaces production for standard-issue variants. Higher-quality 
      examples are guild work—Master Kavek Ossoreth's workshop produces perhaps a 
      dozen ceremonial falxes yearly for officers and house guards.
      
      TACTICAL USE: The falx exists for the moments when infantry lines meet, when 
      doorways must be forced, when something needs to die and precision doesn't 
