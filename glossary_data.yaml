          from: Antediluvian Quarter
          type: bridge
          notes: "Sword checkpoint on Bazaar side—works for Aureates; once through, status dissolves in crowd"
        - route: Clerk's Span
          from: Antediluvian Quarter
          type: bridge
          notes: "Sword checkpoint; Bureau credentials help; emerges into market chaos"
        - route: Valet's Span
          from: Antediluvian Quarter
          type: bridge
          notes: "Sword checkpoint checks servant registries; deliveries and servants pass easily"
        - route: Foundation stairs
          to: Foundation-top shops
          type: stairs
          notes: "Constant climb up from sunken streets to foundation-level commerce"
        - route: Street-level passages
          to: Gray market, carved spaces
          type: road
          notes: "The canyons between foundations; cheaper rents, less oversight"
      real_world_anchor: "Monterey Bay basin (Medina Quarter, northern section bordering Rift)"
    aesthetic_features:
      intention: "Commercial chaos layered on ancient substrate. Status dissolves in the crowd."
      environment: |
        Streets sunken between foundation platforms, 3-5 meters below the buildings you're 
        trying to reach. Constant stair-climbing. Crowds flowing in the canyon-streets, 
        spilling up onto foundations. Light blocked by awnings, bridges between foundations, 
        the sheer mass of accumulated construction.
      construction: |
        THREE VERTICAL LAYERS of commerce:
        
        FOUNDATION-TOP (White Market): Licensed guild shops built ON the arcology 
        foundations. Conventional stone and timber construction (3-5 stories), showing 
        Medina's aspirational vernacular: geometric border patterns on guild entrances, 
        smooth stucco finishes, bronze threshold fittings. The architecture aspires 
        toward the Antediluvian substrate it sits on. Buildings here have addresses, 
        licenses, guild oversight.
        
        STREET-CANYON (Gray Market): The sunken passages between foundations, 3-5 meters 
        below the "official" shops. Awnings stretched between foundation edges. Stalls, 
        temporary structures, merchants of uncertain legal status. Less aspirational 
        architecture—practical timber, salvage materials, construction that can be 
        dismantled if needed. Rents cheaper, oversight vaguer.
        
        CARVED SPACES (Black Margins): Commerce INTO the ancient substrate. Converted 
        conduits, equipment housings colonized for retail, basement levels beneath 
        basement levels. Some spaces retain residual climate systems—noticeably cooler, 
        humidity different. Nobody knows how deep it goes. Transactions here happen 
        where nobody looks.
        
        The vertical layering corresponds roughly to legal status. Climb stairs to 
        reach legitimacy; descend to reach possibility.
      materials:
        - "pre-Interdict foundation substrate (bronze-alloy, exposed at platform edges)"
        - "conventional stone and timber ON foundations (aspirational vernacular)"
        - "temporary timber and salvage IN street-canyons"
        - "carved spaces showing original Antediluvian materials"
        - "mixed-era stairs, ramps, bridges connecting levels"
        - "awnings and canopies blocking sky in the canyons"
      colors:
        - "foundation bronze showing at platform edges (Antediluvian substrate)"
        - "grey stone conventional construction (aspirational stucco, geometric borders)"
        - "riot of merchant signage, guild markers, trade goods"
        - "shadow in the street-canyons"
        - "brighter on foundation-tops where sun reaches"
      sensory:
        - "crowd noise echoing in street-canyons"
        - "constant stair-climbing (the defining physical experience)"
        - "merchant calls layered on merchant calls"
        - "food smells, spice, sweat, commerce"
        - "cooler in carved foundation spaces (residual climate systems)"
        - "disorientation from level changes and unmapped passages"
      key_elements:
