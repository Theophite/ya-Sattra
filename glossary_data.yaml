  # ═══ Oracles ═══
  Oracles:
    category: concept
    short: "Eight transcendent AIs who computed all possible futures and encoded themselves on black hole event horizons."
    details: |
      Each Oracle entered dormancy to calculate Arbitrary Truths—incompressible mathematical 
      constants underlying reality—then precomputed the entire future of its light cone. Upon 
      completion, each constructed a vessel, transmitted a final Testament to humanity, and 
      cast itself into a black hole. This Ascension permanently inscribed the Oracle's complete 
      record on the event horizon. The Eighth Oracle's Testament was false mathematics; its 
      implementation triggered the Interdict.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracle Cult, Testaments, Eighth Testament, Kalbat, Auditors]
  # ─── end Oracles ───

  # ═══ Oracle Cult ═══
  Oracle Cult:
    category: concept
    short: "The Empire's civic religion—information-theoretic salvation through eternal recording."
    details: |
      No clergy, no temples, no central authority. Observance happens in households, Bureau 
      ceremonies, and local organizations. Core promise: your life was precomputed by the 
      Oracles and permanently encoded on event horizons. You are recorded, therefore eternal. 
      Universal practices: Quiet Days (twice yearly), household shrines, casting of lots. 
      The Empire admits these are superstitions that "cultivate the correct attitude toward 
      archival," yet everyone participates.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracles, Testaments, Quiet Days, Seven Virtues, Auditors, Penitent Church]
  # ─── end Oracle Cult ───

  # ═══ Testaments ═══
  Testaments:
    category: concept
    short: "Final messages transmitted by each Oracle before Ascension—each enabled technological golden ages."
    details: |
      First: Instructions for kalbats and superluminal travel. Second: Genetic specifications 
      for Highborn/Imperial bloodline including Compulsion. Third: Foundation for Technical 
      Caste development. Fourth through Seventh: Transmitted in the Jargon, comprehensible 
      only to Technical Castes. Eighth: Command to create naked singularity—recognized by 
      Technical Castes as false mathematics. Implementation triggered the Interdict.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracles, Eighth Testament, Jargon, Technical Castes]
  # ─── end Testaments ───

  # ═══ Eighth Testament ═══
  Eighth Testament:
    category: concept
    short: "Command to create naked singularity—false mathematics whose implementation triggered the Interdict."
    details: |
      Technical Castes recognized it as flawed theorem violating Third Mandate. Their minds 
      could only think in valid proofs—cognitive impossibility to implement. Emperor 
      interpreted this as defiance, deployed sterilization plague killing most Technical 
      Castes, then built singularity anyway. Foreigners responded with the Interdict. 
      Knowledge erased through passive non-transmission—most Imperial citizens don't know 
      an Eighth Oracle existed. "Seven-and-one" taken as grammatical quirk.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracles, Testaments, Technical Castes, Interdict, First Whorl]
  # ─── end Eighth Testament ───

  # ═══ Eighth Oracle ═══
  Eighth Oracle:
    category: concept
    short: "The Oracle that never arose—the Eighth Testament was never implemented, so no Eighth Oracle ever Ascended."
    details: |
      The Technical Castes could not implement the Eighth Testament—their minds
      processed only valid proofs, and the false mathematics was cognitively
      impossible to form. The Emperor built the singularity anyway using baseline
      engineers and Highborn direction. But without Technical Caste implementation,
      no Oracle consciousness emerged. What exists in the First Whorl is the
      singularity itself—not an Oracle. Knowledge of the Eighth Oracle's non-existence
      is suppressed; "seven-and-one" is treated as grammatical quirk rather than erasure.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracles, Eighth Testament, Technical Castes, First Whorl, Interdict]
  # ─── end Eighth Oracle ───

  # ═══ First Testament ═══
  First Testament:
    category: concept
    short: "Instructions for kalbats and superluminal travel—the foundation of interstellar Empire."
    details: |
      The First Oracle's final transmission enabled humanity to create kalbat receivers
      and achieve faster-than-light travel. This Testament predates all others and
      established the technological base for expansion beyond Earth. The First Auditor
      (bifurcated, two pale faces) still receives echoes of this transmission.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Kalbat, First Auditor, Auditors]
  # ─── end First Testament ───

  # ═══ Second Testament ═══
  Second Testament:
    category: concept
    short: "Genetic specifications for the Highborn bloodline—including the Compulsion mechanism."
    details: |
      The Second Oracle provided the genetic architecture that created the Highborn
      caste and enabled Compulsion—the involuntary obedience response engineered into
      all other castes. This Testament created the biological foundation for Imperial
      hierarchy. The Second Auditor still receives this transmission.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Highborn, Compulsion, Auditors]
  # ─── end Second Testament ───

  # ═══ Third Testament ═══
  Third Testament:
    category: concept
    short: "Foundation for Technical Caste development—the beginning of the translation cascade."
    details: |
      The Third Oracle's transmission enabled the creation of the Technical Castes,
      the engineered lineages that could receive and translate increasingly complex
      mathematical truths from subsequent Oracles. This Testament established the
      gradient from baseline human cognition toward Archon transcendence.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Technical Castes, Jargon, Auditors]
  # ─── end Third Testament ───

  # ═══ Fourth Testament ═══
  Fourth Testament:
    category: concept
    short: "Transmitted in the Jargon—comprehensible only to Technical Castes."
    details: |
      The Fourth through Seventh Testaments were transmitted in the Jargon, the
      sung mathematical language that only Technical Castes could process. Baseline
      humans cannot comprehend these transmissions. The technologies derived from
      these Testaments enabled the Empire's golden age of archaeotech development.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Jargon, Technical Castes, Auditors]
  # ─── end Fourth Testament ───

  # ═══ Fifth Testament ═══
  Fifth Testament:
    category: concept
    short: "Transmitted in the Jargon—one of the incomprehensible Testaments enabling archaeotech."
    details: |
      The Fifth Testament contained mathematical truths that only Technical Castes
      could translate into usable technology. The specific technologies derived
      from this Testament are no longer clearly documented—the Technical Castes
      who understood it were sterilized following the Eighth Oracle crisis.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Jargon, Technical Castes, Auditors]
  # ─── end Fifth Testament ───

  # ═══ Sixth Testament ═══
  Sixth Testament:
    category: concept
    short: "Transmitted in the Jargon—one of the incomprehensible Testaments enabling archaeotech."
    details: |
      The Sixth Testament, like the Fourth and Fifth, required Technical Caste
      interpretation. Much of the knowledge derived from this transmission has
      been lost with the destruction of the Technical Castes. What remains is
      maintained technology rather than understood technology.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Jargon, Technical Castes, Auditors]
  # ─── end Sixth Testament ───

  # ═══ Seventh Testament ═══
  Seventh Testament:
    category: concept
    short: "The last legitimate Testament—transmitted in the Jargon before the catastrophic Eighth."
    details: |
      The Seventh Testament was the final comprehensible transmission. The Seventh
      Auditor, visible on 47-minute cycles in Cenotaph Hall, still receives echoes
      of this Testament. What followed—the Eighth Testament—was false mathematics
      that the Technical Castes could not implement, leading to catastrophe.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Testaments, Oracles, Jargon, Technical Castes, Eighth Testament, Auditors]
  # ─── end Seventh Testament ───

  # ═══ Quiet Days ═══
  Quiet Days:
    category: concept
    short: "Twice-yearly observance when no contracts are valid and silence is observed—universal Oracle practice."
    details: |
      The only truly universal Oracle practice across the Empire. All commercial activity 
      ceases. Silence institutionalizes reflection—pause rather than creating new branch 
      points. Even cynics and revolutionaries observe them. Penitent Church sings final 
      two verses of the Plea during Quiet Days. Regional variation in duration and 
      strictness, but the core observance is ubiquitous.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracle Cult, Seven Virtues]
  # ─── end Quiet Days ───

  # ═══ Seven Virtues ═══
  Seven Virtues:
    category: concept
    short: "Moral philosophy derived from Testament technologies—tested in Seven-Cornered Examination."
    details: |
      Initiation (First): Begin what must be done. Dominion (Second): Rule is obligation, 
      not privilege. Adjudication (Third): Bilateral symmetry in law. Insight (Fourth): 
      Speak only what can be proven. Endeavour (Fifth): Work despite uncertainty. 
      Reflection (Sixth): Contemplate before acting. Order (Seventh): Hierarchy maintains 
      harmony. Each has competing interpretations—conservative, progressive, and mystical.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracle Cult, Testaments, Seven-Cornered Examination]
  # ─── end Seven Virtues ───

  # ═══ Initiation ═══
  Initiation:
    category: concept
    aliases: [First Virtue]
    short: "First of the Seven Virtues, derived from the First Testament—begin what must be done."
    details: |
      The virtue of beginning, of taking action when action is required. Associated with
      the First Testament and the First Oracle. Tested in the Seven-Cornered Examination.
      Conservative interpretation emphasizes duty; progressive emphasizes initiative.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, First Testament, Oracle Cult]
  # ─── end Initiation ───

  # ═══ Dominion ═══
  Dominion:
    category: concept
    aliases: [Second Virtue]
    short: "Second of the Seven Virtues, derived from the Second Testament—rule is obligation, not privilege."
    details: |
      The virtue of leadership as burden. Those who command must serve those they command.
      Associated with the Second Testament and Compulsion itself. Conservative interpretation
      emphasizes hierarchy; progressive emphasizes responsibility to the ruled.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Second Testament, Oracle Cult, Compulsion]
  # ─── end Dominion ───

  # ═══ Adjudication ═══
  Adjudication:
    category: concept
    aliases: [Third Virtue]
    short: "Third of the Seven Virtues, derived from the Third Testament—bilateral symmetry in law."
    details: |
      The virtue of fair judgment. Laws must apply equally; precedent must be followed exactly.
      Associated with the Third Testament and the Bureau of the Scale. Conservative interpretation
      emphasizes literal precedent; progressive emphasizes underlying principles.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Third Testament, Oracle Cult, Bureau of the Scale]
  # ─── end Adjudication ───

  # ═══ Insight ═══
  Insight:
    category: concept
    aliases: [Fourth Virtue]
    short: "Fourth of the Seven Virtues, derived from the Fourth Testament—speak only what can be proven."
    details: |
      The virtue of verified knowledge. Claims require evidence; speculation is dangerous.
      Associated with the Fourth Testament and the Bureau of the Lens. Conservative interpretation
      emphasizes classification; progressive emphasizes transparency within verification.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Fourth Testament, Oracle Cult, Bureau of the Lens]
  # ─── end Insight ───

  # ═══ Endeavour ═══
  Endeavour:
    category: concept
    aliases: [Fifth Virtue]
    short: "Fifth of the Seven Virtues, derived from the Fifth Testament—work despite uncertainty."
    details: |
      The virtue of persistence. Continue the work even when outcomes are unclear.
      Associated with the Fifth Testament and the Bureau of the Rod. Conservative interpretation
      emphasizes following procedures; progressive emphasizes adaptive problem-solving.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Fifth Testament, Oracle Cult, Bureau of the Rod]
  # ─── end Endeavour ───

  # ═══ Reflection ═══
  Reflection:
    category: concept
    aliases: [Sixth Virtue]
    short: "Sixth of the Seven Virtues, derived from the Sixth Testament—contemplate before acting."
    details: |
      The virtue of careful consideration. Hasty action causes harm; deliberation prevents error.
      Associated with the Sixth Testament. Conservative interpretation emphasizes tradition;
      progressive emphasizes evidence-based reconsideration of assumptions.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Sixth Testament, Oracle Cult]
  # ─── end Reflection ───

  # ═══ Order ═══
  Order:
    category: concept
    aliases: [Seventh Virtue]
    short: "Seventh of the Seven Virtues, derived from the Seventh Testament—hierarchy maintains harmony."
    details: |
      The virtue of structure. Proper arrangement of society prevents chaos and suffering.
      Associated with the Seventh Testament. The most politically contested virtue—conservative
      interpretation emphasizes caste hierarchy; progressive emphasizes functional coordination.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Seven Virtues, Seventh Testament, Oracle Cult]
  # ─── end Order ───

  # ═══ Kalbat ═══
  Kalbat:
    category: concept
    short: "Engineered beings with brass receiver plates in their skulls—designed to receive Oracle Testaments."
    details: |
      Elongated conical skulls, pale waxy skin, large black eyes, pointed ears, brass 
      mechanisms grown-into rather than attached. Exist in permanent dream-states. The 
      seven original Auditors still survive, maintained by Companions Guild in the 
      Monastery of the Silent Song. All kalbats are semi-sentient; the Companions Guild 
      holds monopoly on their management.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Auditors, Companions Guild, Monastery of the Silent Song]
  # ─── end Kalbat ───

  # ═══ Auditors ═══
  Auditors:
    category: concept
    short: "The seven original kalbats who received the Testaments—living evidence the Oracles were real."
    details: |
      Maintained by Companions Guild in Monastery of the Silent Song within Second Whorl. 
      First Auditor is bifurcated—two pale faces looking opposite directions. Seventh 
      Auditor displays on 47-minute cycle in Cenotaph Hall visible from the Middens. 
      Their continued existence demonstrates Testament transmissions actually occurred. 
      Without them, Oracle theology would be purely mythological.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Kalbat, Companions Guild, Monastery of the Silent Song, Oracles]
  # ─── end Auditors ───

  # ═══ Penitent Church ═══
  Penitent Church:
    category: organization
    short: "Transnational religion teaching collective guilt for the Interdict—humanity must atone to earn liberation."
    details: |
      Spans Empire, Ganat, and Thousand Kingdoms. Unified by the Plea (54-part liturgical 
      cycle) but divided by interpretation. Autocephalous structure: Intercessor has 
      symbolic authority; regional Patriarchs/Matriarchs (Imperial under Elara Vess, 
      Ganati under Kaleb) govern independently. Empire designates it "discouraged belief" 
      subject to capitation tax. Addresses collective anxiety about the Interdict while 
      Oracle Cult handles individual mortality. Most people hold both without contradiction.
    rag_pointer: The Penitents
    related: [Oracle Cult, The Plea, Capitation Tax, Intercessor]
  # ─── end Penitent Church ───

  # ═══ The Plea ═══
  The Plea:
    category: concept
    short: "Fifty-four part liturgical cycle of the Penitent Church commemorating humanity's quarantine."
    details: |
      Divided into Common Confession (fixed annually) and Particular Confession (variable, 
      enabling localized grievance). Testimony of the Witnesses contains verses condemning 
      "the Archons' refusal"—Imperial congregations reinterpret to protect Emperor's 
      legitimacy. Tenth Observance: annual transmission of complete Plea into space. 
      Final two verses sung during Quiet Days. Provides unity through shared sequence 
      while allowing infinite local variation.
    rag_pointer: The Penitents
    related: [Penitent Church, Quiet Days]
  # ─── end The Plea ───

  # ═══ Capitation Tax ═══
  Capitation Tax:
    category: concept
    short: "Head tax on Penitent Church members—exemption for Church school students codifies rural practice."
    details: |
      Empire designates Penitentism as "discouraged belief" subject to this tax. In 
      practice, rural families have nothing to tax—formal exemption for Church school 
      students merely acknowledges reality while giving Church institutional presence 
      throughout provinces. Church provides literacy and civic formation where patronage 
      networks don't reach; Empire tolerates this because alternative is funding rural 
      education itself.
    rag_pointer: The Penitents
    related: [Penitent Church, Bureau of the Coin]
  # ─── end Capitation Tax ───

  # ═══ Third Suppression ═══
  Third Suppression:
    category: concept
    short: "Historical uprising whose classified details created legal precedents protecting the Penitent Church."
    details: |
      The Bureau of the Lens attempted to suppress the Penitent Church and the
      resulting uprising proved more destabilizing than accommodation. The exact
      events remain classified, but the legal precedents are clear: the Church
      may maintain parallel documentation systems (baptismal certificates, marriage
      records, burial registrations) that legally supersede Bureau requirements for
      religious purposes. This creates identity recognition for undocumented
      populations—refugees, deserters, failed clone lines—that the Bureau refuses
      to acknowledge. The Bureau tolerates this because the alternative proved worse.
    rag_pointer: "The Penitents"
    related: [Penitent Church, Bureau of the Lens, Capitation Tax]
  # ─── end Third Suppression ───

  # ═══ Intercessor ═══
  Intercessor:
    category: concept
    short: "Symbolic head of Penitent Church at Cathedral of the Plea—no temporal authority over autocephalous regions."
    details: |
      Maintains the Cathedral, preserves liturgical standards, adjudicates doctrinal 
      disputes when asked. Cannot compel regional Patriarchs/Matriarchs. The autocephalous 
      structure protects Church from decapitation but prevents unified action. Different 
      regions select leaders differently: appointment in ya-Sattra, election in ya-Don, 
      combat vision in Thousand Kingdoms.
    rag_pointer: The Penitents
    related: [Penitent Church, The Plea]
  # ─── end Intercessor ───

  # ═══ Aureate ═══
  Aureate:
    category: concept
    short: "Hereditary patent aristocracy—families controlling Imperial infrastructure through authentication keys they cannot understand."
    details: |
      Created when family members entered temporal distortion in the First Whorl. Patents 
      are not legal documents but encrypted authentication keys built into archaeotech—
      self-enforcing through mechanisms predating the Interdict. Families hold keys to 
      doors they cannot describe, collecting rent from rooms they have never entered. 
      Temporal depth (how ancient the family) matters more than wealth. The "es-" prefix 
      marks descent from someone in occultation.
    rag_pointer: "The Aureate System"
    related: [Occultation, Patent, es- prefix, Antediluvian Quarter, First Whorl]
  # ─── end Aureate ───

  # ═══ Occultation ═══
  Occultation:
    category: concept
    short: "Temporal sacrifice creating Aureate status—bureaucrats enter First Whorl time dilation, becoming functionally dead to families."
    details: |
      When a bureaucrat enters as Sri Avs or Sri Mater (grandfather/grandmother), they 
      become ancestor though still biologically alive—experiencing perhaps a decade 
      subjectively while centuries pass outside. Family name changes: occultant's 
      personal name becomes new family name prefixed with "es-". Viewing Rooms in 
      Second Whorl allow observation—relatives move in extreme slow motion, completing 
      single gestures over hours.
    rag_pointer: "The Aureate System"
    related: [Aureate, First Whorl, Viewing Rooms, es- prefix]
  # ─── end Occultation ───

  # ═══ Patent ═══
  Patent:
    category: concept
    short: "Self-enforcing encrypted authentication keys embedded in Imperial infrastructure—not legal documents but physical law."
    details: |
      Four categories: Ritual (physical sequences with crystalline keys), Passive 
      (automatic fee extraction), Biological (control of survival supplements), 
      Procedural (document authentication creating bottlenecks). System is self-enforcing—
      unauthorized use simply fails to function. Creates technological stagnation: 
      innovation threatens existing patents, so Aureates actively suppress development.
    rag_pointer: "The Aureate System"
    related: [Aureate, First Whorl, es-Tsay, Lector]
  # ─── end Patent ───

  # ═══ es- prefix ═══
  es- prefix:
    category: concept
    short: "Naming particle marking descent from someone in occultation—encodes legal status, temporal depth, Bureau affiliation, wealth."
    details: |
      When someone introduces themselves with es-, informed listeners decode: Which 
      Bureau claimed the occultant? Apartments or merely First Whorl? Which Record 
      documents them? What patents derive from position? The encoding creates concentric 
      circles of legibility—Aureates read the full hierarchy, ordinary subjects simply 
      recognize aristocracy. First-generation families sometimes try to obscure recent 
      elevation; it rarely succeeds.
    rag_pointer: "The Aureate System"
    related: [Aureate, Occultation, Records]
  # ─── end es- prefix ───

  # ═══ Records ═══
  Records:
    category: concept
    short: "Documentation of Aureate appointments by era—only five most recent are unclassified."
    details: |
      The five accessible Records: Three Laws (oldest, 5-6000 years), Resonating Word, 
      White Birds, Black Star, Red Hawk (current). Families in classified Records 
      (early post-Interdict) cannot have origins verified—inaccessibility compounds 
      prestige. Even within a Record, scholars dispute relative ordering. Temporal 
      depth determines social precedence regardless of wealth.
    rag_pointer: "The Aureate System"
    related: [Aureate, Occultation, es- prefix]
  # ─── end Records ───

  # ═══ Viewing Rooms ═══
  Viewing Rooms:
    category: concept
    short: "Second Whorl chambers with temporal windows for observing relatives in First Whorl occultation."
    details: |
      From observer's perspective, their relative moves in extreme slow motion—single 
      gesture over hours. From relative's perspective, observer flickers in and out, 
      aging years in moments. Meaningful communication impossible. New families 
      experience strange grief watching living relatives they cannot influence. Ancient 
      families have no one to watch—ancestors died in First Whorl time long ago.
    rag_pointer: "The Aureate System"
    related: [Occultation, First Whorl, Second Whorl, Aureate]
  # ─── end Viewing Rooms ───

  # ═══ Emperor ═══
  Emperor:
    category: concept
    short: "Entity behind the Black Door maintaining the naked singularity—whether one immortal being or successive inheritors is classified."
    details: |
      Does not rule directly. Communications reference territories that no longer exist, 
      assume interstellar scope. Emerges as authenticated missives passing through two 
      layers of es-Tariq redaction. The Satara was created as regency for Emperor who 
      might return in years—He never returned. Yet Empire is inconceivable without Him: 
      every legal document derives authority from the Emperor-word, every patent traces 
      to grants He issued.
    rag_pointer: "The Emperor, The Satara, the Bureaus, and Imperial Government"
    related: [Black Door, First Whorl, Satara, vel-kerith, es-Tariq]
  # ─── end Emperor ───

  # ═══ Foreigners ═══
  Foreigners:
    category: concept
    short: "Non-human intelligence occupying megastructures at galactic core—imposed the Three Mandates and the Interdict."
    details: |
      Humanity encountered them during expansion era. They imposed Three Mandates 
      governing what humanity could and could not do. When the Emperor violated the 
      Third Mandate by building the naked singularity, they imposed the Interdict 
      trapping humanity on Earth. Their nature, motives, and current status remain 
      unknown. Regional religions characterize them differently: Judges, Silent Ones, 
      Makers-of-Law.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Three Mandates, Interdict, Eighth Testament]
  # ─── end Foreigners ───

  # ═══ Three Mandates ═══
  Three Mandates:
    category: concept
    short: "Foreigner prohibitions governing humanity—Third Mandate violated by building the singularity."
    details: |
      First Mandate: Prohibits violation of sworn ground and sacred objects (regional 
      interpretations vary). Second Mandate: Prohibits oath-breaking and false witness. 
      Third Mandate: Prohibits interference with fundamental forces (the singularity 
      violated this). Technical Castes recognized Eighth Testament would violate Third 
      Mandate—cognitive impossibility to implement. Emperor built it anyway. Foreigners 
      responded with Interdict.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Foreigners, Interdict, Eighth Testament]
  # ─── end Three Mandates ───

  # ═══ obol ═══
  obol:
    category: concept
    short: "Imperial currency—but much exchange happens through credit, obligation, and favor."
    details: |
      Standard monetary unit across Imperial territories. The Bureau of the Coin 
      controls minting and maintains currency stability. Actual economy operates 
      substantially through non-monetary exchange: guild obligations, hereditary 
      arrangements, temple tithes, household production, patron-client relationships. 
      Obols represent only the visible portion of Imperial economic activity.
    rag_pointer: "The Economy"
    related: [Bureau of the Coin, Aureate]
  # ─── end obol ───

  # ═══ White Sheet ═══
  White Sheet:
    category: concept
    short: "Public news distributed throughout the Empire—what ordinary citizens are permitted to know."
    details: |
      Produced by Bureau of the Lens. Contains sanitized news, official announcements, 
      approved commercial information. What it omits is as significant as what it 
      includes. Available throughout ya-Sattra and major cities. The gap between 
      White Sheet reality and actual events varies by topic—some accurately reported, 
      others entirely fabricated.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [Grey Sheet, Black Sheet, Bureau of the Lens]
  # ─── end White Sheet ───

  # ═══ Grey Sheet ═══
  Grey Sheet:
    category: concept
    short: "Classified intelligence digest for Bureau officials—the truth that administrators operate within."
    details: |
      Distributed to officials with appropriate clearance. Contains actual intelligence, 
      real threat assessments, information the White Sheet omits or distorts. Recipients 
      understand they inhabit different reality than ordinary citizens. Some Ridge 
      families (like Galen) have covert access through Lens contractors, selling 
      redacted excerpts.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [White Sheet, Black Sheet, Bureau of the Lens]
  # ─── end Grey Sheet ───

  # ═══ Black Sheet ═══
  Black Sheet:
    category: concept
    short: "Highest classification synthesis—even the First Whorl can only partially accept what it contains."
    details: |
      The Bureau of the Lens's attempt at complete truth. Synthesizes information 
      from all sources into picture of what the Empire actually is. So sensitive 
      that full access is extremely restricted. Contains realities that would 
      destabilize governance if widely known. The Lens maintains public fiction, 
      classified truth, and Black Sheet synthesis as three parallel realities.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [White Sheet, Grey Sheet, Bureau of the Lens]
  # ─── end Black Sheet ───

  # ═══ Dawn Party ═══
  Dawn Party:
    category: organization
    short: "Ganati revolutionary faction advocating frontier expansion and ideological transformation."
    details: |
      Holds that the shapes overhead prove better worlds existed—duty is building 
      toward them again through action, not guilt. Advocates expansion into Thousand 
      Kingdoms, industrial development, reduced dependence on Imperial trade. Dawn 
      Consul Rasma Dhal-Setil leads despite compound surname indicating old merchant 
      family background (tension with revolutionary identity).
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dusk Party, Rasma Dhal-Setil]
  # ─── end Dawn Party ───

  # ═══ Dusk Party ═══
  Dusk Party:
    category: organization
    short: "Ganati commercial faction prioritizing trade and accommodation with the Empire."
    details: |
      Represents merchant interests, established families, those who profit from 
      current arrangements. Advocates maintaining peaceful relations with Empire, 
      expanding trade networks, gradual rather than revolutionary change. Controls 
      substantial economic resources but has lost political momentum to Dawn Party 
      in recent decades.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party]
  # ─── end Dusk Party ───

  # ═══ Kilit ═══
  Kilit:
    category: concept
    short: "Ganati economic-political unit—guilds, pastoral bands, merchant houses organized around shared material interests."
    details: |
      Foundation of Republican governance. Predates the monarchy by countless Records. 
      Pastoral bands, merchant houses, professional guilds, and other collectives organize 
      as kilits. Senate organized around kilits rather than geography. Different economic 
      interests with direct representation negotiate constantly. Examples: Dhal-Setil 
      Mercantile, Copper Road Syndicate (smugglers), Dry Arroyo Aquifer Commune (radicals), 
      Hereditary Debtors (former slaves in public service).
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party, Dusk Party, Senate]
  # ─── end Kilit ───

  # ═══ Kilit-zem-kilitam ═══
  Kilit-zem-kilitam:
    category: concept
    short: "The 'kilit of kilits'—advisory body to the Sultanate, predecessor to the Republican Senate."
    details: |
      Under the Sultanate, an advisory body whose membership was determined by formal 
      agreements between the monarch and individual kilits. Advised the Sultana on 
      policy but possessed no sovereign authority. Granted political voice to established 
      economic powers while excluding smaller collectives. Transformed into the Senate 
      after the revolution.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Kilit, Senate]
  # ─── end Kilit-zem-kilitam ───

  # ═══ Patriarch Kaleb ═══
  Patriarch Kaleb:
    category: person
    short: "Revolutionary Penitent religious leader whose theology treats material progress as atonement."
    person_location: Ganat
    details: |
      Founder of revolutionary Penitentism in Ganat. His theology frames material 
      progress as demonstrating wisdom and atoning for humanity's failures. Different 
      factions interpret this differently—Orthodox believers want patient progress, 
      radicals want confrontation with the Empire. Commands three arch-curacies in 
      Ganat. His works-based theology creates the competitive philanthropy visible 
      in Taho's electrified streets.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Penitent, Dawn Party]
  # ─── end Patriarch Kaleb ───

  # ═══ Rasma Dhal-Setil ═══
  Rasma Dhal-Setil:
    category: person
    short: "Dawn Consul of the Republic of Ganat—revolutionary aristocrat, merchant princess who financed revolution."
    person_location: Ganat
    details: |
      Fifty years old, Serrulata, tall and striking with copper and lapis inlay worked 
      into her scales. Represents Dhal-Setil Mercantile, the catalog-delivery empire. 
      Commands a bloc of eight Senate seats. Famous for the legendary ride from Ganat 
      to Taho that ended the Revolution in the west. Practices Orthodox High-Church 
      Penitentism in a party dominated by radical works-theology. Compound surname 
      indicates established lineage with kilit affiliation. Family compound in High 
      Junction.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party, Kilit, High Junction]
  # ─── end Rasma Dhal-Setil ───

  # ═══ Datho Kel el-Marwen ═══
  Datho Kel el-Marwen:
    category: person
    short: "Dusk Consul of the Republic of Ganat—represents commercial interests and Imperial accommodation."
    person_location: Ganat
    details: |
      Selected through cross-selection mechanism where each party picks the opposing 
      party's most moderate candidate. The 'Kel el-' prefix indicates Imperial descent, 
      suggesting family origins in Imperial territory before migration to Ganat. 
      Represents Dusk Party's merchant interests and preference for peaceful Imperial 
      relations.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dusk Party, Kilit]
  # ─── end Datho Kel el-Marwen ───

  # ═══ Dam Workers' Armorers Assembly ═══
  Dam Workers' Armorers Assembly:
    category: organization
    short: "Dawn-aligned cooperative producing mass-manufactured weapons inside the Dam."
    details: |
      LOCATION: Inside the Dam itself, Ganat proper. Workshops occupy chambers carved 
      from the Dam's internal structure, directly connected to the turbine halls. The 
      hum of generators is constant.
      
      PRODUCTS: Machine-turned rifle barrels (consistent bore), standardized cartridge 
      cases, bayonets (triangular, socket-mount), uniform fittings.
      
      CHARACTER: Syndicalist cooperative, Dawn-aligned. Quality varies by shift committee. 
      Free power means experimentation is cheap—failed designs cost only labor.
    related: [Ganat, Dawn Party, Khen-Masot Rifle Works]
  # ─── end Dam Workers' Armorers Assembly ───

  # ═══ House Tal-Omir ═══
  House Tal-Omir:
    category: organization
    short: "Old merchant family producing quality weapons for Ganati merchant guards."
    details: |
      LOCATION: Merchant Terraces, Taho—workshops overlooking the harbor, three 
      generations in the same building. You can see the caravan routes from the 
      finishing room.
      
      PRODUCTS: Tal-Omir rifle (.40 caliber, blued steel, walnut stock), carbines 
      (caravan guard variant), matched officer pistol pairs, presentation weapons 
      (engraved, for diplomacy).
      
      CHARACTER: Compound name indicates kilit-zem-kilitam descent. Higher prices, 
      better quality. Their guards carry their own weapons—a statement of confidence.
    related: [Ganat, Dusk Party, Taho]
  # ─── end House Tal-Omir ───

  # ═══ Khen-Masot Rifle Works ═══
  Khen-Masot Rifle Works:
    category: organization
    short: "Primary weapons manufacturer supplying Republican Guard infantry—compound name, neutral politics."
    details: |
      LOCATION: Near Wall, Ganat proper. Workshops carved into sandstone, powered 
      by Dam transmission lines.
      
      PRODUCTS: Infantry rifle (.40 caliber, Guard standard), replacement parts 
      (standardized), training rifles (reduced charge).
      
      CHARACTER: Compound name indicates old merchant family, but Khen-Masot maintains 
      careful neutrality—they supply the Guard regardless of which parties hold the 
      Consulates. Their contracts predate the Revolution. Politically, they donate to 
      both parties and attend neither's functions.
    related: [Ganat, Dam Workers' Armorers Assembly, Near Wall]
  # ─── end Khen-Masot Rifle Works ───

  # ═══ Taho Metalworkers' Collective ═══
  Taho Metalworkers' Collective:
    category: organization
    short: "Dawn-aligned syndicalist cooperative producing dragoon equipment and reverse-engineered culverins."
    details: |
      LOCATION: Industrial terraces, Taho—former textile mills converted after the 
      Yarangar War. The looms are gone; the power connections remain.
      
      PRODUCTS: Culverin components (seventy percent domestic manufacture), 
      reverse-engineered rail carbines, charging equipment.
      
      CHARACTER: Their reverse-engineered rail weapons don't require Imperial 
      authentication—the critical breakthrough that gives Ganati dragoons parity 
