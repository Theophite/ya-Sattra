  # ═══ Destrier ═══
  Destrier:
    category: concept
    short: "Carnivorous engineered mounts—hairless carapaced predators that run 70+ mph and bond to single riders."
    details: |
      Engineered by the Creche before the Interdict as self-reproducing transport for 
      colonization. Never reached colonies; now wild throughout former Oregon and 
      Washington, breeding freely in packs. Creche no longer produces them.
      
      APPEARANCE: Hairless skin covered in horn-textured plates (glossy black or 
      ruddy-brown), iridescent where carapace thins. Ramified horns branching like 
      coral provide handholds. Huge placid black eyes. Lips mobile and delicate like 
      a goat's, behind them rows of thin translucent teeth like glass needles, with 
      ridged grinding plates further back. Legs fold at impossible angles, front limbs 
      reaching far forward even at rest.
      
      MOVEMENT: Run like someone in a dream—leap into leap, barely touching ground. 
      70+ mph on flat ground. From perfect stillness to movement in one instant, no 
      transition. Unsuitable for tight maneuvers or formation cavalry.
      
      BEHAVIOR: Perfectly still except heads tracking you. Make constant clicking 
      sound—when rhythm changes, pay attention. Bond to single riders, resist all 
      others. Follow commands extraordinarily well.
      
      METABOLISM: After hard running, steam with heat. Can survive on grass and grain, 
      but if pushed need meat. Unpredictable when hungry. Will hunt in packs, scavenge, 
      eat battlefield casualties.
      
      VALUE: Well-bred destrier sells for ~200 obols (equivalent to adult slave). 
      A band with 600 destriers exceeds most frontier estates' annual revenue. 
      Breeding programs track lineages across 40 generations.
      
      MILITARY: Shock cavalry charging at 70mph breaks formations through speed and 
      psychological terror. Akama warriors lash themselves to saddles. Only Akama 
      truly understand them—children grow up learning the animals' sudden movements.
    rag_pointer: "The Thousand Kingdoms: Overview, Stories from the Empire"
    related: [Akama, Thousand Kingdoms, Ganat, Bureau of the Creche]
  # ─── end Destrier ───

  # ═══ Gouge ═══
  Gouge:
    category: concept
    short: "Akama cavalry weapon—sickle-curved blade on long handle for striking down during destrier's descent."
    details: |
      The signature weapon of destrier cavalry. Shaped like a sickle on a long handle, but 
      instead of completing the crescent, the curve terminates in a point. The point leads, 
      striking first on the descent.
      
      GEOMETRY: Point enters target, then the curve follows through. Both outer edges are 
      sharpened, so as you drop and the point buries, the widening blade carves outward 
      through whatever you've hit. The curve routes around bone and armor rather than 
      catching on it. Opens the wound as it passes. Heavy enough that the descent does 
      the work—you aim the point and let gravity and the destrier's drop handle the rest.
      
      TACTICS: Destriers pick at the edges of formations rather than charging into them. 
      The gouge hooks soldiers from the periphery, catches on shields and armor, drags 
      men out of position. During the destrier's leap, you're briefly three meters above 
      your enemy; the gouge's reach and curve let you strike downward and pull. The 
      momentum of the destrier does the rest.
      
      COMBAT ARC: Coming in at a shallow arc—twenty degrees off horizontal—there's a 
      window where you're above someone. The gouge reaches down past the destrier's 
      shoulder, below its trajectory. Point first, angled toward the ground. Your target 
      is under you as you pass. The curve doesn't fight your forward momentum, it uses it.
      
      AESTHETICS: Looks agricultural—like a harvest tool handed to something terrible. 
      Maybe intentional (Akama aesthetics), maybe evolved from what worked. Gouges tell 
      stories through notched edges and replaced hafts.
      
      MANUFACTURERS: Dzoragh Ironhand (traditional, distinctive blood-channel fuller), 
      Vurda Eleven-Sage Blade-Works (legendary master quality, months-long wait, heirloom 
      pieces), village smiths (adequate for most cavalry work).
    rag_pointer: "The Thousand Kingdoms: Overview, Guide - Military Conflict and Violence"
    related: [Destrier, Akama, Thousand Kingdoms]
  # ─── end Gouge ───

