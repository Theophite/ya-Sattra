  Ataru Blackfish:
    category: person
    short: "Junta commercial emperor—controls salmon processing, ~800 warriors, ~70 vassals paying fixed tribute."
    person_location: Ogon
    details: |
      Age 47. Western canal districts. Took token through combat 12 years ago. 
