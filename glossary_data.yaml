  # ═══ Amber Quarter ═══
  Amber Quarter:
    category: location
    short: "Serrulata trading district—Ganati architecture, not Imperial vernacular."
    details: |
      ~30,000 residents. Ganati-influenced architecture. Republican cultural practices. 
      The district makes no attempt to fit ya-Don's vernacular tradition—it is Ganat 
      transplanted, the Republic's architecture serving the Republic's people.
