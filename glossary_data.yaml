        - "reactor power (direct connection, never fluctuates)"
        - "minor Aureate estates (families who couldn't afford Antediluvian Quarter)"
        - "high-end archaeotech sales (testing requires power)"
        - "conventional infill (highest-aspiration vernacular, trying to match the bronze)"
