  # ═══ Sztoavel ═══
  Sztoavel:
    category: location
    short: "Breakaway smelter precinct—specialty alloys from eastern terminals repaired by Medials."
    details: |
      Split from Vroëszka three centuries ago when Medials repaired dormant eastern terminals 
      on the river's bank. A faction of Vroëszka elders claimed personal rights over the newly 
      active systems and formally split from the house. The schism was violent; the bitterness 
      remains. Sztoavel produces lower-volume, higher-specialty alloys that complement Vroëszka's 
      bulk output. The houses compete in some markets, depend on each other in others, and maintain 
      a hatred that three hundred years has not diminished.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Vroëszka, The Smelters]
    location_features:
      level: district
