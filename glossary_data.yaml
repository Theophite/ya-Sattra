        - "equipment housings emerging from domes"
        - "curved arches throughout (absorbed into vernacular)"
        - "circular observation ports (dark voids in walls)"
        - "control consoles with amber/teal displays"
        - "overwhelming scale (operators dwarfed)"
        - "obelisk towers (300 feet, glowing amber tops)"
