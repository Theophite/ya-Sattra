  # ═══ Gondoliers' Steps ═══
  Gondoliers' Steps:
    category: location
    short: "Stone staircase where gondolas wait for hire at the cliff route's end."
    details: |
      Where the cliff route meets the Medina waterfront, stone steps descend to platforms 
      where the Gondoliers' Guild (~50 licensed boats) provides water transit for those 
      avoiding bridge declarations. Rates vary; discretion is legendary. Gondolas hug 
      the shores rather than crossing the canyon's depths.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
