  # ═══ Vegas Springs ═══
  Vegas Springs:
    category: location
    short: "Quasi-independent eastern trade hub built on artesian springs—controls access to March territories and beyond."
    details: |
      180,000 permanent residents, swelling to 220,000 during caravan season. Located 
      250 miles southeast of Ganat proper. Seventeen major springs produce ~400,000 
      gallons daily through mechanisms the Technical Castes once understood. The Water 
      Guild predates Republic and Sultanate. Khalim Charter (965 RRH) preserved traditional 
      privileges in exchange for Republican sovereignty. Three kilits (Provisioners, 
      Factors, Guild Compact) rotate Senate representation—ensures autonomy, limits 
      coalition influence. Less Serrulata-dominant than Republic overall (55% vs 65%). 
      Commercial courts with own jurisdiction. Ancient basins carry names in forgotten 
      languages: Tsolvarim Pool, Shekhana Cisterns, Basin of Ul-Mar-Thek.
