    category: location
    short: "Vast engineered forest home to Ranga colonists—maintains effective independence from both Empire and Ganat."
    details: |
      Maintains effective independence through terrain and biological advantage. 
      Both Ganat and Empire claim sovereignty; the Ranga ignore both claims. 
      General-Commissioner Ravi Donmar lost an Imperial campaign here—the Ranga 
      had defensive advantages no tactical brilliance could overcome. The forest 
      governs itself through mechanisms outsiders do not understand. Ranga refugees 
