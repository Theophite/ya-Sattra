        - Parish of Mended-Spirits
        - Improvised shade structures
      real_world_anchor: "Central Valley (ya-Don, elevated eastern edge)"
    aesthetic_features:
      intention: "Shelter first. Shade where you can find it."
      environment: "Elevated terrain at the city's edge. Views across all ya-Don—the Furnaces, the central districts, the agricultural lands beyond. Foothill wind provides marginal cooling but also brings dust. Less established than Ember Row; construction is ongoing, boundaries shifting."
      construction: |
        Where the shade tradition breaks down. Central districts have courtyard 
        organization refined over millennia—shared shade wells, buildings arranged 
        to create collective cooling. Thornback Ridge doesn't have that. Buildings 
        solve heat problems individually: canvas awnings, salvage overhangs, whatever 
        creates shadow.
        
        Adobe and salvage construction, same materials as Ember Row but less 
        accumulated refinement. Newer buildings, faster work. Alleys too wide for 
        proper shade canyons. Streets that bake in summer because nobody coordinated 
        the construction. Shade is found rather than designed.
        
        The Parish of Mended-Spirits serves workers displaced by injury, families 
        fallen from better circumstances, people starting over. The parish hall is 
        one of the few properly shaded public spaces—deliberate, welcoming.
      materials:
