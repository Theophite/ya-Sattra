    person_location: Ogon
    details: |
      Age 42. Northern ziggurat districts, Kma-Dhol quarters. Took token 7 years 
      ago through economic necessity (other members need his services). Commands 
      Nine Birds Engineering Collective, dominant Kma-Dhol technical firm in Ogon. 
      Power from monopoly on essential services: structural assessment, factory-singing 
      coordination, archaeotech maintenance. 40,000 Kma-Dhol live in Ogon as recognized 
