    local_aesthetic: "Ridge's apex—separated by tidal canal, accessed via rope bridge. Infrastructure family compounds (Val, Marzen, Galen). Communal garden with real greenery in rotated chambers. Cho gondola terminus—lifeline to Middens. Highest, cleanest, most maintained space in Rotten Quarter. Still rotated—floors are walls, orb-fixtures glow from wrong surfaces—but adapted with generations of care."
