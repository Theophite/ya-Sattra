      ~4,000 across nine villages (300 Völërath, rest Szkovërin and Draëthen). Refugees 
      from ya-Tsovez settled here 10,000 years ago. Hills where Akama destriers cannot 
      operate—no tribute because extraction costs more than it yields. Sort autofactory 
      junk, process scrap via mercury amalgamation. Ships bound for Asovoë winter here; 
      first-arrival and last-departure premiums. Villages compete bitterly for harbor access.
    rag_pointer: The Volerath of Puget Sound
    related: [Ködhegy, Asovoë, Völërath, Szkovërin, Draëthen, San Juan Factorias]
