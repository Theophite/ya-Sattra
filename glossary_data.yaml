      controlling_entity: es-Etaie
      population: ~30
      primary_function: es-Etaie residence
      notable_features:
        - Deliberately modest architecture
        - Penitent theological statement
        - Trusted by guilds
      real_world_anchor: "Central Valley (ya-Don Aureate Enclave)"
    aesthetic_features:
      intention: "We do not need to impress. Faith, not display."
      construction: |
        Deliberate modesty: local stone, standard proportions, no garden display. 
        Three stories of construction that would not be out of place in the Threshold. 
        The choice is theological—the family's genuine Penitent faith expressed 
        through refusal of ostentation. The architecture says what the family believes: 
        wealth is responsibility, not privilege.
      materials:
        - "local stone: tan and grey like Threshold"
        - "standard bronze threshold fittings"
        - "no ornamental water"
        - "no imported materials"
      colors:
