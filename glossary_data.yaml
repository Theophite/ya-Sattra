      environment: "Eastern margin, downwind of the Furnaces. Ash falls here when the wind blows wrong. The ground is contaminated—nothing grows, the water must be brought in. Slag heaps and processing pits. The air tastes of metal."
      construction: |
        Salvage construction on contaminated ground. The Cinder-Sifters build from 
        what they recover—metal scraps, ceramic fragments, materials the Furnaces 
        rejected. Housing clusters around the processing operations: shacks, lean-tos, 
        structures that assume residents won't stay long.
        
        The heat problem is compounded by the work itself—sifting requires exposure, 
        processing generates more heat. Shade structures are improvised, temporary, 
        constantly rebuilt as materials become available. The Church maintains 
        Curate Malachi's operation; the charity is real but so is the control.
        
        Smuggling runs through here because nobody watches closely. What leaves 
        as "processed waste" sometimes includes materials that should have gone 
        elsewhere. The Cinder-Sifters know; they're paid not to notice.
