        - Marina Promenade
        - Vermillion Tower
      controlling_entity: Aureate families
      population: ~48,000
      primary_function: Elite residence, patent infrastructure
      castes_present:
        - Highborn
        - Aureate
        - Near-Baseline (servants)
        - Clone lines (hereditary servants)
      notable_features:
        - Porcelain-coral self-cleaning streets
        - Bioluminescent lamp posts
        - Pre-Interdict arcologies
        - Dawn Market (unofficial)
      borders:
        south: [Rift]
        across_rift: [Medina Quarter]
      transit:
        - route: Aureate Span
          to: Medina Quarter (via Rift)
          type: bridge
          notes: "Patent-holders and representatives"
        - route: Clerk's Span
          to: Medina Quarter (via Rift)
          type: bridge
          notes: "Bureau traffic"
        - route: Valet's Span
          to: Medina Quarter (via Rift)
          type: bridge
          notes: "Servants and deliveries"
        - route: Cliff Route
          to: Medina Quarter
          type: road
          notes: "Eastern end; avoids bridge status declarations"
        - route: Marina Promenade
          to: Rift (north shore)
          type: waterfront
          notes: "Private docks, pleasure craft; Gondoliers' Guild service available"
      real_world_anchor: "Monterey Bay basin (north of Rift)"
    aesthetic_features:
      intention: "We maintain what we were given. The buildings are the patent holders; we are their interface."
      environment: |
        North of the Rift, elevated slightly. Pre-Interdict arcologies that refused to 
        fall—each one unique, each one incomprehensible in its own way. Self-maintaining 
        infrastructure makes the district cleaner than anywhere else in ya-Sattra.
        
        BUT: 48,000 people live here, and only 3,200 are Aureate family members. The 
        32,000 hereditary servants and 12,000 commercial workers need housing. Conventional 
        construction fills the spaces BETWEEN the arcologies—servant quarters, commercial 
        establishments, support facilities, residential blocks for those who serve the 
        great families.
      construction: |
        THREE LAYERS of construction:
        
        FIRST: The arcologies themselves—radically different from each other. Invisible 
        cylinders, spiraling spires, living tissue, spectrum-shifting ziggurats, sealed 
        eggs. Each estate its own mystery. These are permanent, unmodifiable, incomprehensible.
        
        SECOND: The streets—porcelain-coral that self-repairs, bioluminescent lamp posts 
        fed by hereditary lamp-lighters. The ONLY uniform element across the district.
        
        THIRD: Conventional construction filling the spaces between. This is the most 
        refined version of ya-Sattra's vernacular—Mediterranean practicality overlaid with 
        Antediluvian aspiration at its most intense. These buildings have been absorbing 
        aesthetic pressure from the arcologies for 50,000 years:
        
        - Geometric border patterns on EVERY formal entrance: "circuit board" motifs 
          derived from arcology surfaces, more elaborate than anywhere else in the Empire
        - Smooth stucco finishes attempting to approximate seamless thesad—failing, but 
          the attempt is visible in buildings that WANT to be monolithic, jointless
        - Bronze EVERYWHERE: threshold fittings, door hardware, railings, accent strips, 
          window frames, decorative panels. Not functional—aspirational, referencing the 
          great bronze structures looming nearby
        - Streamlined proportions: height-to-width ratios that "feel right" because they 
          echo arcology geometry. Round-cornered windows. Smooth transitions between 
          levels. The buildings WANT to be arcologies.
        - Shadowless interiors: multiple windows, light wells, reflective surfaces. The 
          arcologies have no shadows; servant quarters try to achieve the same effect.
        
        The result is the most aspirational conventional construction in the Empire. 
        Servant quarters in the Antediluvian Quarter are more architecturally ambitious 
        than guild halls elsewhere. Commercial buildings here show more geometric 
        decoration than churches in the Medina Quarter.
      visual_vocabulary:
        - "NOT uniform—each arcology is unique technology"
        - "Porcelain-coral streets: the unifying element between radically different structures"
        - "Conventional construction: the most refined Antediluvian-influenced vernacular in the Empire"
        - "Gaudí meets science fiction: organic forms, but seven different kinds of organic"
        - "Ancient Egypt's temple complexes: hereditary priesthoods maintaining incomprehensible systems"
      materials:
        - "porcelain-coral streets: white, self-cleaning, self-repairing (UNIFORM)"
        - "bioluminescent lamp posts: organic, fed by lamp-lighters (UNIFORM)"
        - "arcology surfaces: EACH DIFFERENT—invisible panels, living coral, light-absorbing stone, spectrum-shifting substrate, pharmaceutical domes, spiral spires"
        - "conventional construction: regional stone, smooth stucco, bronze fittings EVERYWHERE"
        - "geometric relief: elaborate circuit-board patterns on every formal entrance"
      colors:
        - "white/cream porcelain-coral streets (uniform between estates)"
        - "soft bioluminescent glow at night (uniform between estates)"
        - "arcologies: NO UNIFORM COLOR—each estate different"
        - "conventional construction: tan/grey stone, smooth cream stucco, bronze accents"
        - "more bronze visible here than anywhere else in ya-Sattra"
      sensory:
        - "cleaner than elsewhere—streets absorb debris overnight"
        - "bioluminescent light: softer than electric, organic pulse"
        - "quiet—wealth affords insulation"
        - "each arcology has its own sounds: pharmaceutical venting, encryption pulses, biological rhythms"
        - "the aspirational hum of trying to match the arcologies"
      key_elements:
        - "Aureate Way: narrow commercial corridor winding between estates, where fortunes change hands"
        - "Marina Promenade: waterfront walk along the Rift's north shore, pleasure craft and private docks"
        - "porcelain-coral streets: the ONLY unifying aesthetic between radically different estates"
        - "bioluminescent lamp posts: tended by three hereditary families (Vessori, Torrath, Penneth)"
        - "seven major arcologies, each unique"
        - "conventional construction: highest-aspiration vernacular in the Empire"
        - "geometric border patterns: more elaborate than anywhere else"
        - "bronze fittings: pervasive, aspirational, referencing the great structures"
