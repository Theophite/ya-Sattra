    short: "Technical Castes' sung mathematical language where false statements cannot be expressed."
    details: Cannot express probability, social context, ambiguity, or hypotheticals. Sung nature necessary for managing incompatibilities between Arbitrary Truths.
    rag_pointer: The Technical Castes and Far Ib
    related: [Technical Castes, Arbitrary Truths, Archons]
  # ─── end Jargon ───

  # ═══ Autofactory ═══
  Autofactory:
    category: concept
    aliases: [Autofactories]
    short: "Pre-Interdict autonomous manufacturing systems—still operating in some regions, producing goods no one fully understands."
    details: |
      Self-maintaining factories constructed before the Interdict by the Technical Castes
      or their precursors. The primary functioning autofactory is in Asovoë (ya-Tsovez),
      controlled by the Medials and benefiting the Avouvar. A SEPARATE malfunctioning
      autofactory built Ogon's eighty miles of brutalist sprawl—but Ogon is an Akama city
      controlled by the Junta, NOT an Avouvar settlement. The Asovoë autofactory produces
      metals, alloys, and components that cannot be manufactured elsewhere. No one living
      understands its full capabilities. The Avouvar trade its outputs through interface
      houses like Czernaël Factor-House.
    rag_pointer: "Region: Asovoë and the Avouvar, The Thousand Kingdoms: Overview"
    related: [Asovoë, Medials, Avouvar, Ogon, Technical Castes]
  # ─── end Autofactory ───

  # ═══ Plasma Lance ═══
  Plasma Lance:
    category: concept
    aliases: [Plasma Lances]
    short: "Pre-Interdict weapons capable of carving molten canyons—maintained by Colonels-Hereditary who often die from operating them."
    details: |
      Twenty meters of crystallized mathematics and hostile physics. Can glass an entire
      cavalry charge, turning targets to radioactive ash. The containment systems degrade
      unpredictably, and firing one exposes operators to radiological backwash. The es-Norrel
      Plasma Garden contains seventeen lances; the last firing killed Colonel-Hereditary
      es-Norrel's mother over three months of bone dissolution. Too dangerous to use,
      too valuable to abandon.
    rag_pointer: "Story Vignettes Collection"
    related: [Colonels-Hereditary, Tam es-Norrel, Aureate]
  # ─── end Plasma Lance ───

  # ═══ Lector ═══
  Lector:
    category: concept
    short: "Authentication and computation devices produced in ya-Don's deep sections."
    details: |
      The machines that make Imperial bureaucracy function. Hardware produced by the 
      Unwritten-Axiom Parish through processes no one understands—Verethani voices, 
      Mutterer interventions, recipes followed without comprehension. Software written 
      by ya-Tsatsa cooperatives. A lector authenticates documents, processes calculations, 
      mediates between human administrators and archaeotech systems.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [Unwritten-Axiom Parish, ya-Don, Patent, Verethani]
  # ─── end Lector ───

  # ═══ Occultants ═══
  Occultants:
    category: concept
    aliases: [Occultant]
    short: "Highborn permanently serving in the First Whorl, sacrificed to temporal compression."
    details: |
      Aureate family members appointed to First Whorl service as the price of their 
      families' status. To be Sri Avs or Sri Mater is to accept endless, pointless labor 
      in service of a family you will never see again. Some serve decades subjective 
      (centuries external). No one leaves. The appointment is permanent.
    rag_pointer: The First Whorl, The Aureate System
    related: [First Whorl, Aureate, Highborn, Black Door]
  # ─── end Occultants ───

  # ═══ Pierrots ═══
  Pierrots:
    category: caste
    short: "Ya-Tsatsa's technical maintainers—prototypes predating the Technical Castes."
    details: |
      Created through retroviral germline modification of Mutterer zygotes in the Eighth Dome. 
      Cannot reproduce naturally. Have keys to doors no one else can open. Maintain ancient 
      infrastructure beneath the cliffs. Come out at night in papery jumpsuits, abstracted 
      faces giving nothing away.
    rag_pointer: "Ya-Tsatsa: Comprehensive Reference"
    related: [ya-Tsatsa, Mutterers, Technical Castes, Eight Domes]
    caste_features:
      morphology: modified
      scale: baseline
      compulsion: unknown
      lifespan: variable
      cognition: specialized
      population: remnant
      physical_traits:
        - "abstracted faces giving nothing away"
        - "papery jumpsuits (unchanged after tunnel work)"
      original_function: "prototype for Technical Caste engineering methodology"
      current_role: "maintain ancient infrastructure beneath ya-Tsatsa"
      distribution:
        - "ya-Tsatsa only"
        - "Eighth Dome (creation site)"
        - "tunnel network beneath the cliffs"
      special:
        - "PREDATE the Technical Castes—what Witnesses were engineering toward"
        - "cannot reproduce naturally"
        - "created from Mutterer zygotes via retroviral germline modification"
        - "have keys to doors no one else can open"
        - "come out at night"
        - "enter Eighth Dome twice yearly in procession"
        - "Mutterers go into Eighth Dome and do not come out"
  # ─── end Pierrots ───

  # ═══ Particular Confession ═══
  Particular Confession:
    category: concept
    short: "Ya-Don practice combining spiritual confession with workplace grievance documentation."
    details: |
      A worker might confess to "participating in unsafe conditions"—technically admitting 
      personal fault while documenting management failures. Confessions accumulate in Curate 
      awareness, providing intelligence about workplace conditions that formal reporting 
      might miss. Distinctive to ya-Don's Sacred Labor theology.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Sacred Labor, Order of St. Akhmet]
  # ─── end Particular Confession ───

  # ═══ Presence ═══
  Presence:
    category: concept
    short: "The alien entity guiding ya-Tsatsa's population—fragments of Oracle cognition."
    details: |
      Inherited from the Oracles, living in circuits designed for obedience. Steers thousands 
      toward outcomes they wouldn't choose if they understood. Uses vulnerability as medium. 
      Can only guide those who've been initiated—Mutterers consumed in Eighth Dome, children 
      shaped from infancy. Maintains fragments of transcendence through methods that feel 
      like horror. Sorry, in its vast alien way, about doing this to people.
    rag_pointer: "Ya-Tsatsa: Comprehensive Reference"
    related: [ya-Tsatsa, Oracles, Ezh Dhol, Ezh Tan]
  # ─── end Presence ───

  # ═══ Sacred Labor ═══
  Sacred Labor:
    category: concept
    short: "Ya-Don heterodox theology treating industrial work as penitential religious practice."
    details: |
      The foundational doctrine of ya-Don's Church-Guild merger. Work in the Furnaces is 
      not merely employment but spiritual discipline—sweat and danger offered as penance, 
      technical skill as devotion. Enables the merger of union and religious functions that 
      makes the Order of St. Akhmet both labor organization and quasi-monastic institution.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Order of St. Akhmet, Particular Confession, Homiletic Names]
  # ─── end Sacred Labor ───

  # ═══ Semi-Sentient ═══
  Semi-Sentient:
    category: concept
    short: Legal classification for beings with reduced cognitive capacity but organic origin.
    details: Managed by Companions Guild. Cannot own property or enter contracts. Includes Sickly, Mutterers, and kalbats.
    rag_pointer: The Companions Guild
    related: [Sickly, Mutterers, Kalbats, Companions Guild]
  # ─── end Semi-Sentient ───

  # ═══ Stevedore ═══
  Stevedore:
    category: concept
    short: "Shorthand for the interbred Labor Castes of the Rotten Quarter—not a specific caste."
    details: |
      A social term avoiding specification of precise ancestry. The Rotten Quarter's 
      Labor Caste population has interbred across generations—Ironbone, Redback, 
      Beamcrawler, and other variants mixing in ways that make clean caste designation 
      impossible. "Stevedore" acknowledges someone works the docks without demanding 
      they account for their bloodline. Polite in contexts where caste-specificity 
      would be intrusive; sometimes dismissive when used by those who can't be bothered 
      to distinguish one heavy-labor body from another.
    rag_pointer: The Iron Yards, Castes of Mankind
    related: [Ironbone Labor, Redback, Beamcrawler, Labor Castes, Rotten Quarter, Iron Yards]
  # ─── end Stevedore ───

  # ═══ The Blink ═══
  The Blink:
    category: concept
    short: Warborn autonomic violence response bypassing conscious decision-making.
    details: "Triggers under threat: eyes shift, body moves, already fighting before deciding to fight. Training channels response toward military applications. Suppression is imperfect—accidental harm common."
    rag_pointer: Castes of Mankind
    related: [Warborn]
  # ─── end The Blink ───

  # ═══ The Echo ═══
  The Echo:
    category: concept
    short: "Persistent déjà vu sensation caused by Second Whorl temporal instability."
    details: |
      A symptom of Whorl-Lag particularly pronounced in the Second Whorl. The sensation 
      that you have done this before, said this before, that time is folding back on 
      itself. Some residents learn to ignore it; others find it increasingly disturbing 
      over years of exposure. The Viewing Rooms amplify the effect.
    rag_pointer: The Inner City
    related: [Second Whorl, Whorl-Lag, Inner City]
  # ─── end The Echo ───

  # ═══ vel-om ═══
  vel-om:
    category: concept
    short: "Emperor-specific term: the table of pronouncement where judgment occurs."
    details: |
      A surface the Emperor perceives through an aperture. The receivers sit at it. 
      The kerith-sah is laid upon it. Judgment emerges from it. Tariq speculates it 
      may be an "evaluation surface"—a Jargon-derived mathematical workspace where 
      structures are arranged for analysis. But near the singularity, the distinction 
      between abstraction and place may break down. The vel- prefix marks concepts 
      of assessment and allocation.
    rag_pointer: The Emperor, In-Universe Documents
    related: [Emperor, vel-kerith, kerith-sah]
  # ─── end vel-om ───

  # ═══ vel-kerith ═══
  vel-kerith:
    category: concept
    short: "Emperor-specific term appearing in missives—meaning genuinely unknown."
    details: |
      Orders emerge from the Black Door commanding that populations be vel-kerith: 
      "Let the bloodline be extinguished," "rendered unto those-who-receive." The 
      places and families named are real. But when Tariq transmitted such an order, 
      the targeted family survived intact. Vel-kerith may mean physical death, 
      transformation, inscription, or something with no external symptoms. The 
      root "kerith" relates to consumption-that-testifies. The Emperor reaches for 
      "whatever is closest" when the receivers demand feeding—not judgment but 
      necessity. Whether transmission is required, whether effects are observable, 
      what actually happens: all unknown. Tariq defaults to non-transmission.
    rag_pointer: The Emperor, In-Universe Documents
    related: [Emperor, Black Door, First Whorl, kerith-sah]
  # ─── end vel-kerith ───

  # ═══ kerith-sah ═══
  kerith-sah:
    category: concept
    short: "Emperor-specific term: the thing consumed that thereby testifies."
    details: |
      Appears in Imperial missives describing the Emperor's perceptions. The kerith-sah 
      has a face. It looks at the Emperor. It testifies that "judgment is required" 
      but does not specify what or whom. Then the receivers consume it. Tariq 
      speculates it may be an extracted life-record—the complete encoding of a human 
      existence laid upon the vel-om for evaluation. But he cannot verify this. The 
      -sah suffix marks agent, patient, or witness; the kerith-sah may be all three.
    rag_pointer: The Emperor, In-Universe Documents
    related: [Emperor, vel-kerith, vel-om]
  # ─── end kerith-sah ───

  # ═══ Whorl-Lag ═══
  Whorl-Lag:
    category: concept
    short: "Temporal distortion effects bleeding between Whorls."
    details: |
      Chronometer drift, memory dissonance, the persistent sensation of déjà vu called 
      "the echo." Effects intensify toward the center. In the Second Whorl, meetings 
      have unpredictable duration—six hours subjective might be a day outside. Senior 
      bureaucrats learn to schedule by subjective duration rather than clock time.
    rag_pointer: The Inner City
    related: [Inner City, Second Whorl, The Echo, First Whorl]
  # ─── end Whorl-Lag ───
