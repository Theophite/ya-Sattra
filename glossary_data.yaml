        - "whatever the eastern trade brings"
        - "serf-built structures (different labor relations)"
      colors:
        - "lord heraldry (individual house markers, not kilit colors)"
        - "fortress grey and brown"
        - "trade goods from unknown sources"
      sensory:
        - "frontier tension: what lies east?"
        - "serf populations without citizenship rights"
        - "annual lord meetings—rotating locations, political maneuvering"
      key_elements:
        - "seven marches, seven lords"
        - "serf populations (citizenship excluded)"
        - "Senate votes padded with pastoralist delegations"
        - "trade beyond the Dead Cities with unknown entities"
        - "the Far Northeast: Great Lakes cities are rumor, Atlantic trade is inference"
  # ─── end Marcher Territories ───

  # ═══ Water Guild ═══
  Water Guild:
    category: organization
    short: "Ancient institution controlling Vegas Springs' artesian water—predates Republic and Sultanate."
    details: |
      Founding charter dates to the Record of Three Laws, consolidating competing claims 
      over the springs into a single institution. Operates as effective government of 
      Vegas Springs regardless of nominal sovereignty. Maintains fixed prices for standard 
      allocations, creating secondary markets in water rights. The Guild's monopoly offends 
      Republican principles but cannot be disrupted without halting eastern trade entirely. 
      Members serve life terms. Records extend back to Three Laws documenting every allocation.
    rag_pointer: The Republic of Ganat
    related: [Vegas Springs, Ganat, Kilit, Records]
  # ─── end Water Guild ───

  # ═══ Khalim Charter ═══
  Khalim Charter:
    category: concept
    short: "965 RRH treaty preserving Vegas Springs' traditional privileges under Republican sovereignty."
    details: |
      Named for the spring where negotiations occurred. Republic gained sovereignty, 
      taxation rights, and military access. Vegas Springs retained Water Guild, commercial 
      courts, traditional allocation systems, and right to select its own Senator rather 
      than through kilit delegation. Revolutionary commander Sekh Tal-Omir (later Senator) 
      negotiated the compromise rather than besieging a city controlling its own water 
      through terrain favoring defenders.
    rag_pointer: The Republic of Ganat
    related: [Vegas Springs, Water Guild, Ganat]
  # ─── end Khalim Charter ───

  # ═══ Westerners ═══
  Westerners:
    category: concept
    short: "Mysterious anonymous traders providing bulk food from unknown sources—ships identical, speech synthetic."
    details: |
      Arrive in fleets of identical ships. Communicate through synthetic speech. 
      Provide grain and preserved food that Asovoë and other territories depend on 
      for survival. Maintain demarcation line in the Pacific—crossing it means death. 
      Lopez Island (San Juan Factorias) belongs to them; Avouvar do not go there. 
      Their nature, origin, and purposes remain completely unknown.
    rag_pointer: "Asovoë and the Avouvar"
    related: [Asovoë, San Juan Factorias, Lopez Island]
  # ─── end Westerners ───

  # ═══ Pantomime ═══
  Pantomime:
    category: concept
    short: "Popular theater with stock characters and deniable political content—Lens condemnations function as endorsements."
    details: |
      Operates in converted shops, rented halls, street corners. Troupes of 3-6 performers. 
      Stock characters: Pompous Bureaucrat (quotes regulations while accomplishing nothing), 
      Clever Sewer-Fisher (solves problems through wit), Tsatsan Mystic Swindler (claims 
      secret knowledge, picks pockets), Provincial Barbarian (confused by civilization), 
      Suffering Penitent (melodramatic piety). "CONTRARY TO PUBLIC ORDER" posted by Lens 
      tells audiences the production is worth seeing.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Bureau of the Lens, White Sheet, Threshold Theater]
  # ─── end Pantomime ───

  # ═══ Polyphonic Singers ═══
  Polyphonic Singers:
    category: concept
    short: "Highborn bastards with partial harmonic modifications—produce overtones and resonances baseline singers cannot achieve."
    details: |
      Cannot match true Highborn vocalists' simultaneous harmonies, but single voice 
      suggests two or three voices, harmonies emerging from one throat. Occupy uncertain 
      social position: not Highborn (lack full modifications, Aureate registration), not 
      entirely baseline. Perform on streets because no guild claims them, no theater hires 
      them, no category exists for what they are. Music is haunting—melodies acquiring 
      shadows, phrases resonating against themselves.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Highborn, Highborn Vocalists]
  # ─── end Polyphonic Singers ───

  # ═══ Highborn Vocalists ═══
  Highborn Vocalists:
    category: concept
    short: "Prestige performers whose modified throats produce simultaneous harmonies no baseline choir could achieve."
    details: |
      Arias composed for specific performers' unique capabilities—each performer's 
      modifications slightly different. Famous vocalist might have works written only 
      they can sing. Audiences primarily Aureate, ticket prices prohibitive. Performances 
      serve social functions: families demonstrating cultivation, business negotiations 
      in private boxes. Performer is simultaneously artist and status marker. Emotional 
      effects outside anything baseline music produces.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Highborn, Aureate, Polyphonic Singers]
  # ─── end Highborn Vocalists ───

  # ═══ Ironbone Feats ═══
  Ironbone Feats:
    category: concept
    short: "Strongman shows featuring Labor Caste variants bred for mining—bones dense enough to anchor muscles lifting impossible weights."
    details: |
      Performances straightforward: bending metal bars, supporting architectural loads, 
      competitive lifting between lineages. Audiences include genuine appreciation and 
      something darker—workers feeling pride in caste capability, Aureates seeing 
      confirmation that caste system produces useful specialization. Performer occupies 
      both positions: artist and specimen, athlete and product.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Ironbone, Labor Castes]
  # ─── end Ironbone Feats ───

  # ═══ Springheel Acrobatics ═══
  Springheel Acrobatics:
    category: concept
    short: "Vertigo-inducing performances by castes engineered for high work—modified proprioception, altered inner ears."
    details: |
      Castes bred for rigging, tower maintenance, cliff-face construction perform on 
      structures terrifying to baseline audiences: narrow beams at height, swinging 
      platforms, vertical surfaces traversed like level ground. Entertainment comes 
      from physical feats and audience awareness they could never do this. Some troupes 
      include moments referencing falls that kill their cousins on construction sites—
      if subversion stays aesthetic, Lens condemnations remain decorative.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Springheel, Labor Castes]
  # ─── end Springheel Acrobatics ───

  # ═══ Anthropological Exhibitions ═══
  Anthropological Exhibitions:
    category: concept
    short: "Ethically fraught displays of rare castes—framed as educational, functionally human zoos."
    details: |
      Rare castes displayed for observation: Sickly under Companion supervision (rose-gold 
      lattices glowing), Mutterers demonstrating computational vocalizations, frontier 
      variants most citizens have never seen. Placards describe function, engineering 
      history, place in Imperial order. Emphasize these are fellow subjects, valued 
      contributors. The gawking happens anyway. Some feature castes engineered for 
      worlds humanity can no longer reach—bodies shaped for contexts that no longer exist.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Sickly, Mutterers, Companions Guild]
  # ─── end Anthropological Exhibitions ───

  # ═══ Feast of Reflection ═══
  Feast of Reflection:
    category: concept
    short: "Annual Church observance permitting 'dramatic readings' with 'interpretive elements'—licensed misrule."
    details: |
      Tradition holds congregations may perform religious texts with interpretation. 
      Origins unclear—possibly genuine liturgy, possibly legal fiction. In practice: 
      one night when theatrical performance occurs in parish halls under Church rather 
      than Lens oversight. Church standards differ from Bureau's—material fined in 
      Fourth Whorl theater passes without comment in dockside chapel. Many clergy 
      sympathetic to reform.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Penitent Church, Bureau of the Lens, Pantomime]
  # ─── end Feast of Reflection ───

  # ═══ Lens Censorship ═══
  Lens Censorship:
    category: concept
    short: "Negotiated tolerance rather than absolute control—condemnations function as endorsements, fines generate needed revenue."
    details: |
      Bureau of the Lens maintains formal authority over all information and performance. 
      In practice, apparatus is exhausted. Inspectors lack resources for comprehensive 
      enforcement. A censor might attend pantomime, laugh throughout, then deliver fine 
      as part of show. Elaborateness of condemnation signals quality. Real limits exist: 
      no mocking Emperor directly, no questioning Interdict's justice. Playwright Kerem 
      Tal-Vostra was disappeared for crossing the line.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Bureau of the Lens, Pantomime, White Sheet]
  # ─── end Lens Censorship ───

  # ═══ Ganati Media ═══
  Ganati Media:
    category: concept
    short: "Films and radio broadcasts penetrating Imperial borders through smuggling and high antennas—evidence alternatives exist."
    details: |
      Without Ganat's democratic broadcast infrastructure, Empire relies on live 
      performance and licensed print. Ganati media offers audiences evidence that 
      alternatives to Imperial exhaustion exist. The Republic has dozen competing 
      newspapers, partisan press ecology, democratic cultural production. Smuggled 
      films and radio signals reach Imperial audiences willing to risk possession, 
      creating appetite for content the Lens cannot provide.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Ganat, Bureau of the Lens, White Sheet]
  # ─── end Ganati Media ───

  # ═══ es-Tariq ═══
  es-Tariq:
    category: organization
    short: "Aureate household controlling Imperial redaction ciphers—what they erase vanishes from public record."
    details: |
      Among Empire's oldest Aureate families. Sri Avs Tariq serves in Imperial Apartments 
      (85 subjective years, 10,000+ external years)—the Emperor's personal redactor. 
      Sri Director (name self-redacted) holds Senior Satara seat for Lens, over 300 years 
      old. Patent on cipher-set Veil-Nine allows selective erasure of documents. Family 
      trades in erasure: ability to make inconvenient text vanish. Maintains correspondence 
      across millennia of temporal discontinuity.
    rag_pointer: "Household es-Tariq: Custodians of Imperial Secrecy"
    related: [Emperor, Black Door, First Whorl, Bureau of the Lens, Aureate]
  # ─── end es-Tariq ───

  # ═══ Ironbone ═══
  Ironbone:
    category: caste
    short: "Labor caste with dramatically increased bone density—handles loads that would shatter baseline frames."
    details: |
      Two distinct types: Labor (2.4m/8ft, dock work, mining) and Warborn (8'10", heavy 
      weapons platform, armor bolts to skeleton). Labor variant: calcium metabolism 
      continues throughout life, joints stiffen progressively, chair-bound by late 50s. 
      Warborn variant: skeleton absorbs electromagnetic backwash from heavy railguns, 
      even more demanding metabolism than standard Warborn.
    rag_pointer: "Castes of Mankind"
    related: [Labor Castes, Warborn, Ironbone Feats]
  # ─── end Ironbone ───

  # ═══ Cloneline ═══
  Cloneline:
    category: concept
    short: "Hereditary servant populations reproducing through cloning—genetic configurations optimized for specific functions."
    details: |
      Creche Bureau maintains servant-line patents specifying genetics for particular 
      functions: atmospheric tolerance, communication modality, sensory range. Creates 
      institutional memory encoded in genetics—servants don't need to learn capabilities 
      built into biology. Longest relationships extend millennia: palanquin-bearer lines 
      from Record of Three Laws still carry fragile Aureate bodies. Ancient servant 
      populations know family histories better than families themselves.
    rag_pointer: "The Aureate System"
    related: [Bureau of the Creche, Aureate, Kēt, Namali]
  # ─── end Cloneline ───

  # ═══ Kēt ═══
  Kēt:
    category: caste
    short: "Major Highborn clone line—cognitive modifications include perfect memory and enhanced pattern recognition."
    details: |
      Kēt clones share identical appearance within their line. Counselor Kēt-31 works 
      in Institute of Cognitive Integrity. ISK Director Kaimu Orathdasīr is Kēt/Namali 
      hybrid—union between clone lines producing neither line's identical appearance 
      but both lines' cognitive modifications. His traits make him suited for handling 
      cognito-hazards: perceives dangerous patterns without being captured by them.
    rag_pointer: "The Satara, the Bureaus, and Imperial Government"
    related: [Highborn, Cloneline, Namali, Bureau of the Creche]
  # ─── end Kēt ───

  # ═══ Namali ═══
  Namali:
    category: caste
    short: "Major Highborn clone line—often paired with Kēt in hybrid unions for combined cognitive advantages."
    details: |
      Namali clones carry distinctive cognitive modifications. Kēt/Namali hybrids 
      combine both lines' enhancements without identical appearance of either parent 
      line. Such hybrids are valued for specialized roles requiring enhanced cognition 
      without the limitations of pure cloneline appearance.
    rag_pointer: "The Satara, the Bureaus, and Imperial Government"
    related: [Highborn, Cloneline, Kēt, Bureau of the Creche]
  # ─── end Namali ───

  # ═══ Clone Soldiers ═══
  Clone Soldiers:
    category: concept
    short: "Military clones dependent on Creche supplements—biological leverage gives Creche power over Sword."
    details: |
      Warborn clones require amino supplements to survive. Bureau of the Sword depends 
      on Creche for these supplements, creating perpetual jurisdiction dispute. Creche 
      officials speak of duty and mutual obligation while maintaining dependencies that 
      make clones biologically incapable of independence. Semeion-9 variant requires 
      supplements every eight hours via belt pump—designed-in dependency some call 
      designing-in cruelty.
    rag_pointer: "The Satara, the Bureaus, and Imperial Government"
    related: [Warborn, Bureau of the Creche, Bureau of the Sword, Cloneline]
  # ─── end Clone Soldiers ───

  # ═══ Tenth Observance ═══
  Tenth Observance:
    category: concept
    short: "Annual transmission of the complete Plea into space—humanity's report to anyone listening in directions Foreigners haven't forbidden."
    details: |
      Dish pointed carefully away from galactic core. Every Particular Confession from 
      the year streams into space. Empire tolerates this because forbidding it would 
      acknowledge words have power. Assembles fifteen voices from each participating 
      congregation, five sections of three representing mathematical perfection. For 
      forgotten communities, invitation to sing at Cathedral is opportunity to exist 
      publicly.
    rag_pointer: "The Penitents"
    related: [Penitent Church, The Plea, Cathedral of the Plea, Intercessor]
  # ─── end Tenth Observance ───

  # ═══ Cathedral of the Plea ═══
  Cathedral of the Plea:
    category: location
    short: "Site where original Witnesses knelt—the Intercessor speaks from here and coordinates the Tenth Observance."
    details: |
      The principal cathedral of Penitentism, built into one of the Medina's ancient 
      structures at the site where the Witnesses knelt when the Interdict was imposed. 
      Intercessor's authority derives from control of this site. Houses the annual 
      Tenth Observance transmission—a massive broadcast tower rising from the cathedral 
      roof, its dish pointed away from the galactic core, streaming the complete Plea 
      into space. Major observances bring diverse choirs together; communities like 
      Valve-Saint Parish receive invitations to sing as opportunity to exist publicly.
    rag_pointer: "The Penitents"
    related: [Intercessor, Penitent Church, Tenth Observance, The Plea, Medina Quarter, Witnesses]
    location_features:
      level: site
      location_type: religious
      parent: Medina Quarter
      controlling_entity: Intercessor Esthan Omir
      notable_features:
        - Witness Stone (worn by millions of kneeling pilgrims)
        - Transmission Tower (visible from the Rim)
        - Acoustic vaulting for the Plea
    aesthetic_features:
      intention: "The sacred embedded in commerce. Collective guilt recorded in worn stone. We kneel where they knelt, and the stone remembers. And the tower—the tower says we are still speaking to the stars, even if they will not answer."
      environment: "Surrounded by Medina markets and guild shops—incense mixing with cooking smells from the street, the Plea's harmonies competing with vendor calls. The faith exists in the world, not apart from it. But rising above everything, the Transmission Tower dominates the Medina skyline."
      construction: "Pre-Interdict structure modified for liturgical use. The ancient bronze columns stand within the nave. Vaulted ceilings designed for acoustic resonance—the Plea's fifty-four parts were composed for this space. Archaeological strata visible in the walls: pre-Interdict foundation, millennia of modification, the current wooden choir lofts. The Transmission Tower was added in the third century after the Interdict, built atop the original structure."
      visual_vocabulary:
        - "Roman basilica: public gathering, columned nave, accessible grandeur"
        - "Hagia Sophia: acoustic architecture for liturgical singing, dome diffusing sound"
        - "Art deco broadcast towers: geometric lattice rising in stepped setbacks, the Chrysler Building's crown, 1930s radio masts"
        - "Worn pilgrimage sites: Santiago de Compostela's eroded steps, Rome's Scala Sancta"
      materials:
        - "grey granite worn smooth by millions of hands and knees"
        - "ancient bronze columns within the nave"
        - "wooden choir lofts from eight centuries ago, already showing heavy wear"
        - "the Witness Stone: floor depression worn by kneeling pilgrims since the Interdict"
        - "Transmission Tower: bronze framework with geometric latticework, green with verdigris"
      colors:
        - "grey stone, darker at contact points, lighter where untouched"
        - "bronze-green of ancient columns and the Tower's framework"
        - "faded liturgical fabrics in teal and cream"
        - "candle-smoke patina on vaulted ceiling"
      sensory:
        - "the acoustic bloom when choirs begin—sound designed to fill and linger"
        - "incense and street-cooking mingling at the entrance"
        - "worn stone underfoot, smooth and cool, shaped by passage"
        - "the deep hum of the Transmission Tower during Tenth Observance—felt in the chest before heard"
      key_elements:
        - "the Witness Stone: actual floor where Witnesses knelt, worn into shallow depression"
        - "the Transmission Tower: 200 feet of geometric bronze lattice rising in stepped setbacks, dish at apex, visible from anywhere in the Rim—art deco monumentalism declaring humanity's continued plea to the stars"
        - "Intercessor's pulpit: elevated but not distant, speaking to congregation not above it"
        - "choir galleries for the fifteen-voice sections of the Tenth Observance"
        - "the contrast: worn pilgrimage stone below, broadcast monumentalism above"
  # ─── end Cathedral of the Plea ───

  # ═══ The Angle ═══
  The Angle:
    category: location
    short: "Medina arcology sheared at thirty degrees—dramatic survivor of whatever destroyed the others."
    details: |
      Full-size pre-Interdict arcology, roughly 400 meters at the base, sheared off at 
      approximately thirty degrees perhaps 200 meters up. The truncation surface is smooth 
      as glass—not broken or collapsed but cut, as if something removed the upper portion 
      instantaneously. Whatever did this is classified. The lower floors remain functional; 
      ~8,000 residents occupy the intact sections. Upper floors near the cut are sealed—
      the truncation exposed internal systems that still function unpredictably.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Calibration Hall, Kethesir's Pillar]
    location_features:
      level: site
      location_type: residential
      parent: Medina Quarter
      population: ~8,000
      primary_function: Residential, commercial on lower floors
      notable_features:
        - Sheared at 30° angle
        - Smooth truncation surface
        - Lower floors functional
        - Upper floors sealed
      real_world_anchor: "Monterey Bay basin (Medina Quarter)"
    local_aesthetic: "The dramatic silhouette visible from across the Medina—a full-size arcology cut at thirty degrees, the truncation surface catching light at dawn and dusk. The lower floors bustle with commerce and residence like any occupied building. Higher up, the walls show where the cut begins: smooth as polished stone, perfectly flat, exposing cross-sections of internal conduits that occasionally spark or hum. The sealed floors above the cut are dark, their windows showing nothing. Whatever removed the upper portion did so cleanly enough that the remaining structure remains stable—but no one builds near the edges."
  # ─── end The Angle ───

  # ═══ Calibration Hall ═══
  Calibration Hall:
    category: location
    short: "Fully populated Medina arcology—dense vertical city housing perhaps 30,000."
    details: |
      The only one of the Medina's surviving arcologies that functions as its builders 
      intended: a complete vertical city with operational utilities, self-repair systems, 
      climate control, and the full infrastructure of pre-Interdict habitation. ~30,000 
      residents occupy 40+ floors. The name comes from whatever the building originally 
      calibrated—the documentation is lost, but the term persists. Guild halls, merchant 
      housing, Bureau sub-offices, and workshops fill space designed for purposes no one 
      remembers. Rents are premium; the waiting list is measured in generations.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, The Angle, Kethesir's Pillar]
    location_features:
      level: site
      location_type: residential
      parent: Medina Quarter
      population: ~30,000
      primary_function: Residential, commercial, administrative
      notable_features:
        - Fully operational utilities
        - Self-repair systems active
        - Climate control functional
        - Multi-generational waiting lists
      real_world_anchor: "Monterey Bay basin (Medina Quarter)"
    local_aesthetic: "What an arcology is supposed to be: a vertical city alive from foundation to apex, light in every window, the hum of operational systems audible from outside. The exterior shows the wear of millennia but the self-repair keeps it functional—surfaces pristine in some sections, deliberately aged in others, following patterns no one designed. Inside: galleries and corridors thronged with residents, guild shops on the lower floors, premium apartments higher up, Bureau sub-offices wherever space permits. The building runs hot—climate control maintaining temperatures comfortable for pre-Interdict populations, which current inhabitants find slightly warm. Compared to the Angle's dramatic wound or the Unlit Spire's silence, Calibration Hall simply works."
  # ─── end Calibration Hall ───

  # ═══ Kethesir's Pillar ═══
  Kethesir's Pillar:
    category: location
    short: "Gutted Medina arcology covered in defaced depictions of someone called Kethesir."
    details: |
      Full-size arcology that survived structurally but was systematically vandalized at 
      some point in the unrecorded past. The interior is covered with depictions of a 
      figure called Kethesir—murals, reliefs, statues, mosaics—in poses suggesting he was 
      a warlord, or an entertainer, or an actor, or possibly all three. Almost every 
      depiction has been deliberately defaced: angle grinders removing faces, something 
      that caused immense heat scorching entire murals black. Whatever tools accomplished 
      this also destroyed the utility conduits running behind the walls. Service has been 
      restored to floors 1-4 through external connections; ~2,000 people occupy these 
      lower floors. The upper 35+ floors remain dark, their defaced Kethesirs staring 
      eyelessly from walls no one visits.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, The Angle, Calibration Hall, Kethesir]
    location_features:
      level: site
      location_type: residential
      parent: Medina Quarter
      population: ~2,000
      primary_function: Residential (limited), salvage access
      notable_features:
        - Utilities only on floors 1-4
        - External power/water connections
        - Upper floors dark and empty
        - Defaced Kethesir depictions throughout
        - Vandalism destroyed utility conduits
      real_world_anchor: "Monterey Bay basin (Medina Quarter)"
    local_aesthetic: "The lower floors glow with improvised lighting—external power connections jury-rigged across centuries, water pumped from cisterns below. Life happens here: cramped apartments, small businesses, the stubborn habitation of people who can't afford Calibration Hall's waiting list. But even on the occupied floors, defaced Kethesirs watch from every surface: a mural with the face ground away, a relief where heat-scarring obscures the features, a statue missing its head. Above the fourth floor: darkness, and more Kethesirs. Salvage crews who venture up report hundreds of depictions—the figure in armor, in theatrical costume, addressing crowds, leading charges, taking bows. Every face destroyed. Whatever he did to earn this, someone was thorough about erasing him. The heat that scorched his images also melted the conduits behind them, killing the building's systems floor by floor."
  # ─── end Kethesir's Pillar ───

  # ═══ Kethesir ═══
  Kethesir:
    category: person
    short: "Unknown figure depicted throughout Kethesir's Pillar—every image systematically defaced."
    details: |
      Hundreds of depictions survive in the gutted arcology bearing his name: murals, 
      reliefs, statues, mosaics. The imagery suggests a warlord, or an entertainer, or 
      an actor—possibly all three. He appears in armor leading charges, in theatrical 
      costume taking bows, addressing crowds from balconies, seated in judgment. No 
      documentation survives explaining who he was or why someone methodically destroyed 
      every depiction of his face. The vandalism predates current records. Scholars 
      debate whether the defacement was damnatio memoriae, iconoclasm, or something else 
      entirely. The building still bears his name because no one knows what else to call it.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Kethesir's Pillar, Medina Quarter]
  # ─── end Kethesir ───

  # ═══ Old Customs ═══
  Old Customs:
    category: location
    short: "Neighborhood near Archive Gate—named for what used to be there, now junior clerks, scribes, salvage brokers."
    details: |
      The name remembers a customs house that hasn't existed for millennia. The Archive 
      Gate is its remnant—now named after Booksellers' Row, which it opens onto. Junior 
      bureaucrats, copyists, scribes, salvage brokers, and the support population of 
      boundary commerce live here. Booksellers' Row anchors the neighborhood; scribal 
      businesses cluster nearby serving the book trade and the clerks who need documents 
      copied. Many's countinghouse draws traffic from both sides of the Gate. Cheap rents 
      for respectable work—marginally better than Rotten Quarter housing, private rooms, 
      windows that open. Southern edges shade into disrepute.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Archive Gate, Booksellers' Row]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Medina Quarter
      children:
        - Booksellers' Row
        - Archive Salvage Office
      population: ~50,000
      primary_function: Boundary commerce, junior clerk housing, scribal services
      castes_present:
        - Near-Baseline
        - Various labor castes
      notable_features:
        - Archive Gate (remnant of Old Customs)
        - Booksellers' Row
        - Many's primary countinghouse
        - Scribal businesses
        - Salvage broker offices
        - Cheap respectable housing
        - Southern margins of uncertain reputation
      borders:
        southwest: [Archive Gate, Iron Yards]
        north: [Clothiers' Quarter]
      transit:
        - route: Archive Gate
          to: Iron Yards / Rotten Quarter
          type: checkpoint
          notes: "Lens inspectors examine salvage; heavy daily traffic"
        - route: Processional (southern branch)
          to: Embarcadero / Rift
          type: road
          notes: "Commercial traffic to docks"
        - route: Guild streets
          to: Clothiers' Quarter, central Medina
          type: road
          notes: "Northward into respectable commerce"
      real_world_anchor: "Monterey Bay basin (Medina Quarter, southwestern edge)"
    aesthetic_features:
      intention: "Cheap respectability. A Medina address for those starting out or staying put."
      environment: |
        Archive Gate visible from most streets. Traffic from the Yards constant. Booksellers' 
        Row provides the respectable anchor; scribal shops cluster in its orbit; southern 
        edges shade toward the uncertain.
        
        This is where Medina's Antediluvian aspiration FADES. The geometric border patterns 
        that decorate guild halls in central Medina are simpler here, or absent. The smooth 
        stucco finishes give way to exposed stone. Bronze fittings appear at major thresholds 
        but not everywhere. The buildings are practical rather than aspirational—functional 
        vernacular serving people who can't afford to quote the arcologies.
      construction: |
        Conventional stone and timber, 4-5 stories. Shared facilities. Quality declines 
        southward—better near Booksellers' Row, marginal near the Gate.
        
        NORTHERN BLOCKS (near Booksellers' Row): Some geometric decoration, smooth stucco 
