      real_world_anchor: "Monterey Bay basin (Medina Quarter)"
    aesthetic_features:
      intention: "Guild prosperity made visible. We are established; we are respectable; we have been here longer than the Bureaux."
      environment: |
        Middle Medina—not adjacent to arcologies but close enough to absorb their 
        aesthetic. The Clothiers' Guild hall anchors the district, its facade showing 
        the commercial aspiration at full expression. Bolt shops, sample rooms, 
        fitting halls occupy ground floors; residences above.
      construction: |
        COMMERCIAL ASPIRATION at its most established. This is what Medina vernacular 
        looks like when guilds have had millennia to accumulate wealth:
        
        - Guild hall: Geometric border patterns in elaborate "circuit board" motifs 
          around main entrance. Smooth stucco finish (carefully maintained, replastered 
          every generation). Bronze threshold fittings worn bright by generations of 
          guild members. Proportions consciously echoing arcology geometry.
        - Member shops: Simpler versions of the same vocabulary. Bronze threshold 
          strips. Some geometric decoration at entrances. Smooth stucco where owners 
          can afford maintenance.
        - Worker housing (upper floors, rear buildings): Practical construction. 
          Exposed stone. Less decoration. The aspiration concentrates at street level.
        
        Dye-works at neighborhood edges—the smell and staining kept away from 
        respectable commerce. Warehouses behind the showroom facades.
