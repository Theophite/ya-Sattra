      environment: "The Ninth Horizon Terrace—a Medina arcology like those in the Inner City—fell ON ITS SIDE in antiquity. What was once an exterior wall is now the top, where a road runs. What were interior corridors and chambers are still interior—just rotated. Floors became walls. Walls became floors and ceilings. The Ridge is 100 meters high because the arcology was 100 meters WIDE."
