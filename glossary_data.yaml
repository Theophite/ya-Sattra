      environment: "Eastern bank of the peninsula, terminals dormant for millennia until Medials repaired them. Same labor-caste proportions as Vroëszka, same defensive water geography, but newer occupation—only three centuries of accumulated refinement."
      construction: "Labor-caste infrastructure (near-baseline proportions like Vroëszka). But the terminals here produce specialty alloys: lower volume, higher complexity, different specifications. Same incomprehensible extrusion process, different outputs."
      visual_vocabulary:
