  # ─── end Old Customs ───

  # ═══ Archive Salvage Office ═══
  Archive Salvage Office:
    category: location
    short: "Salvage Guild certified dealer near Archive Gate—reconditioned archaeotech that passed official assessment."
    details: |
      Proprietor Dov Sennek (49, male, near-baseline) holds Salvage Guild membership 
      allowing sale of certified archaeotech. Inventory includes electronic components, 
      mechanical devices, materials of uncertain origin. Prices vary enormously—common 
      replacements cost two obols, rare archaeotech commands hundreds. Dov's expertise 
      lies in matching customers with appropriate goods, understanding actual technical 
      requirements. Turns away customers whose purposes might attract Lens attention.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Old Customs, Salvage Guild, Dov Sennek]
    location_features:
      level: site
      location_type: commercial
      parent: Old Customs
      primary_function: Certified archaeotech sales
      notable_features:
        - Salvage Guild certification
        - Wide price range
        - Technical expertise
      real_world_anchor: "Monterey Bay basin (Medina Quarter, Old Customs)"
    local_aesthetic: "A shop front indistinguishable from a dozen others on the street—until you notice the Salvage Guild seal. Inside: shelves of components, drawers of small parts, a locked case for valuable pieces. Dov Sennek knows what everything is and what it's worth. More importantly, he knows what you actually need, which is rarely what you think you need."
  # ─── end Archive Salvage Office ───

  # ═══ Dov Sennek ═══
  Dov Sennek:
    category: person
    short: "Salvage Guild dealer at Archive Salvage Office—expertise in matching customers to archaeotech."
    details: |
      49, male, near-baseline. Guild membership allows sale of certified archaeotech. 
      Known for understanding actual technical requirements rather than what customers 
      claim to need. Turns away business that might attract Lens attention.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Archive Salvage Office, Salvage Guild, Old Customs]
    person_location: Archive Salvage Office
  # ─── end Dov Sennek ───

  # ═══ The Approach ═══
  The Approach:
    category: location
    short: "Prestigious neighborhood outside Fourth Whorl—everyone calls it 'the Fifth.'"
    aliases: [The Fifth, Fifth]
    details: |
      Formally the Approach, universally called "the Fifth" - the joke being that it's 
      the whorl that isn't. Short bronze pre-Interdict buildings house minor Aureate 
      estates and prominent merchant families. Extremely reliable power drawn directly 
      from Inner City reactors makes this the district for electricity-intensive 
      businesses: archaeotech dealers who need testing equipment, fabricators running 
      pre-Interdict machinery, specialty industries that can't afford power fluctuations. 
      The lights never flicker here. Rents reflect it.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Fourth Whorl, Inner City]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Medina Quarter
      children:
        - Charter House
      population: ~12,000
      primary_function: Power-intensive commerce, minor Aureate residence
      castes_present:
        - Near-Baseline
        - Highborn (minor lines)
      notable_features:
        - Bronze pre-Interdict buildings
        - Direct reactor power (never fluctuates)
        - Minor Aureate estates
        - High-end archaeotech dealers
        - Power-intensive industry
        - Charter House (Court of Direct Imperial Concessions, Territorial and Stellar)
      borders:
        west: [Fourth Whorl transition]
        east: [Clothiers' Quarter]
        south: [Great Bazaar]
      transit:
        - route: Fourth Whorl Doorways
          to: Inner City
          type: door
          notes: "Power conduits follow same route; walking distance to Bureau"
        - route: Guild streets
          to: Clothiers' Quarter, Great Bazaar
          type: road
          notes: "Easy access to guild territories"
      real_world_anchor: "Monterey Bay basin (Medina Quarter, western edge near Fourth Whorl)"
    aesthetic_features:
      intention: "The whorl that isn't. Reactor power and bronze walls, but outside the doors."
      environment: |
        Bronze buildings that could almost be Inner City overflow—short, solid pre-Interdict 
        construction, nothing like Medina's conventional stone. Power conduits emerge from 
        the Fourth Whorl and terminate here. The hum is louder than elsewhere.
        
        This is NOT conventional construction aspiring toward Antediluvian aesthetic. These 
        ARE Antediluvian buildings—bronze pre-Interdict alloy, same material as the Inner 
        City. They're just smaller (2-4 stories, human-scaled) and outside the whorls. 
        The Approach doesn't quote the arcologies; it IS ancient architecture.
      construction: |
        Pre-Interdict bronze structures, 2-4 stories. Not arcologies—smaller buildings, 
        human-scaled but clearly ancient. The bronze-alloy walls are the same material 
        as Fourth Whorl, just different architecture. Power infrastructure visible: 
        conduit housings, junction boxes, the equipment keeping electricity flowing.
        
        Where CONVENTIONAL construction appears (infill between ancient buildings, 
        additions, modifications), it shows the highest-aspiration vernacular—the 
        stone-and-timber trying to match the bronze it's surrounded by. But most of 
        what you see here is genuinely ancient.
