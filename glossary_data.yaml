  # ═══ Cathedral of St. Akhmet ═══
  Cathedral of St. Akhmet:
    category: location
    short: "Religious center of ya-Don—aspirational-vertical architecture reaching toward the obelisk towers."
    details: |
      Ya-Don's largest religious structure. Hosts Assembly for 5,000+ at major observances. 
      Arch-Curate's residence adjacent. Where the Order's religious and labor functions merge—
      confession includes workplace grievances, liturgical calendar incorporates production 
      schedules. The architecture attempts beauty—Gothic-meets-Art-Deco crystalline spires 
      reaching upward, toward the Furnace obelisks.
