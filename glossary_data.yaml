  # ═══ The Smelters ═══
  The Smelters:
    category: location
    short: "Peninsula where autofactory terminals extrude the metals making Asovoë worth trading with."
    details: |
      Extends into Fraser delta, water on three sides. Autofactory terminals extrude metals 
      according to specifications established before the revolt—no furnaces, no ore, no fuel, 
      just incomprehensible production drawing on the autofactory's deeper systems. Vroëszka 
      controls bulk production; Sztoavel handles specialty alloys. The schism between them is 
      three centuries old and bitter. Industrial byproduct contamination (heavy metals, exotic 
      compounds) differs from hot-zone radiation but extends lifespans similarly.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Vroëszka, Sztoavel]
    location_features:
      level: district
      location_type: industrial
      parent: Asovoë
      primary_function: Metal production
      children: [Vroëszka, Sztoavel]
      castes_present:
        - Avouvar
      hazards:
        - "Industrial contamination (heavy metals, exotic compounds)"
        - "Toxic byproducts channeled into river"
      notable_features:
        - "Autofactory terminals (no furnaces, ore, or fuel)"
        - "Peninsula geography (defensive isolation)"
        - "Labor-caste proportions (fit Avouvar bodies better)"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
