        east: [Yarangar, Northern Frontier]
    aesthetic_features:
      intention: "We are waiting. We are receiving. The important things cannot be shown."
      environment: "White-gray quartz diorite cliffs rising 300+ feet from the ocean. Cool and constant climate (50s year-round). Constant wind. Seasons distinguished by wind direction, not temperature."
      construction: "City grows from the cliffs, uses stone quarried from them. The geology IS the architecture. Construction material is the cliff itself, cut and shaped but never disguised."
