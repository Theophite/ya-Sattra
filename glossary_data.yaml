      environment: "Seven territories east of core Ganat—buffer zone between Republic and unknown east. Varied terrain from high plains to desert. The Dead Cities lie beyond; the Great Lakes cities are rumor."
      construction: "Marcher aesthetic diverges from Republican: feudal rather than kilit-governed, lord-centered rather than civic. Fortified estates. Serf villages. Trade posts for mysterious eastern commerce."
      visual_vocabulary:
        - "Feudal rather than Republican: lord's estates, not kilit halls"
        - "Frontier fortification: defensive architecture"
