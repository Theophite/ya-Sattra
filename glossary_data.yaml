  # ═══ Westerner Berths ═══
  Westerner Berths:
    category: location
    short: "Separated docking facilities for Westerner ships at the Rift's western edge."
    details: |
      Pre-Interdict docks near the Middens' flooded ruins, maintained by hereditary 
      harbor-keepers. Westerner ships—identical grey vessels—dock through unchanged 
      millennia-old procedures. Crews are never visible; trade happens via cranes and 
      synthesized speech. Workers follow inherited prohibitions about approaching or 
      touching the ships.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
    related: [Rift, Westerners, Middens]
    location_features:
