      special:
        - designed for worlds they can no longer reach
        - Interdict trapped them on single world
        - most intended functions no longer exist
  # ─── end Colonist Castes ───

  # ═══ Ductworker ═══
  Ductworker:
    category: caste
    short: Labor caste engineered for confined space navigation with compressible ribcage.
    details: ""
    rag_pointer: Castes of Mankind
    related: [Labor Castes, Beamcrawler]
    caste_features:
      morphology: divergent
      scale: small
      compulsion: susceptible
