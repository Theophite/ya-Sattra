    local_aesthetic: "Republican wealth in granite. Massive compounds with walls 2 feet thick—granite blocks mortared with lime, not the fitted-without-mortar technique of pre-Interdict construction. Timber framing imported at enormous cost from lower elevations. Glass windows demonstrating trade wealth. Pitched roofs with proper drainage against 200 inches of annual snow. Electric heating in every room—some compounds have their own generators (the Khen-Masots demonstrate complete self-sufficiency). Interior courtyards with actual vegetation: a statement at 6,800 feet where growing season is 90 days. Multi-generational family compounds serving as both homes and kilit headquarters. 30 people in 8,000 square feet versus 80 in 4,000 in Port District. The contrast is absolute. But the merchant family pays for Port District power. Revolutionary virtue made visible in granite and glass."
