  # ═══ Great Stairs ═══
  Great Stairs:
    category: location
    short: "800 steps from Port District to Upper City—rivers of light at night."
    details: |
      800 granite steps rising 600 feet, wide enough for two people abreast. Electric lights 
      every 20 steps making night travel safe. Granite blocks, each step 8 inches high, edges 
      rounded from millennia of footsteps. Pre-Interdict engineering in oldest sections. 
      Landings every 100 steps provide rest and overlooks. Different kilits maintain different 
      sections, competing to keep theirs brightest. You can tell when you cross boundaries by 
      light spacing and intensity.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Merchant Terraces, Taho]
    location_features:
      level: site
      location_type: infrastructure
      parent: Merchant Terraces
      primary_function: Pedestrian route, social space
      notable_features:
        - 800 steps
        - Kilit-maintained lighting
        - Pre-Interdict construction (oldest sections)
      real_world_anchor: "Lake Tahoe (Taho, Port District to Upper City)"
    local_aesthetic: "Taho's most dramatic demonstration of infrastructure. 800 granite steps from Port District to Upper City, rising 600 feet, wide enough for two abreast. Electric lights every 20 steps. Granite blocks 8 inches high, edges rounded by millennia of footsteps—pre-Interdict engineering in oldest sections, drainage channels preventing ice, walls on downslope side preventing falls. Landings every 100 steps: rest points and overlooks showing the city below, the lake stretching, the mountains rising, the pass where caravans bring contradiction. At night the stairs become rivers of amber light—different kilits maintaining different sections, all competing to be brightest. You can tell when you cross from one kilit's territory to another by subtle differences in light spacing and intensity. No single kilit made the stairs. All of them together made the stairs. But each one made their part, and you can see which part."
  # ─── end Great Stairs ───

  # ═══ Coppersmith Collective Plaza ═══
  Coppersmith Collective Plaza:
    category: location
    short: "Third Terrace plaza surrounded by coppersmith workshops—artisan independence on display."
    details: |
      150-foot square paved with granite blocks, surrounded by coppersmith workshops. 
      Artisans work in shops (forge fires visible, continuous hammering, smell of hot metal 
      and quenching water), display goods in plaza, negotiate with buyers. Some sell locally; 
      some go to Imperial factors paying premium prices—Ganati copper-craft has reputation 
      in ya-Sattra. The plaza's streetlights are maintained by the Collective itself, refusing 
      merchant kilit subsidy as point of artisan independence.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Merchant Terraces, Taho]
    location_features:
      level: site
      location_type: commercial
      parent: Merchant Terraces
      controlling_entity: Coppersmith Collective
      primary_function: Artisan commerce
      notable_features:
        - Self-maintained lighting
        - Artisan independence
      real_world_anchor: "Lake Tahoe (Taho Third Terrace)"
    local_aesthetic: "Artisan independence made visible. 150-foot granite square at Third Terrace level, surrounded by coppersmith workshops. Forge fires and electric lights make shop interiors visible from the plaza—hammering creates continuous noise, hot metal smell mingles with quenching water. Artisans work in their shops, display finished goods in the plaza, negotiate prices with buyers. Some goods sell locally; some to Imperial factors who pay premium prices (Ganati copper-craft has reputation in ya-Sattra for durability and aesthetic sophistication). The plaza's streetlights are maintained by the Collective itself, refusing subsidy from merchant kilits as point of artisan independence. The lights are kept obsessively functional, demonstrating that skilled labor can maintain its own infrastructure. Craftsmanship maintains Republican pride while generating Imperial currency—contradiction nobody questions."
  # ─── end Coppersmith Collective Plaza ───

  # ═══ Harbor District ═══
  Harbor District:
    category: location
    short: Dock area built for near-baseline labor castes, almost comfortable for Avouvar.
    details: "Architecture scaled to ordinary bodies: doorways six feet high, corridors eight feet wide. Docks extend into the Fraser on polymer pilings the autofactory maintains. Warehouses with climate control calibrated for ancient foods."
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Czernaël, Kolaëvin]
    location_features:
      level: district
      location_type: industrial
      parent: Asovoë
      primary_function: Ship unloading, warehousing
      castes_present:
