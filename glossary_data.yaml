        - Near-Baseline
        - Orevet
        - Redback
      real_world_anchor: "Central Valley (ya-Don)"
    aesthetic_features:
      intention: "We build for centuries. The work continues; the workers need shelter that lasts."
      environment: |
        Adjacent to the Furnaces—their glow visible down every street, their heat shaping 
        daily rhythms. Massive stone buildings face inward around courtyards, presenting 
        blank walls to streets. Shadows are precious; shade is architecture.
        
        FURNACE PIPES RUN THROUGH EVERYTHING. Thesad and conventional bronze pipes climb 
        walls, cross streets on brackets, dive underground, emerge from buildings. Some 
        are six inches across; some are twenty feet. The oldest Threshold buildings were 
        built AROUND the pipes—the infrastructure came first. Equipment housings squat at 
        intersections: valve assemblies, junction boxes, monitoring stations nobody opens. 
        Residents have learned which pipes are hot (stay away in summer), which carry 
        vibration (don't sleep next to them), which sometimes leak (collect the condensation).
      construction: |
        Thick stone walls (two feet or more) in local tan and grey—passive cooling 
        evolved over millennia. Curved arches throughout: doorways, windows, passages—
        organic forms absorbed from Furnace proximity. Small windows, deep-set, 
        positioned for ventilation without direct sun. Flat roofs with reflective 
        surfaces, often supporting water cisterns. Courtyard organization: families 
        face inward to shared space where shade accumulates. Bronze fittings at 
        thresholds and lintels.
        
        Buildings accommodate the pipes. Walls jog around them. Windows are placed 
        where pipes aren't. Some buildings have pipes running THROUGH them—sealed 
        passages that nobody enters, infrastructure corridors cutting through living 
        space. The architecture treats the pipes as permanent geography, like rivers 
        or hills.
      materials:
        - "local stone: tan and grey, quarried from foothills"
        - "curved arches: doorways, windows (Furnace forms absorbed)"
        - "bronze threshold fittings"
        - "flat roofs with heat-reflective surfaces"
        - "deep-set windows with external shutters"
        - "Furnace pipes: thesad (pristine) and conventional (oxidized, patched)"
        - "equipment housings at intersections"
