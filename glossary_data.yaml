  Bal Tama:
    category: person
    short: "Junta member from ancient Tama family—four centuries shaping Ogon politics through elimination rather than selection."
    person_location: Ogon
    details: |
      Imperial naming pattern (near-baseline genetics) with full Akama cultural 
      integration. The Tamas have held tokens for ~35 of 70 years total, taking 
      them during stable periods, arranging to lose them during crises. Maintains 
      deaf warband against Highborn threat. Operates honorable exit system through 
      gambling halls—bet token on rigged dice, lose with dignity, token transfers 
