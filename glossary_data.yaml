  # ═══ Vermillion Tower ═══
  Vermillion Tower:
    category: location
    short: "Seventeen-story pre-Interdict estate housing Asaph es-Tsay's collection and intellectual salons."
    details: |
      Not quite an arcology but close—predates the Interdict, stands three blocks from the 
      es-Tsay cylinder. Every floor serves as gallery for Asaph's collection: pre-Interdict 
      artifacts purchased without discrimination, arranged by aesthetic whim. Ground floor: 
      "The Mechanical Garden" (surgical robots posed as dancers, quantum cores as coffee 
      tables). Third floor: "Library of Forbidden Knowledge" (texts he can't read, arranged 
      by color). Seventh floor: "Chapel of Rejected Saints" (heretical iconography, 
      commissioned murals of the Eighth Oracle). Tenth floor: living quarters with 
      "functional" pre-Interdict technology (none of it works). Top floor: salon space 
      for intellectual gatherings. DNA scanner with quantum verification at service 
      entrance. Staff of 37 servants who have learned to fabricate "discoveries" for 
      their master's weak object-memory.
    rag_pointer: "The Antediluvian Quarter"
    related: [Antediluvian Quarter, Asaph es-Tsay, Kems as-Veleth, es-Tsay]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      population: ~40 (Asaph plus 37 servants)
      controller: Asaph es-Tsay
      primary_function: Private estate, collection gallery, salon venue
      notable_features:
        - Pre-Interdict construction (not classified as arcology)
        - Seventeen stories
        - DNA scanner with quantum verification
        - Mixed collection (~60% forgeries)
        - Three blocks from es-Tsay cylinder
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Monument to intellectual pretension rising seventeen stories above the Quarter. Every floor a gallery: pre-Interdict machines posed like sculptures, texts arranged by color in rainbow spirals, heretical murals commissioned from descriptions in banned books. The Mechanical Garden fills the ground floor—a surgical robot with arms spread like a dancer, a quantum computing core serving as coffee table, an atmospheric processor that occasionally fills the room with ozone. Higher floors grow more personal, more delusional: the Chapel of Rejected Saints with its Eighth Oracle painted as illuminating savior, living quarters where broken technology displays meaningless numbers interpreted as health diagnostics. At the top, the salon space where ya-Sattra's intellectual refuse gathers to drink expensive wine and agree with whatever radical position sounds most impressive. Staff maintain elaborate fictions—presenting just-cleaned artifacts as new discoveries for a master whose object-memory is conveniently weak."
  # ─── end Vermillion Tower ───

