      real_world_anchor: "Central Valley (ya-Don, agricultural fringe)"
    aesthetic_features:
      intention: "The land feeds the city. We serve the land."
      environment: "Where desert becomes farmland through irrigation. The Doná River channels spread water across fields; blood-trees line the watercourses with their dark red canopy. The Furnaces visible but distant; this is where ya-Don's density dissolves into productive land."
      construction: |
        Agricultural vernacular absorbing Furnace forms. The farmhouses and working 
        compounds use urban ya-Don materials—adobe, stone, timber—but the STORAGE 
        buildings show something else: domed roofs echoing Furnace geometry, cylindrical 
        silos with curved metal caps, forms that reference the great domes visible 
        across the valley. This isn't conscious imitation—it's millennia of building 
        near the Furnaces, the shapes becoming natural.
        
        Low stone walls partition fields. Farmhouses face irrigation channels rather 
        than streets. The Parish of Common-Ground serves scattered population. 
        Construction follows harvest—building happens when there's time, done well, 
        lasting generations.
