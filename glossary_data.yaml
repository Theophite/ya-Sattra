        - "water everywhere: lapping at foundations, flooding basements (Middens)"
        - "the smell gradient: hot metal and chemicals (Yards), damp and rot (Middens), cleaner air (Ridge)"
        - "the constant presence of labor that costs bodies"
        - "criminal governance more tangible than Imperial authority"
      key_elements:
