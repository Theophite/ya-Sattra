  # ═══ Charter House ═══
  Charter House:
    category: location
    short: "Scale court for direct Imperial grants—formally the Court of Direct Imperial Concessions, Territorial and Stellar."
    details: |
      Formally the Court of Direct Imperial Concessions, Territorial and Stellar. The 
      jurisdiction once settled disputes over territorial allodia, colonial charters, 
      grants to noble houses for entire star systems, mining rights measured in 
      light-years. Those cases haven't been filed since the Interdict. But guild 
      charters are technically direct Imperial grants, hereditary clearances are 
      technically allodia, Aureate patents are technically concessions—so through 
      jurisdictional drift, this court handles guild disputes, apartment inheritance, 
      and patent claims. Scale magistrates cite precedents from settlements involving 
      worlds the Empire no longer owns. The building predates the Bureau, the 
      jurisdiction predates the building, and the decorative program predates everything.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [The Approach, Bureau of the Scale, Medina Quarter]
    location_features:
      level: site
      location_type: administrative
      parent: The Approach
      controlling_entity: Bureau of the Scale
      formal_name: "Court of Direct Imperial Concessions, Territorial and Stellar"
      primary_function: "Guild charter adjudication, hereditary clearances, patent disputes (nominal: interstellar territorial grants)"
      notable_features:
        - Interstellar grant jurisdiction (vestigial)
        - Guild charter disputes (actual use)
        - Pre-Interdict bronze construction
        - Records of settlements for worlds that no longer exist
        - Decorative program designed to terrify
      real_world_anchor: "Monterey Bay basin (Medina Quarter, The Approach)"
    local_aesthetic: "The building wants you afraid. Bronze walls rise without windows to a height that makes human figures insignificant. The entrance forces supplicants through a passage that narrows, darkens, then opens into a space too large, lit from sources you cannot identify. The ceiling—if it is a ceiling—shows depth where depth should not exist: stars, or the memory of stars, or something that looks like stars arranged in patterns that hurt to follow. Figures in relief cover every surface: beings in judgment, beings in supplication, beings in postures that might be execution or might be apotheosis. They are not human. They are not Highborn. Whatever species the artist depicted, the Empire either exterminated them or never knew them. Scale magistrates sit beneath a frieze showing a figure receiving something—a crown, a world, a sentence—from hands too large and too numerous to belong to anything that breathes. The proportions are wrong throughout. Doorways sized for things taller than men. Benches that force human petitioners to sit with feet dangling. Acoustics that make whispers audible and shouts disappear. Guild representatives arguing about cloth tariffs do so beneath imagery of stellar extinction. The architecture does not care what the court currently adjudicates. It remembers what courts were for."
  # ─── end Charter House ───

  # ═══ Joiners' Block ═══
  Joiners' Block:
    category: location
    short: "Guild neighborhood where woodworkers control furniture and cabinet-making—workshops below, families above."
    details: |
      The Joiners' Guild claims exclusive right to furniture production, cabinet-making, 
      and fine woodwork within these blocks. Charter assumes automated woodworking 
      facilities; actual production is entirely manual. Guild hall anchors the 
      neighborhood. Workshops occupy ground floors with guild families above. The 
      smell of sawdust and wood varnish defines the district. Quality varies from 
      rough utility furniture to work that graces Aureate estates.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Joiners' Guild]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Medina Quarter
      controlling_entity: Joiners' Guild
