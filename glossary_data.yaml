  # ═══ Toh ═══
  Toh:
    category: location
    short: "Imperial border resort built among Antediluvian mysteries—8,000 permanent, swelling to 24,000."
    details: |
      Gateway where Imperial authority meets Ganati commerce, 8,000 permanent inhabitants swelling 
      to 24,000 in peak seasons. Sits at 6,200 feet in a valley bowl on the western approach to 
      Taho Pass, granite peaks rising 2,000-3,000 feet on three sides. The lake is visible from 
      higher elevations but not from the valley floor—building anticipation for those heading 
      east. The settlement occupies what was clearly significant tens of thousands of years ago: 
      bronze-colored metal structures converted into hotels, mountain peaks carved into 400-foot 
      Highborn faces, holographic dancers performing eternally in a meadow two miles south. 
      Bureau of the Rod maintains largest installation outside the Inner City. 800 Warborn 
      garrison in permanent boredom. Bureau of the Lens operates as customs inspectors.
    rag_pointer: Index, Stories from the Empire, Ganat and the Yarangar War
    related: [Undying Empire, Taho Pass, Taho, Ganat, Bureau of the Lens, Bureau of the Rod]
    location_features:
      level: city
      location_type: settlement
      parent: Undying Empire
      children:
        - Customs Quarter
        - Hotel District
        - Entertainment Quarter
        - Garrison District
        - The Mountain Faces
        - Holographic Meadow
        - Communications Array
      population: "8,000 permanent; 24,000 peak (late fall)"
      primary_function: Border crossing, Antediluvian tourism, trade gateway
      castes_present:
        - Near-Baseline
        - Serrulata
        - Warborn
        - Akama
      notable_features:
        - Antediluvian bronze-metal hotels
        - Carved mountain faces (400 feet)
        - Holographic dancers
        - Bureau of the Rod installation
        - 800 Warborn garrison
      borders:
        east: [Taho Pass]
        north: [Thousand Kingdoms]
        west: [ya-Sattra]
      real_world_anchor: "Eastern Sierra foothills (west of Donner Pass, Imperial side)"
    aesthetic_features:
      intention: "Antediluvian mystery layered with Imperial bureaucracy. The town is built IN ruins, not near them—among artifacts tens of thousands of years old whose purposes remain inscrutable. But the aesthetic is DIFFERENT from standard Antediluvian—softer, more organic, flowing rather than geometric. An art deco hotel rendered by Salvador Dali for Dwell magazine. This was... a resort? A curated aesthetic experience? For the Antediluvians themselves?"
      environment: "Valley bowl at 6,200 feet, granite peaks on three sides. The lake visible from heights but not from valley floor. Winter: 10-15 feet snow, below 0°F, pass impassable. Summer: 60-75°F days, Aureate tourists escaping coastal heat. Radical population swings dominate everything."
      construction: "Seventeen major Antediluvian structures in bronze-colored metal—but SOFT, FLOWING, ORGANIC. Unlike the cold geometric precision of the Inner City, these structures have curves that suggest growth rather than construction. Furniture grown from walls like biological extrusion. Pods connected by passages that expand and contract with temperature like breathing. The softness is MORE unsettling, not less. This wasn't infrastructure. This was pleasure, leisure, experience—and nobody knows for whom or why."
      visual_vocabulary:
        - "Soft Antediluvian: flowing bronze curves, organic forms, furniture grown from walls—Dali surrealism meets art deco elegance"
        - "Carved mountain faces: three peaks with 400-foot Highborn faces, angular features, stern expressions, no weathering despite obvious age"
        - "Holographic dancers: twelve figures in elaborate costumes performing 47-minute sequences at sunset and dawn—theatrical? ritual? recreational?"
        - "Memorial plaques: ancient bronze dedicating everything to particular Aureate names—but not tombs, and depicting different castes, different persons"
        - "Strange artifacts everywhere: small objects scattered throughout, functional status unknown, gathered by Rod crews, catalogued, never understood"
        - "Imperial granite overlay: customs houses, garrison barracks, newer hotels—functional architecture built among incomprehensible mysteries"
      materials:
        - "bronze-colored Antediluvian metal: warm to touch, organic curves, cannot be worked with Imperial tools"
        - "integrated furniture: sleeping platforms, storage, seating appearing grown from walls like biological extrusion"
        - "grey granite: Imperial construction, the only material people can actually work"
        - "scattered artifacts: palm-sized objects, covered in markings nobody can read, some still powered"
      colors:
        - "bronze metal (Antediluvian structures—warm, slightly luminous, almost alive-looking)"
        - "grey granite (Imperial construction)"
        - "holographic dancers: pre-modification human ideals rendered in light"
        - "Imperial bronze markers (Bureau seals, authentication stamps)"
      sensory:
        - "the constant hum: micro-reactors powering systems nobody understands, just below audible threshold"
        - "bronze structures warm in winter, cool in summer—breathing with the seasons"
        - "the wrongness of soft curves: Antediluvian is supposed to be geometric, precise, cold—this is SOFT, and that's worse"
        - "holographic dancers at sunset/dawn—47 minutes of performance for audiences that will never understand"
        - "the mountain faces watching—always watching—and the unsettling thought that they're watching ENTERTAINMENT"
        - "artifacts scattered everywhere: pick one up, feel the warmth, see the markings, understand nothing"
      key_elements:
