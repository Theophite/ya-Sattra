  # ═══ Furnaces ═══
  Furnaces:
    category: location
    short: Pre-Interdict industrial complex at the heart of ya-Don—the Empire's only source of new complex technology.
    details: |
      Two square miles, ~80,000 workforce across three shifts. The only facility in the Empire 
      capable of producing new complex technology. Temperature increases toward the center; 
      inner sections require heat-adapted castes (Ashrat).
      
      PRIMARY OUTPUTS:
      - Culverins: Electromagnetic infantry weapons. Produced in the Crucible (material prep) 
        and Lattice Hall (crystalline matrices via Mutterer choir). Authentication systems 
        built in at manufacture.
      - Lectors: Computational/authentication devices. Inner ring production, most restricted. 
        Requires Mutterer intervention, Verethani involvement, mysterious thermal regimes.
      - Beamcasters: Plasma sidearms, standard Warborn issue. Pre-Interdict design, 
        production process inherited rather than understood.
      - Power armor components: For Warborn and specialist applications. Repairs and 
        replacement parts; complete suits are archaeotech inheritance.
      - Biological illumination: Two hundred tanks of bioluminescent organisms for Imperial 
        lighting. Five tanks have died in recorded history; those capabilities are lost forever.
      - Electronic components: Resistors, capacitors, semiconductors. The closest thing to 
        conventional manufacturing.
      - Cooling systems: Heat-exchange components under es-Vorath patent.
      
      STRUCTURE: Outer ring (storage, admin, preliminary processing), middle ring (culverin 
      lines, component fabrication, illumination), inner ring (lector production, Mutterer 
      chambers, ancient systems). Workers learn the geography without understanding the logic.
      
      CONTROL: Furnace Board (three patent families, four major guilds, Bureau of the Rod). 
      Order of St. Akhmet holds absolute leverage—a strike shuts down the Empire's only 
      source of new complex technology. This has happened twice; both times the Empire 
      capitulated within weeks.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Order of St. Akhmet, Culverin, Beamcaster, Lector, Bureau of the Rod]
    location_features:
      level: district
      location_type: industrial
      parent: ya-Don
      children:
        - Crucible
        - Lattice Hall
        - Primary Deposition
        - Biological Cultivation
      controlling_entity: Order of St. Akhmet / Furnace Board
      population: ~80,000 workforce
      primary_function: Complex technology manufacturing
      hazards:
        - Extreme heat (increases toward center)
        - Restricted access zones
        - Processes requiring Mutterer intervention
      real_world_anchor: "Central Valley (ya-Don center)"
    aesthetic_features:
      intention: "The Furnaces demand. We provide. The work continues."
      environment: |
        Industrial sublime on overwhelming scale. The domes bulge asymmetrically, their 
        curves following geometries baseline mathematics cannot easily describe. Obelisk 
        towers rise 300 feet, their tops glowing amber. 
        
        THE PIPE NETWORKS: Six inches to twenty feet in diameter, running in every 
        direction—not just within the Furnaces but extending INTO the surrounding city. 
        The pipes don't stop at the walls. They climb over buildings, dive underground, 
        run along streets, emerge from walls. Ya-Don is threaded with Furnace infrastructure. 
        Some pipes are thesad—bronze-colored, self-repairing, pristine after millennia. 
        Others are conventional bronze and copper, oxidized to verdigris, patched where 
        they've failed. The two kinds run side by side. Nobody knows why some were built 
        to last forever and others weren't.
      construction: |
        Antediluvian industrial ceramic: cream and grey fused stone, seamless, jointless, 
        weathered into patterns resembling geological strata. Curved arches throughout—
        doorways, passages, observation galleries. The forms are organic, not geometric.
        
        EXTERIOR: Massive domes (50-200 feet diameter), obelisk towers, pipe networks 
        creating three-dimensional maze extending beyond Furnace boundaries into the city.
        
        INTERIOR: Control rooms of overwhelming scale. Curved walls rising into darkness. 
        Circular ports and voids—observation windows? access hatches? nobody knows their 
        original purpose. Long control consoles with displays showing teal/amber readouts. 
        Single operators dwarfed by architecture. The space assumes operators who were 
        larger, or did not need to move, or experienced scale differently.
        
        PIPE INFRASTRUCTURE: The networks carry coolants, exhaust, materials, and 
        substances no one has identified. Workers navigate paths through the three-dimensional 
        maze learned by rote. The pipes creak and groan with thermal expansion—constant 
        background noise throughout ya-Don. Equipment housings emerge from domes: valve 
        assemblies, junction boxes, pressure vessels, monitoring stations. Some still 
        function; some were abandoned millennia ago; some were never meant for human 
        interaction at all.
      materials:
        - "fused ceramic/stone: cream, grey, seamless jointless surfaces (domes, walls)"
        - "thesad pipes: bronze-colored, self-repairing, pristine after millennia"
        - "conventional pipes: copper/bronze, oxidized to verdigris, patched where failed"
        - "equipment housings: valve assemblies, junction boxes, pressure vessels"
        - "observation ports: circular voids in curved walls"
        - "control consoles: amber/teal displays, red status indicators"
      colors:
        - "cream and grey (weathered ceramic)"
        - "bronze thesad (pristine, self-maintaining)"
        - "copper/bronze oxidized to verdigris and rust"
        - "amber glow from exhaust and observation ports"
        - "teal from control displays"
        - "orange-red from active processes"
      sensory:
