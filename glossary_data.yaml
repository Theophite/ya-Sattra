  # ═══ Taho ═══
  Taho:
    category: location
    short: Largest city in the Republic, commercial gateway to the Empire.
    details: |
      700,000 inhabitants on granite slopes above Lake Tahoe, 6,200-6,800 feet elevation. 
      Controls Truckee Pass—the only crossing for hundreds of miles. Blazes with electric 
      light at night; competitive philanthropy makes power nearly free. Dusk merchant kilits 
      dominate commerce; Dawn arch-curate governs religion. Port District at lake level, 
      Merchant Terraces climbing in five levels, Upper City at summit with Academy and Cathedral.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat, Undying Empire, Toh]
    location_features:
      level: city
      location_type: settlement
      parent: Ganat
      children:
        - Port District
        - Merchant Terraces
        - Upper Taho
      population: ~700,000
      primary_function: Trade gateway
      castes_present:
        - Serrulata
        - Near-Baseline
        - Ranga
      notable_features:
        - Competitive electric lighting
        - Granite architecture
        - Truckee Pass control
        - Pre-Interdict Academy buildings
      borders:
        east: [Ganat proper]
        west: [Taho Pass]
      real_world_anchor: "Lake Tahoe basin (east shore, granite slopes)"
    aesthetic_features:
      intention: "Wealth displayed through light and philanthropy. WE built this—see the plaques, see who gave what, see how much we provide."
      environment: "Granite slopes above alpine lake. 6,200-6,800 feet elevation. The Sierra Nevada rises behind to 9,000+ feet. Winter: 200 inches of snow, -10°F, pass closes. Summer: 85°F days, freezing nights. The lake sits in a glacial basin—extraordinary clarity, 70 feet visibility, cold enough to kill in minutes."
      construction: "Granite Petra. Cities carved from and built of grey granite, space created by cutting terraces into slopes. Massive retaining walls of granite blocks 3-6 feet per side, fitted without mortar in oldest sections. Re-carved Sultanate facades—revolutionary panels replacing monarchical scenes, carved 2-3 inches deeper. Electric infrastructure threaded everywhere."
      visual_vocabulary:
        - "Petra in granite: carved facades, terraced cities climbing slopes, interior space by subtraction"
        - "Pueblo terracing: Mesa Verde-style integration into terrain, five terrace levels each 100-150 feet higher"
        - "Art Nouveau guild emphasis: kilit signatures on every maintained section, competitive display of who gave what"
        - "Old West frontier electrification: lights as civilization marker, absurdly bright at night—'fallen stars' visible from surrounding mountains"
        - "Revolutionary palimpsest: Sultana Ulayah replaced by collective assemblies, new reliefs carved deeper"
      materials:
        - "grey granite: coarse-grained, crystals visible—quartz (glassy), feldspar (white/pink), mica (flaky, sparkles in sun)"
        - "granite blocks fitted without mortar (pre-Interdict sections) or with lime mortar (newer)"
        - "electric wiring on wooden poles or through conduits"
        - "timber framing imported at enormous cost for wealthy compounds"
        - "glass windows as wealth display"
      colors:
        - "grey granite (dominant—sparkles with mica in direct sun)"
        - "lake blue visible from upper terraces"
        - "amber electric light at night—the city glows like fallen stars"
        - "revolutionary banners in rust-orange and teal"
        - "desert varnish streaks on weathered granite"
      sensory:
        - "mountain air, pine scent from surrounding forests"
        - "constant electric hum from generating plants"
        - "competitive brightness at night—disputed sections absurdly overlit"
        - "lake sounds from Port District"
        - "thin air at altitude—visitors struggle with stairs"
        - "winter: 200 inches of snow, everything underground, but the lights stay on"
      key_elements:
        - "Great Stairs: 800 steps from Port District to Upper City, electric lights every 20 steps, different kilits maintain different sections competing to be brightest"
        - "re-carved panels: monarchical tributes replaced by collective assemblies, new imagery 2-3 inches deeper, original forms faintly visible"
        - "competitive philanthropy: merchant kilits publish monthly power subsidies, plaques on buildings listing cumulative investment"
        - "the Academy: 20 acres of pre-Interdict buildings in Upper City, original purpose unknown, stream with turbines providing power at cost"
        - "at night: thousands of amber lights climbing terraces, visible from surrounding mountains—'we have power, we have coordination, we have capacity'"
  # ─── end Taho ───

  # ═══ Taho Cathedral ═══
  Taho Cathedral:
    category: location
    short: "Seat of the Taho arch-curacy—granite construction, 500-year-old pulpit with intertwined hands."
    details: |
      Granite construction, electric lighting, 500-year-old pulpit carved with intertwined 
      hands symbolizing collective labor and mutual support. The symbolism has been reinterpreted 
      repeatedly: divine punishment, then Sultanate prosperity, now revolutionary solidarity. 
      Arch-Curate Tewodo Khamun governs Taho's religious life. His sermons address commercial 
      ethics, competitive philanthropy, the proper relationship between wealth and collective 
      service. A Dawn Party arch-curate governing a Dusk merchant city.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Upper Taho, Taho, Arch-Curate Tewodo Khamun]
    location_features:
      level: site
      location_type: religious
      parent: Upper Taho
      controlling_entity: Arch-Curate Tewodo Khamun
      primary_function: Religious seat, theological interpretation
      notable_features:
        - 500-year-old granite pulpit
        - Intertwined hands symbolism
      real_world_anchor: "Lake Tahoe (Taho Upper City)"
    local_aesthetic: "Theological contradiction carved in granite. The pulpit is 500 years old, carved with intertwined hands—symbolizing collective labor, shared burden, mutual support. The stone hasn't changed; the theology attached to it transforms with each generation. Originally it meant humans supporting each other through divine punishment. Then workers cooperating for Sultanate prosperity. Now revolutionary solidarity and collective material progress. Arch-Curate Tewodo Khamun delivers sermons from this pulpit addressing commercial ethics, competitive philanthropy, the proper relationship between wealth and collective service. A Dawn Party arch-curate governing the religious life of a Dusk merchant city. Electric light illuminates the granite interior. The contradictions persist."
  # ─── end Taho Cathedral ───

  # ═══ Taho Academy ═══
  Taho Academy:
    category: location
    short: "20 acres of pre-Interdict buildings—the Republic's professional class training ground."
    details: |
      Connected pre-Interdict buildings forming complex around central plaza. Original purpose 
      unknown, construction techniques beyond current capability, utilities that still partially 
      function. Dormitories for 400 students, lecture halls, laboratories, library. Three-year 
      program training military officers, engineers, administrators. The Academy's turbines on 
      the stream provide power at cost to surrounding blocks—zero markup because educational 
      institutions don't profiteer.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Upper Taho, Taho]
    location_features:
      level: site
      location_type: educational
      parent: Upper Taho
      primary_function: Professional training
      population: ~400 students
      notable_features:
        - Pre-Interdict construction
        - Stream turbines (power at cost)
        - Class-mixing policies
      real_world_anchor: "Lake Tahoe (Taho Upper City)"
    local_aesthetic: "Antediluvian mystery housing Republican future. 20 acres of connected pre-Interdict buildings—original purpose unknown, construction techniques beyond current capability, utilities that still partially function after millennia. Central plaza surrounded by dormitories, lecture halls, laboratories, library. Students from across the Republic: 30% merchant families paying full tuition, 50% kilit-sponsored with service commitment, 20% military scholarship. Wealthy students in single rooms with better furnishings; scholarship students share cramped quarters, work part-time, study harder. But the Academy forces interaction—random seating, mixed dormitories, collaborative projects. The Academy's own turbines on the stream power not just the complex but surrounding blocks. Power provided at cost—'Educational surplus provided at zero markup. Service to collective: fundamental principle.' One is gift, the other is duty. The difference matters ideologically."
  # ─── end Taho Academy ───

  # ═══ Merchant Compounds ═══
  Merchant Compounds:
    category: location
    short: "Multi-generational family estates serving as homes and kilit headquarters."
    details: |
      Granite walls 2 feet thick, timber framing imported at enormous cost, glass windows, 
      pitched roofs, electric heating throughout. 30 people in 8,000 square feet with multiple 
      fireplaces, proper kitchens, private chambers, interior courtyards with actual vegetation 
      (a statement at altitude). Some have their own generating capacity. The Khen-Masots 
      provide their own power while also subsidizing fifteen thousand other households.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Upper Taho, Taho, Khen-Masot]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Upper Taho
      primary_function: Elite residence, kilit headquarters
      notable_features:
        - Independent power generation
        - Interior courtyards with vegetation
        - Multi-generational occupation
      real_world_anchor: "Lake Tahoe (Taho Upper City)"
    local_aesthetic: "Wealth demonstrating capacity. Granite walls 2 feet thick—substantial, permanent, expensive. Timber framing imported at enormous cost from lower elevations. Glass windows showing wealth (glass is hard to make, harder to transport). Pitched roofs with proper drainage for 200 inches of annual snow. Electric heating in every room. Interior courtyards with actual vegetation—keeping plants alive at 6,800 feet requires irrigation, protection from frost, constant attention. The vegetation announces: we have resources to spare on beauty. 30 people in 8,000 square feet: multiple fireplaces supplementing electric heat, proper kitchens, private chambers. Multi-generational family compounds serving as both homes and kilit headquarters. Some have their own generators. The Khen-Masots provide their own power from their own compound, demonstrating complete self-sufficiency while also providing subsidized power to fifteen thousand other households. Contradiction resolved through scale."
  # ─── end Merchant Compounds ───

  # ═══ Taho Pass ═══
  Taho Pass:
    category: location
    short: "Pre-Interdict granite road rising to 7,000 feet—the only crossing for hundreds of miles."
    details: |
      12 miles from Taho (6,200 ft) to summit (7,000 ft), switchbacking up western slope. 
      Pre-Interdict construction: granite blocks fitted so precisely no mortar was needed, 
      joints tight after millennia. Grade consistent—never too steep for laden wagons. 
      Closes October-April; first spring caravan celebrated. At summit: 15-foot granite 
      obelisk carved with unreadable script. Somebody wraps electric wire around it in 
      winter, creating makeshift streetlight nobody officially maintains.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Taho, Toh, Undying Empire]
    location_features:
      level: site
      location_type: infrastructure
      aliases:
        - Truckee Pass
        - Truckee Pass Road
      primary_function: Trade route
      notable_features:
        - Pre-Interdict fitted granite
        - Summit obelisk with unreadable script
        - Seasonal closure
      borders:
        east: [Taho]
        west: [Toh]
      real_world_anchor: "Sierra Nevada pass (Donner Pass area)"
    local_aesthetic: "Antediluvian engineering connecting Republican commerce to Imperial trade. Granite blocks fitted so precisely no mortar was needed—joints tight after millennia, grade consistent at efficiency modern engineers can't match. The road climbs 12 miles from 6,200 to 7,000 feet, switchbacking up the western slope. Snow and ice damage surface; spring requires clearing rockfall, repairing drainage, checking for structural problems. Republican Guard maintains garrison specifically for road maintenance. At night the road is lit by streetlights every quarter-mile on the Taho side—merchant kilits competing to have their lights reach furthest toward the pass. Caravans arriving after dark see Taho glowing below and the road lit like invitation. At the summit: 15-foot granite obelisk carved with text in script nobody can read. Maybe it commemorates construction. Maybe it warns of something. Somebody—identity unknown—wraps electric wire around it during winter, creating makeshift streetlight at the pass summit. The light stays on all winter despite nobody officially maintaining it. Some mysteries are practical rather than philosophical."
  # ─── end Taho Pass ───

  # ═══ The Bridge ═══
  The Bridge:
    category: location
    short: Pre-Interdict structure spanning the Azhmar River at High Junction.
    details: "250 feet long, 40 feet wide, single impossible arch. Metalloceramic material no Republican engineer understands. Surface glass-slick when wet—workers spread sand constantly. Defines High Junction's geography."
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [High Junction, Old Town, Manufacturing District]
    location_features:
      level: site
      location_type: infrastructure
      parent: High Junction
      notable_features:
        - Pre-Interdict construction
        - Metalloceramic material
        - Single impossible arch
      hazards:
        - Glass-slick surface when wet
        - Eroding abutments
      borders:
        east: [Old Town]
        west: [Manufacturing District]
      real_world_anchor: "Southern Colorado highlands (Azhmar River gorge)"
    local_aesthetic: "Pre-Interdict engineering amid frontier boomtown. Pale grey metalloceramic—perfectly smooth, showing no weathering despite unknown age—arching 250 feet across the gorge in a single impossible span. No Republican engineer understands how it stands. The surface is glass-slick when wet; workers spread sand constantly, wagons cross slowly. Both abutments eroding—timber pilings, stone gabions, desperate earthworks shoring up approaches the river undermines every spring. The Bridge connects adobe Old Town to timber-frame Manufacturing District, ancient technology linking two eras of Republican construction. At night, amber electric light from Old Town on one side, oil lamps and generator glow from the west."
  # ─── end The Bridge ───

