  # ═══ Ember Row ═══
  Ember Row:
    category: location
    short: "Family housing at higher elevation—adaptive vernacular."
    details: |
      ~200,000 residents. Marginally cooler from elevation. Sunset views of Furnace glow. 
      Parish of St. Calis.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don]
    location_features:
      level: district
      location_type: residential
      parent: ya-Don
      population: ~200,000
      primary_function: Family residence
      castes_present:
        - Near-Baseline
        - Orevet
        - Ashrat
      notable_features:
        - Sunset Furnace views
        - The Overlook
        - Parish of St. Calis
      real_world_anchor: "Central Valley (ya-Don)"
    aesthetic_features:
      intention: "We adapt, we repair, we continue. Every modification marks a generation."
      environment: |
        Higher elevation brings marginally cooler temperatures and commanding views. The 
        Furnaces spread below, their glow painting walls orange at sunset. The foothills 
        visible to the east—a reminder that the valley has edges.
        
        Furnace pipes extend here too, but sparser than the Threshold. Main trunks run 
        along major streets; branch lines cross between buildings. More conventional 
        bronze than thesad—this far from the Furnaces, the infrastructure was extended 
        rather than original. Patched sections, jury-rigged connections, valve housings 
        that residents have learned to maintain themselves. The pipes here are less 
        mysterious, more familiar—infrastructure you live with rather than around.
      construction: |
        Adobe and composite panels rather than thick stone—buildings that work with 
        cooling systems rather than against heat. Taller structures (three to six stories), 
        larger windows, walls that breathe. External overhangs and awnings create shade; 
        terraces step up hillsides.
        
        Original adobe supports later metal additions; wooden frames carry salvaged 
        ceramic panels; each generation's repairs visible in the stratigraphy of walls. 
        Residents read family history in their buildings. St. Calis parish has a spire 
        whose proportions don't quite achieve elegance—aspiring toward the obelisk 
        towers visible from every terrace.
        
        Pipes integrate into the patchwork. Some buildings were built to accommodate 
        them; some had them added later, brackets bolted to walls, channels cut through 
        roofs. Equipment housings converted to storage. Valve assemblies decorated with 
        paint, saints' images, family markers—the infrastructure domesticated.
      materials:
        - "adobe: local clay, tan and ochre"
        - "composite panels: salvaged, origin often unknown"
        - "timber framing visible where additions meet originals"
        - "metal cladding: salvaged, oxidized to various patinas"
        - "Furnace pipes: mostly conventional bronze (patched, repaired, maintained)"
        - "equipment housings: some converted to storage, some still functional"
      colors:
        - "adobe tan and ochre"
        - "rust and verdigris from oxidized metals (pipes and cladding)"
        - "stratified walls showing each era's materials"
        - "sunset orange from Furnace glow"
      sensory:
        - "the view downward—Furnaces spread below, pipes threading toward them"
        - "evening light catching the glow"
        - "pipe sounds: creaking, vibration, occasional hissing from valves"
        - "marginally cooler air at elevation"
        - "family sounds—this is where workers raise children"
        - "St. Calis bells marking observances"
      key_elements:
        - "accumulated modification as family history"
        - "Furnace pipes integrated into patchwork (domesticated infrastructure)"
        - "terraced construction stepping up slopes"
        - "St. Calis parish (aspirational-vertical spire)"
        - "the view: Furnaces below, foothills above"
  # ─── end Ember Row ───

