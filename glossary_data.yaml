        - Caste-segregated infrastructure
        - Avouvar trade
  # ─── end Brennholm ───

  # ═══ Far Ib ═══
  Far Ib:
    category: location
    short: "Southern Sierra Nevada facility where Archons survive—cognitive function integrated into architectural infrastructure."
    details: |
      Technical Caste refuge in the Ib Mountains. The Archons here have 
      been calculating for approximately four thousand years, attempting to disprove 
      the Eighth Testament's mathematics. Clone servants maintain their nutrient 
      lines and record Jargon outputs, but the servants degrade generation by 
      generation—each iteration slightly less functional. When servants fail, 
      the Archons will have no one to maintain them.
    rag_pointer: "Technical Castes and Far Ib"
    related: [Archon, Technical Castes, Eighth Testament, Jargon, Ib Mountains]
    location_features:
      level: city
      location_type: settlement
      parent: Ib Mountains
      castes_present:
        - Archon
        - Clone servants
      notable_features:
        - Underground facilities
        - Archon chambers
        - Degrading clone population
      real_world_anchor: "Southern Sierra Nevada (east of Fresno)"
  # ─── end Far Ib ───

  # ═══ Ganati Border ═══
  Ganati Border:
    category: location
    short: "Military frontier zone between Empire and Republic—scout-assassin units operate here."
    details: |
      The frontier zone where Imperial and Ganati territories meet. Scout-assassin 
      Warborn units conduct reconnaissance, surveillance, and occasional direct 
      action against targets the Bureau of the Sword prefers not to acknowledge. 
      The border is permeable for trade but contested for sovereignty.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Bureau of the Sword, Warborn]
    location_features:
      level: territory
      location_type: polity
      parent: Ganat
      notable_features:
        - Military operations
        - Trade routes
        - Contested sovereignty
  # ─── end Ganati Border ───

  # ═══ Ib Mountains ═══
  Ib Mountains:
    category: location
    short: "Mountain range containing Far Ib and other Technical Caste ruins—also called the Iystal Mountains."
    details: |
      The Sierra Nevada range, known in Imperial records as the Ib Mountains or 
      Iystal Mountains. Contains Far Ib, Cloud Temple, and other Technical Caste 
      installations. The Cloud Temple Band operates from facilities here, receiving 
      directives from the dying Archons through quantum-entangled communication 
      systems. The mountains form a natural barrier between the Undying Empire 
      and the Republic of Ganat.
    rag_pointer: "Technical Castes and Far Ib"
    related: [Far Ib, Cloud Temple Band, Technical Castes, Ganat, Steaming Sky Province]
    location_features:
      level: territory
      location_type: polity
      children:
        - Far Ib
        - Cloud Temple
      borders:
        west: [Undying Empire, Steaming Sky Province]
        east: [Ganat]
        north: [Thousand Kingdoms]
      real_world_anchor: "Sierra Nevada mountain range (California/Nevada)"
  # ─── end Ib Mountains ───

  # ═══ Steaming Sky Province ═══
  Steaming Sky Province:
    category: location
    short: "Remote Imperial province in east-central California—mineral extraction zone before the Interdict, now scattered villages."
    details: |
      Seven or eight villages connected by roads that disappear each monsoon season, 
      populated by people who might be third-generation fugitives or might be indigenous 
      or might be the descendants of a crashed orbital platform. Pre-Interdict mineral 
      extraction surveys promised wealth; reality delivered subsistence. Imperial tax 
      collectors visit occasionally; the locals mythologize everything and understand 
      nothing. Contains the City of Glass somewhere within its territory.
    rag_pointer: "Story Vignettes"
    related: [City of Glass, Undying Empire, Ib Mountains]
    location_features:
      level: territory
      location_type: polity
      parent: Undying Empire
      children:
        - City of Glass
      borders:
        east: [Ib Mountains, Ganat]
        north: [Northern Frontier]
      real_world_anchor: "East-central California (pre-Interdict mining region)"
  # ─── end Steaming Sky Province ───

  # ═══ Cloud Temple ═══
  Cloud Temple:
    category: location
    short: "Technical Caste installation in the Ib Mountains—base of operations for the Cloud Temple Band."
    details: |
      One of the few Technical Caste installations maintaining functional connection 
      to Far Ib. The facility's quantum computer, suspended in liquid helium and 
      communicating through thousands of acoustic horns, transmits requests from 
      an entity that may be the Archon designated as "the Mouth." Kelso Senna's 
      mercenary company operates from here, receiving directives from the dying 
      gods of Far Ib.
    rag_pointer: "Cloud Temple Band"
    related: [Cloud Temple Band, Far Ib, Kelso Senna, Ib Mountains, Archon]
    location_features:
      level: site
      location_type: infrastructure
      parent: Ib Mountains
      controlling_entity: Cloud Temple Band
      notable_features:
        - Quantum communication system
        - Acoustic horn array
        - Liquid helium cooling
      real_world_anchor: "Sierra Nevada (exact location classified)"
  # ─── end Cloud Temple ───

  # ═══ Pacific Ocean ═══
  Pacific Ocean:
    category: location
    short: "The western sea—connects all coastal settlements from Asovoë to ya-Sattra."
    details: |
      The ocean defines the western edge of the known world. Coastal cities derive 
      much of their character from their relationship to it: ya-Tsatsa's cliffs rising 
      from it, Ogon where the Columbia meets it, Asovoë's contaminated delta, and 
      ya-Sattra's drained bay that once held it.
    related: [Asovoë, ya-Tsatsa, Ogon, ya-Sattra, Puget Sound]
    location_features:
      level: territory
      location_type: polity
      children:
        - Puget Sound
      borders:
        east: [Asovoë, Puget Sound, ya-Tsatsa, Ogon, ya-Sattra]
      transit:
        - route: Ship
          to: all coastal settlements
          type: ship
          notes: "All routes via Pacific Ocean are by ship; connects Asovoë, Puget Sound, ya-Tsatsa, Ogon, ya-Sattra"
        - route: Westerner ships
          to: unknown origin
          type: ship
          notes: "Mysterious bulk traders; identical grey vessels; crews never visible"
  # ─── end Pacific Ocean ───

  # ═══ Puget Sound ═══
  Puget Sound:
    category: location
    short: "Inland sea where refugee castes established caste-villages after fleeing contaminated north."
    details: |
      The Sound's protected waters and moderate climate drew refugee populations 
      from Asovoë and points north. Caste-villages dot the eastern shore, each 
      maintaining separate infrastructure for their distinct biological needs. 
      Avouvar traders arrive monthly, connecting the settlements to northern 
      trade networks.
    rag_pointer: "Puget Sound Refugee Castes"
    related: [Brennholm, Völërath, Szkovërin, Draëthen, Avouvar, Pacific Ocean]
    location_features:
      level: territory
