  # ═══ Ghaur-Dan ═══
  Ghaur-Dan:
    category: location
    short: "Astal settlement in the Thousand Kingdoms—message poles spiral up every building."
    details: |
      Twelve thousand people, mostly Astal, on volcanic lava rock thirty kilometers 
      south of former Bend. Destrier cavalry cannot operate here—the rock would shatter 
      their legs—creating neutral ground. Message poles are a Thousand Kingdoms Astal 
      tradition: wooden poles spiraling up building walls, carved with tiny script 
      (2mm letters) that accumulates across generations. Bottom sections for children, 
      higher for adults, highest contain messages no one has read in generations. 
      Warborn cannot read the poles—text too small for baseline eyes.
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Thousand Kingdoms, Astal]
    location_features:
      level: city
      location_type: settlement
      parent: Thousand Kingdoms
      population: ~12,000
      primary_function: Astal settlement, neutral ground
      castes_present:
        - Astal
        - Warborn (visitors)
      notable_features:
        - Message poles (Thousand Kingdoms Astal tradition)
        - Lava rock terrain (cavalry-proof)
        - Multi-level passages for Astal scale
        - Information asymmetry (poles unreadable to Warborn)
      real_world_anchor: "Central Oregon (south of former Bend)"
    local_aesthetic: |
      Not Imperial vernacular—this is Thousand Kingdoms architecture adapted for Astal 
      bodies and Akama cultural context. Buildings account for Astals barely over a meter 
      tall and Warborn pushing eight feet: Astal passages run through walls at waist-height, 
      bridges connect buildings at multiple levels. The message poles are everywhere—
      heartwood pine dried seven years, treated with desert plant oils, spiraling up 
      building walls to forty feet. Messages carved in 2mm script accumulate across 
      centuries: "love your mother" underlies "the winter of 847 killed all the wheat" 
      underlies "Tam's third daughter can repair pumps." The wood darkens with age and 
      oil from countless small hands touching for luck.
