    aesthetic_features:
      intention: "We see what you cannot. Our darkness is not your darkness."
      environment: "Deliberately dim. Street lamps tuned to Orevet vision—baseline visitors experience the district as twilight even at noon. Shade is abundant; overhangs extend further than standard; the sun is unwelcome."
      construction: |
        Standard Imperial forms modified for light-sensitive vision. Windows smaller 
        than standard, deep-set, often fitted with heavy external shutters. Overhangs 
        extend three to four feet beyond walls, creating permanent shade bands. 
        Exterior colors deliberately muted—grey, brown, dark blue—reducing reflected 
        light that baseline eyes wouldn't notice but Orevet find painful.
        
        Shop signs use color differences that baseline vision reads as nearly identical 
        but Orevet vision distinguishes easily—a parallel visual language invisible to 
        visitors. The Shrine of St. Oreli celebrates the furnace-seer who could perceive 
        what others couldn't: its interior is darker still, illuminated by frequencies 
        Orevet eyes prefer.
