      trade passes through ya-Sattra. Architecture jars against the surrounding 
      construction: sand-colored composites, sharp angles, buildings designed for 
      desert climate control. Heat-responsive pigments on walls shift through 
      propaganda slogans as temperature changes. Opens directly into the Great 
      Bazaar's chaos—step off a Ganati dock, walk past the enclave's three blocks, 
