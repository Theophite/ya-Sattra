        - route: Ship
          to: Pacific Ocean / coastal settlements
          type: ship
          notes: "All external routes by ship; Avouvar traders arrive monthly"
        - route: Ship
          to: Asovoë
          type: ship
          notes: "Northern trade connection; contaminated waters require precautions"
      real_world_anchor: "Puget Sound, Washington State"
  # ─── end Puget Sound ───

  # ═══ marru ═══
  marru:
    category: concept
    short: |
      Fermented wheat paste with honey vinegar and bread mold—foundation of Imperial cuisine.
    details: |
      Sweet, salty, deeply savory with metallic funk reminiscent of bleu cheese. 
      Used thick as paste spooned over grain, thinned into dipping sauce (three parts 
      water to one part paste), or dissolved into broth. Every household keeps a pot. 
      Running out signals disorder.
    rag_pointer: Culture - Food by Polity
    related: [ya-Sattra, fermented greens, Imperial Cuisine]
  # ─── end marru ───

  # ═══ kavdak ═══
  kavdak:
    category: concept
    short: |
      Fermented salmon paste from the Thousand Kingdoms—concentrated umami foundation.
    details: |
      Weeks of processing: koji fermentation, phenol preservation, reduced to 
      intensely savory paste. Functions as dashi-equivalent in Asovoë. Dissolves 
      into water for broth. Industrial-scale production in Ogon.
    rag_pointer: Culture - Food by Polity
    related: [Thousand Kingdoms, Ogon, Asovoë]
  # ─── end kavdak ───

  # ═══ chilmole ═══
  chilmole:
    category: concept
    short: |
      Dried chiles and meat pounded to powder, mixed with fat—foundation of Ganati cuisine.
    details: |
      Dissolves into broth, spreads on flatbread, flavors everything. Every family 
      has their own recipe. Debates about fat type, meat inclusion, spices, and 
      especially whether marru belongs in chilmole define Ganati food culture. 
      Portable, concentrated, infinitely versatile—exactly what pastoralist cuisine requires.
    rag_pointer: Culture - Food by Polity
    related: [Ganat, Serrulata, pastoral bands]
  # ─── end chilmole ───

  # ═══ tabanak ═══
  tabanak:
    category: concept
    short: |
      Blackberry-blood sauce reduced until leathery and shelf-stable—Thousand Kingdoms condiment.
    details: |
      Name means "bootsole." Rehydrates into sauce when warmed, or eaten straight 
      as calorie-dense trail food. The processing happened earlier—by the time 
      you're cooking, you're combining things already complex.
    rag_pointer: Culture - Food by Polity
    related: [Thousand Kingdoms, Akama]
  # ─── end tabanak ───

  # ═══ manna ═══
  manna:
    category: concept
    short: |
      Thin crisp scrolls with mushroomy-pandan flavor—most virtuous food for Oracle Cult devout.
    details: |
      Eaten alone (ascetic choice), softened in broth (contemplative breakfast), 
      wrapped around fillings, or crumbled as textural element. The flavor complements 
      the marru-herbs-citrus architecture in ways that make devout cuisine distinctive.
    rag_pointer: Culture - Food by Polity
    related: [Oracle Cult, ya-Sattra]
  # ─── end manna ───

  # ═══ pisco ═══
  pisco:
    category: concept
    short: Unoaked grape brandy—primary Ganati liquor.
    details: |
      Clean, fierce, distilled from sweet muscat wines while retaining some floral 
      character. What pastoral bands carry, what gets drunk at markets, what seals 
      agreements. Often flavored with vanilla or citrus peel for travel.
    rag_pointer: Culture - Food by Polity
    related: [Ganat, muscat wine]
  # ─── end pisco ───

  # ═══ koumis ═══
  koumis:
    category: concept
    short: |
      Fermented mare's milk—pastoral staple in Ganat and Thousand Kingdoms.
    details: |
      Slightly alcoholic, sour, made on the move from your horses. The dairy 
      tradition runs deep among Serrulata pastoralists and Akama alike. Settled 
      populations buy it from pastoralists who come through.
    rag_pointer: Culture - Food by Polity
    related: [Ganat, Thousand Kingdoms, Serrulata, Akama]
  # ─── end koumis ───

  # ═══ doogh ═══
  doogh:
    category: concept
    short: |
      Fermented milk drink with cucumber, mint, cumin—Imperial refreshment.
    details: |
      Refreshing, slightly sour, served cold at formal meals. Part of the 
      ya-Sattran sophisticated dining tradition.
    rag_pointer: Culture - Food by Polity
    related: [ya-Sattra]
  # ─── end doogh ───

  # ═══ raspa ═══
  raspa:
    category: concept
    short: |
      Shaved ice with prickly pear juice and lime—the Ganati obsession.
    details: |
      Requires ice, which means either trade with the north or salvaged refrigeration. 
      The combination of intense desert heat and access to ice makes it a status display.
    rag_pointer: Culture - Food by Polity
    related: [Ganat, Taho]
  # ─── end raspa ───

  # ═══ maté ═══
  maté:
    category: concept
    short: |
      Mild stimulant grown in the Empire, exported to Ganat where preferred but cannot grow locally.
    details: |
      Served in gourds, passed and shared. Much of the Imperial crop exports to Ganat, 
      where it's the preferred stimulant despite requiring import across the border. 
      More expensive than coca in most of Ganat.
    rag_pointer: Culture - Food by Polity
    related: [Undying Empire, Ganat]
  # ─── end maté ───

  # ═══ coca ═══
  coca:
    category: concept
    short: Stimulant leaf imported from the south, brewed as tea.
    details: |
      Cheaper than maté in most of Ganat—the default stimulant for workers who 
      can't afford maté prices. Trade routes run through Ogon into the Thousand 
      Kingdoms as well.
    rag_pointer: Culture - Food by Polity
    related: [Ganat, Thousand Kingdoms]
  # ─── end coca ───

  # ═══ bloodfruit ═══
  bloodfruit:
    category: concept
    short: |
      Intensely flavored fruit from the Yarangar—deep purple-red, preserved as sharbat.
    details: |
      The juice is preserved and mixed with water to make sharbat. Available to 
      those with Yarangar connections. Sometimes the rind flavors broths in 
      sophisticated ya-Sattran cooking.
    rag_pointer: Culture - Food by Polity
    related: [Yarangar, Ranga, ya-Sattra]
  # ─── end bloodfruit ───

  # ═══ Armorers' Guild ═══
  Armorers' Guild:
    category: organization
    short: "Imperial guild producing chemical-propellant small arms—extreme quality variance between craftsmen."
    details: |
      Guild monopoly on small arms production in Imperial territory. Unlike the Furnaces 
      (which produce culverins, beamcasters, and other complex technology), the Armorers' 
      Guild produces chemical-propellant weapons through traditional craft methods.
      
      QUALITY VARIANCE: Extreme. Master Kavek Ossoreth produces forty rifles yearly of 
      excellent quality. Apprentice workshops produce adequate weapons cheaply. The guild 
      credential guarantees authenticity, not quality.
      
      WHAT THEY DON'T MAKE: Culverins, beamcasters, power armor—those are Furnace 
      production. The guild produces rifles, pistols, and edged weapons.
      
      CONTRAST WITH GANATI PRODUCTION: Republican kilits use industrial methods—machine 
      tools, standardized parts, assembly lines. Guild production remains craft-based, 
      one weapon at a time.
    related: [Master Kavek Ossoreth, Journeyman Thess Morain, Journeyman Torven Garris, Furnaces]
  # ─── end Armorers' Guild ───

  # ═══ Marcher Territories ═══
  Marcher Territories:
    category: location
    short: "Seven frontier territories technically Republican but functionally independent—maintain serf populations, conduct mysterious eastern trade."
    details: |
      The seven marches maintain serf populations without Republican citizenship, 
      pad their Senate votes with pastoralist delegations, and conduct trade with 
      unknown entities beyond the Dead Cities. Lords meet annually at rotating 
      locations. The Far Northeast remains unknown—cities on the Great Lakes are 
      rumor, Atlantic trade network is inference. March of Keth-Amran is one example.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Senate]
    location_features:
      level: territory
      location_type: grouping
      parent: Ganat
      children:
        - March of Keth-Amran
      controlling_entity: Marcher lords
      primary_function: Frontier buffer, eastern trade
      notable_features:
        - Serf populations (citizenship excluded)
        - Annual lord meetings
        - Trade beyond the Dead Cities
      borders:
        west: [Ganat proper]
        east: [Dead Cities, unknown territories]
      real_world_anchor: "Eastern edges of Ganati territory"
    aesthetic_features:
