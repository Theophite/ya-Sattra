    category: person
    short: "Broken Highborn on the Junta—wears gag, votes silently, auto-opposes anything Imperial."
    person_location: Ogon
    details: |
      Age 19. No formal warband (~30 in semi-permanent association). Northeast ziggurat 
      district. Took token through Compulsion eight years ago. Exiled from es-Vol family 
      after catastrophic breakdown. Possesses ultimate Compulsion but cannot deploy it 
      safely—his commands affect himself as completely as others. His vocal architecture 
