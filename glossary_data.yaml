  # ═══ Threshold ═══
  Threshold:
    category: location
    short: "Oldest residential district in ya-Don—Imperial vernacular refined over millennia."
    details: |
      ~280,000 residents. Contains Cathedral of St. Akhmet. Commercial establishments, 
      shift-end culture.
    rag_pointer: "Ya-Don: Comprehensive Reference"
    related: [ya-Don, Furnaces]
    location_features:
      level: district
      location_type: residential
      parent: ya-Don
      children:
        - Cathedral of St. Akhmet
      population: ~280,000
      primary_function: Worker housing
      castes_present:
