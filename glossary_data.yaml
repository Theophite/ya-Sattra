    details: |
      Granite building flying the Republican standard on the Medina waterfront. Ganat is 
      landlocked—ships must use Imperial ports—so commerce flows through ya-Sattra despite 
      political tensions from the Yarangar War. Factors conduct trade on behalf of merchant 
      kilits, maintaining studied neutrality on political questions.
    rag_pointer: "The Rift: Ya-Sattra's Harbor District"
