    short: "Lens subdivision that produces harmonized warrants—rewrites causality so contradictions never existed."
    details: |
      When historical facts contradict current Imperial positions, IIR produces
      documentation showing reality was always as it now needs to be. They do not
      falsify records—they create complete paper trails demonstrating the "correct"
