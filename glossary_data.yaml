  # ═══ The Processional ═══
  The Processional:
    category: location
    short: "Ancient porcelain-coral thoroughfare running through the Medina Quarter to the Rift embarcadero."
    details: |
      Three kilometers of pre-Interdict porcelain-coral pavement cutting through the 
      Medina Quarter from the eastern approaches to the embarcadero. The pale cream 
      surface—self-cleaning, self-repairing—stands out against the Medina's conventional 
      grey granite, a visible antediluvian artifact that the district was built around. 
      Street runners position themselves along it for first messages of the day. The 
      Processional Tower and Processional Guild maintain their ancient charter for 
      "ceremonial conveyance" along the full route.
    rag_pointer: "The Medina Quarter: A Comprehensive Guide"
    related: [Medina Quarter, Rift, Processional Tower, Processional Guild, Embarcadero]
    location_features:
      level: neighborhood
      location_type: infrastructure
      parent: Medina Quarter
      primary_function: Main commercial thoroughfare
      notable_features:
        - Porcelain-coral pavement (pre-Interdict)
        - Three kilometer length
        - Self-cleaning surface
        - Ends at Rift embarcadero
        - Processional Guild ceremonial route
      real_world_anchor: "Monterey Bay basin (Medina Quarter to Rift)"
    local_aesthetic: "Three kilometers of porcelain-coral cutting through the Medina—pale cream against grey granite, antediluvian pavement that the district was built around. The surface absorbs debris overnight; spills disappear within hours. Where the Medina's conventional streets show millennia of wear, The Processional remains pristine, self-repairing through processes no one comprehends. Guild markers at intersections announce territories on either side, but no one builds on the porcelain-coral itself. At dawn, street runners position for first messages. The route ends where ancient pavement meets the embarcadero's timber and iron."
  # ─── end The Processional ───

  # ═══ Aureate Way ═══
  Aureate Way:
    category: location
    short: "Narrow commercial corridor between es-Korvey and es-Durann estates."
    details: |
      Barely wide enough for two palanquins to pass. Rents exceed palatial estates 
      elsewhere in ya-Sattra—proximity to patent holders justifies any expense. 
      Fortunes change hands in doorway negotiations.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Korvey, es-Durann]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: High-value commercial corridor
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Barely wide enough for two palanquins to pass—porcelain-coral underfoot, two radically different arcologies pressing close on either side. The es-Korvey spiral towers rise on one side, their fabric-draped surfaces shifting color in the light. The es-Durann pharmaceutical domes sprawl on the other, white surfaces occasionally venting green luminescence. Bioluminescent posts at irregular intervals where the passage widens. Shopfronts wedged into spaces the arcologies allow. Rents here exceed palatial estates elsewhere; proximity to patent-holders justifies any expense."
  # ─── end Aureate Way ───

  # ═══ Provisional Square ═══
  Provisional Square:
    category: location
    short: "Central square hosting the Dawn Market—named for a 'temporary' structure standing 800 years."
    details: |
      Neutral ground between competing estates. Before dawn, hereditary servants 
      gather to trade goods, services, and information their masters never acknowledge. 
      By sunrise the market vanishes without evidence it convened.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Dawn Market, Provisional Committee]
    location_features:
      level: site
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: Neutral ground, Dawn Market venue
      notable_features:
        - 800-year-old "temporary" structure
        - Dawn Market (pre-dawn)
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Open plaza of porcelain-coral, the pale surface faintly luminescent before dawn. The 'temporary' structure—eight hundred years old—anchors one corner: wood and canvas that should have rotted centuries ago, maintained by rituals no one remembers establishing. Bioluminescent posts glow amber as hereditary servants gather for the Dawn Market. By sunrise the market vanishes; the square becomes neutral ground between competing estates, too valuable to any single family to claim."
  # ─── end Provisional Square ───

  # ═══ Old Cloister ═══
  Old Cloister:
    category: location
    short: "Companions Guild headquarters—former Technical Caste facility with disturbing architecture."
    details: |
      At the Processional's end. Architecture bears traces of original builders—proportions 
      wrong for human occupancy. Mutterers can roam here without triggering cascades. 
      Contains Archives with Technical Caste recordings in cylinders no one can play. 
      Morning Song audible to early risers.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Companions Guild, Mutterers, Technical Castes]
    location_features:
      level: site
      location_type: administrative
      parent: Antediluvian Quarter
      controlling_entity: Companions Guild
      primary_function: Companions Guild headquarters
      notable_features:
        - Technical Caste architecture
        - Mutterer-safe zones
        - Technical Caste archives
        - Morning Song
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "At the Processional's end, where porcelain-coral gives way to something older. Technical Caste architecture: proportions wrong for human occupancy, doorways too tall, ceiling heights that vary without reason. NOT the organic-feeling arcology grey—something sterile, clinical, built for bodies that thought differently. Mutterers can roam here without triggering cascades; the walls absorb their vocalizations somehow. The Archives hold cylinders no one can play. At dawn, the Morning Song echoes from somewhere deep inside—mechanical, precise, beautiful, incomprehensible."
  # ─── end Old Cloister ───

  # ═══ Garden of Failures ═══
  Garden of Failures:
    category: location
    short: "Es-Tsay pavilion displaying every inferior computing device ever produced."
    details: |
      Surrounds the es-Tsay cylinder's base. Each device accompanied by sneering 
      testimony of inferiority to standard lectors. Educational in unintended ways—
      visitors trace history of computational attempts: chemical logic gates that 
      corroded, biological processors with unexpected behaviors, mechanical calculators 
      too slow. Curator Evenis has tended it for 37 years.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Tsay, Lector]
    location_features:
      level: site
      location_type: administrative
      parent: Antediluvian Quarter
      controlling_entity: es-Tsay
      primary_function: Humiliation pavilion, computational history
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Surrounds the base of the Calculation Spire—which means surrounding nothing visible. The invisible cylinder's edge marked only by slight light-warping. Porcelain-coral paths wind through displays of failed computation: chemical logic gates green with corrosion, biological processors in sealed jars (some still twitching), mechanical calculators of brass and crystal. Each device accompanied by sneering plaques. Curator Evenis tends it with the care of someone maintaining a permanent insult. Educational despite itself."
  # ─── end Garden of Failures ───

  # ═══ Verification House ═══
  Verification House:
    category: location
    short: "Patent verification services—authenticating Aureate claims and patent documentation."
    details: Opens when es-Tsay authentication activates lectors. Processes patent verifications all day. Clerk Thessan Vor has worked here 27 years, knows which patents are actually used versus maintained for prestige.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Aureate, es-Tsay]
    location_features:
      level: site
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: Patent verification
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Functional building amid organic marvels—conventional construction because the business requires accessibility. Opens when es-Tsay authentication activates lectors each morning. Queues form on porcelain-coral pavement outside. Inside: verification desks, stacked patent documentation, lectors humming with computational work. Clerk Thessan Vor at his station for twenty-seven years, knowing which patents matter and which are maintained for prestige alone."
  # ─── end Verification House ───

  # ═══ Calculation Spire ═══
  Calculation Spire:
    category: location
    short: "Es-Tsay estate—700m invisible cylinder displaying the city behind it on failing panels."
    details: |
      The cylinder appears as an architectural void, visible only through slight light-warping 
      at its edges. Ten thousand display panels show the city behind it; many have burnt out, 
      creating dark scars. Sri Pater Irem es-Tsay performs morning authentication from the apex, 
      activating every lector purchased in the previous 24 hours. The Garden of Failures 
      surrounds its base.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Tsay, Garden of Failures, Lector]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Tsay
      primary_function: Computational authentication, residence
      notable_features:
        - Invisible display panels
        - Patent Chamber at apex
        - Analytical engine in bunkers below
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "A perfect cylinder seven hundred meters tall that displays the city behind it—an architectural void visible only through slight light-warping at the edges. Burnt-out panels create dark scars across the illusion. At night, you can see stars through the middle of a building. The Garden of Failures rings its base: failed computational devices displayed with sneering plaques. Inside, 188 family members and 3,600 servants occupy space designed for five thousand. The building knows what the Empire is thinking before it finishes the thought."
  # ─── end Calculation Spire ───

  # ═══ es-Korvey Towers ═══
  es-Korvey Towers:
    category: location
    short: "Three spiral towers wrapped in sample fabrics—textile treatment monopoly made architectural."
    details: |
      Three interconnected spires spiral around each other like frozen smoke. External surfaces 
      draped in sample fabrics that change weekly. At sunset, treated fabric exteriors become 
      translucent screens displaying abstract patterns. Crystal wasps build valuable nests between 
      towers. Mari es-Korvey holds weekly fabric courts in the middle tower's apex.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Korvey, Aureate Way]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Korvey
      primary_function: Textile treatment, residence
      notable_features:
        - Spiral architecture
        - Fabric-draped exteriors
        - Bio-vaults seven stories underground
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Three spires spiral around each other like frozen smoke—organic architecture that seems grown rather than built. External surfaces draped in sample fabrics displaying the monopoly's reach. At sunset, the towers illuminate from within, treated fabric becoming translucent screens showing patterns that might be advertising or art. Crystal wasps build glowing nests between the spires, their constructions worth more than Middens buildings. The bio-vaults seven stories underground, where actual cultivation occurs, are sealed to all but genetic keyholders."
  # ─── end es-Korvey Towers ───

  # ═══ es-Durann Complex ═══
  es-Durann Complex:
    category: location
    short: "Pharmaceutical dome complex sprawling across sixteen blocks—medicine synthesis beyond understanding."
    details: |
      Unlike neighbors' vertical aspirations, the es-Durann estate sprawls horizontally: 
      interconnected domes covering sixteen city blocks. The Treatment Pavilion serves as 
      public face—sterile white surfaces, unnecessary airlocks. At sunset, domes vent 
      pharmaceutical byproducts that smell of bitter almonds and shimmer green.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Durann, Aureate Way]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Durann
      primary_function: Pharmaceutical synthesis, residence
      notable_features:
        - Horizontal sprawl
        - Treatment Pavilion
        - Pharmaceutical venting at sunset
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Horizontal where neighbors are vertical—interconnected domes sprawling across sixteen blocks. The Treatment Pavilion presents medical authority: sterile white, unnecessary airlocks that hiss impressively, staff in contamination suits serving theatrical purpose. Actual production occurs in automated systems the family monitors but doesn't control. At sunset, the domes vent pharmaceutical byproducts—green luminescence rising like ghosts, the smell of bitter almonds, air that shimmers. Residents know which streets to avoid when wind blows wrong."
  # ─── end es-Durann Complex ───

  # ═══ es-Norren Towers ═══
  es-Norren Towers:
    category: location
    short: "Seventeen semaphore towers connected by bridges of captive lightning—quantum encryption made visible."
    details: |
      Seventeen towers of varying heights connected by bridges at seemingly random intervals. 
      Tower heights create wind vortexes making bridges terrifying to cross. The family hasn't 
      met in person for years—business conducted by written messages via Springheels. At sunset, 
      bridges light with encryption traffic worth hundreds of obols per pulse.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Norren]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      children:
        - Spectral Archive
      controlling_entity: es-Norren
      primary_function: Quantum encryption, residence
      notable_features:
        - Seventeen interconnected towers
        - Wind vortex bridges
        - Encryption traffic visible at sunset
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Seventeen towers of varying heights, bridges connecting them at random intervals. The tower heights once served transmission purposes now forgotten; they create wind vortexes that make the bridges terrifying. At sunset, the bridges light with encryption traffic—captive lightning, each pulse worth hundreds of obols, messages so secret the math would kill you if understood. Honat es-Norren hasn't seen his wife in twelve years; she's in Tower Seven, he's in Tower Thirteen. Children circulate on schedules that might once have been technical requirements."
  # ─── end es-Norren Towers ───

  # ═══ Symbiotic Spires ═══
  Symbiotic Spires:
    category: location
    short: "Five organic towers grown from living tissue—es-Poel biological interface monopoly."
    details: |
      Five organic towers rise from a shared base of living tissue—grown rather than built. 
      Walls pulse with slow biological rhythms, bioluminescent rather than lit. Seleth es-Poel, 
      sixty-three, has never left the central spire; her metabolism is linked to the tower's 
      enzymatic production. Translation crèches visible through organic membrane windows.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Poel]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      children:
        - Translation Gardens
      controlling_entity: es-Poel
      primary_function: Biological interface synthesis, residence
      notable_features:
        - Organic architecture
        - Bioluminescent walls
        - Translation crèches
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Five organic towers rising from a shared base of living tissue—surfaces showing the texture of engineered coral, grown rather than built. The walls pulse with slow biological rhythms, luminescing rather than lit. Light is warm and organic, shifting through the day following the towers' metabolic cycles rather than the sun. Translation crèches visible through windows of transparent organic membrane: sealed chambers where interface organisms grow. Seleth es-Poel has never left the central spire; her body is modified to integrate with the tower's systems, metabolism linked to enzymatic production."
  # ─── end Symbiotic Spires ───

  # ═══ Seven-and-One Meridian Terrace ═══
  Seven-and-One Meridian Terrace:
    category: location
    short: "Spectrum-shifting ziggurat—es-Verlaus estate, originally es-Yoht, now occupied by provincial newcomers."
    details: |
      Stepped cone rising with each level a perfect diminishing circle. Exterior shifts through 
      the spectrum as it ascends: angry red at base, through visible range, to an apex that 
      appears as blank grey where violet should be. Originally es-Yoht estate, purchased after 
      the family achieved "intended state" (non-existence). Karvan es-Verlaus keeps horses 
      for racing on middle levels.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Verlaus, Aureate System]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Verlaus
      primary_function: Archaeotech taxation, residence
      notable_features:
        - Spectrum-shifting exterior
        - Unprocessable apex
        - Horse racing on middle levels
        - 1,268 inherited clone servants
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "A stepped ziggurat that lost its edges, each level a perfect diminishing circle. The exterior shifts through spectrum as it ascends: angry red at base, through colors that make eyes water, to an apex that should be violet but appears as nothing the brain can process. The es-Verlaus don't belong here—Threshing Coast riders who bought it from the Bureau after the es-Yohts achieved non-existence. Karvan es-Verlaus wakes in chambers pulsing with bioluminescent rhythms keyed to departed biology, checks on the horses, and maintains the fiction that his family belongs in the Antediluvian Quarter."
  # ─── end Seven-and-One Meridian Terrace ───

  # ═══ es-Morath Arcology ═══
  es-Morath Arcology:
    category: location
    short: "Sealed stone egg at the Quarter's edge—neural preservation family who can no longer survive outside."
    details: |
      Massive stone egg half-buried in ground at the Quarter's northern edge. No windows, no 
      visible doors. Smooth grey substrate absorbs light, appearing as shadow even at noon. 
      Pipes carry atmospheric mixtures in and waste out. The arcology hasn't opened to outside 
      air in four hundred years. The es-Morath have modified themselves to embody their patent; 
      their bodies produce neural preservation enzymes. They cannot survive outside.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Morath]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Morath
      primary_function: Neural enzyme synthesis, residence
      notable_features:
        - Completely sealed
        - Incompatible atmosphere
        - Living enzyme factories
      hazards:
        - Lethal internal atmosphere
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter, northern edge)"
    local_aesthetic: "Massive stone egg half-buried at the Quarter's northern edge. No windows, no visible doors. Smooth grey substrate absorbs rather than reflects light—the building appears as a shadow even at noon. Pipes emerge from ground around the perimeter: atmospheric mixtures in, waste products out. The arcology hasn't opened to outside air in four hundred years. Inside, the es-Morath have become their patent—bodies elongated, limbs bending at unexpected angles, skin bioluminescent, eyes blind in normal light. Progenitor Tesseth es-Morath, three hundred years old, cannot survive outside. Cadet-Interface Mellora handles all external contact."
  # ─── end es-Morath Arcology ───

  # ═══ Spectral Archive ═══
  Spectral Archive:
    category: location
    short: "Es-Norren document storage where light behaves strangely."
    details: |
      Rooms within the es-Norren towers where the quantum encryption infrastructure 
      creates optical anomalies. Documents stored here are visible only at certain 
      angles; some can only be read in specific lighting conditions that the Archive 
      maintains.
    rag_pointer: The Antediluvian Quarter
    related: [es-Norren Towers, es-Norren]
    location_features:
      level: site
      location_type: administrative
      parent: es-Norren Towers
      controlling_entity: es-Norren
      primary_function: Document storage
      notable_features:
        - Light distortion effects
        - Angle-dependent visibility
      real_world_anchor: "Monterey Bay basin (es-Norren Towers)"
    local_aesthetic: "Rooms where light behaves strangely—quantum encryption infrastructure creating optical anomalies no one fully understands. Documents visible only at certain angles; some readable only in specific lighting conditions. Archive-Keeper Lessith maintains the collection, knowing exactly which shelf requires which approach. The encryption traffic on the bridges above pulses through these spaces, casting shadows that move against their sources."
  # ─── end Spectral Archive ───

  # ═══ Translation Gardens ═══
  Translation Gardens:
    category: location
    short: "Es-Poel inter-circle communication spaces within the Symbiotic Spires."
    details: |
      Spaces within the es-Poel towers where servants from different concentric 
      circles can communicate through the biological interface organisms the 
      family cultivates. The Gardens bridge incompatible modifications, allowing 
      translation between servant lines that couldn't otherwise interact.
    rag_pointer: The Antediluvian Quarter
    related: [Symbiotic Spires, es-Poel]
    location_features:
      level: site
      location_type: administrative
      parent: Symbiotic Spires
      controlling_entity: es-Poel
      primary_function: Inter-circle communication
      notable_features:
        - Biological translation interfaces
        - Multiple communication modalities
      real_world_anchor: "Monterey Bay basin (Symbiotic Spires)"
    local_aesthetic: "Spaces where incompatible modifications can communicate—organic chambers saturated with interface organisms that translate between servant lines. The air is thick with enzymatic compounds; breathing here connects you to the tower's communication network. Inner-circle servants, modified beyond baseline tolerance, can speak with outer-circle servants who interface with the outside world. The walls pulse with the slow rhythms of translation bacteria doing their work."
  # ─── end Translation Gardens ───

  # ═══ Asovoë ═══
  Asovoë:
    category: location
    short: Contaminated city inhabited by Avouvar at the edge of habitable world.
    details: Fraser River delta, glaciers visible to north. Autofactory maintains infrastructure for millions while 60,000 Avouvar inhabit seventeen precincts. Radiation renewed deliberately to exclude outsiders.
    rag_pointer: Asovoë and the Avouvar
    related: [Avouvar, San Juan Factorias]
    location_features:
      level: city
      location_type: settlement
      children:
        - Vroëszka
        - Sztoavel
        - Czernaël
        - Kolaëvin
        - Żelovin
        - Dravoëtsin
        - Lavoëran
        - Kraëlosz
        - Vesztraëlin
        - Droëvan
        - Harbor District
        - The Smelters
      aliases:
        - ya-Tsovez
      controlling_entity: Seventeen precinct councils / Rezhda
      population: ~60,000
      castes_present:
        - Avouvar
        - Medials
      hazards:
