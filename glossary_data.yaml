    short: "Lens subdivision that makes dangerous information unfindable—cultivates cognitive deficits in its staff."
    details: |
      ISK staff are selected for ability to NOT process certain information patterns.
      They can approach dangerous knowledge without comprehending it. Files are not
      destroyed but made progressively more difficult to locate—each reference leads
      to another reference in an infinite regress. Staff develop "documentary syndrome"
