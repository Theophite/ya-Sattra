      notable_features:
        - Near-baseline proportions
        - Climate-controlled warehouses
      borders:
        adjacent: [Czernaël, Kolaëvin]
      real_world_anchor: "Varies by context"
    aesthetic_features:
      intention: "The exception. Built for others. Almost comfortable."
      environment: "Dock facilities on the Fraser delta. Near-baseline proportions—rare in Asovoë. Built for labor castes that no longer exist, now almost comfortable for Avouvar bodies."
      construction: "Unique in Asovoë: architecture scaled to ordinary bodies. Doorways six feet high, corridors eight feet wide. Avouvar need no platforms, no fabric partitions to make spaces usable. But still autofactory-maintained, still ancient."
      visual_vocabulary:
        - "Exception to Asovoë standard: human-scale proportions"
        - "Industrial port: docks, pilings, warehouses"
        - "The space where Asovoë meets the outside world at appropriate scale"
      materials:
