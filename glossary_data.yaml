        - "pipe-creaks from thermal expansion (audible throughout ya-Don)"
        - "constant rumbling from processes no one understands"
        - "amber light that never fully dims"
        - "the scale—humans diminished by architecture"
        - "equipment humming in housings nobody opens"
      key_elements:
