    local_aesthetic: "Sultanate fortress adapted to Republican use. Massive adobe walls two feet thick, small windows at defensive intervals, timber-reinforced gates. Underground chambers extend deep—armory, storage, cool barracks for summer relief. Revolutionary banners hang where Sultanate standards once flew: rust-orange and teal maguey-silk. The parade ground doubles as assembly space for political rallies. Officers' quarters show electric lighting; enlisted barracks still use oil lamps. The building could withstand assault—and has, twice, during the Revolution."
