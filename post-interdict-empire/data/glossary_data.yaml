    aesthetic_features:
      intention: "Built for minds that no longer exist. The architecture assumes understanding that cannot be recovered."
      environment: "High Sierra Nevada, remote facility above treeline. Cold, thin air, isolation. The Ib Mountains are themselves a liminal zone—Technical Caste territory, contaminated in ways that differ from the Malpais or the Dead Cities."
      construction: "Technical Caste architecture adapted for human use. Original chambers assumed non-human movement patterns: corridors spiral rather than run straight, acoustically sensitive spaces designed for Jargon communication, biological support systems for organisms merging with infrastructure. The Band has carved living quarters from chambers whose original purpose is unknown, installed conventional military infrastructure where Technical Caste equipment has failed."
      visual_vocabulary:
