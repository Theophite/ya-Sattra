      Dish pointed carefully away from galactic core. Every Particular Confession from 
      the year streams into space. Empire tolerates this because forbidding it would 
      acknowledge words have power. Assembles fifteen voices from each participating 
      congregation, five sections of three representing mathematical perfection. For 
      forgotten communities, invitation to sing at Cathedral is opportunity to exist 
      publicly.
