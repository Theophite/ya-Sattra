    details: |
      Stepped cone rising with each level a perfect diminishing circle. Exterior shifts through 
      the spectrum as it ascends: angry red at base, through visible range, to an apex that 
      appears as blank grey where violet should be. Originally es-Yoht estate, purchased after 
      the family achieved "intended state" (non-existence). Karvan es-Verlaus keeps horses 
      for racing on middle levels.
    rag_pointer: The Antediluvian Quarter
