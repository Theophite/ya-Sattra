        - "observation equipment (for watching Medials)"
        - "training tools for pattern-recognition"
        - "Tevorath meeting space (skill-based hierarchy visible)"
      colors:
        - "Technical quarter colors: geometries that confuse color perception too"
        - "aurora-bright Avouvar in spaces that don't quite resolve"
        - "Medial work-light from the Technical quarter"
      sensory:
        - "the wrongness of Technical geometry (different from Highborn or Warborn wrongness)"
        - "corridors that seem to change direction"
        - "the presence of Medials nearby—autonomous machines tending systems"
        - "mediator debates: skill demonstrated through successful prediction"
      key_elements:
