  # ═══ Thesad ═══
  Thesad:
    category: technology
    short: "The 'bronze' or 'brass' of the Inner City—actually an Antediluvian alloy, not bronze at all."
    details: |
      The seamless bronze-colored alloy from which all pre-Interdict arcologies were 
      constructed. Self-repairing, seemingly eternal, impossible to manufacture with 
      post-Interdict technology. The name derives from the Imperial root "thes-" 
      (brightness, light, yellow) plus "-ad" (substance). The Antediluvians called the 
      Inner City "ya-Thes.el"—Place of Eternal Brightness—and built it from eternal 
      brightness solidified into walls.
      
      USAGE: Characters call it "bronze" or "brass" in ordinary speech. The technical 
      term "thesad" should only appear when the distinction from actual bronze/brass 
      matters—e.g., a smith noting it can't be worked, or a scholar discussing 
      Antediluvian materials. For narrative description, "bronze" is fine.
    rag_pointer: The Inner City, Aesthetics
    related: [Inner City, Antediluvians, ya-Thes.el]
    aliases:
      - bronze
      - brass
      - bronze-colored alloy
      - Antediluvian bronze
    etymology:
      root: thes- (brightness, light, yellow)
      affix: -ad (substance)
      meaning: "bright-substance"
    properties:
      - self-repairing
      - seamless construction
      - warm bronze color
      - impossible to manufacture
      - seemingly eternal
  # ─── end Thesad ───

