      functions: atmospheric tolerance, communication modality, sensory range. Creates 
      institutional memory encoded in genetics—servants don't need to learn capabilities 
      built into biology. Longest relationships extend millennia: palanquin-bearer lines 
      from Record of Three Laws still carry fragile Aureate bodies. Ancient servant 
      populations know family histories better than families themselves.
    rag_pointer: "The Aureate System"
    related: [Bureau of the Creche, Aureate, Kēt, Namali]
  # ─── end Cloneline ───

