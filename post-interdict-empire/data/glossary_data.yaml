        - Eroding abutments
      borders:
        east: [Old Town]
        west: [Manufacturing District]
      real_world_anchor: "Southern Colorado highlands (Azhmar River gorge)"
    local_aesthetic: "Pre-Interdict engineering amid frontier boomtown. Pale grey metalloceramic—perfectly smooth, showing no weathering despite unknown age—arching 250 feet across the gorge in a single impossible span. No Republican engineer understands how it stands. The surface is glass-slick when wet; workers spread sand constantly, wagons cross slowly. Both abutments eroding—timber pilings, stone gabions, desperate earthworks shoring up approaches the river undermines every spring. The Bridge connects adobe Old Town to timber-frame Manufacturing District, ancient technology linking two eras of Republican construction. At night, amber electric light from Old Town on one side, oil lamps and generator glow from the west."
  # ─── end The Bridge ───

  # ═══ The Cliffs ═══
  The Cliffs:
