        - "Tevorath: seven mediators selected by skill, not age"
        - "Most of city's practicing mediators"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "We watch. We correlate. We predict imperfectly, but better than anyone else."
      environment: "Surrounds the Technical Caste quarter—geometries that baseline cognition finds disorienting, architecture built for minds that processed information differently. The Avouvar mediators have spent generations learning to read what the Medials do."
      construction: "Technical Caste infrastructure: geometries that confuse normal perception, corridors that seem to change direction, chambers whose proportions don't quite resolve. Not Highborn-wrong or Warborn-wrong but Technical-wrong—built for cognition, not bodies."
      visual_vocabulary:
        - "Technical Caste geometry: disorienting, perception-confusing"
        - "Observation spaces: where mediators watch Medials work"
        - "Training facilities: where young Avouvar learn pattern-recognition"
        - "The Tevorath chamber: meritocracy visible in arrangement"
      materials:
