      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "We tend what grows in darkness. When it emerges, we name it. This is how we have always lived."
      environment: "Two worlds: modest contaminated surface territory on the Technical quarter's edge, and beneath it a sterile labyrinth no other house may enter. The underground requires absolute purity—radiation would damage developing Medials."
      construction: "Surface: Asovoë standard, wrong-scale architecture adapted over centuries. Underground: sealed environment, shielded from contamination, maintained at sterile standards no other inhabited space approaches. The contrast is absolute—from hot zone to clean room."
      visual_vocabulary:
        - "Surface: Asovoë standard fabric partitions and adapted architecture"
        - "Underground: clinical sterility, controlled lighting, sealed environments"
        - "The Chancery: deliberation chambers, millennia of archives"
