  # ═══ ya-Tsatsa ═══
  ya-Tsatsa:
    category: location
    short: "Third Imperial city, holy city of the Oracle Cult."
    details: |
      Built atop where three Oracles achieved consciousness. Home to Testament Societies, 
      Threefold Mirror Academy, and the Presence. Near-zero crime despite producing most 
      organized criminal leadership elsewhere. Systematic opacity toward outsiders while 
      maintaining surface cooperation. Population ~150,000.
    rag_pointer: "Ya-Tsatsa: Comprehensive Reference"
    related: [Testament Society, Threefold Mirror Academy, Presence, Ezh Tan, Ezh Ot, Ezh Dhol]
    location_features:
      level: city
      location_type: settlement
      parent: Undying Empire
      children:
        - Upper City
        - Lower City
        - The Cliffs
      controlling_entity: Ezh families (Ezh Tan, Ezh Ot, Ezh Dhol)
      population: ~150,000
      primary_function: Religious center, software production
      notable_features:
        - Three Cradles
        - Kalbat cliff tombs
        - The Presence
        - Eight pre-city domes
        - No crime within city limits
      real_world_anchor: "Point Reyes, California"
    aesthetic_features:
      intention: "We are waiting. We are receiving. The important things cannot be shown."
      environment: "White-gray quartz diorite cliffs rising 300+ feet from the ocean. Cool and constant climate (50s year-round). Constant wind. Seasons distinguished by wind direction, not temperature."
      construction: "City grows from the cliffs, uses stone quarried from them. The geology IS the architecture. Construction material is the cliff itself, cut and shaped but never disguised."
      visual_vocabulary:
        - "Cycladic sculpture: sparse abstraction, suggestions of faces rather than faces"
        - "Shinto shrine construction: clean lines, natural materials, sacred austerity"
        - "Hadrian's Villa: built forms emerging from and returning to landscape"
        - "Petra: cliff-carved architecture, but with restraint replacing ornamentation"
      materials:
        - "quartz diorite: pale enough to glow in moonlight, hard enough to hold detail for millennia"
        - "visible crystals: quartz catching light, feldspar holding color, dark mineral flecks"
        - "undyed linen in natural cream (high-status clothing)"
        - "ceramic wind-whistles integrated into architecture"
        - "bronze resonators and chimes"
      colors:
        - "white and pale grey stone"
        - "undyed natural cream (highest status)"
        - "muted earth tones"
        - "no bright colors—restraint is the statement"
      sensory:
        - "constant wind, never stops"
        - "wind-whistles screaming during gales (the city's voice)"
        - "bronze chimes during gentle summer pressure"
        - "salt spray weathering stone faces to abstraction"
        - "acoustic presence of the wind filling every space"
      key_elements:
        - "kalbat cliff tombs: slack-jawed faces carved into cliffs, weathered smooth by centuries"
        - "the Cradles: three sites where Oracles achieved consciousness, surprisingly small"
        - "eight pre-city domes: purpose unknown, predating human settlement"
        - "geometric mosaics that seem to shift in peripheral vision"
        - "terraced paths climbing through hollow tomb-mouths"
