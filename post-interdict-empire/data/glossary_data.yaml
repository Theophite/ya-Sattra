  # ═══ Karst ═══
  Karst:
    category: caste
    short: "Deep-dwelling labor caste engineered for underground infrastructure."
    details: |
      Built for tunnel systems and underground facilities where pressure 
      differentials and minimal light would kill surface-adapted humans. 
      Rarely exceed five feet, barrel chests, enormous eyes adapted for 
      bioluminescent wavelengths, curved spines.
    rag_pointer: "Castes of Mankind, Ya-Don: Comprehensive Reference"
    related: [Labor Castes, Depths of St. Yerren]
    caste_features:
      morphology: divergent
      scale: small
      compulsion: susceptible
      lifespan: baseline
      cognition: baseline
      population: common
      physical_traits:
        - "rarely exceed 5 feet tall"
        - "barrel chest (expanded lung capacity for thin atmospheres)"
        - "enormous eyes (~2x baseline size)"
        - "eyes adapted for bioluminescent wavelengths"
        - "painful in ordinary daylight"
        - "perpetual crouch, curved spine"
        - "pale grey-white skin of creatures rarely seeing sunlight"
        - "movement awkward at surface, fluid underground"
        - "spherical silhouette in full adulthood"
      original_function: "deep infrastructure maintenance"
      current_role: "underground systems, pressure-seal technicians"
      distribution:
        - "Depths of St. Yerren (ya-Don)"
        - "underground infrastructure throughout Empire"
      special:
