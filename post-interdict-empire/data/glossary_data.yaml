        - "silver-grey extruded metals"
        - "void-black infrastructure"
        - "aurora-bright Avouvar in spaces that almost fit their bodies"
      sensory:
        - "terminal hum (not furnace roar—extrusion, not smelting)"
        - "industrial contamination: different health patterns from hot-zone radiation"
        - "water on three sides: delta sounds, isolation"
        - "proportions almost comfortable (the relief of near-fit)"
      key_elements:
