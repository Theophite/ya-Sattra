  # ═══ Vesztraëlin ═══
  Vesztraëlin:
    category: location
    short: Feuding precinct—5000 years of vendetta with Droëvan, epic poetry, and Chancery proceedings.
    details: |
      Occupies part of the garrison district with adjacent rival Droëvan. The feud began during a 
      starvation winter so ancient that even elders who remember it cannot say what happened—only 
      that something did. To feud over violence committed during a starvation winter violates 
      fundamental Avouvar ethics, so the feud acquired a different nominal subject (a border that 
      shifts by meters each generation) and the killing continued. The feud has become both houses' 
      internal culture: epic poetry, death-verses composed by killers for their victims, formal 
      Chancery proceedings filling archives. Children learn the feud's outlines before they learn to read.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Droëvan, Warborn]
    location_features:
      level: district
      location_type: military
      parent: Asovoë
      primary_function: The feud
      castes_present:
        - Avouvar
      borders:
        contested: Droëvan
      hazards:
        - "Autonomous training systems in buffer yards"
        - "Railgun emplacements"
        - "The feud itself"
      notable_features:
        - "5000-year vendetta with Droëvan"
        - "Mess hall converted to theater"
        - "Warborn stone platforms as family cluster foundations"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "Someone I loved was killed. There exists a framework that permits me to kill in return."
      environment: "Former Warborn garrison—corridors 15 feet wide, doorways 12 feet high, ceilings vaulting into shadow. Designed for nine-foot soldiers massing half a ton. Now inhabited by people killing each other according to precedents five millennia old."
      construction: "Warborn barracks repurposed: stone sleeping platforms (for soldiers half a ton in mass) serve as foundations for family clusters, surrounded by fabric partitions. Mess halls (tables sized for Warborn frames) become community gathering spaces—one converted to theater for vendetta plays, another buried under centuries of Chancery filings stacked to the ceiling. Training yards serve as buffer zones: autonomous systems still run exercises, firing at anything that moves."
      visual_vocabulary:
        - "Warborn proportions: lower and wider than Highborn, brutal rather than attenuated"
        - "Military bunker aesthetic: reinforced, defensible, armored"
        - "Vendetta culture: plays dramatizing incidents, poetry memorializing dead"
        - "Chancery documentation: centuries of filings on contested meters of territory"
      materials:
        - "Warborn-scale military construction (stone platforms, reinforced corridors)"
        - "fabric partitions creating family spaces on soldier beds"
        - "railgun emplacements (operational, pointed at Droëvan)"
        - "archive stacks: Chancery filings, precedents, adjudications"
      colors:
        - "military grey and black"
        - "aurora-bright Avouvar against brutal proportions"
        - "stage colors for vendetta theater"
        - "document colors: ancient paper, dried ink"
      sensory:
        - "autonomous training drones in the yards—the sound that keeps both houses from claiming buffer zones"
        - "Warborn proportions: lower, wider, more brutal than Highborn wrongness"
        - "theater acoustics: mess hall scale projects voices without amplification"
        - "the silence after a killing—everyone waiting to see what precedent permits"
      key_elements:
        - "5000-year feud with Droëvan (original cause: unspeakable starvation-winter violence)"
        - "Nominal subject: a border shifting by meters each generation"
        - "Epic poetry, death-verses, vendetta plays, Chancery proceedings"
        - "Training yards as accidental demilitarized zone"
        - "Mess hall theater where plays depict both houses' acts without judgment"
        - "Each generation discovers the same truth: someone was killed, and precedent permits killing in return"
  # ─── end Vesztraëlin ───

