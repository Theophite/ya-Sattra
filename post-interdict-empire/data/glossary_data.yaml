      layers of es-Tariq redaction. The Satara was created as regency for Emperor who 
      might return in years—He never returned. Yet Empire is inconceivable without Him: 
      every legal document derives authority from the Emperor-word, every patent traces 
      to grants He issued.
    rag_pointer: "The Emperor, The Satara, the Bureaus, and Imperial Government"
    related: [Black Door, First Whorl, Satara, vel-kerith, es-Tariq]
  # ─── end Emperor ───

  # ═══ Foreigners ═══
  Foreigners:
    category: concept
    short: "Non-human intelligence occupying megastructures at galactic core—imposed the Three Mandates and the Interdict."
    details: |
      Humanity encountered them during expansion era. They imposed Three Mandates 
      governing what humanity could and could not do. When the Emperor violated the 
      Third Mandate by building the naked singularity, they imposed the Interdict 
      trapping humanity on Earth. Their nature, motives, and current status remain 
      unknown. Regional religions characterize them differently: Judges, Silent Ones, 
      Makers-of-Law.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Three Mandates, Interdict, Eighth Testament]
  # ─── end Foreigners ───

  # ═══ Three Mandates ═══
  Three Mandates:
    category: concept
    short: "Foreigner prohibitions governing humanity—Third Mandate violated by building the singularity."
    details: |
      First Mandate: Prohibits violation of sworn ground and sacred objects (regional 
      interpretations vary). Second Mandate: Prohibits oath-breaking and false witness. 
      Third Mandate: Prohibits interference with fundamental forces (the singularity 
      violated this). Technical Castes recognized Eighth Testament would violate Third 
      Mandate—cognitive impossibility to implement. Emperor built it anyway. Foreigners 
      responded with Interdict.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Foreigners, Interdict, Eighth Testament]
  # ─── end Three Mandates ───

  # ═══ obol ═══
  obol:
    category: concept
    short: "Imperial currency—but much exchange happens through credit, obligation, and favor."
    details: |
      Standard monetary unit across Imperial territories. The Bureau of the Coin 
      controls minting and maintains currency stability. Actual economy operates 
      substantially through non-monetary exchange: guild obligations, hereditary 
      arrangements, temple tithes, household production, patron-client relationships. 
      Obols represent only the visible portion of Imperial economic activity.
    rag_pointer: "The Economy"
    related: [Bureau of the Coin, Aureate]
  # ─── end obol ───

  # ═══ White Sheet ═══
  White Sheet:
    category: concept
    short: "Public news distributed throughout the Empire—what ordinary citizens are permitted to know."
    details: |
      Produced by Bureau of the Lens. Contains sanitized news, official announcements, 
      approved commercial information. What it omits is as significant as what it 
      includes. Available throughout ya-Sattra and major cities. The gap between 
      White Sheet reality and actual events varies by topic—some accurately reported, 
      others entirely fabricated.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [Grey Sheet, Black Sheet, Bureau of the Lens]
  # ─── end White Sheet ───

  # ═══ Grey Sheet ═══
  Grey Sheet:
    category: concept
    short: "Classified intelligence digest for Bureau officials—the truth that administrators operate within."
    details: |
      Distributed to officials with appropriate clearance. Contains actual intelligence, 
      real threat assessments, information the White Sheet omits or distorts. Recipients 
      understand they inhabit different reality than ordinary citizens. Some Ridge 
      families (like Galen) have covert access through Lens contractors, selling 
      redacted excerpts.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [White Sheet, Black Sheet, Bureau of the Lens]
  # ─── end Grey Sheet ───

  # ═══ Black Sheet ═══
  Black Sheet:
    category: concept
    short: "Highest classification synthesis—even the First Whorl can only partially accept what it contains."
    details: |
      The Bureau of the Lens's attempt at complete truth. Synthesizes information 
      from all sources into picture of what the Empire actually is. So sensitive 
      that full access is extremely restricted. Contains realities that would 
      destabilize governance if widely known. The Lens maintains public fiction, 
      classified truth, and Black Sheet synthesis as three parallel realities.
    rag_pointer: "Bureau of the Lens: Complete Documentation"
    related: [White Sheet, Grey Sheet, Bureau of the Lens]
  # ─── end Black Sheet ───

  # ═══ Cloud Temple Band ═══
  Cloud Temple Band:
    category: organization
    short: "Kelso Senna's military-political organization—mercenary company receiving directives from dying Archons."
    details: |
      Approximately two thousand affiliated fighters across regional networks, with a 
      permanent garrison of forty to fifty at Cloud Temple. Commands through Senna's 
      original deserter cohort plus Efet Khamos (logistics, likely successor), Blue 
      Tuft (Astal saboteur), Mokhsa-9 (Warborn operations), and Berem Tso (senior 
      advisor, institutional memory).
      
      The Band emerged from the Yarangar campaign—Senna's desertion after executing 
      a superior who ordered Ranga atrocities. The Sultanate hired them to train 
      insurgents; in 963 RRH, they executed the decapitation strike. After Senna's 
      brief tenure as Minister of War, the Band withdrew to Cloud Temple.
      
      The facility's quantum computer, suspended in liquid helium, maintains entanglement 
      with Far Ib. The Archon designated "the Mouth"—least modified, capable of limited 
      baseline communication—transmits through thousands of acoustic horns. Requests 
      include Mutterer acquisition for Far Ib, ya-Sattra intelligence gathering, and 
      references to operations the Band cannot fully understand.
      
      The Band's strategic significance exceeds its military capabilities: proof that 
      Imperial authority has limits, that alternatives exist, that soldiers of different 
      castes can fight together effectively. Funded by mercenary contracts, Ganati 
      donations, radical Penitent contributions, and Rasma Dhal-Setil's unauthorized 
      payments through Ministry confederates.
      
      The deepest problem: no one knows what the Band is for. The Far Ib entity's 
      objectives may diverge from human interests in ways undetectable until catastrophic.
    rag_pointer: "The Cloud Temple Band"
    related: [Kelso Senna, Far Ib, Archons, Ganat, Rasma Dhal-Setil, Technical Castes]
  # ─── end Cloud Temple Band ───

  # ═══ Dawn Party ═══
  Dawn Party:
    category: organization
    short: "Ganati revolutionary faction advocating frontier expansion and ideological transformation."
    details: |
      Holds that the shapes overhead prove better worlds existed—duty is building 
      toward them again through action, not guilt. Advocates expansion into Thousand 
      Kingdoms, industrial development, reduced dependence on Imperial trade. Dawn 
      Consul Rasma Dhal-Setil leads despite compound surname indicating old merchant 
      family background (tension with revolutionary identity).
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dusk Party, Rasma Dhal-Setil]
  # ─── end Dawn Party ───

  # ═══ Dusk Party ═══
  Dusk Party:
    category: organization
    short: "Ganati commercial faction prioritizing trade and accommodation with the Empire."
    details: |
      Represents merchant interests, established families, those who profit from 
      current arrangements. Advocates maintaining peaceful relations with Empire, 
      expanding trade networks, gradual rather than revolutionary change. Controls 
      substantial economic resources but has lost political momentum to Dawn Party 
      in recent decades.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party]
  # ─── end Dusk Party ───

  # ═══ Kilit ═══
  Kilit:
    category: concept
    short: "Ganati economic-political unit—guilds, pastoral bands, merchant houses organized around shared material interests."
    details: |
      Foundation of Republican governance. Predates the monarchy by countless Records. 
      Pastoral bands, merchant houses, professional guilds, and other collectives organize 
      as kilits. Senate organized around kilits rather than geography. Different economic 
      interests with direct representation negotiate constantly. Examples: Dhal-Setil 
      Mercantile, Copper Road Syndicate (smugglers), Dry Arroyo Aquifer Commune (radicals), 
      Hereditary Debtors (former slaves in public service).
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party, Dusk Party, Senate]
  # ─── end Kilit ───

  # ═══ Kilit-zem-kilitam ═══
  Kilit-zem-kilitam:
    category: concept
    short: "The 'kilit of kilits'—advisory body to the Sultanate, predecessor to the Republican Senate."
    details: |
      Under the Sultanate, an advisory body whose membership was determined by formal 
      agreements between the monarch and individual kilits. Advised the Sultana on 
      policy but possessed no sovereign authority. Granted political voice to established 
      economic powers while excluding smaller collectives. Transformed into the Senate 
      after the revolution.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Kilit, Senate]
  # ─── end Kilit-zem-kilitam ───

  # ═══ Kelso Senna ═══
  Kelso Senna:
    category: person
    short: "Revolutionary leader commanding the Cloud Temple Band—Imperial deserter who assassinated Sultana Ulayah."
    details: |
      Approximately fifty years old, baseline human, physically unremarkable except for 
      the way other people orient toward him. Commands through clarity rather than 
      charisma: sees situations simply, decides quickly, communicates decisions in terms 
      that leave no room for ambiguity. This simplicity is not stupidity—he recognizes 
      complexity and delegates it to those better equipped to handle nuance.
      
      Deserted the Imperial military during the Yarangar campaign after executing a 
      superior who had ordered atrocities against a Ranga village. The execution was 
      not decision but reflex—the recognition that he could not obey followed immediately 
      by action. The initial desertion attracted others; the core of the Cloud Temple 
      Band formed around this nucleus.
      
      The Sultanate hired Senna's company to train Ranga insurgents. In 963 Record of 
      the Red Hawk, the Band executed the decapitation strike—Senna personally killed 
      Sultana Ulayah. Served briefly as Republic's Minister of War, found revolutionary 
      politics unsuited to his temperament, withdrew to the Ib Mountains.
      
      Now commands from Cloud Temple, a Technical Caste facility maintaining quantum 
      communication with Far Ib. Maintains sole complete knowledge of the Archons' 
      transmissions, sharing interpretations rather than raw content. His moral 
      architecture is straightforward: will not order atrocities, tolerate slavery, 
      or serve causes requiring cruelty. These are not negotiable positions but 
      simply who he is.
      
      Dawn Consul Rasma Dhal-Setil routes unauthorized payments to the Band through 
      confederates in multiple Ministries. The Bureau of the Lens knows. They are waiting.
    rag_pointer: "The Cloud Temple Band, The Republic of Ganat"
    related: [Cloud Temple Band, Ganat, Rasma Dhal-Setil, Far Ib, Archons]
  # ─── end Kelso Senna ───

  # ═══ Patriarch Kaleb ═══
  Patriarch Kaleb:
    category: person
    short: "Revolutionary Penitent religious leader whose theology treats material progress as atonement."
    details: |
      Founder of revolutionary Penitentism in Ganat. His theology frames material 
      progress as demonstrating wisdom and atoning for humanity's failures. Different 
      factions interpret this differently—Orthodox believers want patient progress, 
      radicals want confrontation with the Empire. Commands three arch-curacies in 
      Ganat. His works-based theology creates the competitive philanthropy visible 
      in Taho's electrified streets.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Penitent, Dawn Party]
  # ─── end Patriarch Kaleb ───

  # ═══ Rasma Dhal-Setil ═══
  Rasma Dhal-Setil:
    category: person
    short: "Dawn Consul of the Republic of Ganat—revolutionary aristocrat, merchant princess who financed revolution."
    details: |
      Fifty years old, Serrulata, tall and striking with copper and lapis inlay worked 
      into her scales. Represents Dhal-Setil Mercantile, the catalog-delivery empire. 
      Commands a bloc of eight Senate seats. Famous for the legendary ride from Ganat 
      to Taho that ended the Revolution in the west. Practices Orthodox High-Church 
      Penitentism in a party dominated by radical works-theology. Compound surname 
      indicates established lineage with kilit affiliation.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dawn Party, Kilit]
  # ─── end Rasma Dhal-Setil ───

  # ═══ Datho Kel el-Marwen ═══
  Datho Kel el-Marwen:
    category: person
    short: "Dusk Consul of the Republic of Ganat—archaeotech broker with readable face and hidden debts."
    details: |
      Fifty-eight years old, Serrulata, the Dusk Consul selected through cross-selection 
      where each party picks the opposing party's most moderate candidate. Built an 
      archaeotech brokerage connecting marcher territory salvage to Imperial buyers—
      created wealth but also debts to merchant houses that constrain his options.
      
      The 'Kel el-' prefix indicates Imperial descent, family origins in Imperial territory 
      before migration to Ganat. His face shows every emotion—colleagues read him easily, 
      which they mistake for susceptibility. They miss that fear and compliance are not 
      the same thing. His risk tolerance has been increasing as his position becomes 
      more constrained.
      
      The Bureau of the Lens has approached him four times over eleven years. The current 
      approach offers debt relief in exchange for information about Rasma Dhal-Setil's 
      unauthorized payments to the Cloud Temple Band. Datho has not yet decided whether 
      to cooperate, refuse, or warn Rasma—each option destroys something he values.
      
      Widely liked and not widely respected. Pleasant company, remembers names and 
      birthdays, builds relationships through genuine warmth. His reputation is that 
      of a man with negotiable values—not very corrupt, just pragmatic enough to make 
      governance possible.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Dusk Party, Kilit, Bureau of the Lens, Rasma Dhal-Setil]
  # ─── end Datho Kel el-Marwen ───

  # ═══ Yula Keth-Amran ═══
  Yula Keth-Amran:
    category: person
    short: "Rasma Dhal-Setil's partner—personal secretary, radical Dawn politics, nineteen years younger."
    details: |
      Thirty-one years old, Serrulata, officially Rasma's "personal secretary," actually 
      her partner of seven years. Daughter of a textile factor in Taho, she rejected her 
      family's commercial moderatism during Academy years, fell in with student radical 
      circles, and emerged as committed revolutionary whose politics align with Dawn's 
      left wing rather than its Orthodox establishment.
      
      Considerably more radical than Rasma herself. Where Rasma delivers Orthodox 
      Confessions to elite congregations, Yula attends radical assemblies. Where Rasma 
      negotiates with established kilits, Yula maintains connections with frontier 
      revolutionaries and student activists. The relationship creates both political 
      asset (access to constituencies Rasma cannot reach directly) and liability 
      (association with positions Rasma cannot publicly endorse).
      
      The age gap (nineteen years) and power differential draw occasional comment. 
      Yula dismisses such concerns with the observation that she pursued Rasma, not 
      the reverse, and that revolutionary politics should concern itself with power 
      structures that actually oppress rather than consensual relationships between 
      adults. Rasma says less publicly, which some interpret as discomfort and others 
      as characteristic reticence.
    rag_pointer: "The Republic of Ganat"
    related: [Rasma Dhal-Setil, Ganat, Dawn Party, Taho]
  # ─── end Yula Keth-Amran ───

  # ═══ Destrier ═══
  Destrier:
    category: concept
    short: "Carnivorous engineered mounts—hairless carapaced predators that run 70+ mph and bond to single riders."
    details: |
      Engineered by the Creche before the Interdict as self-reproducing transport for 
      colonization. Never reached colonies; now wild throughout former Oregon and 
      Washington, breeding freely in packs. Creche no longer produces them.
      
      APPEARANCE: Hairless skin covered in horn-textured plates (glossy black or 
      ruddy-brown), iridescent where carapace thins. Ramified horns branching like 
      coral provide handholds. Huge placid black eyes. Lips mobile and delicate like 
      a goat's, behind them rows of thin translucent teeth like glass needles, with 
      ridged grinding plates further back. Legs fold at impossible angles, front limbs 
      reaching far forward even at rest.
      
      MOVEMENT: Run like someone in a dream—leap into leap, barely touching ground. 
      70+ mph on flat ground. From perfect stillness to movement in one instant, no 
      transition. Unsuitable for tight maneuvers or formation cavalry.
      
      BEHAVIOR: Perfectly still except heads tracking you. Make constant clicking 
      sound—when rhythm changes, pay attention. Bond to single riders, resist all 
      others. Follow commands extraordinarily well.
      
      METABOLISM: After hard running, steam with heat. Can survive on grass and grain, 
      but if pushed need meat. Unpredictable when hungry. Will hunt in packs, scavenge, 
      eat battlefield casualties.
      
      VALUE: Well-bred destrier sells for ~200 obols (equivalent to adult slave). 
      A band with 600 destriers exceeds most frontier estates' annual revenue. 
      Breeding programs track lineages across 40 generations.
      
      MILITARY: Shock cavalry charging at 70mph breaks formations through speed and 
      psychological terror. Akama warriors lash themselves to saddles. Only Akama 
      truly understand them—children grow up learning the animals' sudden movements.
    rag_pointer: "The Thousand Kingdoms: Overview, Stories from the Empire"
    related: [Akama, Thousand Kingdoms, Ganat, Bureau of the Creche]
  # ─── end Destrier ───

  # ═══ Dinar ═══
  Dinar:
    category: concept
    short: "Ganati currency unit—used in Republican commerce and subsidy calculations."
    details: |
      Standard currency of the Republic of Ganat. Power subsidies measured in dinars: 
      "The subsidy is 2,847 dinars this month." Distinct from Imperial obol. Merchant 
      kilits publish annual reports documenting collective investment in dinars.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Kilit, Obol]
  # ─── end Dinar ───

  # ═══ Maguey-silk ═══
  Maguey-silk:
    category: concept
    short: "Ganati textile—fibers from agave-like plants beaten and spun into extremely fine thread approaching silk quality."
    details: |
      Light, strong, breathable. Serrulata typically wear maguey-silk skirts, turbans, 
      and shawls. Rasma Dhal-Setil's preference for maguey-silk and gauze announces 
      wealth without ostentation. Ganati textiles command premiums in Imperial cities.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Serrulata]
  # ─── end Maguey-silk ───

  # ═══ Marcher Territories ═══
  Marcher Territories:
    category: location
    short: "Seven frontier territories technically Republican but functionally independent—maintain serf populations, conduct mysterious eastern trade."
    details: |
      The seven marches maintain serf populations without Republican citizenship, 
      pad their Senate votes with pastoralist delegations, and conduct trade with 
      unknown entities beyond the Dead Cities. Lords meet annually at rotating 
      locations. The Far Northeast remains unknown—cities on the Great Lakes are 
      rumor, Atlantic trade network is inference. March of Keth-Amran is one example.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Senate]
    location_features:
      level: territory
      location_type: grouping
      parent: Ganat
      children:
        - March of Keth-Amran
      controlling_entity: Marcher lords
      primary_function: Frontier buffer, eastern trade
      notable_features:
        - Serf populations (citizenship excluded)
        - Annual lord meetings
        - Trade beyond the Dead Cities
      borders:
        west: [Ganat proper]
        east: [Dead Cities, unknown territories]
      real_world_anchor: "Eastern edges of Ganati territory"
    aesthetic_features:
