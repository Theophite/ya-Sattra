  # ═══ Antediluvian Quarter ═══
  Antediluvian Quarter:
    category: location
    short: "Elite district housing Aureate estates on pre-Interdict marvels."
    details: |
      ~48,000 residents: ~3,200 Aureate family members, ~32,000 hereditary servants, 
      ~12,000 commercial workers. Wealth derives from patents maintained through inherited 
      ritual, not knowledge. Self-maintaining infrastructure: porcelain-coral streets that 
      clean themselves, bioluminescent lamp posts fed by hereditary lamp-lighters. Buildings 
      may be the actual patent holders, with families merely their interface.
    rag_pointer: The Antediluvian Quarter
    related: [ya-Sattra, Aureate, Medina Quarter, Rift]
    location_features:
      level: district
      location_type: residential
      parent: ya-Sattra
      children:
        - The Processional
        - Aureate Way
        - Provisional Square
        - Old Cloister
        - Garden of Failures
        - Verification House
        - Calculation Spire
        - es-Korvey Towers
        - es-Durann Complex
        - es-Norren Towers
        - Symbiotic Spires
        - Seven-and-One Meridian Terrace
        - es-Morath Arcology
      controlling_entity: Aureate families
      population: ~48,000
      primary_function: Elite residence, patent infrastructure
      castes_present:
        - Highborn
        - Aureate
        - Near-Baseline (servants)
        - Clone lines (hereditary servants)
      notable_features:
        - Porcelain-coral self-cleaning streets
        - Bioluminescent lamp posts
        - Pre-Interdict arcologies
        - Dawn Market (unofficial)
      borders:
        south: [Rift]
        across_rift: [Medina Quarter]
      real_world_anchor: "Monterey Bay basin (north of Rift)"
    aesthetic_features:
      intention: "We maintain what we were given. The buildings are the patent holders; we are their interface."
      environment: "North of the Rift, elevated slightly. Pre-Interdict arcologies that refused to fall—each one unique, each one incomprehensible in its own way. Self-maintaining infrastructure makes the district cleaner than anywhere else in ya-Sattra."
      construction: "The STREETS are uniform: porcelain-coral that self-repairs, bioluminescent lamp posts fed by hereditary lamp-lighters. The ARCOLOGIES are radically different from each other—invisible cylinders, spiraling spires, living tissue, spectrum-shifting ziggurats, sealed eggs. Each estate is its own mystery."
      visual_vocabulary:
        - "NOT uniform—each arcology is unique technology"
        - "Porcelain-coral streets: the unifying element between radically different structures"
        - "Gaudí meets science fiction: organic forms, but seven different kinds of organic"
        - "Ancient Egypt's temple complexes: hereditary priesthoods maintaining incomprehensible systems"
      materials:
        - "porcelain-coral streets: white, self-cleaning, self-repairing (UNIFORM)"
        - "bioluminescent lamp posts: organic, fed by lamp-lighters (UNIFORM)"
        - "arcology surfaces: EACH DIFFERENT—invisible panels, living coral, light-absorbing stone, spectrum-shifting substrate, pharmaceutical domes, spiral spires"
      colors:
        - "white/cream porcelain-coral streets (uniform between estates)"
        - "soft bioluminescent glow at night (uniform between estates)"
        - "arcologies: NO UNIFORM COLOR—invisible (es-Tsay), fabric-draped (es-Korvey), white domes venting green (es-Durann), lightning-lit (es-Norren), pulsing organic (es-Poel), spectrum-shifting (es-Verlaus), shadow-dark (es-Morath)"
      sensory:
        - "cleaner than elsewhere—streets absorb debris overnight"
        - "bioluminescent light: softer than electric, organic pulse"
        - "quiet—wealth affords insulation"
        - "each arcology has its own sounds: pharmaceutical venting, encryption pulses, biological rhythms, silence from the sealed"
        - "at dawn: street runners positioning for first messages"
      key_elements:
        - "The Processional: main thoroughfare, three kilometers from docks to Old Cloister"
        - "porcelain-coral streets: the ONLY unifying aesthetic between radically different estates"
        - "bioluminescent lamp posts: tended by three hereditary families (Vessori, Torrath, Penneth)"
        - "seven major arcologies, each unique: invisible cylinder, spiral towers, dome complex, semaphore network, living spires, shifting ziggurat, sealed egg"
        - "buildings as patent holders: families as interface, not owners"
  # ─── end Antediluvian Quarter ───

  # ═══ The Processional ═══
  The Processional:
    category: location
    short: "Main thoroughfare running three kilometers from docks to Old Cloister."
    details: |
      Fused ceramic pavement that self-repairs minor damage—absorbs debris overnight 
      through processes no one comprehends. Street runners position themselves along 
      it for first messages of the day. Side streets wind between arcologies following 
      pre-human paths.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Old Cloister]
    location_features:
      level: neighborhood
      location_type: infrastructure
      parent: Antediluvian Quarter
      primary_function: Main thoroughfare
      notable_features:
        - Self-repairing pavement
        - Three kilometer length
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Three kilometers of porcelain-coral pavement—pale cream, slightly luminescent in shadow, warm under sunlight. The surface absorbs debris overnight; spills disappear within hours. Bioluminescent lamp posts every forty feet, tended by the Vessori family. On either side, arcologies rise—but no two alike: invisible cylinders, spiral towers draped in fabric, pharmaceutical domes venting green, living coral spires that pulse. The streets are uniform; the estates are each their own mystery. At dawn, street runners position for first messages. Side streets wind between estates following paths that predate human memory."
  # ─── end The Processional ───

  # ═══ Aureate Way ═══
  Aureate Way:
    category: location
    short: "Narrow commercial corridor between es-Korvey and es-Durann estates."
    details: |
      Barely wide enough for two palanquins to pass. Rents exceed palatial estates 
      elsewhere in ya-Sattra—proximity to patent holders justifies any expense. 
      Fortunes change hands in doorway negotiations.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Korvey, es-Durann]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: High-value commercial corridor
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Barely wide enough for two palanquins to pass—porcelain-coral underfoot, two radically different arcologies pressing close on either side. The es-Korvey spiral towers rise on one side, their fabric-draped surfaces shifting color in the light. The es-Durann pharmaceutical domes sprawl on the other, white surfaces occasionally venting green luminescence. Bioluminescent posts at irregular intervals where the passage widens. Shopfronts wedged into spaces the arcologies allow. Rents here exceed palatial estates elsewhere; proximity to patent-holders justifies any expense."
  # ─── end Aureate Way ───

  # ═══ Provisional Square ═══
  Provisional Square:
    category: location
    short: "Central square hosting the Dawn Market—named for a 'temporary' structure standing 800 years."
    details: |
      Neutral ground between competing estates. Before dawn, hereditary servants 
      gather to trade goods, services, and information their masters never acknowledge. 
      By sunrise the market vanishes without evidence it convened.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Dawn Market, Provisional Committee]
    location_features:
      level: site
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: Neutral ground, Dawn Market venue
      notable_features:
        - 800-year-old "temporary" structure
        - Dawn Market (pre-dawn)
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Open plaza of porcelain-coral, the pale surface faintly luminescent before dawn. The 'temporary' structure—eight hundred years old—anchors one corner: wood and canvas that should have rotted centuries ago, maintained by rituals no one remembers establishing. Bioluminescent posts glow amber as hereditary servants gather for the Dawn Market. By sunrise the market vanishes; the square becomes neutral ground between competing estates, too valuable to any single family to claim."
  # ─── end Provisional Square ───

  # ═══ Old Cloister ═══
  Old Cloister:
    category: location
    short: "Companions Guild headquarters—former Technical Caste facility with disturbing architecture."
    details: |
      At the Processional's end. Architecture bears traces of original builders—proportions 
      wrong for human occupancy. Mutterers can roam here without triggering cascades. 
      Contains Archives with Technical Caste recordings in cylinders no one can play. 
      Morning Song audible to early risers.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Companions Guild, Mutterers, Technical Castes]
    location_features:
      level: site
      location_type: administrative
      parent: Antediluvian Quarter
      controlling_entity: Companions Guild
      primary_function: Companions Guild headquarters
      notable_features:
        - Technical Caste architecture
        - Mutterer-safe zones
        - Technical Caste archives
        - Morning Song
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "At the Processional's end, where porcelain-coral gives way to something older. Technical Caste architecture: proportions wrong for human occupancy, doorways too tall, ceiling heights that vary without reason. NOT the organic-feeling arcology grey—something sterile, clinical, built for bodies that thought differently. Mutterers can roam here without triggering cascades; the walls absorb their vocalizations somehow. The Archives hold cylinders no one can play. At dawn, the Morning Song echoes from somewhere deep inside—mechanical, precise, beautiful, incomprehensible."
  # ─── end Old Cloister ───

  # ═══ Garden of Failures ═══
  Garden of Failures:
    category: location
    short: "Es-Tsay pavilion displaying every inferior computing device ever produced."
    details: |
      Surrounds the es-Tsay cylinder's base. Each device accompanied by sneering 
      testimony of inferiority to standard lectors. Educational in unintended ways—
      visitors trace history of computational attempts: chemical logic gates that 
      corroded, biological processors with unexpected behaviors, mechanical calculators 
      too slow. Curator Evenis has tended it for 37 years.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Tsay, Lector]
    location_features:
      level: site
      location_type: administrative
      parent: Antediluvian Quarter
      controlling_entity: es-Tsay
      primary_function: Humiliation pavilion, computational history
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Surrounds the base of the Calculation Spire—which means surrounding nothing visible. The invisible cylinder's edge marked only by slight light-warping. Porcelain-coral paths wind through displays of failed computation: chemical logic gates green with corrosion, biological processors in sealed jars (some still twitching), mechanical calculators of brass and crystal. Each device accompanied by sneering plaques. Curator Evenis tends it with the care of someone maintaining a permanent insult. Educational despite itself."
  # ─── end Garden of Failures ───

  # ═══ Verification House ═══
  Verification House:
    category: location
    short: "Patent verification services—authenticating Aureate claims and patent documentation."
    details: Opens when es-Tsay authentication activates lectors. Processes patent verifications all day. Clerk Thessan Vor has worked here 27 years, knows which patents are actually used versus maintained for prestige.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, Aureate, es-Tsay]
    location_features:
      level: site
      location_type: commercial
      parent: Antediluvian Quarter
      primary_function: Patent verification
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Functional building amid organic marvels—conventional construction because the business requires accessibility. Opens when es-Tsay authentication activates lectors each morning. Queues form on porcelain-coral pavement outside. Inside: verification desks, stacked patent documentation, lectors humming with computational work. Clerk Thessan Vor at his station for twenty-seven years, knowing which patents matter and which are maintained for prestige alone."
  # ─── end Verification House ───

  # ═══ Calculation Spire ═══
  Calculation Spire:
    category: location
    short: "Es-Tsay estate—700m invisible cylinder displaying the city behind it on failing panels."
    details: |
      The cylinder appears as an architectural void, visible only through slight light-warping 
      at its edges. Ten thousand display panels show the city behind it; many have burnt out, 
      creating dark scars. Sri Pater Irem es-Tsay performs morning authentication from the apex, 
      activating every lector purchased in the previous 24 hours. The Garden of Failures 
      surrounds its base.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Tsay, Garden of Failures, Lector]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Tsay
      primary_function: Computational authentication, residence
      notable_features:
        - Invisible display panels
        - Patent Chamber at apex
        - Analytical engine in bunkers below
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "A perfect cylinder seven hundred meters tall that displays the city behind it—an architectural void visible only through slight light-warping at the edges. Burnt-out panels create dark scars across the illusion. At night, you can see stars through the middle of a building. The Garden of Failures rings its base: failed computational devices displayed with sneering plaques. Inside, 188 family members and 3,600 servants occupy space designed for five thousand. The building knows what the Empire is thinking before it finishes the thought."
  # ─── end Calculation Spire ───

  # ═══ es-Korvey Towers ═══
  es-Korvey Towers:
    category: location
    short: "Three spiral towers wrapped in sample fabrics—textile treatment monopoly made architectural."
    details: |
      Three interconnected spires spiral around each other like frozen smoke. External surfaces 
      draped in sample fabrics that change weekly. At sunset, treated fabric exteriors become 
      translucent screens displaying abstract patterns. Crystal wasps build valuable nests between 
      towers. Mari es-Korvey holds weekly fabric courts in the middle tower's apex.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Korvey, Aureate Way]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Korvey
      primary_function: Textile treatment, residence
      notable_features:
        - Spiral architecture
        - Fabric-draped exteriors
        - Bio-vaults seven stories underground
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Three spires spiral around each other like frozen smoke—organic architecture that seems grown rather than built. External surfaces draped in sample fabrics displaying the monopoly's reach. At sunset, the towers illuminate from within, treated fabric becoming translucent screens showing patterns that might be advertising or art. Crystal wasps build glowing nests between the spires, their constructions worth more than Middens buildings. The bio-vaults seven stories underground, where actual cultivation occurs, are sealed to all but genetic keyholders."
  # ─── end es-Korvey Towers ───

  # ═══ es-Durann Complex ═══
  es-Durann Complex:
    category: location
    short: "Pharmaceutical dome complex sprawling across sixteen blocks—medicine synthesis beyond understanding."
    details: |
      Unlike neighbors' vertical aspirations, the es-Durann estate sprawls horizontally: 
      interconnected domes covering sixteen city blocks. The Treatment Pavilion serves as 
      public face—sterile white surfaces, unnecessary airlocks. At sunset, domes vent 
      pharmaceutical byproducts that smell of bitter almonds and shimmer green.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Durann, Aureate Way]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      controlling_entity: es-Durann
      primary_function: Pharmaceutical synthesis, residence
      notable_features:
        - Horizontal sprawl
        - Treatment Pavilion
        - Pharmaceutical venting at sunset
      real_world_anchor: "Monterey Bay basin (Antediluvian Quarter)"
    local_aesthetic: "Horizontal where neighbors are vertical—interconnected domes sprawling across sixteen blocks. The Treatment Pavilion presents medical authority: sterile white, unnecessary airlocks that hiss impressively, staff in contamination suits serving theatrical purpose. Actual production occurs in automated systems the family monitors but doesn't control. At sunset, the domes vent pharmaceutical byproducts—green luminescence rising like ghosts, the smell of bitter almonds, air that shimmers. Residents know which streets to avoid when wind blows wrong."
  # ─── end es-Durann Complex ───

  # ═══ es-Norren Towers ═══
  es-Norren Towers:
    category: location
    short: "Seventeen semaphore towers connected by bridges of captive lightning—quantum encryption made visible."
    details: |
      Seventeen towers of varying heights connected by bridges at seemingly random intervals. 
      Tower heights create wind vortexes making bridges terrifying to cross. The family hasn't 
      met in person for years—business conducted by written messages via Springheels. At sunset, 
      bridges light with encryption traffic worth hundreds of obols per pulse.
    rag_pointer: The Antediluvian Quarter
    related: [Antediluvian Quarter, es-Norren]
    location_features:
      level: site
      location_type: residential
      parent: Antediluvian Quarter
      children:
