      notable_features:
        - Mountainside barracks
        - Permanent garrison
      real_world_anchor: "Eastern Sierra foothills (Toh, northern edge)"
    local_aesthetic: "Military display without military purpose. Barracks constructed into the mountainside on Toh's northern edge—granite construction, utilitarian, housing 800 Warborn who have nothing to do. They cannot fight the Republic (relations too valuable), cannot patrol wilderness (Republic territory or unclaimed waste), cannot deploy elsewhere (assigned to Toh). They train, maintain equipment, drink heavily (accelerated Warborn metabolism makes alcohol tolerance extreme), and cause manageable trouble in town. Relations with Toh are complicated: soldiers provide security and emergency muscle, but also terrify near-baseline residents, damage property drunk, occasionally assault civilians (handled internally with minimal accountability). Vice operators view them as large, predictable customers with high tolerance and combat trauma to process."
  # ─── end Garrison District ───

  # ═══ The Mountain Faces ═══
  The Mountain Faces:
    category: location
    short: "Three peaks with 400-foot Highborn faces carved into summits—gazing toward pass, valley, south."
    details: |
      Three peaks surrounding Toh have summits carved into enormous stylized Highborn faces—
      angular features, stern expressions, each at least 400 feet from chin to crown. Carving 
      precision is inhuman; scholars debate whether created by early Highborn ancestors, 
      advanced automated systems, or the Oracles themselves. The faces show no weathering 
      despite obvious age. They gaze toward the pass, toward the valley, and toward the south 
      (the holographic meadow). And above it all, watching—always watching.
    rag_pointer: Index
    related: [Toh, Antediluvian, Highborn]
    location_features:
      level: site
      location_type: monument
      parent: Toh
      primary_function: Unknown (observation? warning? decoration?)
      notable_features:
        - 400-foot carved faces
        - Inhuman precision
        - No weathering
      real_world_anchor: "Eastern Sierra foothills (peaks surrounding Toh)"
    local_aesthetic: "Inhuman precision on geological scale. Three peaks with summits carved into Highborn faces—angular features, stern expressions, 400 feet from chin to crown. The carving precision exceeds any known technique: scholars debate early Highborn ancestors, advanced automated systems, the Oracles themselves. The faces show no weathering despite being exposed for tens of thousands of years. They gaze in three directions: toward the pass (watching who arrives), toward the valley (watching the town), toward the south (watching the holographic meadow). The mountain faces predate any meaningful records by millennia. Whatever they represent, whoever carved them, why they've endured—nobody knows. Walking through Toh in late October, looking up at those faces watching you, wondering if they're seeing what ancient peoples saw."
  # ─── end The Mountain Faces ───

  # ═══ Holographic Meadow ═══
  Holographic Meadow:
    category: location
    short: "Twelve dancing figures at sunset and dawn—47-minute sequence, emitters 200 feet deep in bedrock."
    details: |
      Two miles south of Toh, in a flat meadow suitable for gatherings. Holographic projectors 
      buried in bedrock create twelve dancing figures in elaborate costumes performing what 
      might be ritual dances, theatrical performances, or abstract movement. Holograms appear 
      at sunset and dawn, run 47-minute sequence, then fade. The Rod has excavated repeatedly 
      trying to access projectors or determine power source—embedded in solid granite more 
      than 200 feet down. The holograms have operated without interruption for as long as 
      anyone has records.
    rag_pointer: Index
    related: [Toh, Antediluvian, Bureau of the Rod]
    location_features:
      level: site
      location_type: monument
      parent: Toh
      primary_function: Unknown (entertainment? ritual? art?)
      notable_features:
        - Holographic dancers
        - 47-minute sequence
        - Emitters 200+ feet deep
      real_world_anchor: "Eastern Sierra foothills (2 miles south of Toh)"
    local_aesthetic: "Eternal performance for no audience. Flat meadow two miles south of town—suitable for gatherings, perhaps designed for gatherings. At sunset and dawn, holographic projectors create twelve figures in elaborate costumes, performing dances (or rituals, or abstract movement—nobody knows). The sequence runs 47 minutes, then fades. The Rod has excavated repeatedly trying to access projectors or power source: embedded in solid granite more than 200 feet down, beyond any excavation attempt. The holograms have operated without interruption for as long as anyone has records. The figures don't look like any caste—idealized, averaged, perhaps what humanity looked like before modifications, or what Antediluvians wanted humanity to look like. They're still dancing. For an audience that doesn't exist anymore. In a meadow that used to be something else."
  # ─── end Holographic Meadow ───

