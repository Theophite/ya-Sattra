      notable_features:
        - 200-foot tower
        - Sub-audible hum
        - Rod communications added
      real_world_anchor: "Eastern Sierra foothills (Toh)"
    local_aesthetic: "Ancient communications still humming. Tower 200 feet above the valley floor, bronze-colored metal, topped with shapes that might be antennae or might be decoration. The structure hums constantly at a frequency just below audible range—you feel it more than hear it, a pressure in your chest that never quite resolves. The Rod has installed their own communications equipment around and within it, treating the Antediluvian structure as scaffolding for modern systems while the original function remains unknown. Some scholars: part of planet-wide network. Others: communication with orbital facilities. A few: religious architecture, no functional purpose. The humming continues either way. The Rod records show it's never stopped, never varied, never responded to any stimulus they've tried."
