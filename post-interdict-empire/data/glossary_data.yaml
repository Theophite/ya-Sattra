  # ═══ Ganat proper ═══
  Ganat proper:
    category: location
    short: The dam-city that gives the Republic its name.
    details: |
      500,000 inhabitants in Glen Canyon on the Teph River. Cities carved INTO cliff faces—
      space created by subtraction, not addition. The Dam provides power too cheap to meter; 
      working-class warrens honeycomb the rock around it. Near Wall hosts markets and 
      residences. Far Wall hosts government—Senate chamber, ministry warrens, the Cathedral 
      atop it all. The city never sleeps because power is free and stopping costs opportunity.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat, Taho]
    location_features:
      level: city
      location_type: settlement
      parent: Ganat
      children:
        - The Dam
        - Near Wall
        - Far Wall
        - Lake Ganat
        - Tyrant's Walk
      aliases:
        - Ganat City
        - Glen Canyon
      population: ~500,000
      primary_function: Political capital
      castes_present:
        - Serrulata
        - Near-Baseline
        - Hereditary Debtors
      notable_features:
        - Carved sandstone architecture
        - Perpetual electric lighting
        - Revolutionary aesthetics
        - Underground warrens
      borders:
        west: [Taho]
        east: [High Junction]
      real_world_anchor: "Glen Canyon, Colorado River"
    aesthetic_features:
      intention: "The Republic made this. See who did what. WE did this—specific kilit, named, identifiable."
      environment: "500-foot salmon-colored Navajo sandstone canyon. Cross-bedding visible—diagonal lines from ancient desert dunes, winds that blew before humans. River at bottom moderates temperature. Canyon creates shade and breeze. Summer 10-15° cooler than surrounding desert; winter sheltered from wind."
      construction: |
        The canyon walls are carved. This is the first thing visitors see: 500 feet of salmon sandstone covered 
        in Art Nouveau figurative sculpture at monumental scale. Figures 20-25 feet tall stand in relief 2-3 feet 
        from the wall—thousands of them, covering both canyon faces, robes flowing rather than hanging straight, 
        hair like flames or water, faces individualized. Each carving signed by its maker, kilit territory visible 
        in style differences. The effect is Angkor Wat meets Gaudí's Sagrada Familia: figurative density in organic 
        flowing curves covering an entire canyon.
        
        Behind the carved facades: Cappadocian-scale underground cities honeycomb the rock. Warrens extend hundreds 
        of meters into sandstone, ventilation shafts rising to surface, multi-level chambers connected by Guggenheim-
        style spiral ramps. Space created by subtraction—you carve to build, you remove to make room.
        
        Threading through it all: Antediluvian infrastructure predating the carving. The Dam anchors the complex, 
        but grey conduits run through bedrock throughout the canyon, chambers of unknown purpose occasionally 
        intersected by new excavation. Workers build around what they find; nobody damages what still functions.
        
        At the canyon rim: 1890s Southwest territorial architecture caps the carved sandstone—flat-roofed adobe 
        with parapeted edges, vigas protruding, earthship thermal mass logic. Where surface meets underground, 
        two building traditions meet. Early electrification runs everywhere: exposed copper wiring on ceramic 
        insulators, carbon-filament bulbs in pressed-glass fixtures, transformer boxes humming, the aesthetic 
        of power made visible throughout a city that never sleeps because power is free.
      visual_vocabulary:
        - "Petra: Treasury and Monastery carved into canyon walls, cities approached through narrow canyons opening into carved grandeur"
        - "Cappadocia/Derinkuyu: Underground cities for climate control—but Ganat's scale is monumental, warrens extending hundreds of meters into rock, ventilation shafts rising to surface, multi-level chambers connected by spiral ramps"
        - "Gaudí's Sagrada Familia: Art Nouveau facades covering entire canyon walls—20-25 foot figures in organic flowing curves, robes flowing not hanging, hair like flames or water"
        - "Angkor Wat/Khajuraho: Figurative density—thousands of carved figures in relief 2-3 feet from the wall"
        - "Art Nouveau guild emphasis: Each piece identifiable by maker, craft integrated with art, Guimard Metro entrances and Gaudi tiles"
        - "1890s Southwest Territorial: Flat-roofed adobe on canyon rim, vigas (log beams) protruding, parapeted edges, Santa Fe organic curves meeting carved sandstone"
        - "Pueblo/Mesa Verde: Cliff dwellings integrated into rock faces, communal labor visible in construction"
        - "Earthship logic: Thermal mass construction, earth-bermed dwellings, buildings breathing with temperature cycles, organic curves following natural contours"
        - "Guggenheim spiral: Continuous ramp access between levels, flowing rather than stepped, the spiral as both circulation and architecture"
        - "Early electrification aesthetic: Exposed wiring on ceramic insulators, glass-and-brass fixtures, transformer boxes at junctions, the infrastructure of power made visible and beautiful"
        - "Antediluvian mystery: Grey material harder than granite threading through the sandstone—conduits, chambers, infrastructure that predates carving and still functions"
      materials:
        - "salmon Navajo sandstone: soft enough to carve with hand tools, durable once carved, beautiful in smooth curves and flowing organic forms"
        - "desert varnish: iron and manganese oxide streaks from water seepage, dark lines running down weathered walls like permanent rain"
        - "stained glass: wealthy cave-homes with vast panels lit from behind, glowing both day and night"
        - "copper cladding: verdigris green against warm sandstone, organic doorway frames in Art Nouveau curves"
        - "adobe on canyon rim: sun-dried brick, plastered smooth, ochre-cream color complementing sandstone below"
        - "vigas: log beams protruding through adobe walls, canales (drain spouts) channeling rare rain"
        - "the Dam itself: grey Antediluvian material harder than granite, smooth to the touch, impervious to weathering—NOT sandstone"
        - "Antediluvian conduits in warrens: same grey material appearing in tunnel walls, sometimes carrying unknown substances, sometimes humming with power"
        - "early electrical hardware: ceramic insulators, copper wiring with cloth insulation, pressed-glass globes, brass fittings green with age"
      colors:
        - "salmon and cream sandstone (dominant—horizontal layers of red, rust-orange, cream, tan)"
        - "perpetual electric light against orange rock at night—amber carbon-filament glow"
        - "teal from copper compounds (expensive, semi-permanent, kilit marker)"
        - "rust-orange from iron oxide (cheap, common, territorial marker)"
        - "stained glass glowing from wealthy cave-homes—blues, greens, golds"
        - "verdigris copper cladding against warm stone"
        - "adobe ochre-cream on canyon rim"
        - "grey Antediluvian material threading through warm sandstone"
      sensory:
        - "river sound constant at lower levels"
        - "perpetual electric hum—turbines never stop, transformers buzz at junctions"
        - "canyon echoes—voices carry, layer, create cacophony in the warrens"
        - "the smell: hot metal, chemicals, sawdust, human sweat, machine oil, ozone from electrical equipment"
        - "dramatic temperature shift between sun and shade, between surface and deep warrens"
        - "hookah dens and drinking clubs: tobacco smoke, cannabis haze, political argument echoing off carved sandstone"
        - "the slight vibration near Antediluvian conduits—something running through them still"
        - "carbon-filament bulb flicker in older installations"
        - "wheatpaste posters layering every flat surface near tunnel junctions—kilit recruitment, political rallies, work opportunities, the walls a palimpsest of community needs"
      key_elements:
        - "carved canyon walls: THE defining feature—500 feet of salmon sandstone covered in Art Nouveau figurative sculpture, thousands of 20-25 foot figures in flowing curves, each signed by its carver, kilit territories visible in style"
        - "the Dam: grey Antediluvian material, turbines that never stop, power too cheap to meter—the city's heart and mystery"
        - "revolutionary palimpsest: Sultana Ulayah receiving tribute re-carved as collective assemblies, new imagery 2-3 inches deeper than monarchical scenes, the original forms faintly visible underneath"
        - "working-class warrens: Cappadocian scale—tunnels branching through sandstone, chambers carved every 20 feet, electric bulbs every 10 feet, spiral ramps connecting levels, ventilation shafts rising to surface"
        - "Antediluvian conduits: grey material threading through warren walls, predating the carving, some still carrying power or unknown substances, rooms built around infrastructure nobody understands"
        - "stained glass cave-homes: wealthy residences with massive panels visible from across the canyon, glowing day and night"
        - "canyon-rim adobe: 1890s Territorial style buildings capping the sandstone, vigas and parapets, where surface construction meets underground city"
        - "Senate Chamber: 80-foot circular room carved from sandstone, tiered seating, revolutionary reliefs covering the walls"
        - "early electrical infrastructure: exposed wiring as decoration, transformer stations as landmarks, the visible machinery of free power"
        - "Guggenheim spirals: continuous ramp access threading through the warrens, organic flow rather than discrete stairs"
        - "perpetual illumination: the city never sleeps because power is free, streets and tunnels and warrens lit continuously"
  # ─── end Ganat proper ───

