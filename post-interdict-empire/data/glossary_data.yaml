    details: |
      Warborn clones require amino supplements to survive. Bureau of the Sword depends 
      on Creche for these supplements, creating perpetual jurisdiction dispute. Creche 
      officials speak of duty and mutual obligation while maintaining dependencies that 
      make clones biologically incapable of independence. Semeion-9 variant requires 
