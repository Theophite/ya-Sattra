  # ═══ Institute of the Lattice ═══
  Institute of the Lattice:
    category: organization
    short: "Lens subdivision maintaining cryptographic infrastructure—mathematicians approaching understanding of the Jargon."
    details: |
      Accepts perhaps a dozen applicants annually who vanish into Archive depths. 
      Consists entirely of mathematicians riding the edge of Eighth Oracle heresy. 
      93% attended ya-Tsatsa's Threefold Mirror Academy—graduates cannot reveal what 
      they learned even under Compulsion. Three systems: Monk (detects contradiction), 
