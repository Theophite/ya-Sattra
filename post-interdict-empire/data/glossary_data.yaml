  # ═══ Ridge ═══
  Ridge:
    category: location
    short: "Elevated district occupying a collapsed arcology—the Rotten Quarter's respectable tier."
    details: |
      ~1,200 residents. The Ninth Horizon Terrace fell ON ITS SIDE in antiquity—what was 
      a 100-meter-wide arcology is now a 100-meter-high ridge. Three infrastructure families 
      (Val, Marzen, Galen) control water, power, and information. ~90 workshops recondition 
