      visible doors. Smooth grey substrate absorbs light, appearing as shadow even at noon. 
      Pipes carry atmospheric mixtures in and waste out. The arcology hasn't opened to outside 
      air in four hundred years. The es-Morath have modified themselves to embody their patent; 
      their bodies produce neural preservation enzymes. They cannot survive outside.
