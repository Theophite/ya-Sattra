  # ═══ Rotten Quarter ═══
  Rotten Quarter:
    category: location
    short: "Colloquial name for ya-Sattra's poor industrial districts."
    details: Informal grouping encompassing Iron Yards, Middens, and Ridge. Not a formal administrative unit.
    rag_pointer: The Iron Yards, The Hanged Men
    related: [Iron Yards, Middens, Ridge]
    location_features:
      level: district
      location_type: grouping
      parent: ya-Sattra
      children:
        - Iron Yards
        - Middens
        - Ridge
      primary_function: Industrial and poor residential
      borders:
        northeast: [Medina Quarter]
        across_rift: [Antediluvian Quarter]
      real_world_anchor: "Monterey Bay basin (southwest)"
    aesthetic_features:
      intention: "We do the work that costs bodies. We live where the city throws its wreckage. We make do."
      environment: "The collapsed arcologies define the geography: the Ninth Horizon Terrace fallen sideways to become the Ridge, its fall creating the quarried depression of the Iron Yards, the Middens built on flooded foundations jutting into the Rift. The view is always UP—toward the Inner City's bronze towers, the Medina's respectable bustle, the Antediluvian Quarter across the water. They can see what they're excluded from."
      construction: "Nothing is new. Everything is salvage, repurposed, improvised. Thesad from collapsed arcologies becomes building material. Conventional construction fills gaps. The Hanged Men and Salvage Guild exercise more practical authority than Imperial Bureaux. Work happens in conditions that destroy bodies over years or decades."
      visual_vocabulary:
        - "Shipbreaking yards: massive things reduced to component parts, value extracted from wreckage"
        - "Favela stacking (Middens): vertical density, improvised construction, flooding at lower levels"
        - "Quarry towns (Iron Yards): the land itself extracted, terraced depression filled with industry"
        - "Rotated arcology (Ridge): structure fallen on its side, floors become walls, interior becomes exterior"
        - "Gradients within poverty: Ridge craftspeople are NOT Iron Yards laborers are NOT Middens poor"
      materials:
        - "salvaged thesad (from collapsed arcologies—still self-repairing, incongruously pristine)"
        - "salvaged conventional metals (rust, patina, chemical staining)"
        - "improvised construction (whatever works)"
        - "exposed bedrock (Iron Yards quarried terraces)"
        - "flooded foundations (Middens—water permeates everything)"
      colors:
        - "rust (dominant in Iron Yards)"
        - "grey bedrock and grey water"
        - "bronze thesad where it appears (incongruous quality)"
        - "torchlight orange at night"
        - "chemical staining in processing areas"
        - "cleaner toward Ridge, dirtier toward Middens depths"
      sensory:
        - "industrial noise: hammering, cutting, grinding (Iron Yards)"
        - "water everywhere: lapping at foundations, flooding basements (Middens)"
        - "the smell gradient: hot metal and chemicals (Yards), damp and rot (Middens), cleaner air (Ridge)"
        - "the constant presence of labor that costs bodies"
        - "criminal governance more tangible than Imperial authority"
      key_elements:
        - "Iron Yards: salvage processing, Salvage Guild, Pipefitters Union, Yen Tam"
        - "Middens: flooded tenements, Hanged Men, sewer-fisher clans, the Rift's edge"
        - "Ridge: tilted arcology, infrastructure families, archaeotech workshops, respectability within poverty"
        - "the view UP toward what they're excluded from"
        - "gradients of desperation: each district looks down on the one below"
