  # ═══ Toh ═══
  Toh:
    category: location
    short: "Imperial border resort built among Antediluvian mysteries—8,000 permanent, swelling to 24,000."
    details: |
      Gateway where Imperial authority meets Ganati commerce, 8,000 permanent inhabitants swelling 
      to 24,000 in peak seasons. Sits at 6,200 feet in a valley bowl on the western approach to 
      Taho Pass, granite peaks rising 2,000-3,000 feet on three sides. The lake is visible from 
      higher elevations but not from the valley floor—building anticipation for those heading 
      east. The settlement occupies what was clearly significant tens of thousands of years ago: 
      bronze-colored metal structures converted into hotels, mountain peaks carved into 400-foot 
      Highborn faces, holographic dancers performing eternally in a meadow two miles south. 
      Bureau of the Rod maintains largest installation outside the Inner City. 800 Warborn 
      garrison in permanent boredom. Bureau of the Lens operates as customs inspectors.
    rag_pointer: Index, Stories from the Empire, Ganat and the Yarangar War
    related: [Undying Empire, Taho Pass, Taho, Ganat, Bureau of the Lens, Bureau of the Rod]
    location_features:
      level: city
      location_type: settlement
      parent: Undying Empire
      children:
        - Customs Quarter
        - Hotel District
        - Entertainment Quarter
        - Garrison District
        - The Mountain Faces
        - Holographic Meadow
        - Communications Array
      population: "8,000 permanent; 24,000 peak (late fall)"
      primary_function: Border crossing, Antediluvian tourism, trade gateway
      castes_present:
        - Near-Baseline
        - Serrulata
        - Warborn
        - Akama
      notable_features:
        - Antediluvian bronze-metal hotels
        - Carved mountain faces (400 feet)
        - Holographic dancers
        - Bureau of the Rod installation
        - 800 Warborn garrison
      borders:
        east: [Taho Pass]
        north: [Thousand Kingdoms]
        west: [ya-Sattra]
      real_world_anchor: "Eastern Sierra foothills (west of Donner Pass, Imperial side)"
    aesthetic_features:
      intention: "Antediluvian mystery layered with Imperial bureaucracy. The town is built IN ruins, not near them—among artifacts tens of thousands of years old whose purposes remain inscrutable. But the aesthetic is DIFFERENT from standard Antediluvian—softer, more organic, flowing rather than geometric. An art deco hotel rendered by Salvador Dali for Dwell magazine. This was... a resort? A curated aesthetic experience? For the Antediluvians themselves?"
      environment: "Valley bowl at 6,200 feet, granite peaks on three sides. The lake visible from heights but not from valley floor. Winter: 10-15 feet snow, below 0°F, pass impassable. Summer: 60-75°F days, Aureate tourists escaping coastal heat. Radical population swings dominate everything."
      construction: "Seventeen major Antediluvian structures in bronze-colored metal—but SOFT, FLOWING, ORGANIC. Unlike the cold geometric precision of the Inner City, these structures have curves that suggest growth rather than construction. Furniture grown from walls like biological extrusion. Pods connected by passages that expand and contract with temperature like breathing. The softness is MORE unsettling, not less. This wasn't infrastructure. This was pleasure, leisure, experience—and nobody knows for whom or why."
      visual_vocabulary:
        - "Soft Antediluvian: flowing bronze curves, organic forms, furniture grown from walls—Dali surrealism meets art deco elegance"
        - "Carved mountain faces: three peaks with 400-foot Highborn faces, angular features, stern expressions, no weathering despite obvious age"
        - "Holographic dancers: twelve figures in elaborate costumes performing 47-minute sequences at sunset and dawn—theatrical? ritual? recreational?"
        - "Memorial plaques: ancient bronze dedicating everything to particular Aureate names—but not tombs, and depicting different castes, different persons"
        - "Strange artifacts everywhere: small objects scattered throughout, functional status unknown, gathered by Rod crews, catalogued, never understood"
        - "Imperial granite overlay: customs houses, garrison barracks, newer hotels—functional architecture built among incomprehensible mysteries"
      materials:
        - "bronze-colored Antediluvian metal: warm to touch, organic curves, cannot be worked with Imperial tools"
        - "integrated furniture: sleeping platforms, storage, seating appearing grown from walls like biological extrusion"
        - "grey granite: Imperial construction, the only material people can actually work"
        - "scattered artifacts: palm-sized objects, covered in markings nobody can read, some still powered"
      colors:
        - "bronze metal (Antediluvian structures—warm, slightly luminous, almost alive-looking)"
        - "grey granite (Imperial construction)"
        - "holographic dancers: pre-modification human ideals rendered in light"
        - "Imperial bronze markers (Bureau seals, authentication stamps)"
      sensory:
        - "the constant hum: micro-reactors powering systems nobody understands, just below audible threshold"
        - "bronze structures warm in winter, cool in summer—breathing with the seasons"
        - "the wrongness of soft curves: Antediluvian is supposed to be geometric, precise, cold—this is SOFT, and that's worse"
        - "holographic dancers at sunset/dawn—47 minutes of performance for audiences that will never understand"
        - "the mountain faces watching—always watching—and the unsettling thought that they're watching ENTERTAINMENT"
        - "artifacts scattered everywhere: pick one up, feel the warmth, see the markings, understand nothing"
      key_elements:
        - "memorial purpose: ancient plaques dedicate facilities to Aureate names—but different castes depicted, different persons, not tombs but... what?"
        - "transient atmosphere: most people passing through, waiting, temporarily present—normal Imperial hierarchies relax"
        - "seasonal rhythms: winter isolation (6,000), spring chaos (15,000-18,000), summer leisure (12,000-15,000), fall rush (24,000)"
        - "the Rod's official position: this has been an attraction for visitors extending 30,000-40,000 years into prehistory"
        - "the curated horror: realizing the Antediluvians built a RESORT, that the dancers were ENTERTAINMENT, that this was LEISURE—and we don't know for whom"
        - "smuggling economy: ya-Sattran Aureate fraud networks and Tsatsan vice operators compete for control"
  # ─── end Toh ───

  # ═══ Customs Quarter ═══
  Customs Quarter:
    category: location
    short: "Where the Rod/Coin customs house dominates eastern Toh—200x300 feet, three stories, twelve inspection bays."
    details: |
      Rod/Coin customs house: 200x300 feet, granite walls with slate roofing, built 600 years 
      ago and renovated extensively. Ground floor: twelve inspection bays handling 4-6 caravans 
      simultaneously, secure storage, holding cells. Second floor: administrative offices, visa 
      processing (2-4 days routine, longer for complications), document authentication. Third 
      floor: Lens operations under cover of Rod administration. During peak season, three 
      8-hour shifts process caravans continuously.
    rag_pointer: Index
    related: [Toh, Bureau of the Rod, Bureau of the Coin, Bureau of the Lens]
    location_features:
      level: district
      location_type: administrative
      parent: Toh
      primary_function: Customs, inspection, visa processing
      notable_features:
        - Twelve inspection bays
        - Three-story granite building
        - Continuous peak-season operation
      real_world_anchor: "Eastern Sierra foothills (Toh, eastern edge)"
    local_aesthetic: "Imperial bureaucracy at industrial scale. Granite customs house 200x300 feet, three stories, dominating Toh's eastern edge where the pass road enters the valley. Twelve inspection bays for caravans, secure storage for impounded goods, holding cells for travelers with visa problems. The architecture expresses hierarchy: officials elevated above merchants, inspection galleries overlooking processing areas below. During peak season the building operates continuously—three shifts processing caravans, emergency staffing, priority queues for those paying premium fees (or bribing effectively). The extended quarter includes warehouses where goods wait for clearance, corrals for destriers, temporary camping for caravans that can't afford hotels, and a thriving informal market where travelers sell items to avoid tariff assessment."
  # ─── end Customs Quarter ───

  # ═══ Hotel District ═══
  Hotel District:
    category: location
    short: "Seventeen major hotels—ten in Antediluvian bronze structures, seven in Imperial granite."
    details: |
      The core of Toh's legitimate economy. Ten hotels use Antediluvian bronze structures 
      (the Palace Hotel in the Grand Terrace, three operators dividing the Sunset Complex), 
      seven in Imperial construction. Plus forty smaller inns, boarding houses, private rooms 
      during peak season. The bronze structures have environmental controls that still function 
      through unknown mechanisms—warm in winter, cool in summer. Rooms in the Palace book 
      months in advance for summer Aureates.
    rag_pointer: Index
    related: [Toh, Palace Hotel, Sunset Complex]
    location_features:
      level: district
      location_type: commercial
      parent: Toh
      children:
        - Palace Hotel
        - Sunset Complex
      primary_function: Tourist accommodation
      notable_features:
        - Antediluvian bronze structures
        - Functioning environmental controls
      real_world_anchor: "Eastern Sierra foothills (Toh)"
    local_aesthetic: "Antediluvian mystery made comfortable. Bronze-colored metal structures converted into hotels—the material warm to touch, excellent thermal properties, environmental controls still functioning through mechanisms nobody understands. The Palace Hotel (Grand Terrace) offers 120 rooms with integrated furniture grown from walls, sleeping platforms, storage recesses. Individual rooms maintain original environmental controls; Imperial furniture and decoration have been added but rooms retain that Antediluvian quality—proportions slightly wrong for human comfort, corners that don't quite meet at right angles, lighting from no visible source. Imperial Standard Hotels (seven granite buildings, 200-400 rooms each) serve bulk commercial traffic—basic but functional, rates tripling during fall rush. Managers know which rooms to give which guests, when to be absent during conversations."
  # ─── end Hotel District ───

  # ═══ Palace Hotel ═══
  Palace Hotel:
    category: location
    short: "The Grand Terrace converted—120 rooms, Antediluvian environmental controls, Aureate clientele."
    details: |
      Most prestigious accommodation in Toh. Four-story Antediluvian structure built into 
      mountainside, 300 feet long, 80 feet deep. Rooms have integrated furniture grown from 
      walls—sleeping platforms, storage, seating. Environmental controls (temperature, lighting, 
      air quality) function through unknown mechanisms. Imperial amenities added over centuries. 
      Some wings too deteriorated, dangerous, or strange to access. Fifty permanent staff.
    rag_pointer: Index
    related: [Toh, Hotel District, Antediluvian]
    location_features:
      level: site
      location_type: commercial
      parent: Hotel District
      primary_function: Luxury accommodation
      notable_features:
        - Antediluvian construction
        - Functioning environmental controls
        - Integrated furniture
      real_world_anchor: "Eastern Sierra foothills (Toh)"
    local_aesthetic: "Authentic Antediluvian architecture with modern amenities. Four stories built into mountainside, hundreds of individual rooms opening onto long corridors overlooking the valley. The rooms retain that Antediluvian quality: proportions slightly wrong for human comfort, corners not quite meeting at right angles, lighting from no visible source. Integrated furniture appears grown from walls—sleeping platforms at heights that feel wrong, storage recesses that don't quite fit human possessions, seating that accommodates but doesn't welcome. Most rooms retain functioning environmental controls through mechanisms nobody understands. The Palace caters to summer Aureates wanting to experience authenticity while maintaining comfort. Some wings closed—too deteriorated, too dangerous, too strange. Nobody talks about what's in the closed wings."
  # ─── end Palace Hotel ───

  # ═══ Sunset Complex ═══
  Sunset Complex:
    category: location
    short: "Sprawling compound of interconnected pods—three operators competing, boundaries disputed."
    details: |
      Antediluvian compound of interconnected pods, each 40-60 feet in diameter, arranged 
      without obvious pattern across a hillside. Some pods designed for habitation, others 
      for gathering, others for unknown functions. Connections expand and contract slightly 
      with temperature, maintaining perfect seals. Three different operators through complicated 
      lease arrangements the Rod refuses to adjudicate—each claims superiority, guests wander 
      between sections causing friction.
    rag_pointer: Index
    related: [Toh, Hotel District, Antediluvian]
    location_features:
      level: site
      location_type: commercial
      parent: Hotel District
      primary_function: Mid-tier accommodation
      notable_features:
        - Interconnected Antediluvian pods
        - Disputed ownership
        - Expanding/contracting connections
      real_world_anchor: "Eastern Sierra foothills (Toh)"
    local_aesthetic: "Antediluvian organic architecture divided by Imperial bureaucracy. Interconnected pods 40-60 feet in diameter, arranged without obvious pattern—some for habitation, some for gathering, some for functions nobody can determine. The connections between pods expand and contract with temperature, maintaining perfect seals through mechanisms that shouldn't work. Three operators divide the complex through lease arrangements nobody fully understands, each claiming their section superior. Guests sometimes wander between sections, causing friction about service. More affordable than the Palace, targeting merchant families and middle-tier functionaries. The divided ownership creates competition but also confusion—who maintains which corridor? Who's responsible when systems malfunction?"
  # ─── end Sunset Complex ───

  # ═══ Entertainment Quarter ═══
  Entertainment Quarter:
    category: location
    short: "Western valley—theaters, museums, restaurants, vice operations keeping visitors entertained."
    details: |
      Toh's economy depends on entertaining people waiting days or weeks for visa processing. 
      Three major theaters (one in Antediluvian pavilion with perfect acoustics). Five archaeotech 
      exhibitions displaying objects of unknown purpose. Forty-plus restaurants at every price 
      point. The Vice Quarter: eight major brothels (Tsatsan-operated), twelve gambling houses, 
      cannabis vendors. Protection paid to both Tsatsan and ya-Sattran Aureate networks.
    rag_pointer: Index
    related: [Toh]
    location_features:
      level: district
      location_type: commercial
      parent: Toh
      primary_function: Entertainment, vice
      notable_features:
        - Antediluvian pavilion theater
        - Archaeotech exhibitions
        - Tolerated vice operations
      real_world_anchor: "Eastern Sierra foothills (Toh, western valley)"
    local_aesthetic: "Entertainment for the transient. Three major theaters—one in an Antediluvian pavilion with perfect acoustics, two in Imperial construction. Programming mixes Imperial traditional (for summer Aureates), Republican musical styles (for waiting merchants), deliberately weird experimental work (for anyone bored enough). Five private museums display Antediluvian objects of unknown purpose, compete fiercely with elaborate stories that may or may not have any scholarly basis. Forty-plus restaurants at every price point—the culinary scene is eclectic because nobody eats here every night for years. The Vice Quarter: technically illegal, practically tolerated. Eight major brothels (Tsatsan-operated), twelve gambling houses, cannabis vendors (illegal but barely enforced). Protection paid to both criminal networks—Tsatsans run operations, ya-Sattran Aureates ensure Lens agents don't enforce too vigorously."
  # ─── end Entertainment Quarter ───

  # ═══ Garrison District ═══
  Garrison District:
    category: location
    short: "800 Warborn in permanent boredom—barracks built into northern mountainside."
    details: |
      Bureau of the Sword maintains 800 Warborn: large because Toh sits next to the Republic, 
      small because relations are tense but never violent. Primary function is display—showing 
      the Republic the Empire takes the border seriously. The Warborn are intensely bored: 
      cannot fight the Republic (too valuable), cannot patrol wilderness (Republic territory), 
      cannot deploy elsewhere (assigned to Toh). They spend time training, maintaining equipment, 
      drinking heavily, causing manageable trouble in town.
    rag_pointer: Index
    related: [Toh, Bureau of the Sword, Warborn]
    location_features:
      level: district
      location_type: military
      parent: Toh
      controlling_entity: Bureau of the Sword
      population: 800 Warborn
      primary_function: Military display, emergency response
      castes_present:
