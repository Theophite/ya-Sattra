    local_aesthetic: "Modest adobe building in Old Town's residential core—nothing like the Frontier Veterans' converted warehouse. Meeting room with worn wooden benches, a small bar serving pulque and lighting hookahs for prospective members. No revolutionary banners or martyr portraits; just practical notices about land grants, equipment loans, mutual aid funds. Older veterans gather here, men and women who've already established homesteads and want benefits without aggressive expansion. The atmosphere is social club rather than political cell. When young soldiers near discharge, touts from all the halls compete—but Eastern Range offers conversation rather than ideology."
  # ─── end Eastern Range Cooperative ───

