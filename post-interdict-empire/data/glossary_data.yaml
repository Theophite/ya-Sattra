        - Near-Baseline
        - Sewer-Fishers
        - Various labor castes
      hazards:
        - Flooding
        - Criminal violence
      borders:
        east: [Iron Yards]
        south: [Ridge]
        north: [Rift]
        west: [Rift]
      real_world_anchor: "Monterey Bay basin (Rotten Quarter, harbor-adjacent)"
    aesthetic_features:
      intention: "Survival in the gaps. The Hanged Men provide what the Empire doesn't."
      environment: "Seven tenements rising from partially flooded foundations. Harbor-adjacent—Rift waters lap at lower levels. Vertical slum with external catwalks, improvised bridges, rope ladders between buildings."
      construction: "Pre-Interdict tenement cores adapted beyond recognition. External additions in scrap and salvage. Catwalks connecting buildings. Vertical density—every surface used. Water management is power (Lockworks controls distribution)."
      visual_vocabulary:
        - "Kowloon Walled City: vertical density, improvised connections, organic growth"
        - "Favela stacking: additions upon additions, no master plan"
        - "Industrial waterfront slum: flooded foundations, structures rising from decay"
      materials:
        - "rust-stained metal (dominant)"
        - "salvaged materials from Iron Yards"
        - "rope, canvas, improvised construction"
        - "ancient pre-Interdict cores beneath adaptations"
      colors:
        - "rust (dominant)"
        - "grey-brown water at lower levels"
        - "occasional lantern glow (Lantern-Heaps)"
        - "Hanged Men markers: knotted rope motifs"
      sensory:
        - "water sounds: dripping, lapping at foundations"
        - "vertical acoustics: sounds carry up stairwells and light-shafts"
        - "fish smell from sewer-fisher activity"
        - "at night: near-total darkness except Lantern-Heaps"
        - "the creak of catwalks and rope bridges"
      key_elements:
        - "Gallows: fifteen stories of rust-stained metal, Hanged Men headquarters"
        - "Lockworks: basement facility controlling water distribution (source of Hanged Men power)"
        - "Lantern-Heaps: the one well-lit tenement, where gatherings happen"
        - "external catwalks connecting tenements at multiple levels"
        - "Cho gondola: only transport link to Ridge, single-family monopoly"
  # ─── end Middens ───

  # ═══ Gallows ═══
  Gallows:
    category: location
    short: "Hanged Men headquarters in the Middens—fifteen stories of rust-stained metal."
    details: |
      Houses ~200 Hanged Men plus support personnel. Lower floors contain Ygren Fen's 
      exchange market where protection fees convert to currency. Upper floors house 
      leadership. The Lockworks facility in basement levels controls water distribution 
      for the entire district. The building's height allows surveillance of all movement 
      between tenements.
    rag_pointer: The Middens Tenements
    related: [Middens, Hanged Men, Lockworks]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      children:
        - Lockworks
      controlling_entity: Hanged Men
      population: ~200
      primary_function: Criminal headquarters, water control
      notable_features:
        - Exchange market (floors 1-3)
        - Lockworks (basement)
        - Crane extending from peak
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "Fifteen stories of rust-stained metal rising from pre-Interdict foundations. The Lockworks in the flooded basement controls water for the entire district—whoever controls the valves controls the Middens. Knotted rope motifs mark Hanged Men territory: rust-red paint, teal horizontal bands, copper alloy plates at major doorways. The crane extending from the peak is a visible statement of power. Lower floors active with exchange market commerce; upper floors sealed for leadership. Water sounds from below, always."
  # ─── end Gallows ───

  # ═══ Lockworks ═══
  Lockworks:
    category: location
    short: "Water control facility in the Gallows basement—source of Hanged Men power."
    details: |
      Pre-Interdict infrastructure controlling water distribution for the entire Middens. 
      Whoever controls the Lockworks controls the district. Valvehands maintain the 
      systems; the Hanged Men control access. When punishment is needed, a valve 
      adjustment suffices.
    rag_pointer: The Middens Tenements
    related: [Gallows, Hanged Men, Valvehands]
    location_features:
      level: site
      location_type: infrastructure
      parent: Gallows
      controlling_entity: Hanged Men
      primary_function: Water distribution control
      real_world_anchor: "Monterey Bay basin (Middens, Gallows basement)"
    local_aesthetic: "Pre-Interdict water infrastructure beneath improvised slum—smooth grey surfaces, joints sealed through processes no one replicates. NOT like the Salvage Dome's thesad or the Iron Yards' quarried stone—something older, different, designed for water. Valves and pipes of wrong-looking ancient metal. The Valvehands understand the systems; the Hanged Men control access. Water flowing through everything, the sound constant. Turn a valve, and someone's water stops."
  # ─── end Lockworks ───

  # ═══ Bright-Spire ═══
  Bright-Spire:
    category: location
    short: "Chain-Men-occupied tenement tapering toward the sky—2,700 residents under constant surveillance."
    details: |
      Rises from harbor itself, foundations submerged. Accessible primarily by boat or 
      bridges to Hollow-Egress. Each floor smaller than the one below. 83 Chain-Men 
      control checkpoints on every stairwell—2,700 residents pass through extraction 
      points constantly. Sela's prayer circle on tenth floor accumulates materials. 
      The question isn't whether violence will erupt but which direction it flows.
    rag_pointer: The Middens Tenements
    related: [Middens, Chain-Men, Hanged Men]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      controlling_entity: Chain-Men
      population: ~2,700
      primary_function: Residential (under occupation)
      hazards:
        - Constant surveillance
        - Extraction checkpoints
        - Building violence
      notable_features:
        - Tapering geometry
        - Submerged foundations
        - Sela's prayer circle (tenth floor)
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "Ziggurat-in-reverse rising from harbor water. Pre-Interdict foundations entirely submerged—accessible only by boat. Each floor smaller than the one below, tapering toward sky. 2,700 people compressed into narrowing space. Chain-Men checkpoints at every stairwell. Grey metal and rust-orange corrosion, no decoration. Bridges connect to Hollow-Egress, the only land connection. The taper visible from everywhere in the district."
  # ─── end Bright-Spire ───

  # ═══ Hollow-Egress ═══
  Hollow-Egress:
    category: location
    short: "Five-clan cooperative tenement controlling Lift-3 salvage access."
    details: |
      ~1,800 residents. Economic heart of salvage work despite the Gallows' political 
      centrality. Better maintained than neighbors through combined clan investment. 
      The massive industrial elevator shaft descends through pre-Interdict foundations 
      into depths no one fully maps. Five sewer-fisher clans share responsibility for 
      different systems.
    rag_pointer: The Middens Tenements
    related: [Middens, Lift-3, Sewer-Fishers]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      children:
        - Lift-3
      controlling_entity: Five-clan cooperative
      population: ~1,800
      primary_function: Salvage access, cooperative housing
      notable_features:
        - Lift-3 industrial elevator
        - Merra's kitchen
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "Best-maintained Middens tenement—five sewer-fisher clans share investment in upkeep. Pre-Interdict foundations extend deep into flooded systems below. Lift-3's massive elevator shaft dominates the building's center, descending through those foundations into tunnel networks no one fully maps. Bridges connect to Bright-Spire. Sewer-fisher clan markers in traditional patterns. Merra's kitchen on third floor. Water sounds echo up from the depths."
  # ─── end Hollow-Egress ───

  # ═══ Lift-3 ═══
  Lift-3:
    category: location
    short: "Industrial elevator descending into flooded pre-Interdict depths."
    details: |
      Massive shaft through Hollow-Egress foundations into tunnel systems no one 
      fully maps. Operated by Yuli Loak. Provides access to salvage that surface 
      operations cannot reach. Five sewer-fisher clans share control. What comes 
      up funds the Middens economy; what goes down includes things the clans 
      prefer not to discuss.
    rag_pointer: The Middens Tenements
    related: [Hollow-Egress, Sewer-Fishers, Loak]
    location_features:
      level: site
      location_type: infrastructure
      parent: Hollow-Egress
      controlling_entity: Five-clan cooperative
      primary_function: Deep salvage access
      hazards:
        - Flooded depths
        - Unknown tunnel systems
      real_world_anchor: "Monterey Bay basin (Middens, Hollow-Egress depths)"
    local_aesthetic: "Industrial elevator shaft descending into flooded dark. Massive cable-rigging, platform large enough for salvage loads. Yuli Loak's operator booth perched on shaft edge. Below: water sounds, echoes, flooded pre-Interdict systems that no one fully maps."
  # ─── end Lift-3 ───

  # ═══ Sump-Gate ═══
  Sump-Gate:
    category: location
    short: "Pumping station tenement extending into the harbor, home to Valve-Saint Parish."
    details: |
      ~1,500 residents. Extends furthest into the water. Pumping infrastructure processes 
      water for entire district. The Valve-Saint Parish occupies the overflow chamber, 
      worshipping around a massive wheel altar. Fishing boats and salvage vessels dock 
      here. Curate Aram es-Thabit leads the congregation.
    rag_pointer: The Middens Tenements
    related: [Middens, Valve-Saint Parish]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      children:
        - Valve-Saint Parish
      population: ~1,500
      primary_function: Water pumping, religious center
      notable_features:
        - Pumping infrastructure
        - Overflow chamber (parish location)
        - Wheel altar
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "Extends furthest into harbor water—pre-Interdict foundations jutting into the Rift, nearly amphibious. Pumping infrastructure processes water for entire district: visible, audible, the constant thrum of machinery. Boats dock at flooded lower levels. The Valve-Saint Parish occupies the overflow chamber—wheel altar surrounded by channeled water, seawater seeping through the floor during high tide. Industrial-religious fusion where water itself becomes sacred."
  # ─── end Sump-Gate ───

  # ═══ Lantern-Heaps ═══
  Lantern-Heaps:
    category: location
    short: "Electronics salvage tenement with Cho family electrical monopoly."
    details: |
      ~2,200 residents. Glows at night—the only building with consistent power. 
      Cho gondola runs from here to Ridge workshops, the only direct route between 
      Middens and legitimate commerce. Rainbow signage marks Cho territory. Electronics 
      reconditioning and power distribution.
    rag_pointer: The Middens Tenements
    related: [Middens, Cho, Ridge]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      controlling_entity: Cho family
      population: ~2,200
      primary_function: Electronics salvage, power distribution
      notable_features:
        - Cho gondola to Ridge
        - Electrical monopoly
        - Rainbow signage
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "The lit building in near-total Middens darkness—Cho electrical monopoly made visible. Pre-Interdict foundations on southern edge where ground rises toward the Ridge. Cho rainbow signage garish against prevailing grey. Gondola cable stretching up toward Ridge workshops—the lifeline between Middens poverty and Rotten Quarter prosperity. Electronics workshops glow with testing displays. Less water than northern tenements, more connection to legitimate commerce."
  # ─── end Lantern-Heaps ───

  # ═══ Knife-Edge ═══
  Knife-Edge:
    category: location
    short: "Metalworking tenement leaning fifteen degrees against eastern rubble."
    details: |
      ~1,600 residents. Forges process salvage arriving from Iron Yards networks. 
      The fifteen-degree lean is visible from anywhere in the district, structural 
      failure arrested but never corrected. Residents internalize the tilt—their 
      gait adjusts even on level ground.
    rag_pointer: The Middens Tenements
    related: [Middens, Iron Yards]
    location_features:
      level: site
      location_type: industrial
      parent: Middens
      population: ~1,600
      primary_function: Metalworking, salvage processing
      hazards:
        - Structural instability
        - Forge heat and smoke
      notable_features:
        - Fifteen-degree lean
        - Active forges
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "The leaning tenement—fifteen degrees visible from anywhere in the district. Pre-Interdict foundations shifted but held; structural failure arrested, never corrected. Eastern edge where flooded foundations give way to Iron Yards' quarried bedrock—the transition zone. Forge smoke drifts from upper floors, processing salvage from networks connecting to the Yards. Residents develop the tilted gait, walking crooked even on level ground. Less water here, more industry."
  # ─── end Knife-Edge ───

  # ═══ Vetch-Rise ═══
  Vetch-Rise:
    category: location
    short: "Transient housing tenement—sole pedestrian entry to the Middens."
    details: |
      ~2,500 residents. Only building connecting directly to mainland. Everyone 
      entering or leaving the Middens on foot passes through here or pays for boat 
      transport. Yen Tam Society maintains influence despite Hanged Men dominance 
      elsewhere—they control access. Transient Market assembles wherever Chain-Men 
      aren't currently patrolling.
    rag_pointer: The Middens Tenements
    related: [Middens, Yen Tam Beneficial Society, Transient Market]
    location_features:
      level: site
      location_type: residential
      parent: Middens
      controlling_entity: Yen Tam Society (access control)
      population: ~2,500
      primary_function: Transient housing, district access point
      notable_features:
        - Sole pedestrian entry
        - Transient Market
        - Rain-net repair (sixth floor)
      real_world_anchor: "Monterey Bay basin (Middens)"
    local_aesthetic: "Gateway tenement—the only building connecting directly to mainland. Everyone entering Middens on foot passes through ground floor or pays for boat transport. Pre-Interdict foundations on eastern edge, where flooded Middens meets quarried Iron Yards bedrock. Yen Tam markers at ground level controlling access. Transient Market materializes and dissolves in corridors. Highest turnover, most vulnerable population. Rain-net repair on sixth floor. The border between Middens isolation and the wider city."
  # ─── end Vetch-Rise ───

  # ═══ Transient Market ═══
  Transient Market:
    category: location
    short: "Mobile market in Vetch-Rise assembling wherever Chain-Men aren't patrolling."
    details: |
      Vendors carry entire inventories ready to move at moment's notice. Goods are 
      marginal but essential: used clothing, barely-edible food, documentation that 
      might pass casual inspection. When danger appears, the market dissolves like 
      smoke, reassembling elsewhere once danger passes.
    rag_pointer: The Middens Tenements
    related: [Vetch-Rise, Middens]
    location_features:
      level: site
      location_type: commercial
      parent: Vetch-Rise
      primary_function: Marginal commerce
      notable_features:
        - Mobile/guerrilla operation
        - Disperses instantly under threat
      real_world_anchor: "Monterey Bay basin (Middens, Vetch-Rise)"
    local_aesthetic: "Not a place but a phenomenon—commerce materializing in Vetch-Rise corridors wherever Chain-Men aren't. Vendors carry entire inventories: used clothing, barely-edible food, documentation that might pass inspection. When danger appears, the market dissolves like smoke. No stalls, no fixed positions—blankets on damp floors, goods in bags ready to grab. The architecture of survival, reassembling elsewhere once danger passes."
  # ─── end Transient Market ───

  # ═══ Monastery of the Silent Song ═══
  Monastery of the Silent Song:
    category: location
    short: Facility housing surviving Auditor kalbats.
    details: Seven kalbats survive here in cyclic dormancy, tended by Companions in two-year rotations. Located in the Second Whorl.
    rag_pointer: The Companions Guild
    related: [Kalbats, Companions Guild, Second Whorl]
    location_features:
      level: site
      location_type: religious
      parent: Second Whorl
      controlling_entity: Companions Guild
      castes_present:
        - Kalbats
        - Companions
      real_world_anchor: "Inner City arcology (Second Whorl)"
  # ─── end Monastery of the Silent Song ───

  # ═══ Near Wall ═══
  Near Wall:
    category: location
    short: "Commerce and residence side of Glen Canyon—markets at bottom, wealthy cave-homes above."
    details: |
      The canyon wall closest to the main road entering Ganat. Lower levels: covered bazaars 
      carved into the cliff, crowded markets for food, textiles, copper work, imported goods. 
      Higher up: wealthy cave-homes with vast stained glass windows glowing day and night, 
      2-3,000 square feet carved into sandstone. Middle-class deeper, no windows but electric 
      light. The poorer you are, the deeper you live—but even the deepest have electric light 
      and sanitation. Terraces carved for gardens and gathering.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat proper, Far Wall]
    location_features:
      level: district
      location_type: residential
      parent: Ganat proper
      children:
        - Canyon Floor Markets
        - Wealthy Cave-Homes
      borders:
        across_canyon: [Far Wall]
      real_world_anchor: "Glen Canyon (Ganat proper, road-side wall)"
    local_aesthetic: |
      Petra made vertical—commerce at bottom, wealth ascending into light. Lower levels: covered bazaars 
      carved into salmon sandstone, opening onto streets along the canyon floor. Early electrification 
      aesthetic: exposed copper wiring on ceramic insulators, carbon-filament bulbs in pressed-glass globes, 
      transformer boxes humming at junction points. Electric lights blaze constantly (the spaces would be 
      dark otherwise). Crowded, noisy, fragrant with food and spices and human density.
      
      Higher up: wealthy cave-homes carved close enough to the canyon face to install vast stained glass 
      windows. Massive panels showing geometric patterns or figurative scenes, lit from behind by electric 
      light, glowing day and night—visible from across the canyon, announcing wealth through beauty. Art 
      Nouveau decoration in carved sandstone: flowing curves at Gaudí scale, organic doorways with verdigris 
      copper cladding, figures 20-25 feet tall in relief from the wall.
      
      At the canyon rim: 1890s Southwest territorial architecture—flat-roofed adobe buildings with parapeted 
      edges, vigas (log beams) protruding, earthship-style thermal mass construction. Where surface meets 
      carved sandstone, two building traditions meet: adobe on top, carved stone below, spiral ramps 
      connecting them.
      
      Terraces provide outdoor space: irrigated gardens, gathering areas, lookout points. Staircases and 
      spiral ramps lit every 20 feet. The deeper you live, the poorer you are—but even the deepest have 
      light and sanitation. Cappadocian depth with Ganati brightness.
  # ─── end Near Wall ───

  # ═══ Canyon Floor Markets ═══
  Canyon Floor Markets:
    category: location
    short: "Covered bazaars carved into the Near Wall's base—crowded, noisy, perpetually lit."
    details: |
      Carved spaces opening onto streets along the canyon floor. Food from upper canyon farms, 
      textiles from Dam workshops, copper work from local artisans, imported goods from Imperial 
      trade via Taho, salvaged archaeotech. Electric lights illuminate constantly—the spaces 
      would be dark otherwise. Fragrant with food, spices, human density.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Near Wall, Ganat proper]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Near Wall
      primary_function: Trade, commerce
      real_world_anchor: "Glen Canyon (Ganat proper, Near Wall base)"
    local_aesthetic: "Covered bazaars carved from salmon sandstone, opening onto the canyon floor. Electric lights every few feet—essential, because the carved spaces would be dark otherwise. The markets never close; power is free. Merchants call from carved stalls. Copper work gleams under electric bulbs. Textiles from the Dam's workshops hang in colors that glow against salmon stone. Food vendors fill the air with spice and cooking smoke. Imported goods from Imperial trade through Taho. Salvaged archaeotech and reverse-engineered products. Crowded, noisy, fragrant with human density. Every surface accretes layers of commercial announcement and political advocacy."
  # ─── end Canyon Floor Markets ───

  # ═══ Wealthy Cave-Homes ═══
  Wealthy Cave-Homes:
    category: location
    short: "Upper Near Wall residences with vast stained glass windows visible across the canyon."
    details: |
      2-3,000 square feet carved into sandstone: multiple chambers, high ceilings, Art Nouveau 
      decoration. Close enough to the canyon face to install vast stained glass windows—massive 
      panels lit from behind, glowing both day and night. The windows face the canyon, visible 
      from the Far Wall and below, announcing wealth through beauty that costs enormous amounts 
      to commission and install.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Near Wall, Ganat proper]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Near Wall
      primary_function: Elite residence
      notable_features:
        - Stained glass windows
        - Art Nouveau carved decoration
      real_world_anchor: "Glen Canyon (Ganat proper, upper Near Wall)"
    local_aesthetic: "Gaudí meets Petra. Cave-homes carved close enough to the canyon face for vast stained glass windows—massive panels showing geometric patterns or figurative scenes, lit from behind by electric light, glowing both day and night. 2-3,000 square feet carved into salmon sandstone: multiple chambers, high ceilings, Art Nouveau curves in the carved decoration, revolutionary or Penitent imagery flowing across walls. Organic doorways with copper cladding in verdigris green. The windows face the canyon—visible from the Far Wall, from the markets below, from Tyrant's Walk crossing the Dam. Each one a fortune. Each one announcing that here lives someone who made it. Below, the middle class lives deeper with electric light but no windows. Below them, the poor in minimal tunnels. But even there, light and sanitation."
  # ─── end Wealthy Cave-Homes ───

  # ═══ Northern Frontier ═══
  Northern Frontier:
    category: location
    short: "Vast zone where Imperial sovereignty dissolves gradually into contested territory."
    details: "Between ya-Sattra and Ogon. Colonel-Hereditary estates and Akama warbands maintain elaborate performances of tribute and vassalage. Imperial control doesn't end at a border but dissolves gradually."
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Thousand Kingdoms, Undying Empire]
    location_features:
      level: district
      location_type: geographic
      primary_function: Frontier zone
      borders:
        south: [Undying Empire]
        north: [Thousand Kingdoms]
      real_world_anchor: "Northern California to southern Oregon"
  # ─── end Northern Frontier ───

  # ═══ Ogon ═══
  Ogon:
    category: location
    short: Autofactory city where Columbia meets the sea, ~1 million inhabitants.
    details: Eighty miles of brutalist sprawl produced by malfunctioning autofactory. Seven token-holders govern through the Junta. Kma-Dhol (40,000 sewer-fishers) operate openly as technical specialists.
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Junta of Ogon, Thousand Kingdoms, Kma-Dhol]
    location_features:
      level: city
      location_type: settlement
      parent: Thousand Kingdoms
      children:
        - The Slab
        - Kma-Dhol Quarter
      controlling_entity: Junta of Ogon
      population: ~1 million
      castes_present:
        - Akama
        - Kma-Dhol
      notable_features:
        - Autofactory
        - Grand Canal terminus
        - Ziggurat architecture
      borders:
        east: [The Grand Canal]
        south: [Northern Frontier]
      real_world_anchor: "Columbia River mouth (Portland/Astoria area)"
    aesthetic_features:
      intention: "Human presence marked on alien concrete. We live here despite what this place was built for."
      environment: "Oregon coast where autofactory transformed landscape. Rain 200 days/year, 50-60°F constant, everything perpetually damp. Moss grows on concrete. Douglas firs 200 feet tall growing through broken structures. Eighty miles of brutalist sprawl."
      construction: "Autofactory structures are brutalist concrete pushed to extreme—geometric, no human accommodation. Human construction is Douglas fir timber with mortise and tenon joinery, built WITHIN autofactory shells. Platforms atop ziggurats. Footbridges spanning canals."
      visual_vocabulary:
        - "Brutalist pushed to extreme: Boston City Hall, Barbican, but without any human accommodation"
        - "Mayan stepped ziggurats: geometric forms without ornamentation"
        - "Japanese shrine carpentry: careful joinery in Douglas fir within wrong-dimensioned concrete"
        - "Scandinavian fishing villages: bright paint on weathered wood against grey"
      materials:
        - "autofactory concrete (grey, geometric, wrong-dimensioned for humans)"
        - "Douglas fir timber (human construction within autofactory shells)"
        - "three colors from autofactory waste: rust-orange, lime-yellow, teal"
        - "wooden pegs, mortise and tenon joinery"
      colors:
        - "grey concrete (autofactory dominant)"
        - "rust-orange diagonal slashes (human territorial markers)"
        - "lime-yellow and teal accents"
        - "green moss growing on everything"
        - "Douglas fir's natural brown"
      sensory:
        - "constant rain, dripping, damp everything"
        - "autofactory hum where systems still operate"
        - "woodsmoke from human settlements"
        - "river and ocean sounds at terminus"
        - "creaking timber within concrete shells"
      key_elements:
        - "diagonal paint slashes marking human presence against alien concrete"
        - "timber structures built inside autofactory rooms (proper frames within wrong dimensions)"
        - "The Slab: central autofactory zone, dense with Kma-Dhol operations"
        - "stepped ziggurats with platforms added on top"
        - "Grand Canal terminus: geometrically straightened Columbia River"
        - "200-foot Douglas firs growing through broken autofactory sections"
  # ─── end Ogon ───

  # ═══ Old Town ═══
  Old Town:
    category: location
    short: "Original settlement on High Junction's east bank."
    details: |
      Protected from flooding by natural terraces 15-20 feet above river level. Inherited 
      Sultanate-era infrastructure. Adobe domes with underground chambers, now electrified. 
      Houses garrison headquarters, Hereditary Debtor bureaucratic complex, Saint Arsakh 
      parish, Dhal-Setil compound, and the residential core of pre-revolution families.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [High Junction, Dhal-Setil, Saint Arsakh]
    location_features:
      level: district
      location_type: residential
      parent: High Junction
      children:
        - Garrison Headquarters
        - Debtor Bureaucratic Complex
        - Parish of Saint Arsakh
        - Dhal-Setil Compound
        - Eastern Range Cooperative
      borders:
        west: [The Bridge]
      real_world_anchor: "Southern Colorado highlands (High Junction east bank)"
    local_aesthetic: "Ganati building traditions on the frontier. Adobe domes rise above underground chambers—smooth ochre-cream exteriors broken by organic doorways with copper cladding worked in flowing patterns. Carved decoration on older buildings: geometric curves incised into plaster, bands of rust-orange and cream marking structural divisions. Nothing approaching Ganat proper's monumental facades, but recognizably Ganati in its flowing lines and organic forms. Every surface accretes wheatpaste posters—political advocacy layered over commercial announcement, newer covering older, creating visible stratigraphy of the city's arguments. Revolutionary banners hang from doorways: maguey-silk dyed rust-orange or teal, cream-colored text in flowing Ganati script. Amber electric light glows through windows designed for oil lamps. Copper wire threads between buildings older than the Revolution."
  # ─── end Old Town ───

  # ═══ Garrison Headquarters ═══
  Garrison Headquarters:
    category: location
    short: "Republican Guard command center in High Junction—converted Sultanate administrative complex."
    details: |
      Houses approximately 3,000 active personnel rotating between garrison duty, range patrol, 
      and training operations. Converted Sultanate administrative complex capable of withstanding 
      assault. Colonel Ghar commands. Monthly military payroll generates ~150,000 dinars annually 
      circulating through the local economy.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Old Town, High Junction, Republican Guard]
