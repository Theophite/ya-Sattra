  # ═══ The Rim ═══
  The Rim:
    category: location
    short: "Metropolitan periphery of ya-Sattra along the former coastline."
    details: |
      Multiple named cities along the cliffs and ridges that were once the Monterey 
      Bay shoreline, now looking down into the basin where the arcology-dominated 
      core districts sit. More conventional urban patterns than the basin, less 
      arcology dependence, oriented both toward the basin (economically, 
      administratively) and outward toward the agricultural hinterland. Houses 
      perhaps 2.5-3 million of ya-Sattra's total population.
    rag_pointer: ""
    related: [ya-Sattra]
    location_features:
      level: district
      location_type: grouping
      parent: ya-Sattra
      primary_function: "Metropolitan periphery, agriculture-adjacent settlements"
      borders:
        below: [Inner City, Medina Quarter, Antediluvian Quarter, Rotten Quarter]
        outward: [Imperial hinterland]
      real_world_anchor: "Former Monterey Bay coastline (now clifftops)"
    aesthetic_features:
      intention: "We look down at what we serve. We live where architecture makes sense."
      environment: "Former Monterey Bay coastline—now clifftops 200-400 feet above the basin floor. Multiple named cities strung along the cliff edge, each with views down into the arcology-dominated core. Mediterranean climate, but cliff-edge winds channel down into the basin. Oriented both toward the basin (work, administration) and outward toward agricultural hinterland."
      construction: "Conventional urban patterns with human-scale architecture. Regional stone and timber construction—nothing self-repairing, nothing impossible. Proportions that make sense for the bodies that live in them. The contrast with the basin is visible: down there, the arcologies; up here, buildings humans built for humans."
      visual_vocabulary:
        - "Mediterranean hillside towns: stone construction, terraced streets, views downward"
        - "Cliff-edge settlements: the drop-off as defining feature"
        - "Normal city: what urban life looks like without arcologies"
        - "The view DOWN: they can see the bronze towers, the Rift, the strangeness from above"
      materials:
        - "regional stone (conventional quarrying)"
        - "local timber (normal construction)"
        - "conventional materials throughout (contrast to basin's arcology inheritance)"
        - "cliff-edge wind breaks and terracing"
      colors:
        - "tan and grey stone (weathered naturally, unlike self-repairing thesad)"
        - "terracotta roof tiles"
