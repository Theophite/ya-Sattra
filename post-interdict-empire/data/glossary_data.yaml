    local_aesthetic: "Revolutionary judgment carved in stone. Circular room 80 feet in diameter, carved from salmon sandstone. Tiered seating in concentric circles—200 senators facing the central floor where speakers stand. Acoustics extraordinary: a voice at normal volume carries to every seat; two senators arguing simultaneously create cacophony. The walls show revolutionary reliefs carved deep—3-4 inches into sandstone—over older imagery. Collective assemblies. Workers building infrastructure. Soldiers fighting together. But look closely at certain sections: smoother stone underneath, faint outlines of different compositions. The Sultana receiving tribute, now carved away. Revolutionary imagery replacing monarchical scenes, the palimpsest visible to anyone who knows to look. Electric light blazes continuously. Nothing hidden."
