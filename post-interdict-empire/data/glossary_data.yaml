  # ═══ The Dam ═══
  The Dam:
    category: location
    short: "Antediluvian hydroelectric structure—grey material harder than granite, turbines that never stop."
    details: |
      300 feet across, 400 feet from river to top. Built from grey material that looks like 
      stone but isn't—harder than granite, smooth to the touch, impervious to weathering. 
      The builders' purposes are unknown; current residents adapted what they found. Turbines 
      re-engineered decades before the Revolution. Provides power too cheap to meter—workshops 
      operate 24 hours because stopping costs opportunity. Working-class warrens honeycomb 
      the surrounding sandstone, tunnels terminating inside the Dam itself.
    rag_pointer: The Republic of Ganat, Ganat and the Yarangar War
    related: [Ganat proper, Antediluvian]
    location_features:
      level: district
      location_type: infrastructure
      parent: Ganat proper
      aliases:
        - Industrial District
      children:
        - Working-Class Warrens
        - Tyrant's Walk
      primary_function: Power generation, industrial district
      notable_features:
        - Antediluvian construction
        - 24-hour industrial operation
        - Working-class warrens
      real_world_anchor: "Glen Canyon (Ganat proper)"
    local_aesthetic: |
      Antediluvian mystery amid carved sandstone. The Dam itself is grey material—NOT sandstone, NOT any 
      stone Republicans understand. Harder than granite, smooth to the touch, showing no weathering despite 
      unknown age. Perhaps it stored water. Perhaps it generated power. Perhaps it was something else entirely. 
      
      The turbines inside are modern—re-engineered decades before the Revolution, spinning continuously, 
      generating power too cheap to meter. But the structure they're mounted in is ancient, incomprehensible. 
      Conduits of the same grey material thread outward from the Dam through the surrounding sandstone—some 
      carry power (the electrical infrastructure taps into these), some carry unknown substances, some simply 
      hum with unidentifiable purpose. Workers carving new chambers occasionally break through into these 
      conduits and must build around them; nobody wants to damage infrastructure that still functions.
      
      Workshops carved into surrounding sandstone operate 24 hours: hammers on metal, electric saws, looms 
      clacking, the constant background of turbines and flowing water. The smell: hot metal, chemicals, 
      sawdust, human sweat, machine oil, ozone from electrical equipment. Working-class warrens honeycomb 
      the rock—tunnels branching from the Dam into the cliff, chambers carved every 20 feet, bright salmon 
      sandstone visible under perpetual electric light. Spiral ramps connect levels, Guggenheim-style 
      continuous access rather than discrete stairs. The warrens feel organic, unplanned, grown rather 
      than built—but everyone knows who carved which chamber.
  # ─── end The Dam ───

  # ═══ Working-Class Warrens ═══
  Working-Class Warrens:
    category: location
    short: "Three-dimensional maze of tunnels and chambers carved through sandstone around the Dam."
    details: |
      Organic urbanism—workers needed housing near employment, the sandstone could be carved, 
      power and lighting were free. A typical warren: main tunnel 8 feet high, 6 feet wide, 
      running 150 feet through sandstone, chambers carved every 20 feet (12x10 feet, home to 
      families of four or five). Electric bulbs every 10 feet. Tunnels branch, connect, shortcut 
      between systems. No comprehensive map—expansion happens constantly. Some residents go 
      weeks without seeing the surface.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [The Dam, Ganat proper]
    location_features:
      level: neighborhood
      location_type: residential
      parent: The Dam
      primary_function: Worker housing
      notable_features:
        - Organic expansion
        - Perpetual electric lighting
        - Three-dimensional maze
        - Wheatpaste poster culture
      real_world_anchor: "Glen Canyon (Ganat proper, surrounding the Dam)"
    local_aesthetic: |
      Cappadocia-scale underground living with perpetual electric light. Main tunnels 8 feet high, 6 feet 
      wide, running 150 feet through salmon-colored sandstone. Every 20 feet, a chamber carved off: 12 by 
      10 feet, 7 feet high, home to a family of four or five. Electric bulbs every 10 feet—bright amber 
      from carbon filaments, the salmon stone visible constantly, exposed copper wiring on ceramic insulators. 
      Carved shelves, sleeping platforms, ventilation shafts cut to surface 100 feet above.
      
      Spiral ramps connect levels—Guggenheim-style continuous access flowing between floors rather than 
      discrete staircases. The ramps are carved into the sandstone, worn smooth by generations of feet. 
      Multiple families share tunnels. Children play in corridors. Cooking in communal areas carved larger.
      
      Wheatpaste posters layer every flat surface near tunnel junctions. Kilit recruitment: "Stonecutters' 
      Fraternal Collective Needs Apprentices—Training Provided." Political advocacy: "Dawn Coalition Rally, 
      Far Wall Plaza, Seventh-Day." Event announcements, work opportunities, housing exchanges, missing 
      persons. New posters paste over old; the layers build up until someone scrapes them down and the 
      cycle begins again. The salmon sandstone beneath is stained with flour paste and paper residue. 
      Reading the walls tells you what matters this week.
      
      The warrens connect—tunnels branch, vertical shafts connect levels, shortcuts carved between previously 
      separate systems. No comprehensive map exists. Navigation by landmark: 'Turn left at the blue mark,' 
      'Go down two levels at the shaft near the weaving collective.' Some residents go weeks without seeing sky.
      
      Throughout the warrens, grey Antediluvian conduits thread through the sandstone—infrastructure predating 
      the carving, built into bedrock before anyone carved here. Workers build around these conduits; nobody 
      damages what still functions. Some carry power, some hum with unknown purpose. The warrens feel carved 
      out of something already inhabited by older systems.
  # ─── end Working-Class Warrens ───

  # ═══ Tyrant's Walk ═══
  Tyrant's Walk:
    category: location
    short: "Catwalk through the Dam connecting Near Wall to Far Wall—formerly Ulayah's Walk."
    details: |
      The only crossing below the Dam's top. Passes above the industrial district, 400 feet 
      above the river. Renamed after the Revolution—the Sultana's name removed, replaced 
      with political judgment. The alternative is walking over the Dam's top.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [The Dam, Near Wall, Far Wall]
    location_features:
      level: site
      location_type: infrastructure
      parent: The Dam
      primary_function: Pedestrian crossing
      notable_features:
        - Revolutionary renaming
        - Views over industrial district
      real_world_anchor: "Glen Canyon (through the Dam)"
    local_aesthetic: "Industrial crossing with revolutionary judgment. The catwalk passes through the Dam itself, above workshops where hammers never stop ringing. Grey Antediluvian walls on either side—smooth, impervious, lit by electric bulbs. Below: the industrial district, visible through gaps, the smell of hot metal rising. The walk was Ulayah's Walk before the Revolution; now Tyrant's Walk, the Sultana's name replaced with political verdict. 400 feet above the river. The only crossing besides walking over the Dam's top, exposed to wind and sun."
  # ─── end Tyrant's Walk ───

  # ═══ Lake Ganat ═══
  Lake Ganat:
    category: location
    short: "Reservoir behind the Dam—upper canyon, fishing, irrigation, year-round water supply."
    details: |
      The river backs up into Lake Ganat in the upper canyon. Provides year-round water 
      for the city, fishing for food, irrigation for upper canyon farms. The lake existed 
      before the turbines were re-engineered, serving fishing and irrigation when the Dam 
      was just enormous ruin.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [The Dam, Ganat proper]
    location_features:
      level: site
      location_type: geographic
      parent: Ganat proper
      primary_function: Water supply, fishing, irrigation
      real_world_anchor: "Glen Canyon (upper canyon, behind Dam)"
    local_aesthetic: "Quiet above the industrial roar. The Teph River backs up behind the Dam into still water—Lake Ganat in the upper canyon. Fishing boats on calm surface. Upper canyon farms draw irrigation. The lake existed before the turbines were re-engineered, when the Dam was just enormous ruin, impressive but silent. Now the water feeds the turbines that never stop, but up here you can't hear them. Salmon sandstone walls rise on either side, carved facades visible in the distance downstream. The reservoir is practical—year-round water supply, fish protein, farm irrigation—but also respite from the perpetual industry below."
  # ─── end Lake Ganat ───

