  # ═══ Khesh-Dalan ═══
  Khesh-Dalan:
    category: location
    short: "Revolutionary ethics in Antediluvian ruins—Akama settlement atop archaeological treasure."
    details: |
      Settlement attempting to integrate Akama population with Republican structures, 
      built unknowingly atop one of the richest Antediluvian archaeological sites in 
      the eastern territories. The village of perhaps three hundred Akama—former 
      Thirteen-Hawks who chose settlement over raiding—occupies what appears to be 
      unremarkable grassland near a dry wash called Khesh Creek.
      
      Beneath the surface: an Antediluvian complex of unknown extent. Initial exploration 
      revealed intact structures, functional or near-functional technology, materials 
      that defy easy categorization. The discovery creates an ethical dilemma that 
      defines the settlement's current crisis.
      
      Headman Dranakh Nine-Hawk must decide whether to notify Republican authorities 
      (which would bring archaeologists, administrators, probably displacement) or 
      attempt independent excavation (illegal, dangerous, potentially lucrative). 
      Captain Sekh of the Cloud Temple Band has offered support—Senna wants archaeotech 
      for purposes Sekh cannot fully explain. The Republican Guard patrol visits monthly; 
      time pressure compounds every consideration.
      
      The village itself demonstrates successful integration: Akama children learning 
      Republican literacy alongside traditional skills, kilit governance adapting to 
      accommodate Akama consensus practices, felt tents standing beside adobe structures.
    rag_pointer: "The Republic of Ganat"
    related: [Ganat, Akama, Thousand Kingdoms, Cloud Temple Band]
    location_features:
      level: city
      location_type: settlement
      parent: Ganat
      population: ~300
      primary_function: Frontier settlement, Akama integration
      castes_present:
        - Akama
        - Serrulata
      notable_features:
        - Antediluvian complex beneath village
        - Thirteen-Hawk Akama settlement
        - Integration experiment
      borders:
        north: [Thousand Kingdoms]
      real_world_anchor: "Near Rexburg, Idaho (northern Ganati frontier)"
    aesthetic_features:
      intention: "Can Akama become citizens? And what lies beneath—and around—the answer?"
      environment: "Northern Ganati frontier at 5,000 feet, high plateau where the Teph River (formerly Henrys Fork) cuts through. The village occupies gentle slopes above Khesh Creek—a dry wash running water only during spring melt. Unremarkable landscape hiding remarkable secrets. Cold winters, hot summers, the constant wind of open country."
      construction: "The settlement occupies pre-Interdict structures with utilities that still function mysteriously. Hybrid additions: Akama felt tents (properly called ger, circular, portable) alongside Republican adobe structures (permanent, thick-walled, flat-roofed). The Antediluvian buildings themselves are incomprehensible—materials that look like stone but aren't, seamless joints, rooms whose proportions feel wrong. Villagers have adapted them as best they can, adding timber partitions, hanging felt for insulation, treating the alien architecture as given terrain rather than constructed space."
      visual_vocabulary:
        - "Antediluvian ruins as living space: villagers occupying structures built for unknown purposes by unknown builders"
        - "Archaeological density visible everywhere: turn over a rock, find a device; dig a latrine, uncover a conduit"
        - "Ganat frontier additions: adobe walls, flat roofs, narrow windows against summer heat"
        - "Thousand Kingdoms portable: felt tents with painted door-frames, destrier paddocks"
        - "Integration visible: three architectural traditions (Antediluvian, Ganati, Akama) in uneasy proximity"
      materials:
        - "Antediluvian construction: grey pseudo-stone, metalloceramic, unknown composites, surfaces that don't weather"
        - "artifacts everywhere: palm-sized objects of unfamiliar materials, markings no one can read, some still powered"
        - "adobe brick (Ganati tradition, locally made)"
        - "felt over timber frame (Akama ger construction)"
      colors:
        - "grey Antediluvian materials (dominant in ruins)"
        - "tan adobe against brown grassland"
        - "felt white and cream (Akama)"
        - "rust-orange territorial markers (diagonal slashes on tents)"
        - "mysterious internal lighting in some Antediluvian structures (amber, source unknown)"
      sensory:
        - "two languages: Ganati trade-tongue and Akama dialects in constant code-switching"
        - "destrier smell from paddocks downwind"
        - "constant wind across open grassland"
        - "inside Antediluvian structures: wrong acoustics, air that tastes different, the hum of systems nobody maintains"
        - "the disorientation of living in spaces designed for other bodies"
      key_elements:
        - "Dranakh Nine-Hawk (headman, former raider, faces impossible choice)"
        - "Captain Sekh (Cloud Temple Band liaison, offers dangerous support)"
        - "Antediluvian complex (wealth and danger, the settlement IS the ruins)"
        - "Republican Guard patrol (monthly visits, the clock ticking)"
        - "artifacts in every pocket (children find them playing, adults find them digging)"
        - "the schoolhouse (integration working, or seeming to)"
  # ─── end Khesh-Dalan ───

  # ═══ Great Stairs ═══
  Great Stairs:
    category: location
    short: "800 steps from Port District to Upper City—rivers of light at night."
    details: |
      800 granite steps rising 600 feet, wide enough for two people abreast. Electric lights 
      every 20 steps making night travel safe. Granite blocks, each step 8 inches high, edges 
      rounded from millennia of footsteps. Pre-Interdict engineering in oldest sections. 
      Landings every 100 steps provide rest and overlooks. Different kilits maintain different 
      sections, competing to keep theirs brightest. You can tell when you cross boundaries by 
      light spacing and intensity.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Merchant Terraces, Taho]
    location_features:
      level: site
      location_type: infrastructure
      parent: Merchant Terraces
      primary_function: Pedestrian route, social space
      notable_features:
        - 800 steps
        - Kilit-maintained lighting
        - Pre-Interdict construction (oldest sections)
      real_world_anchor: "Lake Tahoe (Taho, Port District to Upper City)"
    local_aesthetic: "Taho's most dramatic demonstration of infrastructure. 800 granite steps from Port District to Upper City, rising 600 feet, wide enough for two abreast. Electric lights every 20 steps. Granite blocks 8 inches high, edges rounded by millennia of footsteps—pre-Interdict engineering in oldest sections, drainage channels preventing ice, walls on downslope side preventing falls. Landings every 100 steps: rest points and overlooks showing the city below, the lake stretching, the mountains rising, the pass where caravans bring contradiction. At night the stairs become rivers of amber light—different kilits maintaining different sections, all competing to be brightest. You can tell when you cross from one kilit's territory to another by subtle differences in light spacing and intensity. No single kilit made the stairs. All of them together made the stairs. But each one made their part, and you can see which part."
  # ─── end Great Stairs ───

  # ═══ Coppersmith Collective Plaza ═══
  Coppersmith Collective Plaza:
    category: location
    short: "Third Terrace plaza surrounded by coppersmith workshops—artisan independence on display."
    details: |
      150-foot square paved with granite blocks, surrounded by coppersmith workshops. 
      Artisans work in shops (forge fires visible, continuous hammering, smell of hot metal 
      and quenching water), display goods in plaza, negotiate with buyers. Some sell locally; 
      some go to Imperial factors paying premium prices—Ganati copper-craft has reputation 
      in ya-Sattra. The plaza's streetlights are maintained by the Collective itself, refusing 
      merchant kilit subsidy as point of artisan independence.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Merchant Terraces, Taho]
    location_features:
      level: site
      location_type: commercial
      parent: Merchant Terraces
      controlling_entity: Coppersmith Collective
      primary_function: Artisan commerce
      notable_features:
        - Self-maintained lighting
        - Artisan independence
      real_world_anchor: "Lake Tahoe (Taho Third Terrace)"
    local_aesthetic: "Artisan independence made visible. 150-foot granite square at Third Terrace level, surrounded by coppersmith workshops. Forge fires and electric lights make shop interiors visible from the plaza—hammering creates continuous noise, hot metal smell mingles with quenching water. Artisans work in their shops, display finished goods in the plaza, negotiate prices with buyers. Some goods sell locally; some to Imperial factors who pay premium prices (Ganati copper-craft has reputation in ya-Sattra for durability and aesthetic sophistication). The plaza's streetlights are maintained by the Collective itself, refusing subsidy from merchant kilits as point of artisan independence. The lights are kept obsessively functional, demonstrating that skilled labor can maintain its own infrastructure. Craftsmanship maintains Republican pride while generating Imperial currency—contradiction nobody questions."
  # ─── end Coppersmith Collective Plaza ───

  # ═══ Harbor District ═══
  Harbor District:
    category: location
    short: Dock area built for near-baseline labor castes, almost comfortable for Avouvar.
    details: "Architecture scaled to ordinary bodies: doorways six feet high, corridors eight feet wide. Docks extend into the Fraser on polymer pilings the autofactory maintains. Warehouses with climate control calibrated for ancient foods."
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Czernaël, Kolaëvin]
    location_features:
      level: district
      location_type: industrial
      parent: Asovoë
      primary_function: Ship unloading, warehousing
      castes_present:
