  # ═══ Upper Taho ═══
  Upper Taho:
    category: location
    short: "Wealthy district at Taho's summit—Academy, Cathedral, merchant compounds."
    details: |
      At 6,800 feet, where goods climbing the terraces finally arrive and status reaches 
      its peak. The Academy occupies 20 acres of pre-Interdict buildings (original purpose 
      unknown, construction beyond current capability). Taho Cathedral with its 500-year-old 
      granite pulpit carved with intertwined hands. Merchant compounds: granite walls 2 feet 
      thick, timber framing, glass windows, electric heating throughout, interior courtyards 
      with actual vegetation. The Khen-Masots provide their own power from their own generators.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Taho, Merchant Terraces]
    location_features:
      level: district
      location_type: residential
      parent: Taho
      children:
        - Taho Academy
        - Taho Cathedral
        - Merchant Compounds
      aliases:
        - Upper City
      primary_function: Elite residence, education, religion
      notable_features:
        - Pre-Interdict Academy
        - Arch-curacy seat
        - Merchant compounds
      borders:
        below: [Merchant Terraces]
      real_world_anchor: "Lake Tahoe (Taho, 6,800 feet)"
    local_aesthetic: "Wealth crystallized in granite. Merchant compounds with walls 2 feet thick, timber framing imported at enormous cost, glass windows showing wealth, pitched roofs with proper drainage, electric heating in every room. Multi-generational family compounds serving as both homes and kilit headquarters—30 people in 8,000 square feet with multiple fireplaces, proper kitchens, private chambers, interior courtyards with actual vegetation (a statement at this altitude). Some compounds have their own generating capacity; the Khen-Masots provide their own power, demonstrating complete self-sufficiency while also providing subsidized power to fifteen thousand other households. The contrast with Port District is absolute—but both have electric light and heat. The Cathedral rises with carved intertwined hands on its granite pulpit. And the Academy: 20 acres of pre-Interdict buildings whose original purpose no one knows, construction techniques beyond current capability, utilities that still partially function."
  # ─── end Upper Taho ───

  # ═══ Taho Academy ═══
  Taho Academy:
    category: location
    short: "Pre-Interdict buildings of unknown purpose—now training Republican professionals."
    details: |
      20 acres in Upper City: connected pre-Interdict buildings forming complex around central 
      plaza. Original purpose unknown, construction techniques beyond current capability, 
      utilities still partially function. Now houses dormitories for 400 students, lecture 
      halls, laboratories, library. Three-year program: engineering, military, administrative 
      tracks. The Academy's own turbines on the stream running through the complex provide 
      power at cost—zero markup, published monthly, because educational institutions don't 
      profiteer.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Upper Taho, Taho]
    location_features:
      level: site
      location_type: educational
      parent: Upper Taho
      primary_function: Professional training
      notable_features:
        - Pre-Interdict construction
        - Self-powered (stream turbines)
        - Mixed wealth dormitories
      real_world_anchor: "Lake Tahoe (Upper Taho)"
    local_aesthetic: "Antediluvian mystery serving revolutionary education. 20 acres of connected pre-Interdict buildings whose original purpose no one knows—construction techniques beyond current capability, utilities that still partially function after millennia. Now a complex around central plaza: dormitories housing 400 students (assignments deliberately mix wealth levels), lecture halls, laboratories, library. The buildings themselves are strange: materials that look like stone but aren't quite, proportions that feel wrong without being obviously so, rooms that seem larger inside than outside. A stream runs through the complex; the Academy's turbines on it provide power not just for Academy buildings but several blocks of surrounding structures—at cost, zero markup, published monthly: 'Educational surplus provided at zero markup. Service to collective: fundamental principle.' Social life happens in the central plaza and surrounding taverns where students argue politics, debate theology, form relationships across class lines."
  # ─── end Taho Academy ───

