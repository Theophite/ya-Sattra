#   From: # ═══ Entry Name ═══  (through)  # ─── end Entry Name ───
#
# Categories: caste, location, organization, concept, technology, document, person
#
# Schema documentation: GLOSSARY_SCHEMA.md
# ═══════════════════════════════════════════════════════════════════════════════

entries:

  # ===========================================================================
  # CASTE
  # ===========================================================================

  # ═══ Akama ═══
  Akama:
    category: caste
    short: Unclassified caste with scrambled heritage from multiple engineered lineages.
    details: ""
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Thousand Kingdoms, Junta of Ogon]
    caste_features:
      morphology: variable
      scale: variable
      compulsion: unknown
      lifespan: baseline
      cognition: baseline
      population: common
      physical_traits:
        - variable
        - mixed heritage visible
        - scrambled features from multiple lineages
      original_function: none (emergent population)
      current_role: primary Thousand Kingdoms population
      distribution:
        - Thousand Kingdoms
        - northern pastoralist groups in Ganat
      interfertile_with:
        - Akama
      special:
        - defined by practice not genetics
        - Akama = someone who can breed with other Akama + participates in culture
        - distinguishing features of specific castes have blurred into general capability
  # ─── end Akama ───

  # ═══ Archons ═══
  Archons:
    category: caste
    short: Highest tier of Technical Castes, bodies merged with architecture.
    details: ""
    rag_pointer: The Technical Castes and Far Ib
    related: [Technical Castes, Far Ib, Arbitrary Truths]
    caste_features:
      morphology: merged
      scale: variable
      compulsion: unknown
      lifespan: extended
      cognition: enhanced
      population: remnant
      physical_traits:
        - mass of modified tissue ~8 feet diameter
        - surface textured with interfaces, sensors, unknown structures
        - "face remains somewhere: two eyes, mouth, features no longer quite right"
        - biological processes extend through walls and floors
        - nutrient lines run through building conduits
      original_function: hold complete Arbitrary Truths, generate primary inferences
      current_role: survivors calculate while dying at Far Ib
      distribution:
        - Far Ib only
      special:
        - numbered rather than named (order of losing mobility)
        - bodies merged with architecture (cannot be separated)
        - The Seventh Remaining has been calculating for ~4,000 years
        - "attempting to disprove Eighth Testament's mathematics"
        - clone servants attend them (degrading generation by generation)
        - when servants fail, Archons will have no one to maintain nutrient lines
  # ─── end Archons ───

  # ═══ Ashrat ═══
  Ashrat:
    category: caste
    short: "Heat-tolerant labor caste engineered for sustained furnace exposure."
    details: |
      Ya-Don's primary furnace workers. Grey skin from dermal calcium compounds 
      that deepens with age and exposure. Silicate-compound sweat leaves permanent 
      shimmer. Run hot, require enormous caloric intake during shifts.
    rag_pointer: "Castes of Mankind, Ya-Don: Comprehensive Reference"
    related: [Labor Castes, ya-Don, Order of St. Akhmet]
    caste_features:
      morphology: modified
      scale: baseline
      compulsion: susceptible
      lifespan: reduced
      cognition: baseline
      population: common
      physical_traits:
        - "grey skin (pale ash when young, deep charcoal with decades of exposure)"
        - "permanent silicate shimmer from compound sweat"
        - "broad through shoulders"
        - "elevated body temperature (comfortable in near-freezing with single layer)"
        - "visible vascular tracery when flushed from heat"
      original_function: "high-temperature industrial work"
      current_role: "Furnace operations, heat-exchange maintenance"
      distribution:
        - "ya-Don (35% of Order of St. Akhmet membership)"
        - "scattered Imperial industrial sites"
      health_issues:
        - "reduced lifespan (~65 years)"
        - "metabolism burns faster than other castes"
        - "lungs and heart vulnerable to long-term damage"
      special:
        - "require constant caloric intake during shifts (6+ meals daily)"
        - "body cannibalizes itself within hours without food"
        - "off-shift: notorious gourmands with heightened flavor sensitivity"
        - "Ashrat cuisine emphasizes complexity within richness"
        - "Ashrat fatalism shapes caste culture (will updates annual)"
  # ─── end Ashrat ───

  # ═══ Astal ═══
  Astal:
    category: caste
    short: "Rapid-generation colonist caste with dramatically accelerated life cycle."
    details: |
      Designed for rapid colonization. Enhanced spatial cognition, accelerated 
      reproduction, social structures optimized for establishing new settlements. 
      Mature by 8, parents by 10-11, dead by 35. Knowledge transmitted through 
      aphorisms rather than written records.
    rag_pointer: "Castes of Mankind, Ya-Don: Comprehensive Reference"
    related: [Colonist Castes, Quick Lanes]
    caste_features:
      morphology: divergent
      scale: small
      compulsion: susceptible
      lifespan: reduced
      cognition: specialized
      population: rare
      physical_traits:
        - "small and delicate (~5 feet)"
        - "very large translucent bat-like ears with tufts"
        - "large yellow-amber eyes"
        - "small pointed face with pink nose"
        - "pale fur covering body"
        - "slender, almost fragile build"
        - "long thin neck"
      original_function: "rapid planetary colonization"
      current_role: "agricultural labor in marginal territories"
      distribution:
        - "Quick Lanes district (ya-Don)"
        - "scattered marginal settlements"
      health_issues:
        - "lifespan ~35 years maximum"
        - "little sleep as children"
      special:
        - "mature by age 8, married by 11, parents by 10"
        - "generations cycle faster than other castes can track"
        - "name themselves by physical features (Ear Tufts, Pink Tail, Loud Sneeze)"
        - "knowledge encoded in aphorisms, not written records"
        - "enhanced hearing beyond baseline human range"
        - "Quick Chapel provides simplified liturgy for rapid-generation cognition"
  # ─── end Astal ───

  # ═══ Avouvar ═══
  Avouvar:
    category: caste
    short: Radiation-adapted colonist caste with ink-black radiomelanin and extreme longevity.
    details: ""
    rag_pointer: Asovoë and the Avouvar
    related: [Colonist Castes, Asovoë]
    caste_features:
      morphology: modified
      scale: tall
      compulsion: susceptible
      lifespan: extended
      cognition: baseline
      population: rare
      physical_traits:
        - nearly 2 meters tall, most of it leg
        - long legs built for bracing (low-gravity engineering)
        - huge barrel chest (lungs adapted for thin atmospheres)
        - long arms, large hands, arms hang forward
        - head set forward on short neck
        - broad splayed feet, wide stance even when still
        - huge dark eyes adapted for dim conditions
        - wide nose spreading across features
        - "INK-BLACK: uniform from sclera to sole (no whites of eyes)"
        - radiomelanin absorbs light completely (silhouettes given depth)
        - heads shaved clean, skull slightly elongated at back
        - single lock (queue) bound with copper wire indicates house affiliation
      original_function: gas giant moon colonization in radiation belts
      current_role: ya-Tsovez (Asovoë) residents, smelting, trade
      distribution:
        - ya-Tsovez (Asovoë) only
      health_issues:
        - extraordinarily inbred (60k people, 10k years isolation)
        - pervasive radiation accumulates mutations
        - not easily interfertile with other castes
      lifespan_note: hot zone elders may exceed 900 years; peripheral precincts 500; scales with radiation
      special:
        - DNA repair mechanisms activated by radiation prevent senescence
        - longevity scales with contamination level
        - biology REQUIRES radioactive environment (lethal to other castes)
        - politics operates between people who have known each other for 500 years
        - grudges accumulate across centuries
        - ambassadors rotate under different names so no one notices same individuals returning
        - ~60,000 survive
        - "clothing: aurora colors (blues, greens, magentas, violets) against black bodies"
        - "formal dress: dozens of long scarves wrapped into architectural structures"
  # ─── end Avouvar ───

  # ═══ Beamcrawler ═══
  Beamcrawler:
    category: caste
    short: Labor caste with elongated limbs optimized for traversing industrial infrastructure.
    details: ""
    rag_pointer: Castes of Mankind
    related: [Labor Castes, Ductworker]
    caste_features:
      morphology: divergent
      scale: baseline
      compulsion: susceptible
      lifespan: baseline
      cognition: baseline
      population: common
      physical_traits:
        - 6 feet tall but proportions wrong
        - short torso, long limbs
        - arms reach nearly to ankles
        - elongated arms optimized for traversing scaffolding
        - legs designed for climbing rather than walking
        - feet articulated for gripping rather than striding
      original_function: structural maintenance in difficult access areas
      current_role: infrastructure inspection, repair crews on pillars/sky-bridges
      distribution:
        - Imperial cities with elevated infrastructure
      special:
        - awkward gait on flat ground (people stare)
        - "in scaffolding: fluid grace, arms reaching impossible holds"
        - body flows through 3D space as naturally as water flows downhill
        - movement becomes automatic (does not think about it)
        - can access spaces requiring equipment for baseline workers
  # ─── end Beamcrawler ───

  # ═══ Colonist Castes ═══
  Colonist Castes:
    category: caste
