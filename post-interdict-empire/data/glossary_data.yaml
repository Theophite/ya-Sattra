  Merchant Terraces:
    category: location
    short: "Five levels of commercial districts climbing Taho's slope—goods flow down, status flows up."
    details: |
      Each terrace 100-150 feet higher than the last, created by cutting into slope and building 
      massive retaining walls (granite blocks 3-6 feet per side, fitted without mortar in oldest 
      sections). First Terrace: Sultanate period, re-carved facades. Second/Third: late Sultanate 
