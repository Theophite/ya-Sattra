  Namali:
    category: caste
    short: "Major Highborn clone line—often paired with Kēt in hybrid unions for combined cognitive advantages."
    details: |
      Namali clones carry distinctive cognitive modifications. Kēt/Namali hybrids 
      combine both lines' enhancements without identical appearance of either parent 
      line. Such hybrids are valued for specialized roles requiring enhanced cognition 
      without the limitations of pure cloneline appearance.
    rag_pointer: "The Satara, the Bureaus, and Imperial Government"
    related: [Highborn, Cloneline, Kēt, Bureau of the Creche]
