    details: |
      Kēt clones share identical appearance within their line. Counselor Kēt-31 works 
      in Institute of Cognitive Integrity. ISK Director Kaimu Orathdasīr is Kēt/Namali 
      hybrid—union between clone lines producing neither line's identical appearance 
      but both lines' cognitive modifications. His traits make him suited for handling 
      cognito-hazards: perceives dangerous patterns without being captured by them.
    rag_pointer: "The Satara, the Bureaus, and Imperial Government"
    related: [Highborn, Cloneline, Namali, Bureau of the Creche]
