        - "fog cold and damp on mornings"
        - "the smell of salt and industry mingled"
        - "gondola oars and barge engines"
        - "bridge traffic: the rhythm of crossing, the checkpoint pauses"
      key_elements:
        - "the dark water itself (former submarine canyon, unnaturally deep)"
        - "Aureate Span: patent-holder traffic, most ornate"
        - "Clerk's Span: Bureau business, efficient"
        - "Valet's Span: service and delivery traffic"
        - "the cliff route: avoiding bridge declarations entirely"
        - "Westerner berths: where the deep-sea colonists dock"
        - "the Middens edge: where flooded foundations meet the Rift"
