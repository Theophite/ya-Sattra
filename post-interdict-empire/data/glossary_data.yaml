        - Water Guild monopoly
        - Khalim Charter autonomy
        - Commercial courts
        - Ancient catchment basins
      borders:
        northwest: [Ganat proper]
        east: [Marcher Territories]
      real_world_anchor: "Las Vegas area, Nevada (artesian basin)"
    aesthetic_features:
      intention: "Water in the desert is power. The Guild was here before the Republic."
      environment: "Artesian basin in the Mojave—seventeen major springs creating oasis in desert. 400,000 gallons daily through mechanisms no one understands. The city exists because water rises here."
      construction: "Older than Republican Ganat—the Water Guild predates everything. Ancient catchment basins carry names in forgotten languages. Republican structures overlay pre-existing infrastructure. Commercial architecture: caravanserais, trading halls, warehouses."
