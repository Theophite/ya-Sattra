      controlling_entity: Penitent Church
      primary_function: Worship, Confessions
      notable_features:
        - Covered courtyard
        - Seats 400
        - Competitive philanthropy venue
      real_world_anchor: "Southern Colorado highlands (High Junction Old Town)"
    local_aesthetic: "Sultanate administrative building converted to sacred purpose. Two-story adobe, thick walls keeping summer heat and winter cold at bay. The covered courtyard serves as gathering space before and after services—packed during Particular Confessions when the elite justify their wealth. Narrow windows admit shafts of light that move across worn wooden pews through the day. No grand ornamentation: functional architecture made holy by use. The altar occupies what was once a bureaucrat's office. Curate Totha preaches practical theology—works-based atonement demonstrated through action, not rhetoric. When Rasma Dhal-Setil visits, her hour-long Confessions fill every seat and overflow into the courtyard."
  # ─── end Parish of Saint Arsakh ───

  # ═══ Dhal-Setil Compound ═══
  Dhal-Setil Compound:
