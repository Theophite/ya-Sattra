  # ═══ Cloud Temple ═══
  Cloud Temple:
    category: location
    short: "Technical Caste facility in the Ib Mountains—Cloud Temple Band headquarters with quantum link to Far Ib."
    details: |
      One of the few Technical Caste installations maintaining functional connection to 
      Far Ib. Built for consciousness that no longer exists in its designed form—acoustic 
      chambers for parallel communication in the Jargon, biological support systems for 
      bodies already half-merged with infrastructure. The Band has adapted it imperfectly 
      for human occupation.
      
      The quantum computer occupies a central chamber, suspended in liquid helium maintained 
      by cooling systems predating human occupation. Crystal-and-brass mechanism sustains 
      entanglement with Far Ib, producing acoustic output through thousands of horns arrayed 
      across chamber walls. The original design assumed Technical Caste cognition: parallel 
      processing across the full frequency spectrum, communication through sung mathematical 
      proofs. Current listeners improvise interpretation through multiple frameworks.
      
      When the Band found Cloud Temple, a feral Mutterer choir had been maintaining its 
      systems for unknown duration—compulsive optimization preserving infrastructure that 
      Imperial knowledge can no longer understand. The communication cannot be repaired if 
      damaged. No one understands the mechanism well enough to fix it.
    rag_pointer: "The Cloud Temple Band, The Technical Castes and Far Ib"
