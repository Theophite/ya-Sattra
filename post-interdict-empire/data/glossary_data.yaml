  # ─── end Iron Yards ───

  # ═══ Archive Gate ═══
  Archive Gate:
    category: location
    short: "Checkpoint marking boundary between Iron Yards and Medina Quarter."
    details: |
      Spans multiple levels where industrial squalor meets commercial respectability. 
      The Quarantine Shed sits just inside, where Bureau of the Lens inspectors examine 
      suspicious salvage before allowing it into regulated markets. Boundary economy 
      thrives here—Broker Tess Mellish facilitates gray-market transactions.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Medina Quarter, Quarantine Shed, Booksellers' Row]
    location_features:
      level: site
      location_type: infrastructure
      parent: Iron Yards
      primary_function: Boundary control and inspection
      children:
        - Quarantine Shed
      real_world_anchor: "Monterey Bay basin (Iron Yards/Medina boundary)"
    local_aesthetic: "Massive bronze structure spanning multiple levels—the formal boundary where industrial squalor meets commercial respectability. On the Iron Yards side: rust, quarried bedrock, salvage construction. On the Medina side: grey granite, guild markers, maintained antiquity. The bronze of the Gate itself is Medina-style construction, not pre-Interdict—patinated green-black with age, decorated with Bureau of the Lens authentication seals. The Quarantine Shed sits just inside: functional salvage construction, corrugated metal, decontamination pads, inspection tables. Everything crossing this threshold gets examined."
  # ─── end Archive Gate ───

  # ═══ Dry-Dock 3 ═══
  Dry-Dock 3:
    category: location
    short: "Largest dry dock in the Iron Yards."
    details: |
      Maintains a controlled flood for hull repairs—a permanent pool of oily water 
      reflecting sparks from cutting operations above. Northern edge drops toward 
      harbor and the Rift. Dockmaster Pell Pelesar oversees operations.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Rift]
    location_features:
      level: site
      location_type: industrial
      parent: Iron Yards
      primary_function: Ship repair and cutting operations
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "The lowest point in the Yards—cut even deeper into bedrock than the quarried basin floor. Two hundred meters long, capable of receiving the largest vessels. The flood mechanisms are pre-Interdict: controlled flooding still functions through principles the operators don't understand. Dockmaster Pell Pelesar inherited knowledge of its quirks from her father. Permanent pool of oily water at bottom reflects sparks falling from cutting operations above—workers call it the industrial aurora, visible from the Ridge on clear nights. Grey bedrock walls, massive hull sections suspended on cable-rigs. Salt water, tar, dead fish, industrial runoff, hot metal. The scale dwarfs workers."
  # ─── end Dry-Dock 3 ───

  # ═══ Forge Terrace ═══
  Forge Terrace:
    category: location
    short: "Transition zone where Iron Yards industrial facilities give way to worker housing."
    details: |
      Coal forges and cable-splicing shops built into rising stone toward the Ridge. 
      Chimneys create permanent haze pooling against the Ridge's retaining walls. 
      Quarried terracing allows tenements to climb the cliffside without completely 
      blocking light to lower structures.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Ridge]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Iron Yards
      primary_function: Light industry and worker housing
      borders:
        south: [Ridge]
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "Transition zone climbing toward the Ridge: quarried bedrock below, rotated thesad arcology above. Coal forges and cable-splicing shops built into the rising stone—~4,000 people in structures that blur workshop and home. Families live above or behind their forges; industrial heat serves as winter warmth. Chimneys create permanent haze pooling against the Ridge's retaining walls, giving the air a metallic taste residents claim you stop noticing. Quarried terracing allows tenements to climb without blocking light to lower structures. Grey stone, soot-stained, looking up at bronze."
  # ─── end Forge Terrace ───

  # ═══ Breakspar Loft ═══
  Breakspar Loft:
    category: location
    short: "Shipping containers welded to cliff face—vertical worker housing climbing toward the Ridge."
    details: |
      ~1,000 people in forty-odd container units welded to the cliff, connected by 
      catwalks and cable-lift to Torchline Row. Named for the broken ship's mast driven 
      into stone as main structural support. Boss Hella Vordir manages the building—
      former stevedore whose joints gave out at forty-five.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Forge Terrace, Ridge]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Iron Yards
      population: ~1,000
      controlling_entity: Hella Vordir
      primary_function: Worker housing
      borders:
        south: [Ridge]
        below: [Torchline Row]
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "Shipping containers welded to quarried cliff face, stacked and connected by catwalks of steel grating. The broken spar—a ship's mast—driven into stone at an angle and guyed with cables to the Ridge above. Original container paint faded to rust-red or grey-blue. External stairs of welded plate and tube. Windows cut rough into container walls, edged with welded angle iron. Everything rusting—orange-rust, brown-rust, rust spreading like lichen. Through-rust patched with welded plate. Cable-lift descent to Torchline Row. The sound of metal creaking in wind."
  # ─── end Breakspar Loft ───

  # ═══ Torchman's Rest ═══
  Torchman's Rest:
    category: location
    short: "Salvaged modular housing stacked six high—the Iron Yards' largest residential structure."
    details: |
      ~4,500 people in salvaged modular units originally designed for rapid deployment, 
      now stacked six high. Connected by external stairs and rope bridges, creaking 
      alarmingly in high winds but having survived three decades. Elder Cass Kelir 
      leads—former cutting grid worker whose lungs gave out.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Forge Terrace, Ridge]
    location_features:
      level: neighborhood
      location_type: residential
      parent: Iron Yards
      population: ~4,500
      controlling_entity: Elder Cass Kelir
      primary_function: Worker housing
      borders:
        south: [Ridge]
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "Salvaged modular units stacked six high—rapid deployment housing serving its intended purpose in an unintended location. External stairs and rope bridges connecting units. The whole structure creaks in high winds. Mostly families here, not single workers. Elder Cass Kelir's authority derives from having lived here longest and knowing everyone's business without malice. Less rust than Breakspar—the modular units were built to last, even if their arrangement wasn't planned."
  # ─── end Torchman's Rest ───

  # ═══ Quarantine Shed ═══
  Quarantine Shed:
    category: location
    short: "Bureau of the Lens inspection station at the Archive Gate."
    details: |
      Where inspectors examine suspicious salvage before allowing it into Medina Quarter's 
      regulated markets. Inspector Drell Cassin and staff examine materials for patent 
      violations, radiation contamination, and prohibited archaeotech. The boundary 
      between legitimate and illegitimate commerce.
    rag_pointer: The Iron Yards
    related: [Archive Gate, Iron Yards, Bureau of the Lens, Medina Quarter]
    location_features:
      level: site
      location_type: administrative
      parent: Archive Gate
      controlling_entity: Bureau of the Lens
      primary_function: Salvage inspection
      real_world_anchor: "Monterey Bay basin (Archive Gate)"
    local_aesthetic: "Bureaucratic overlay on salvage vernacular. Corrugated walls, decontamination pads, radiation detectors, inspection tables under harsh lighting. Bureau stamps and forms impose imperial order on industrial chaos. Clean enough to work in, dirty enough to belong to the Yards."
  # ─── end Quarantine Shed ───

  # ═══ Salvage Dome ═══
  Salvage Dome:
    category: location
    short: "Pre-Interdict structure housing Salvage Guild operations."
    details: |
      Unknown original purpose. Bronze curves somehow wrong compared to contemporary 
      construction. Forty-foot circular skylights glazed with greenish pre-Interdict 
      material. Carved relief covers every surface: geometric patterns, figures in 
      profile, unreadable script. Auction floor runs three-hour cycles. Oracle shrine 
      in eastern corner maintained by Curate Varen Taasaren. Northern annexes house 
      radiation containment, chemical processing, underground vaults.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Salvage Guild]
    location_features:
      level: site
      location_type: commercial
      parent: Iron Yards
      controlling_entity: Salvage Guild
      primary_function: Auction house and salvage administration
      notable_features:
        - Pre-Interdict construction
        - Oracle shrine
        - Underground vaults
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "The one piece of pre-Interdict architecture in the Iron Yards—thesad walls, the same bronze-colored alloy as the Inner City, rising from quarried grey bedrock. Two hundred feet across, seventy feet high at the apex. Forty-foot circular skylights glazed with greenish pre-Interdict glass. Carved relief on every surface: geometric patterns, figures in profile, script no one can read. Inside, centuries of catwalks added in layers—masters' offices at top, ground-level logistics below. The bronze floor worn to bright gold-red in traffic paths, dark patina elsewhere. Impossible architecture surrounded by industrial salvage."
  # ─── end Salvage Dome ───

  # ═══ The Pit ═══
  The Pit:
    category: location
    short: "Decontamination pad for radiation-tagged salvage in the Iron Yards."
    details: |
      Circular depression near the Salvage Dome's eastern side. Ground sealed with 
      archaeotech polymer that nothing grows through. Radiation-tagged salvage gets 
      dumped here from Lift-3. Workers in protective gear process hot materials before 
      they enter the regular salvage stream.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Salvage Dome]
    location_features:
      level: site
      location_type: industrial
      parent: Iron Yards
      primary_function: Radiation decontamination
      hazards:
        - Radiation exposure
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "Circular depression near the Salvage Dome—the Yards' most dangerous work-site. The ground is sealed with archaeotech polymer: grey, sterile, inhuman. Nothing grows through it. Nothing stains it. The polymer is pre-Interdict, like the Dome beside it—two pieces of impossible material amid quarried bedrock. Hot materials arrive from Lift-3, glowing faintly, radiation counters clicking. Workers in heavy protective gear move carefully. The Pit processes what would kill anyone else before it enters the regular salvage stream."
  # ─── end The Pit ───

  # ═══ Torchline Row ═══
  Torchline Row:
    category: location
    short: "Commercial strip on elevated ridge above the Iron Yards."
    details: |
      Named for constant rain of welding sparks—fire-resistant construction is survival 
      requirement. Businesses maintain calibrated relationships with competing powers. 
      Key establishments: Den Vesh (blind salvage assessor), Seru and Sari (protective 
      tailoring), Cask and Flux pharmacy, Coil-Bone Clinic, Yellow Glass Bathhouse, 
      Yen Tam Seven Branches gambling house.
    rag_pointer: The Iron Yards
    related: [Iron Yards, Yen Tam Beneficial Society]
    location_features:
      level: neighborhood
      location_type: commercial
      parent: Iron Yards
      children:
        - Den Vesh Salvage Assessment
        - Seru and Sari Protective Tailoring
        - Cask and Flux
        - Coil-Bone Clinic
        - Yellow Glass Bathhouse
        - Yen Tam Seven Branches
        - The Burned Hand
        - The Char
        - Morrow's Tools
      primary_function: Worker services and commerce
      notable_features:
        - Fire-resistant construction
        - Elevated above industrial floor
      real_world_anchor: "Monterey Bay basin (Iron Yards)"
    local_aesthetic: "Quarried limestone ridge elevated above the basin floor—the stone was cut away millennia ago, fed into arcology construction that later fell. Now the terraces serve as foundation for the district's commercial strip. Fire-resistant construction required: ceramic tile, stone, treated wood. No orb-fixtures here—torch-lit at night, the flames that give the Row its name. Constant rain of welding sparks from cutting operations below. Shopfronts display goods behind protective barriers. Pipefitter, Guild, and Yen Tam markers compete for wall-space. Grey stone, rust-stained, spark-scarred."
  # ─── end Torchline Row ───

  # ═══ Den Vesh Salvage Assessment ═══
  Den Vesh Salvage Assessment:
    category: location
    short: "Blind assessor handling materials too dangerous for Guild certification."
    details: |
      Den Vesh lost his sight to radiation cataracts but claims he can still perceive 
      Cherenkov glow from hot materials. Assesses radiation-tagged salvage that would 
      trigger quarantine if examined through official channels. Pays Yen Tam for protection, 
      Union for transport, Iron Yards Boys to ensure neither organization decides he's 
      more valuable as an example than as revenue.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards, Yen Tam Beneficial Society]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      primary_function: Illicit salvage assessment
      hazards:
        - Radiation exposure
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Reinforced metal structure designed to repel both radiation and curiosity. Lead-lined walls, no windows. The blind proprietor moves by memory through spaces most avoid. Radiation counters click constantly. Customers enter quickly, leave quickly. Grey metal, spark-pitted, deliberately anonymous amid Torchline Row's commerce."
  # ─── end Den Vesh Salvage Assessment ───

  # ═══ Seru and Sari Protective Tailoring ═══
  Seru and Sari Protective Tailoring:
    category: location
    short: "Twin sisters producing protective garments for salvage workers."
    details: |
      Compact brick building, 15x20 feet, two stories, lead-lined walls. Twin near-baseline 
      sisters with enhanced color vision distinguish between subtle fabric treatments. 
      Produce lead-thread aprons, radiation-resistant coveralls, spark-protective masks 
      with mica lenses. Maintain neutrality—a Chain-Man's apron sewn with same care as 
      a Pipefitter's. Forty-seven, unmarried, refuse all offers to expand.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      primary_function: Protective clothing manufacture
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Compact brick amid Torchline Row's fire-resistant construction. Lead-lined walls because they work with radiation-tagged materials. Inside: workbenches worn smooth by decades of identical movements, fabric bolts sorted by protective quality, finished garments hanging in careful rows. The twins move in unison. The shop is exactly the size they can manage together."
  # ─── end Seru and Sari Protective Tailoring ───

  # ═══ Cask and Flux ═══
  Cask and Flux:
    category: location
    short: "Pharmacy skirting legality—painkillers, radiation ointments, stimulants."
    details: |
      Keth Varemgiren stocks chemical compounds in careful ratios that skirt legality. 
      Painkillers diluted just enough to avoid narcotic classification, radiation 
      ointments that might be industrial sealant repackaged, stimulants keeping workers 
      functional through double shifts. Adjacent to the Coil-Bone Clinic.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards, Coil-Bone Clinic]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Keth Varemgiren
      primary_function: Quasi-legal pharmacy
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Shelves of bottles and jars, labels hand-written in pharmacological shorthand. The smell of chemicals, alcohol, ground herbs. Keth Varemgiren knows exactly how much dilution keeps a compound legal. Workers come in describing symptoms; he produces something that helps without asking questions. Fire-resistant brick, small windows, the careful organization of someone skirting multiple laws."
  # ─── end Cask and Flux ───

  # ═══ Coil-Bone Clinic ═══
  Coil-Bone Clinic:
    category: location
    short: "Unofficial medical facility for workers who can't access legitimate healthcare."
    details: |
      Adjacent to the Cask and Flux, also operated by Keth Varemgiren. Provides medical 
      treatment that would require credentials he doesn't have. Bone-setting, wound 
      treatment, radiation sickness management. The name refers to the spiral fractures 
      common in salvage accidents.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards, Cask and Flux]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Keth Varemgiren
      primary_function: Unlicensed medical care
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Treatment tables, surgical implements sterilized by methods Keth learned somewhere he doesn't discuss. The coil-bone fractures that give the clinic its name displayed in specimen jars—spiral breaks from cable-snap injuries, teaching examples. Blood stains that don't quite scrub out. Workers trust Keth because he's still here after decades, which means he hasn't killed too many patients."
  # ─── end Coil-Bone Clinic ───

  # ═══ Yellow Glass Bathhouse ═══
  Yellow Glass Bathhouse:
    category: location
    short: "Bathhouse, flophouse, and decontamination facility under Yen Tam oversight."
    details: |
      Pre-Interdict glass panels filter light to pale amber-gold. Communal baths heated 
      by coal-fired boilers, sleeping platforms curtained by canvas (forty obols/night), 
      decontamination facilities. Under Yen Tam accounting oversight, also launders money 
      through inflated maintenance costs. Staff knows not to ask questions.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards, Yen Tam Beneficial Society]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Yen Tam Beneficial Society
      primary_function: Bathing, lodging, decontamination
      notable_features:
        - Pre-Interdict yellow glass panels
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "The yellow tint is slight—more amber or pale gold—but distinctive. Pre-Interdict glass panels that somehow survived when the arcologies fell. Inside: steam, coal smoke, wet wool, human bodies, carbolic disinfectant. Windows fog constantly, water condenses and drips. Workers cleaning up after shifts, laborers too poor for housing, radiation-exposed needing decontamination. The one piece of beauty in a functional space."
  # ─── end Yellow Glass Bathhouse ───

  # ═══ Yen Tam Seven Branches ═══
  Yen Tam Seven Branches:
    category: location
    short: "Gambling den with ya-Tsatsan religious observance—serious, quiet, dangerous."
    details: |
      Converted forge building, 50x60 feet. Soot-stained ceiling from decades of forge 
      operation. Shrine with seven brass plates in open octagon, eighth point a mirror. 
      Seven-sided dice, Testament-suit cards, seven-fold betting structures. Religious 
      observance disguised as (or simultaneous with) gambling. Yen Tam family members 
      deal and watch.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards, Yen Tam Beneficial Society]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Yen Tam Beneficial Society
      primary_function: Gambling, religious observance
      notable_features:
        - Seven-brass-plate shrine
        - Ya-Tsatsan gambling style
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Soot-black ceiling from the building's forge days—permanent, atmospheric. Oil lamps create pools of amber light while corners stay dark. Timber tables, serious players studying seven-sided dice and Testament-suit cards. This isn't rowdy gambling—the games are religious observance. The shrine's seven brass plates inscribed with Jargon, the eighth point a mirror reflecting the room. Quiet, careful, and everyone knows the Yen Tam are watching."
  # ─── end Yen Tam Seven Branches ───

  # ═══ The Burned Hand ═══
  The Burned Hand:
    category: location
    short: "Primary tavern of the Iron Yards—three connected buildings, multiple entrances."
    details: |
      Sprawling establishment useful for those who prefer not to be seen entering or 
      leaving together. Named for the forge-burned handprint pressed into bronze above 
      the main door—allegedly left by a worker who couldn't afford treatment. Run by 
      Kella Varn, a near-baseline woman who lost her left arm to a cutting accident.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Kella Varn
      primary_function: Tavern
      notable_features:
        - Three connected buildings
        - Multiple entrances
        - Bronze handprint above door
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Three buildings connected by passages, multiple entrances for discrete arrivals and departures. The bronze handprint above the main door—a worker's forge-burned palm pressed into cooling metal, the scar of someone who couldn't afford treatment and used the wall to steady himself. Inside: smoke, ale, the complicated social negotiations of the Iron Yards. Kella Varn watches everything with the attention of someone who lost an arm to inattention."
  # ─── end The Burned Hand ───

  # ═══ The Char ═══
  The Char:
    category: location
    short: "Cheap food kitchen for workers who can't afford the Burned Hand."
    details: |
      Cramped kitchen where Grandmother Shen produces rice porridge, pickled vegetables, 
      and whatever protein she found cheap at market. Forty years cooking in the Iron 
      Yards. Knows which crews are flush, which are desperate, which foremen can be trusted.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Grandmother Shen
      primary_function: Cheap food
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Cramped, steam-filled, the smell of rice porridge and pickled vegetables. Grandmother Shen moves through her kitchen by forty years of muscle memory. Workers eat standing or crouching—no room for tables. The cheapest food on Torchline Row, which means the most honest customers. She knows the Yards' rhythms better than the foremen."
  # ─── end The Char ───

  # ═══ Morrow's Tools ═══
  Morrow's Tools:
    category: location
    short: "Hand equipment sales and repairs for salvage work."
    details: |
      Cutting torches, pry bars, specialized instruments for working different materials. 
      The tools that keep salvage workers alive—or don't, if poorly maintained. Cass 
      Morrow runs the shop with the precision of someone whose livelihood depends on 
      equipment that doesn't fail.
    rag_pointer: The Iron Yards
    related: [Torchline Row, Iron Yards]
    location_features:
      level: site
      location_type: commercial
      parent: Torchline Row
      controlling_entity: Cass Morrow
      primary_function: Tool sales and repair
      real_world_anchor: "Monterey Bay basin (Torchline Row)"
    local_aesthetic: "Tools hung on every wall surface, sorted by function and condition. The smell of machine oil and metal. Cass Morrow tests each item before sale—a cutting torch that fails mid-cut kills the worker holding it. Fire-resistant construction like everything on the Row, but here the concern is sparks from grinding wheels and test-fires. Precision in a district that destroys the imprecise."
  # ─── end Morrow's Tools ───

  # ═══ Kma-Dhol Quarter ═══
  Kma-Dhol Quarter:
    category: location
    short: Areas of Ogon accessible only to sewer-fisher Technical Caste descendants.
    details: "40,000 Kma-Dhol live throughout Ogon as recognized technical specialists. Occupy ziggurat upper levels, suspended platforms, compression passages. Operate openly under theological framework treating them as possessing 'clever souls.'"
    rag_pointer: "The Thousand Kingdoms: Overview"
    related: [Ogon, Kma-Dhol]
    location_features:
      level: district
      location_type: residential
      parent: Ogon
      population: ~40,000
      primary_function: Technical services
      castes_present:
        - Kma-Dhol
      notable_features:
        - Compression passages
        - Slip-joint routes
        - Ziggurat upper levels
      real_world_anchor: "Columbia River mouth (within Ogon)"
  # ─── end Kma-Dhol Quarter ───

  # ═══ Kolaëvin ═══
  Kolaëvin:
    category: location
    short: Warehouse precinct controlling food storage in Asovoë.
    details: Absolutist governance under Patriarch Teszvorath (117 years surviving internal politics). Controls when food enters storage. Internal succession violent but hidden.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Czernaël]
    location_features:
      level: district
      location_type: industrial
      parent: Asovoë
      controlling_entity: Patriarch Teszvorath
      primary_function: Food storage
      castes_present:
        - Avouvar
      real_world_anchor: "Fraser River delta"
    aesthetic_features:
      intention: "Food enters when we permit. The granaries are ours."
      environment: "Warehouse district—vast autofactory storage halls maintained at precise temperatures. Climate-controlled for millennia by systems no one fully understands."
      construction: "Asovoë standard: wrong-scale storage facilities. Avouvar living quarters tucked into corners of vast refrigerated halls. Fabric partitions creating warm spaces within cold storage."
      visual_vocabulary:
        - "Asovoë standard: autofactory infrastructure, Highborn proportions"
        - "Warehouse sublime: storage facilities scaled for absent populations"
      materials:
        - "autofactory climate control systems"
        - "preserved food stores (fish, grain, preserved goods)"
        - "insulating fabric partitions"
      colors:
        - "frost-white storage areas"
        - "void-black structural elements"
        - "aurora-bright Avouvar against cold grey"
      sensory:
        - "cold—constant climate control, breath visible"
        - "the hum of refrigeration systems"
        - "food smells: preserved fish, grain, dried goods"
      key_elements:
        - "Patriarch Teszvorath's 117-year reign"
        - "violent but hidden succession politics"
        - "control over food storage as leverage"
        - "partnership with Czernaël for San Juan factorias"
  # ─── end Kolaëvin ───

  # ═══ Kraëlosz ═══
  Kraëlosz:
    category: location
    short: The Eldest House—ancients who may exceed 900 years occupy the most contaminated precinct.
    details: |
      Occupies the former Highborn administrative quarter, the most contaminated zone in Asovoë. 
      True ancients never leave their chambers, surrounded by descendants to the twentieth generation, 
      paranoid beyond capacity for normal politics. Automated servitors still deliver unique luxury 
      goods from underground terminals. The house offers retirement to elders from other precincts—
      another 250 years in exchange for the hot zone's flux. Matriarch Czenovaë Vroëszka (870 years) 
      purchased a tower here four centuries ago for longevity research, abandoning her own house.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Vroëszka]
    location_features:
      level: district
      location_type: residential
      parent: Asovoë
      castes_present:
        - Avouvar
      hazards:
        - "Most severe contamination in the city"
        - "Lethal to visitors within hours without protection"
      notable_features:
        - "Ancients exceeding 900 years"
        - "Automated servitors delivering luxury goods"
        - "Retirement destination for elders seeking extended lifespan"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "We have outlasted everything. We will outlast what comes next. Do not look for us."
      environment: "Former Highborn administrative quarter—the most contaminated, longest-lived territory. True ancients huddle in chambers deep within, never emerging. The flux that kills visitors extends residents' lives toward a millennium."
      construction: "Architecture for bodies the Avouvar do not possess: 40-foot ceilings, 9-foot doorways, corridors 15 feet wide. Furniture for forms that stretched rather than compressed. The Avouvar build platforms on furniture, partition vast chambers with fabric, cluster in corners of rooms designed for single Highborn. The adaptations are millennia old but never naturalize."
      visual_vocabulary:
        - "Deliberate silence: no spotlights, no banners, no announcement"
        - "Diffuse Highborn lighting—twilight that never becomes day or night"
        - "Ghostly: visitors cannot determine where the ancients are"
        - "Automated servitors on unknowable errands"
      materials:
        - "Highborn-scale administrative infrastructure (radically wrong proportions)"
        - "substrates that still respond to stimuli: walls shifting colors, panels displaying unreadable data"
        - "fabric partitions creating human-scale spaces within inhuman architecture"
        - "luxury goods from underground terminals (unique, unpredictable, incomprehensible)"
      colors:
        - "void-black architecture"
        - "wall substrates cycling through colors that correlate with nothing Avouvar produce"
        - "diffuse, sourceless illumination casting no shadows"
        - "aurora-bright Avouvar too small for the frames that contain them"
      sensory:
        - "disorienting architecture: too large, too Highborn, no cues for time or direction"
        - "maintained emptiness identical to empty districts—presence revealed only through accumulating evidence"
        - "servitors passing on unknowable errands without acknowledging observers"
        - "the Kraëlosz materializing from doorways visitors did not notice"
        - "silence deeper than contemplation—withdrawal from politics, commerce, culture"
      key_elements:
        - "True ancients (900+ years) never leave chambers"
        - "Twenty generations of descendants serving as intermediaries"
        - "Paranoia as architecture: diffusion, not concealment"
        - "Retirement destination for elders from other houses"
        - "Matriarch Czenovaë's tower (purchased from Vroëszka wealth)"
        - "Automated servitors delivering luxury goods no one understands"
  # ─── end Kraëlosz ───

  # ═══ Ködhegy ═══
  Ködhegy:
    category: location
    short: Fog Hill—highest of the nine refugee villages around Szürkevíz.
    details: 300 meters above harbor. ~400 residents. Völërath (19), Szkovërin (47), Draëthen (remainder). Three defensive gates. Fog catchment for water. Founded ~6,000 years ago.
    rag_pointer: The Volerath of Puget Sound
    related: [Szürkevíz]
    location_features:
      level: district
      location_type: settlement
      parent: Szürkevíz
      population: ~400
      primary_function: Defensive settlement, autofactory sorting
      castes_present:
        - Völërath
        - Szkovërin
        - Draëthen
      notable_features:
        - Fog catchment
        - Defensive gates
        - Hilltop position
      real_world_anchor: "Puget Sound (hill village)"
  # ─── end Ködhegy ───

  # ═══ Lavoëran ═══
  Lavoëran:
    category: location
    short: "The Cloning Precinct—children descend at age one, don't emerge until thirty."
    details: |
      Operates the underground facility where Medials are grown. Children born to Lavoëran 
      mothers descend into sterile halls within their first year and do not see sunlight until 
      they're ready to be named—thirty years later. Survival rate for late Anointing: sixty 
      percent. This strange childhood makes Lavoëran alien even to other Avouvar. The house 
      also operates the Chancery and provides most medical services; their monopoly on Medial 
      production makes them untouchable.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Medials]
    location_features:
      level: district
      location_type: administrative
      parent: Asovoë
      controlling_entity: Chancellor Koratvel
      primary_function: Medial production, Chancery
      castes_present:
        - Avouvar
      hazards:
        - "Surface territory contaminated (like all Asovoë)"
        - "Underground halls absolutely sterile—the opposite extreme"
      notable_features:
        - "Underground cloning facility (shielded from radiation)"
        - "30-year childhood in sterile darkness"
