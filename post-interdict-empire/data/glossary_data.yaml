  # ─── end Colonist Castes ───

  # ═══ Ductworker ═══
  Ductworker:
    category: caste
    short: Labor caste engineered for confined space navigation with compressible ribcage.
    details: ""
    rag_pointer: Castes of Mankind
    related: [Labor Castes, Beamcrawler]
