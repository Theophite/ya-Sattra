  # ═══ Far Wall ═══
  Far Wall:
    category: location
    short: "Government and bureaucracy side of Glen Canyon—Senate Chamber, ministry warrens, Cathedral atop."
    details: |
      The canyon wall hosting government, bureaucracy, and transformed wealth. Lower levels: 
      bureaucratic warrens notoriously confusing—endless tunnels connecting offices, meeting 
      rooms, archive storage. Mid-level: the Senate Chamber, 80 feet in diameter, revolutionary 
      reliefs carved over monarchical scenes. Higher up: Hereditary Debtors' quarter, former 
      slave quarters now valuable property. Atop: the Cathedral, former palace of Sultana Ulayah, 
      now Patriarch Kaleb's seat, partially overhanging the cliff.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
    related: [Ganat proper, Near Wall]
    location_features:
      level: district
      location_type: administrative
      parent: Ganat proper
      children:
        - Bureaucratic Warrens
        - Senate Chamber
        - Hereditary Debtors' Quarter
        - The Cathedral
      borders:
        across_canyon: [Near Wall]
      real_world_anchor: "Glen Canyon (Ganat proper, government-side wall)"
    local_aesthetic: |
      Power carved from stone. Lower levels: bureaucratic warrens—Cappadocian-scale underground 
      administration, aggressively lit with Dawn Party aesthetic of transparency through illumination. 
      Electric bulbs every few feet, exposed wiring on ceramic insulators, transformer boxes humming at 
      junctions. Nothing hidden because power is free and hiding costs political capital. Endless tunnels 
      connecting offices, meeting rooms, archive storage. Spiral ramps connect levels rather than discrete 
      stairs. A petitioner might spend hours navigating the three-dimensional maze.
      
      Mid-level: the Senate Chamber, circular, 80 feet in diameter, revolutionary reliefs carved 3-4 
      inches deep over monarchical scenes—the originals faintly visible underneath, palimpsest politics. 
      Art Nouveau figures at Gaudí scale: 20-25 feet tall, robes flowing, hair like flames. The chamber 
      itself is Earthship logic: thermal mass carved from living rock, natural temperature regulation, 
      the canyon breathing through ventilation shafts.
      
      Higher: Hereditary Debtors' quarter, former slave quarters now valuable real estate—transformed, 
      expanded, decorated with Art Nouveau carved facades and stained glass. The bitter irony made 
      beautiful: the children of slaves living better than their owners' grandchildren.
      
      Atop it all: the Cathedral, massive sandstone structure on the canyon rim. 1890s Southwest 
      territorial architecture meeting carved grandeur—adobe and vigas above, carved stone below, the 
      Patriarch's seat partially overhanging the cliff, visible from across the canyon. Revolutionary 
      broadcasting equipment incongruously modern against Art Nouveau facades covering every accessible 
      surface: flowing curves, figurative scenes, relief work 2-3 feet from the wall.
  # ─── end Far Wall ───

  # ═══ Bureaucratic Warrens ═══
  Bureaucratic Warrens:
    category: location
    short: "Ministry tunnels in the Far Wall's lower levels—notoriously confusing, aggressively lit."
    details: |
      Endless tunnels connecting offices, meeting rooms, archive storage. A petitioner might 
      spend hours navigating. Electric bulbs every few feet—Dawn aesthetic of transparency 
      through illumination, nothing hidden in darkness. Forms processed, reports written, 
      administrators coordinating between government and kilits.
    rag_pointer: Ganat and the Yarangar War, The Republic of Ganat
