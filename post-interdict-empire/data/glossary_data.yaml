  # ═══ Vroëszka ═══
  Vroëszka:
    category: location
    short: "Smelter precinct controlling bulk metal production—autofactory terminals, not furnaces."
    details: |
      Controls the autofactory terminals that extrude the metals making Asovoë worth trading with. 
      The process is not conventional smelting—no furnaces, no ore, no fuel. The terminals draw on 
      the autofactory's deeper systems, producing alloys according to specifications established 
      before the revolt. Seven elders over six hundred years old govern through a council that agrees 
      on nothing. Matriarch Czenovaë (870 years old) withdrew four centuries ago into theological 
      speculation in Kraëlosz, leaving the house to fracture. The schism that created Sztoavel 
      occurred because she was not there to prevent it.
    rag_pointer: Asovoë and the Avouvar
    related: [Asovoë, Sztoavel, Kraëlosz, The Smelters]
    location_features:
      level: district
      location_type: industrial
      parent: Asovoë
      member_of: The Smelters
      controlling_entity: Vroëszka council (seven elders)
      primary_function: Bulk metal production
      castes_present:
        - Avouvar
      notable_features:
        - "Autofactory terminals (not furnaces)"
        - "Peninsula geography (water on three sides)"
        - "Labor-caste proportions (fit Avouvar better than most of city)"
      real_world_anchor: "Fraser River delta (Asovoë)"
    aesthetic_features:
      intention: "The terminals produce. We collect what comes out. We do not understand; we distribute."
      environment: "Peninsula extending into Fraser delta, water on three sides. Defensible geography: single land approach, natural chokepoints. Industrial byproduct contamination different from hot-zone radiation—heavy metals, exotic compounds, residues from incomprehensible processes."
      construction: "Labor-caste infrastructure: corridors wide for cargo, ceilings high for heat dissipation, floors reinforced for heavy loads. Proportions fit Avouvar bodies better than Highborn or Warborn architecture—the workers who built these facilities were near-baseline humans. Less modification needed than elsewhere in Asovoë."
      visual_vocabulary:
        - "Autofactory terminals: metal emerges according to ancient specifications"
        - "Labor-caste proportions: the rare spaces that almost fit"
        - "Peninsula isolation: water barriers, defensive geography"
        - "No furnaces: production without fire, ore, or fuel"
      materials:
        - "autofactory terminal infrastructure (incomprehensible)"
        - "extruded metals: ingots, sheets, rods, wire"
        - "labor-caste construction (near-baseline proportions)"
        - "industrial byproducts channeled to river"
      colors:
