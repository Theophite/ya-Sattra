    details: |
      Orders emerge from the Black Door commanding that populations be vel-kerith: 
      "Let the bloodline be extinguished," "rendered unto those-who-receive." The 
      places and families named are real. But when Tariq transmitted such an order, 
      the targeted family survived intact. Vel-kerith may mean physical death, 
      transformation, inscription, or something with no external symptoms. The 
      root "kerith" relates to consumption-that-testifies. The Emperor reaches for 
      "whatever is closest" when the receivers demand feeding—not judgment but 
      necessity. Whether transmission is required, whether effects are observable, 
      what actually happens: all unknown. Tariq defaults to non-transmission.
    rag_pointer: The Emperor, In-Universe Documents
    related: [Emperor, Black Door, First Whorl, kerith-sah]
  # ─── end vel-kerith ───

  # ═══ kerith-sah ═══
  kerith-sah:
    category: concept
    short: "Emperor-specific term: the thing consumed that thereby testifies."
    details: |
      Appears in Imperial missives describing the Emperor's perceptions. The kerith-sah 
      has a face. It looks at the Emperor. It testifies that "judgment is required" 
      but does not specify what or whom. Then the receivers consume it. Tariq 
      speculates it may be an extracted life-record—the complete encoding of a human 
      existence laid upon the vel-om for evaluation. But he cannot verify this. The 
      -sah suffix marks agent, patient, or witness; the kerith-sah may be all three.
    rag_pointer: The Emperor, In-Universe Documents
    related: [Emperor, vel-kerith, vel-om]
  # ─── end kerith-sah ───

  # ═══ Whorl-Lag ═══
  Whorl-Lag:
    category: concept
    short: "Temporal distortion effects bleeding between Whorls."
    details: |
      Chronometer drift, memory dissonance, the persistent sensation of déjà vu called 
      "the echo." Effects intensify toward the center. In the Second Whorl, meetings 
      have unpredictable duration—six hours subjective might be a day outside. Senior 
      bureaucrats learn to schedule by subjective duration rather than clock time.
    rag_pointer: The Inner City
    related: [Inner City, Second Whorl, The Echo, First Whorl]
  # ─── end Whorl-Lag ───
