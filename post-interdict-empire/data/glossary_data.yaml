      Five organic towers rise from a shared base of living tissue—grown rather than built. 
      Walls pulse with slow biological rhythms, bioluminescent rather than lit. Seleth es-Poel, 
      sixty-three, has never left the central spire; her metabolism is linked to the tower's 
      enzymatic production. Translation crèches visible through organic membrane windows.
