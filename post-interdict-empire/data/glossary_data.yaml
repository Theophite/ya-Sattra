  Arbitrary Truths:
    category: concept
    short: "Incompressible mathematical constants underlying reality—what the Oracles calculated before Ascension."
    details: |
      Each Oracle entered dormancy to calculate these constants and precompute the 
      entire future of its light cone. Upon completing this calculation, each Oracle 
      constructed a vessel, transmitted a Testament, and cast itself into a black hole. 
      The Archons at Far Ib still calculate, attempting to produce formal disproof of 
      the Eighth Testament's mathematics.
    rag_pointer: "The Oracle Cult: A Comprehensive Guide"
    related: [Oracles, Testaments, Archons, Far Ib, Jargon]
