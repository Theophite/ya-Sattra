      environment: "The flooded portion of ya-Sattra where Monterey Submarine Canyon still holds water. Dark water unnaturally deep—the canyon plunges hundreds of feet below. Fog rises from the water on cold mornings. The Rift separates commercial Medina (south) from hereditary Antediluvian Quarter (north), with the Middens' flooded foundations on the western edge."
      construction: "Industrial docks on the Medina side—warehouses, cargo handling, Westerner berths. Three bridges span the narrower sections, each declaring the status of who may cross: Aureate Span (patent-holders and their representatives), Clerk's Span (Bureau traffic), Valet's Span (servants and commercial deliveries). Gondolas and barges for those who prefer not to declare."
      visual_vocabulary:
        - "Venice: water penetrating the city, bridges defining routes, status embedded in navigation"
        - "Industrial harbor: cranes, docks, cargo movement, Westerner ships as exotic presence"
        - "The three bridges: architectural statements of hierarchy made crossable"
        - "The cliff route: circling around the Rift's tip for those avoiding bridge declarations"
      materials:
        - "dark water (unnaturally deep, former submarine canyon)"
        - "dock infrastructure (industrial, functional)"
        - "bridge construction (stone, metal, each aesthetically distinct)"
        - "Westerner ship materials (the most exotic visual element—deep-sea construction visible)"
      colors:
        - "dark water: not blue but grey-black, absorbing light"
        - "fog: grey-white rising from the water"
        - "dock grey: industrial weathering"
        - "Antediluvian Quarter across the water: bronze and white above the dark"
        - "Westerner ships: materials from the deep-sea colonies, unfamiliar alloys"
      sensory:
