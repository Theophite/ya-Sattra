      borders:
        below: [Iron Yards, Middens]
        east: [Medina Quarter]
      real_world_anchor: "Monterey Bay basin (Rotten Quarter, elevated)"
    aesthetic_features:
      intention: "We are skilled craftspeople, not Rotten Quarter poor. Technical dignity."
      environment: "The Ninth Horizon Terrace—a Medina arcology like those in the Inner City—fell ON ITS SIDE in antiquity. What was once an exterior wall is now the top, where a road runs. What were interior corridors and chambers are still interior—just rotated. Floors became walls. Walls became floors and ceilings. The Ridge is 100 meters high because the arcology was 100 meters WIDE."
      construction: "This is thesad architecture—the same bronze-colored alloy as the Inner City—but rotated 90 degrees. The road on top (Horizon Row) runs along what was once the arcology's exterior face. Below that, the interior spaces (The Arcades) are still interior—just rotated. What were elevator shafts are now horizontal corridors. What were floors are now walls. Generations of cutting and adapting have made it usable: new floors laid across old walls, doorways carved through ceilings, platforms everywhere. Some orb-fixtures still function, casting shadowless light from what are now walls or floors."
      visual_vocabulary:
        - "Shipwreck architecture: a vessel on its side, everything rotated"
        - "Fourth Whorl rotated 90 degrees: same materials, same proportions, but floors are walls now"
        - "Elevator shafts become corridors: vertical passages now horizontal"
        - "Medina guild culture transplanted: Horizon Row (on top) has cobblestones and propriety"
        - "Iron Yards connection below: cable lifts descending from the rotated structure"
      materials:
        - "thesad: the same bronze-colored Antediluvian alloy as the Inner City (self-repairing even sideways)"
        - "orb-fixtures: some still function, now casting light from walls or what were ceilings"
        - "adaptation materials: new floors, platforms, carved doorways—generations of making it usable"
        - "workshop equipment in spaces never designed for this orientation"
      colors:
        - "bronze thesad walls (same as Fourth Whorl, pristine and self-repairing)"
        - "adaptation materials: whatever was available, mixed salvage colors"
        - "orb-fixture light: warm, shadowless, from wrong angles"
        - "cleaner than Yards or Middens—maintained with technical pride"
      sensory:
        - "the constant wrongness of rotated architecture: walking on what were walls, reaching up to what were floors"
        - "orb-fixture light from wrong surfaces—walls, floors, wherever they ended up"
        - "workshop sounds echoing in spaces with acoustics designed for different orientations"
        - "former elevator shafts as horizontal corridors—the proportions feel wrong"
        - "cleaner air than Yards (elevated above industrial fumes)"
        - "cable-lift creaking (the Iron Yards connection)"
      key_elements:
        - "the 90-degree rotation: floors are walls, walls are floors, exterior is now on top"
        - "Horizon Row: the road on TOP, running along what was once the exterior wall"
        - "the Arcades: interior spaces rotated and cut up—elevator shafts become corridors"
        - "~90 archaeotech workshops in adapted interior spaces"
        - "the Ridge gait: navigating constant vertical-to-horizontal transitions"
        - "Penthouse Block: infrastructure families in rotated chambers"
        - "thesad still self-repairing (pristine bronze next to worn adaptations)"
