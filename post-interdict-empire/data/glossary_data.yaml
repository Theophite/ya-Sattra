    aesthetic_features:
      intention: "I belong here. I have access. I maintain what I was given."
      environment: "Commercial bustle atop ancient foundations. Pre-Interdict buildings with 50,000 years of continuous occupation show floors worn into canyons, door thresholds worn through to substrate. Mediterranean climate. Gateway where outside world meets Imperial authority."
      construction: "Interstitial construction: stone, brick, wood buildings (3-5 stories) built BETWEEN ancient bronze columns, never touching them. The five-foot gap maintained around columns for reasons no one remembers. Buildings on arcology foundations, working around ancient systems that still function."
      visual_vocabulary:
