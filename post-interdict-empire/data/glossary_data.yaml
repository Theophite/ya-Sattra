    details: |
      Ta-Kefyeh shtetls operate outside commercial economy, paying tithes rather than 
      taxes under treaty rather than regulation. Cultivate alien plants: bloodfruit, 
      St. Idrin's Bells, stiltwood. Pharmaceutical production (bug honey) exists 
      entirely outside the permit raj—Creche cannot claim oversight of non-human 
      entities under pre-Charter treaties. Thornwood Shtetl, Hillcrest Shtetl are 
