  # ─── end Marcher Territories ───

  # ═══ Water Guild ═══
  Water Guild:
    category: organization
    short: "Ancient institution controlling Vegas Springs' artesian water—predates Republic and Sultanate."
    details: |
      Founding charter dates to the Record of Three Laws, consolidating competing claims 
      over the springs into a single institution. Operates as effective government of 
      Vegas Springs regardless of nominal sovereignty. Maintains fixed prices for standard 
      allocations, creating secondary markets in water rights. The Guild's monopoly offends 
      Republican principles but cannot be disrupted without halting eastern trade entirely. 
      Members serve life terms. Records extend back to Three Laws documenting every allocation.
    rag_pointer: The Republic of Ganat
    related: [Vegas Springs, Ganat, Kilit, Records]
  # ─── end Water Guild ───

  # ═══ Khalim Charter ═══
  Khalim Charter:
    category: concept
    short: "965 RRH treaty preserving Vegas Springs' traditional privileges under Republican sovereignty."
    details: |
      Named for the spring where negotiations occurred. Republic gained sovereignty, 
      taxation rights, and military access. Vegas Springs retained Water Guild, commercial 
      courts, traditional allocation systems, and right to select its own Senator rather 
      than through kilit delegation. Revolutionary commander Sekh Tal-Omir (later Senator) 
      negotiated the compromise rather than besieging a city controlling its own water 
      through terrain favoring defenders.
    rag_pointer: The Republic of Ganat
    related: [Vegas Springs, Water Guild, Ganat]
  # ─── end Khalim Charter ───

  # ═══ Westerners ═══
  Westerners:
    category: concept
    short: "Mysterious anonymous traders providing bulk food from unknown sources—ships identical, speech synthetic."
    details: |
      Arrive in fleets of identical ships. Communicate through synthetic speech. 
      Provide grain and preserved food that Asovoë and other territories depend on 
      for survival. Maintain demarcation line in the Pacific—crossing it means death. 
      Lopez Island (San Juan Factorias) belongs to them; Avouvar do not go there. 
      Their nature, origin, and purposes remain completely unknown.
    rag_pointer: "Asovoë and the Avouvar"
    related: [Asovoë, San Juan Factorias, Lopez Island]
  # ─── end Westerners ───

  # ═══ Pantomime ═══
  Pantomime:
    category: concept
    short: "Popular theater with stock characters and deniable political content—Lens condemnations function as endorsements."
    details: |
      Operates in converted shops, rented halls, street corners. Troupes of 3-6 performers. 
      Stock characters: Pompous Bureaucrat (quotes regulations while accomplishing nothing), 
      Clever Sewer-Fisher (solves problems through wit), Tsatsan Mystic Swindler (claims 
      secret knowledge, picks pockets), Provincial Barbarian (confused by civilization), 
      Suffering Penitent (melodramatic piety). "CONTRARY TO PUBLIC ORDER" posted by Lens 
      tells audiences the production is worth seeing.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Bureau of the Lens, White Sheet, Threshold Theater]
  # ─── end Pantomime ───

  # ═══ Polyphonic Singers ═══
  Polyphonic Singers:
    category: concept
    short: "Highborn bastards with partial harmonic modifications—produce overtones and resonances baseline singers cannot achieve."
    details: |
      Cannot match true Highborn vocalists' simultaneous harmonies, but single voice 
      suggests two or three voices, harmonies emerging from one throat. Occupy uncertain 
      social position: not Highborn (lack full modifications, Aureate registration), not 
      entirely baseline. Perform on streets because no guild claims them, no theater hires 
      them, no category exists for what they are. Music is haunting—melodies acquiring 
      shadows, phrases resonating against themselves.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Highborn, Highborn Vocalists]
  # ─── end Polyphonic Singers ───

  # ═══ Highborn Vocalists ═══
  Highborn Vocalists:
    category: concept
    short: "Prestige performers whose modified throats produce simultaneous harmonies no baseline choir could achieve."
    details: |
      Arias composed for specific performers' unique capabilities—each performer's 
      modifications slightly different. Famous vocalist might have works written only 
      they can sing. Audiences primarily Aureate, ticket prices prohibitive. Performances 
      serve social functions: families demonstrating cultivation, business negotiations 
      in private boxes. Performer is simultaneously artist and status marker. Emotional 
      effects outside anything baseline music produces.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Highborn, Aureate, Polyphonic Singers]
  # ─── end Highborn Vocalists ───

  # ═══ Ironbone Feats ═══
  Ironbone Feats:
    category: concept
    short: "Strongman shows featuring Labor Caste variants bred for mining—bones dense enough to anchor muscles lifting impossible weights."
    details: |
      Performances straightforward: bending metal bars, supporting architectural loads, 
      competitive lifting between lineages. Audiences include genuine appreciation and 
      something darker—workers feeling pride in caste capability, Aureates seeing 
      confirmation that caste system produces useful specialization. Performer occupies 
      both positions: artist and specimen, athlete and product.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Ironbone, Labor Castes]
  # ─── end Ironbone Feats ───

  # ═══ Springheel Acrobatics ═══
  Springheel Acrobatics:
    category: concept
    short: "Vertigo-inducing performances by castes engineered for high work—modified proprioception, altered inner ears."
    details: |
      Castes bred for rigging, tower maintenance, cliff-face construction perform on 
      structures terrifying to baseline audiences: narrow beams at height, swinging 
      platforms, vertical surfaces traversed like level ground. Entertainment comes 
      from physical feats and audience awareness they could never do this. Some troupes 
      include moments referencing falls that kill their cousins on construction sites—
      if subversion stays aesthetic, Lens condemnations remain decorative.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Springheel, Labor Castes]
  # ─── end Springheel Acrobatics ───

  # ═══ Anthropological Exhibitions ═══
  Anthropological Exhibitions:
    category: concept
    short: "Ethically fraught displays of rare castes—framed as educational, functionally human zoos."
    details: |
      Rare castes displayed for observation: Sickly under Companion supervision (rose-gold 
      lattices glowing), Mutterers demonstrating computational vocalizations, frontier 
      variants most citizens have never seen. Placards describe function, engineering 
      history, place in Imperial order. Emphasize these are fellow subjects, valued 
      contributors. The gawking happens anyway. Some feature castes engineered for 
      worlds humanity can no longer reach—bodies shaped for contexts that no longer exist.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Sickly, Mutterers, Companions Guild]
  # ─── end Anthropological Exhibitions ───

  # ═══ Feast of Reflection ═══
  Feast of Reflection:
    category: concept
    short: "Annual Church observance permitting 'dramatic readings' with 'interpretive elements'—licensed misrule."
    details: |
      Tradition holds congregations may perform religious texts with interpretation. 
      Origins unclear—possibly genuine liturgy, possibly legal fiction. In practice: 
      one night when theatrical performance occurs in parish halls under Church rather 
      than Lens oversight. Church standards differ from Bureau's—material fined in 
      Fourth Whorl theater passes without comment in dockside chapel. Many clergy 
      sympathetic to reform.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Penitent Church, Bureau of the Lens, Pantomime]
  # ─── end Feast of Reflection ───

  # ═══ Lens Censorship ═══
  Lens Censorship:
    category: concept
    short: "Negotiated tolerance rather than absolute control—condemnations function as endorsements, fines generate needed revenue."
    details: |
      Bureau of the Lens maintains formal authority over all information and performance. 
      In practice, apparatus is exhausted. Inspectors lack resources for comprehensive 
      enforcement. A censor might attend pantomime, laugh throughout, then deliver fine 
      as part of show. Elaborateness of condemnation signals quality. Real limits exist: 
      no mocking Emperor directly, no questioning Interdict's justice. Playwright Kerem 
      Tal-Vostra was disappeared for crossing the line.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Bureau of the Lens, Pantomime, White Sheet]
  # ─── end Lens Censorship ───

  # ═══ Ganati Media ═══
  Ganati Media:
    category: concept
    short: "Films and radio broadcasts penetrating Imperial borders through smuggling and high antennas—evidence alternatives exist."
    details: |
      Without Ganat's democratic broadcast infrastructure, Empire relies on live 
      performance and licensed print. Ganati media offers audiences evidence that 
      alternatives to Imperial exhaustion exist. The Republic has dozen competing 
      newspapers, partisan press ecology, democratic cultural production. Smuggled 
      films and radio signals reach Imperial audiences willing to risk possession, 
      creating appetite for content the Lens cannot provide.
    rag_pointer: "Imperial Media and Entertainment"
    related: [Ganat, Bureau of the Lens, White Sheet]
  # ─── end Ganati Media ───

  # ═══ es-Tariq ═══
  es-Tariq:
    category: organization
    short: "Aureate household controlling Imperial redaction ciphers—what they erase vanishes from public record."
    details: |
      Among Empire's oldest Aureate families. Sri Avs Tariq serves in Imperial Apartments 
      (85 subjective years, 10,000+ external years)—the Emperor's personal redactor. 
      Sri Director (name self-redacted) holds Senior Satara seat for Lens, over 300 years 
      old. Patent on cipher-set Veil-Nine allows selective erasure of documents. Family 
      trades in erasure: ability to make inconvenient text vanish. Maintains correspondence 
      across millennia of temporal discontinuity.
    rag_pointer: "Household es-Tariq: Custodians of Imperial Secrecy"
    related: [Emperor, Black Door, First Whorl, Bureau of the Lens, Aureate]
  # ─── end es-Tariq ───

  # ═══ Ironbone ═══
  Ironbone:
    category: caste
    short: "Labor caste with dramatically increased bone density—handles loads that would shatter baseline frames."
