      real_world_anchor: "Lake Tahoe (Taho, slopes above waterfront)"
    local_aesthetic: "Granite Petra climbing in terraces. Each level 100-150 feet higher than the last, 400 feet deep, created by cutting slope and building retaining walls—granite blocks 3-6 feet per side, fitted without mortar in oldest sections. First Terrace shows Sultanate architecture: carved facades with geometric patterns and figurative art, but the figures have been re-carved. Sultana Ulayah receiving tribute is now collective assembly deciding distributions. Aristocratic hunting panels are now cooperative agriculture. The revolutionary imagery carved 2-3 inches deeper because they removed the original first. Second and Third Terraces: late Sultanate expansion. Fourth and Fifth: revolutionary-era, past twenty years, designed from the start for Republican aesthetics. Switchback roads connect terraces; granite staircases lit by electric lights every 50 feet. At night the stairs become rivers of light—different kilits maintaining different sections, competing to be brightest."
